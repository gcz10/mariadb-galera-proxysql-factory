---
# minio_root_env.yml — prywatne root-only srodowisko klienta `mc` na infra.
#
# Wspolne dla provisioningu (provision_minio.yml), finalizacji rotacji
# (main.yml) i derejestracji (deregister_minio.yml): kazde wywolanie dostaje
# wlasny katalog pod /run. Asercja poswiadczen root i format root.env MUSZA byc
# identyczne we wszystkich sciezkach — rozjazd oznaczal SignatureDoesNotMatch
# albo ciche niepowodzenie listingow. Zadanie wymaga
# MINIO_ROOT_USER/MINIO_ROOT_PASSWORD w srodowisku kontrolera.
#
# `mc` czyta userinfo doslownie, wiec znaki / @ : i biale rozjechalby parsowanie
# URL-a (SignatureDoesNotMatch bez czytelnego komunikatu); percent-encoding NIE
# jest rozwiazaniem, bo mc go nie dekoduje. Klasa MUSI byc skladnia Pythona
# (`is search` wola re.search): POSIX-owe [:space:] nie istnieje w re i dawaloby
# klase {/@:[space} + literal ']' — asercje, ktora nie lapie ANI JEDNEGO znaku.
- name: Wymagaj poswiadczen root MinIO
  # Celowo BEZ `no_log`: ukrywalby fail_msg, a asercja i tak wypisuje wylacznie
  # nazwy zmiennych srodowiskowych i statyczny komunikat, nigdy ich wartosci.
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'MINIO_ROOT_USER') | length > 0
      - lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') | length > 0
      - lookup('ansible.builtin.env', 'MINIO_ROOT_USER') is not search('[/@:\s]')
      - lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') is not search('[/@:\s]')
    fail_msg: >-
      MINIO_ROOT_USER/MINIO_ROOT_PASSWORD sa wymagane na kontrolerze
      (niepuste, bez znakow / @ : i bialych) — bez nich zarzadane MinIO nie
      moze zostac skonfigurowane ani odebrane.
    quiet: true

# Katalog jest unikalny na wywolanie, wiec dwa klastry nigdy nie dziela polityk
# ani root.env. Cena tej izolacji: nie ma juz wspolnej sciezki, ktora kolejny
# przebieg sprzatnalby po poprzedniku. Kazdy `always` roli usuwa wlasny katalog
# takze po bledzie; osierocic go moze wylacznie twarde ubicie kontrolera
# (SIGKILL/Ctrl-C pomijaja `always`), a wtedy zabiera go najblizszy reboot, bo
# /run to tmpfs. Swiadomie nie ma tu zamiatarki `galera-backup-minio-*`:
# kasowanie po wieku na wspoldzielonym hoscie grozilo by usunieciem katalogu
# rownolegle biegnacego klastra, czyli dokladnie tym wyscigiem, ktory ten
# uklad likwiduje. Sam plik nie poszerza dostepu — kontener minio na tym hoscie
# i tak trzyma MINIO_ROOT_USER/MINIO_ROOT_PASSWORD w swoim env.
- name: Utworz unikalny root-only katalog tymczasowy klienta MinIO na infra
  ansible.builtin.tempfile:
    state: directory
    path: /run
    prefix: galera-backup-minio-
  register: galera_backup_minio_workspace
  become: true
  delegate_to: "{{ groups['infra'][0] }}"

- name: Utwardz uprawnienia katalogu tymczasowego klienta MinIO
  ansible.builtin.file:
    path: "{{ galera_backup_minio_workspace.path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  delegate_to: "{{ groups['infra'][0] }}"

- name: Zapisz root-only srodowisko klienta MinIO
  # BEZ `urlencode`: mc nie dekoduje percent-encoding (bezpieczenstwo znakow
  # pilnuje asercja wyzej). localhost:9000, bo kontener mc dzieli sie siecia
  # z kontenerem minio (`--network container:minio`).
  ansible.builtin.copy:
    dest: "{{ galera_backup_minio_workspace.path }}/root.env"
    owner: root
    group: root
    mode: "0600"
    content: >-
      MC_HOST_myminio=http://{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') }}:{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') }}@localhost:9000
  become: true
  delegate_to: "{{ groups['infra'][0] }}"
  no_log: true
