---
# deregister_minio.yml — odwolanie kont serwisowych MinIO przy derejestracji klastra.
#
# Zakres celowo minimalny i SCIALE per-klaster: znikaja wylacznie konta nazwane
# `galera-backup-{{ cluster.name }}` i konto retencji (dokladne dopasowanie po
# tozsamosci z `mc admin accesskey info`). Bucket, obiekty backupow i owner
# marker to dane operatora i pozostaja NIETKNIETE — zadne `mc rb`/`mc rm` nie
# istnieje w tym pliku. Pusta lista kont = idempotentny no-op.
#
# Wolane wylacznie przez include_role (tasks_from) z
# playbooks/cluster_deregister.yml — tak filtry tej roli
# (minio_service_account_keys, minio_access_keys_named) sa dostepne, a infra
# host zyje jeszcze przed `infra-teardown`.
# Srodowisko root i discovery kont sa WSPOLNE z provisioningu
# (minio_root_env.yml, minio_owned_keys.yml) — jedna definicja, zero kopii.

- name: Zaladuj lockfile wskazany przez klaster (reprodukowalny obraz mc)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
    name: lock

- name: Odwolaj konto serwisowe MinIO zalozone przez ten klaster
  # Jeden block/always: prywatny workspace utworzony na infra MUSI znikac
  # rowniez wtedy, gdy listing, sonda tozsamosci albo samo revoke zawioda.
  block:
    - name: Przygotuj root-only srodowisko klienta MinIO
      # Wspolny include z provisioningu: IDENTYCZNA asercja (niepuste, bez
      # znakow lamacych userinfo) i IDENTYCZNY format root.env w obu
      # sciezkach. Derejestracja bez MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
      # MUSI padac, nie przechodzic po cichu — konto serwisowe zostaloby
      # sierota na wspoldzielonym MinIO po zniszczeniu klastra.
      ansible.builtin.include_tasks:
        file: minio_root_env.yml

    - name: Zbuduj obraz stanu kont serwisowych MinIO
      # Wspolny discovery z provisioningu: jeden listing + jedna tura
      # `accesskey info` zamiast kopii; filtry nazw czytaja wynik wyzej.
      ansible.builtin.include_tasks:
        file: minio_owned_keys.yml

    - name: Wybierz konta MinIO tego klastra
      # DOKLADNE dopasowanie nazw po info: konta innych klastrow na
      # wspoldzielonym MinIO nigdy nie trafiaja na liste. OBA konta klastra
      # musza zniknac — samo konto zapisu zostawiloby na wspolnym MinIO sierote
      # z prawem kasowania kopii po zniszczonym juz kliencie.
      ansible.builtin.set_fact:
        galera_backup_deregister_access_keys: >-
          {{
            (
              galera_backup_owned_keys_jsons
              | default([])
              | minio_access_keys_named('galera-backup-' ~ cluster.name)
            )
            +
            (
              galera_backup_owned_keys_jsons
              | default([])
              | minio_access_keys_named(('galera-backup-prune-' ~ cluster.name)
              | minio_service_account_name)
            )
          }}
      no_log: true

    - name: Odwolaj konta MinIO tego klastra
      # Kazdy obrot petli usuwa konto serwisowe — mutacja stanu MinIO.
      # Pusta lista to idempotentny no-op (klaster nigdy nie mial konta
      # albo zostalo juz odwolane wczesniejszym przebiegiem).
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - container:minio
          - --env-file
          - "{{ galera_backup_minio_workspace.path }}/root.env"
          - "{{ lock.minio.mc_image }}@{{ lock.minio.mc_image_digest }}"
          - admin
          - accesskey
          - remove
          - myminio
          - "{{ item }}"
      loop: "{{ galera_backup_deregister_access_keys | default([]) }}"
      changed_when: true
      no_log: true
      become: true
      delegate_to: "{{ groups['infra'][0] }}"

    - name: Raport derejestracji konta MinIO
      ansible.builtin.debug:
        msg: >-
          Derejestracja MinIO zakonczona dla '{{ cluster.name }}': odwolano
          {{ galera_backup_deregister_access_keys | default([]) | length }}
          kont serwisowych o nazwie 'galera-backup-{{ cluster.name }}'.
          Bucket '{{ backup.s3.bucket }}', owner marker i kopie backupow
          pozostaja zachowane — to dane operatora.

  always:
    - name: Usun tymczasowe poswiadczenia root MinIO
      # Takze po porazce: prywatny root.env nie moze przetrwac w /run.
      ansible.builtin.file:
        path: "{{ galera_backup_minio_workspace.path }}"
        state: absent
      become: true
      delegate_to: "{{ groups['infra'][0] }}"
      when:
        - galera_backup_minio_workspace is defined
        - galera_backup_minio_workspace.path is defined
