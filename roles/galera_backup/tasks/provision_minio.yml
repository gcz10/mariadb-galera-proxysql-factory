---
# provision_minio.yml — pojednanie kont serwisowych MinIO dla klastra.
#
# Przebieg (kolejnosc i wlasciwosci bezpieczenstwa pilnuje
# tests/unit/test_minio_rotation_atomic.py):
#   1. minio_root_env.yml           — root-only srodowisko klienta `mc`;
#   2. polityki                     — zapis i retencja jako pliki 0600;
#   3. bucket + owner marker        — bucket zarzadany nalezy DO TEGO klastra;
#   4. minio_owned_keys.yml         — jeden discovery: list + info wszystkich kont;
#   5. reconcile_minio_account.yml  — x2: konto zapisu i konto retencji;
#   6. sprzatanie                   — workspace provisioningu znika zawsze;
#                                     main.yml tworzy swieze root.env dopiero
#                                     po utrwaleniu secrets.env, gdy istnieja
#                                     konta oczekujace na odwolanie.
# Rozdzial poswiadczen zapis/kasowanie opisuje docs/runbooks/backup.md; kazdy
# include dostaje slownik `mc_account`, dzieki czemu przeplyw zycia konta
# istnieje w jednym egzemplarzu (reconcile_minio_account.yml).
- name: Provision scoped MinIO credentials on infra host
  block:
    - name: Przygotuj root-only srodowisko klienta MinIO
      ansible.builtin.include_tasks:
        file: minio_root_env.yml

    - name: Render policy to temporary file
      ansible.builtin.template:
        src: minio-policy.json.j2
        dest: "{{ galera_backup_minio_workspace.path }}/policy.json"
        owner: root
        group: root
        mode: "0600"

    - name: Render retention policy to temporary file
      # Osobna polityka dla osobnego konta: kasowanie kopii jest odciete od ich
      # zapisu, bo klucz zapisu lezy na kazdym wezle Galery (elekcja donora).
      ansible.builtin.template:
        src: minio-policy-prune.json.j2
        dest: "{{ galera_backup_minio_workspace.path }}/policy-prune.json"
        owner: root
        group: root
        mode: "0600"

    - name: Ensure bucket exists
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - container:minio
          - --env-file
          - "{{ galera_backup_minio_workspace.path }}/root.env"
          - "{{ lock.minio.mc_image }}@{{ lock.minio.mc_image_digest }}"
          - mb
          - --ignore-existing
          - "myminio/{{ backup.s3.bucket }}"
      changed_when: false
      no_log: true

    - name: Read managed bucket owner marker
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - container:minio
          - --env-file
          - "{{ galera_backup_minio_workspace.path }}/root.env"
          - "{{ lock.minio.mc_image }}@{{ lock.minio.mc_image_digest }}"
          - cat
          - "myminio/{{ backup.s3.bucket }}/galera-backup-owner.json"
      register: galera_backup_owner_marker_initial
      changed_when: false
      failed_when: false
      no_log: true

    - name: Validate existing managed bucket owner marker
      ansible.builtin.assert:
        that:
          - (galera_backup_owner_marker_initial.stdout | from_json).format_version == 1
          - (galera_backup_owner_marker_initial.stdout | from_json).cluster_name == cluster.name
        fail_msg: Managed S3 bucket owner marker belongs to another cluster or is malformed
        quiet: true
      when: galera_backup_owner_marker_initial.rc == 0

    - name: Create managed bucket owner marker with root credentials
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -i
          - --network
          - container:minio
          - --env-file
          - "{{ galera_backup_minio_workspace.path }}/root.env"
          - "{{ lock.minio.mc_image }}@{{ lock.minio.mc_image_digest }}"
          - pipe
          - "myminio/{{ backup.s3.bucket }}/galera-backup-owner.json"
        stdin: >-
          {{ {'format_version': 1, 'cluster_name': cluster.name} | to_json }}
      when: galera_backup_owner_marker_initial.rc != 0
      # Marker tworzymy tylko gdy go nie bylo — to realna mutacja stanu MinIO.
      changed_when: true
      no_log: true

    - name: Verify managed bucket owner marker after provisioning
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - container:minio
          - --env-file
          - "{{ galera_backup_minio_workspace.path }}/root.env"
          - "{{ lock.minio.mc_image }}@{{ lock.minio.mc_image_digest }}"
          - cat
          - "myminio/{{ backup.s3.bucket }}/galera-backup-owner.json"
      register: galera_backup_owner_marker_final
      changed_when: false
      no_log: true

    - name: Require exact managed bucket ownership
      ansible.builtin.assert:
        that:
          - (galera_backup_owner_marker_final.stdout | from_json).format_version == 1
          - (galera_backup_owner_marker_final.stdout | from_json).cluster_name == cluster.name
        fail_msg: Managed S3 bucket owner marker verification failed
        quiet: true

    - name: Zbuduj obraz stanu kont serwisowych MinIO
      ansible.builtin.include_tasks:
        file: minio_owned_keys.yml

    - name: Pojednaj konto zapisu klastra (bez prawa kasowania)
      ansible.builtin.include_tasks:
        file: reconcile_minio_account.yml
      vars:
        mc_account:
          name: "galera-backup-{{ cluster.name }}"
          policy: "{{ galera_backup_minio_workspace.path }}/policy.json"
          tmp: ""
          existing_access_key: "{{ galera_backup_existing_s3_access_key }}"
          existing_secret_key: "{{ galera_backup_existing_s3_secret_key }}"
          access_fact: galera_backup_s3_access_key
          secret_fact: galera_backup_s3_secret_key
          revoke_fact: galera_backup_access_keys_to_revoke

    - name: Pojednaj konto retencji (jedyne z prawem kasowania)
      ansible.builtin.include_tasks:
        file: reconcile_minio_account.yml
      vars:
        mc_account:
          name: "{{ ('galera-backup-prune-' ~ cluster.name) | minio_service_account_name }}"
          policy: "{{ galera_backup_minio_workspace.path }}/policy-prune.json"
          tmp: "-prune"
          existing_access_key: "{{ galera_backup_existing_s3_prune_access_key }}"
          existing_secret_key: "{{ galera_backup_existing_s3_prune_secret_key }}"
          access_fact: galera_backup_s3_prune_access_key
          secret_fact: galera_backup_s3_prune_secret_key
          revoke_fact: galera_backup_prune_keys_to_revoke

  always:
    - name: Remove root credentials and temporary policy
      # Fakty z aktywnymi kluczami i listami odwolan przechodza do main.yml,
      # lecz root.env i polityki sa prywatne dla tego invocation i nie moga
      # przetrwac do kolejnej fazy ani rownoleglego klastra.
      ansible.builtin.file:
        path: "{{ galera_backup_minio_workspace.path }}"
        state: absent
      become: true
      when:
        - galera_backup_minio_workspace is defined
        - galera_backup_minio_workspace.path is defined
