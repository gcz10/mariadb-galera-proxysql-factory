---
- name: Provision scoped MinIO credentials on infra host
  block:
    - name: Create temporary directory for MinIO provisioning
      ansible.builtin.file:
        path: /run/galera-backup-minio-tmp
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Render policy to temporary file
      ansible.builtin.template:
        src: minio-policy.json.j2
        dest: /run/galera-backup-minio-tmp/policy.json
        owner: root
        group: root
        mode: "0600"

    - name: Copy policy into minio container
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - /run/galera-backup-minio-tmp/policy.json
          - "minio:/tmp/policy.json"
      changed_when: false

    - name: Ensure bucket exists
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -e
          - "MC_HOST_myminio=http://{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') }}:{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') }}@localhost:9000"
          - minio
          - mc
          - mb
          - --ignore-existing
          - "myminio/{{ backup.s3.bucket }}"
      changed_when: false
      no_log: true

    - name: Revoke all existing MinIO service accounts for this cluster
      ansible.builtin.shell:
        cmd: |
          python3 -c '
          import json, subprocess, os
          root_u = os.environ.get("MINIO_ROOT_USER", "")
          root_p = os.environ.get("MINIO_ROOT_PASSWORD", "")
          mc_env = f"MC_HOST_myminio=http://{root_u}:{root_p}@localhost:9000"
          target_name = "galera-backup-{{ cluster.name }}"

          list_res = subprocess.run(
              ["docker", "exec", "-e", mc_env, "minio", "mc", "admin", "accesskey", "list", "myminio", "--all", "--json"],
              capture_output=True, text=True
          )
          if list_res.returncode != 0:
              exit(0)

          to_remove = []
          for line in list_res.stdout.splitlines():
              if not line.strip(): continue
              try:
                  record = json.loads(line)
              except Exception:
                  continue
              for sa in record.get("svcaccs") or []:
                  ak = sa.get("accessKey")
                  if not ak: continue
                  sa_name = sa.get("name")
                  if not sa_name:
                      info_res = subprocess.run(
                          ["docker", "exec", "-e", mc_env, "minio", "mc", "admin", "accesskey", "info", "myminio", ak, "--json"],
                          capture_output=True, text=True
                      )
                      if info_res.returncode == 0:
                          try:
                              sa_name = json.loads(info_res.stdout).get("name")
                          except Exception:
                              pass
                  if sa_name == target_name:
                      to_remove.append(ak)

          for ak in to_remove:
              subprocess.run(
                  ["docker", "exec", "-e", mc_env, "minio", "mc", "admin", "accesskey", "rm", "myminio", ak],
                  capture_output=True, text=True
              )
          '
      environment:
        MINIO_ROOT_USER: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') }}"
        MINIO_ROOT_PASSWORD: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') }}"
      changed_when: false
      failed_when: false
      no_log: true

    - name: Create new scoped access key pair
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -e
          - "MC_HOST_myminio=http://{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') }}:{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') }}@localhost:9000"
          - minio
          - mc
          - admin
          - accesskey
          - create
          - myminio/
          - --json
          - --name
          - "galera-backup-{{ cluster.name }}"
          - --policy
          - /tmp/policy.json
      register: mc_create_result
      no_log: true

    - name: Extract generated scoped credentials
      ansible.builtin.set_fact:
        galera_backup_s3_access_key: "{{ (mc_create_result.stdout | from_json).accessKey }}"
        galera_backup_s3_secret_key: "{{ (mc_create_result.stdout | from_json).secretKey }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop:
        - "{{ backup.scheduler.host }}"
        - "{{ inventory_hostname }}"
      no_log: true

  always:
    - name: Clean up temporary files on minio container and infra host
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - minio
          - rm
          - -f
          - /tmp/policy.json
      failed_when: false
      changed_when: false

    - name: Clean up temporary directory on infra host
      ansible.builtin.file:
        path: /run/galera-backup-minio-tmp
        state: absent
