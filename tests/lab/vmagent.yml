---
# vmagent config — scrapuje node_exporter i mysqld_exporter z lab cluster
# i wysyła do PMM Server's VictoriaMetrics przez remoteWrite.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "lab-node-exporter"
    static_configs:
      - targets:
          - "172.28.0.11:9100"
          - "172.28.0.12:9100"
          - "172.28.0.13:9100"
          - "172.28.0.21:9100"
          - "172.28.0.22:9100"
        labels:
          cluster: "lab-cluster"

  - job_name: "lab-mysql-exporter"
    static_configs:
      - targets:
          - "172.28.0.11:9104"
          - "172.28.0.12:9104"
          - "172.28.0.13:9104"
        labels:
          cluster: "lab-cluster"
