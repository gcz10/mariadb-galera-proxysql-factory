---
# Lab cluster — 3 Galera + 2 ProxySQL w kontenerach Rocky Linux 9.
# Profil: laboratory. BLK-1/BLK-2 rozblokowane przez OrbStack/Docker.
# Nie jest to produkcja — kontenery nie mają SELinux (brak jądra), firewalld limited.

services:
  gnode1:
    build: .
    container_name: gnode1
    hostname: gnode1
    networks:
      galera-net:
        ipv4_address: 172.28.0.11
    ports:
      - "127.0.0.1:2221:22"
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - gnode1-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  gnode2:
    build: .
    container_name: gnode2
    hostname: gnode2
    networks:
      galera-net:
        ipv4_address: 172.28.0.12
    ports:
      - "127.0.0.1:2222:22"
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - gnode2-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  gnode3:
    build: .
    container_name: gnode3
    hostname: gnode3
    networks:
      galera-net:
        ipv4_address: 172.28.0.13
    ports:
      - "127.0.0.1:2223:22"
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - gnode3-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  pnode1:
    build: .
    container_name: pnode1
    hostname: pnode1
    networks:
      galera-net:
        ipv4_address: 172.28.0.21
    ports:
      - "127.0.0.1:2224:22"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  pnode2:
    build: .
    container_name: pnode2
    hostname: pnode2
    networks:
      galera-net:
        ipv4_address: 172.28.0.22
    ports:
      - "127.0.0.1:2225:22"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  pmm-server:
    image: percona/pmm-server:3.8.1@sha256:ef47471fb3b54e10897a92bab0b7b45e82d9825c3b0abf5a0693242191f99468
    platform: linux/amd64
    container_name: pmm-server
    hostname: pmm-server
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${PMM_ADMIN_PASSWORD:?Ustaw PMM_ADMIN_PASSWORD}"
      PMM_ENABLE_UPDATES: "0"
    networks:
      galera-net:
        ipv4_address: 172.28.0.100
      galera-net-2:
        ipv4_address: 172.29.0.100
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - pmm-data:/srv
    restart: unless-stopped
    mem_limit: 4g
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Ustaw MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Ustaw MINIO_ROOT_PASSWORD}"
    networks:
      galera-net:
        ipv4_address: 172.28.0.60
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  rnode1:
    build: .
    container_name: rnode1
    hostname: rnode1
    networks:
      galera-net:
        ipv4_address: 172.28.0.50
    ports:
      - "127.0.0.1:2226:22"
    privileged: true
    volumes:
      - rnode1-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN


  # === Drugi niezależny klaster (lab2) — ISC-60/61: osobna sieć 172.29.0.x ===
  gnode1b:
    build: .
    container_name: gnode1b
    hostname: gnode1b
    networks:
      galera-net-2:
        ipv4_address: 172.29.0.11
    ports:
      - "127.0.0.1:2231:22"
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - gnode1b-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  gnode2b:
    build: .
    container_name: gnode2b
    hostname: gnode2b
    networks:
      galera-net-2:
        ipv4_address: 172.29.0.12
    ports:
      - "127.0.0.1:2232:22"
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - gnode2b-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  gnode3b:
    build: .
    container_name: gnode3b
    hostname: gnode3b
    networks:
      galera-net-2:
        ipv4_address: 172.29.0.13
    ports:
      - "127.0.0.1:2233:22"
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - gnode3b-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  pnode1b:
    build: .
    container_name: pnode1b
    hostname: pnode1b
    networks:
      galera-net-2:
        ipv4_address: 172.29.0.21
    ports:
      - "127.0.0.1:2234:22"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  pnode2b:
    build: .
    container_name: pnode2b
    hostname: pnode2b
    networks:
      galera-net-2:
        ipv4_address: 172.29.0.22
    ports:
      - "127.0.0.1:2235:22"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  minio2:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio2
    hostname: minio2
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Ustaw MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Ustaw MINIO_ROOT_PASSWORD}"
    networks:
      galera-net-2:
        ipv4_address: 172.29.0.60
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - minio2-data:/data
    restart: unless-stopped

networks:
  galera-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  galera-net-2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  gnode1-data:
  gnode2-data:
  gnode3-data:
  pmm-data:
  minio-data:
  rnode1-data:
  gnode1b-data:
  gnode2b-data:
  gnode3b-data:
  minio2-data:
