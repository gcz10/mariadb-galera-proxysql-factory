---
# Lab cluster — 3 Galera + 2 ProxySQL w kontenerach Rocky Linux 9.
# Profil: laboratory. BLK-1/BLK-2 rozblokowane przez OrbStack/Docker.
# Nie jest to produkcja — kontenery nie mają SELinux (brak jądra), firewalld limited.

services:
  gnode1:
    build: .
    container_name: gnode1
    hostname: gnode1
    networks:
      galera-net:
        ipv4_address: 172.28.0.11
    ports:
      - "2221:22"
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - gnode1-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  gnode2:
    build: .
    container_name: gnode2
    hostname: gnode2
    networks:
      galera-net:
        ipv4_address: 172.28.0.12
    ports:
      - "2222:22"
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - gnode2-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  gnode3:
    build: .
    container_name: gnode3
    hostname: gnode3
    networks:
      galera-net:
        ipv4_address: 172.28.0.13
    ports:
      - "2223:22"
    privileged: true
    tmpfs:
      - /tmp
    volumes:
      - gnode3-data:/var/lib/mysql
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  pnode1:
    build: .
    container_name: pnode1
    hostname: pnode1
    networks:
      galera-net:
        ipv4_address: 172.28.0.21
    ports:
      - "2224:22"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  pnode2:
    build: .
    container_name: pnode2
    hostname: pnode2
    networks:
      galera-net:
        ipv4_address: 172.28.0.22
    ports:
      - "2225:22"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    networks:
      galera-net:
        ipv4_address: 172.28.0.100
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    networks:
      galera-net:
        ipv4_address: 172.28.0.101
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

networks:
  galera-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  gnode1-data:
  gnode2-data:
  gnode3-data:
  prometheus-data:
  grafana-data:
