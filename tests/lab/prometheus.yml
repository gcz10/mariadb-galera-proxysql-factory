---
# Prometheus config — scrapuje node_exporter na wszystkich węzłach + mysqld_exporter na Galera.
# node_exporter: port 9100 (instalowany na każdym hoście)
# mysqld_exporter: port 9104 (instalowany na Galera nodes po F3)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Node exporter — metryki systemowe (CPU, RAM, dysk, sieć) na wszystkich 5 węzłach
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "172.28.0.11:9100"  # gnode1
          - "172.28.0.12:9100"  # gnode2
          - "172.28.0.13:9100"  # gnode3
          - "172.28.0.21:9100"  # pnode1
          - "172.28.0.22:9100"  # pnode2

  # MySQL exporter — metryki MariaDB/Galera na 3 węzłach (po F3)
  - job_name: "mysql-exporter"
    static_configs:
      - targets:
          - "172.28.0.11:9104"  # gnode1
          - "172.28.0.12:9104"  # gnode2
          - "172.28.0.13:9104"  # gnode3

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
