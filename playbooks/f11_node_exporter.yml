---
# F11-partial: instalacja node_exporter na hostach klastra.
# F11 rejestruje endpointy jako natywne external services w PMM Inventory.
# node_exporter: port 9100, metryki systemowe.
# Satisfies (partial): ISC-46 (metryki trafiają do PMM).

- name: "Monitoring - instaluj node_exporter"
  # Kazdy klaster jest NAJEMCA warstwy wspolnej, wiec node_exporter ladowany jest
  # wylacznie na wlasnych wezlach: wezly ProxySQL naleza do platformy i obsluguje
  # je f11_proxysql_metrics.yml z platform/shared/ — pmm-agent ma JEDNA tozsamosc
  # node per host, wiec rejestracja tych wezlow przez klaster to konflikt,
  # nie duplikat.
  # Hosty z pmm-agentem maja node_exporter Z PACZKI — tarball dublowalby
  # eksporter na 9100 i rejestracje tego samego wezla. Patrz f11_pmm_agent.yml.
  hosts: "{{ ('galera' ~ ('' if (monitoring.agent_groups | default([])) | length == 0 else ':!' ~ ((monitoring.agent_groups | default([])) | join(':!')))) }}"
  become: true
  serial: 1
  vars_files:
    - "../{{ versions.lock_file }}"


  vars:
    node_exporter_version: "{{ node_exporter.version }}"
    node_exporter_arch_map:
      aarch64: arm64
      arm64: arm64
      x86_64: amd64
      amd64: amd64
    node_exporter_asset_arch: "{{ node_exporter_arch_map.get(ansible_facts['architecture'], '') }}"
    node_exporter_sha256: "{{ node_exporter.linux_sha256 }}"
    node_exporter_managed_dir: "/usr/local/lib/node_exporter/{{ node_exporter_version }}-{{ node_exporter_asset_arch }}"
    node_exporter_managed_binary: "{{ node_exporter_managed_dir }}/node_exporter"
    node_exporter_archive: "/var/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_asset_arch }}.tar.gz"
    node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
    node_exporter_args: >-
      --web.listen-address=:9100
      --collector.textfile.directory={{ node_exporter_textfile_dir }}

  tasks:
    - name: "Wymagaj wspieranej architektury node_exporter"
      ansible.builtin.assert:
        that:
          - node_exporter_asset_arch | length > 0
        fail_msg: "Brak przypiętego artefaktu node_exporter dla {{ ansible_facts['architecture'] }}."

    - name: "Utwórz nieuprzywilejowanego użytkownika node_exporter"
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /sbin/nologin
        create_home: false
        state: present
      register: node_exporter_user

    - name: "Utwórz katalog przypiętej wersji node_exporter"
      ansible.builtin.file:
        path: "{{ node_exporter_managed_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Pobierz przypięte archiwum node_exporter"
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_asset_arch }}.tar.gz"
        dest: "{{ node_exporter_archive }}"
        checksum: "sha256:{{ node_exporter_sha256[node_exporter_asset_arch] }}"
        owner: root
        group: root
        mode: "0644"

    - name: "Rozpakuj przypięty node_exporter"
      ansible.builtin.unarchive:
        src: "{{ node_exporter_archive }}"
        dest: "{{ node_exporter_managed_dir }}"
        remote_src: true
        extra_opts:
          - --strip-components=1
        include:
          - "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_asset_arch }}/node_exporter"
        creates: "{{ node_exporter_managed_binary }}"
      register: node_exporter_install

    - name: "Sprawdź zarządzaną ścieżkę node_exporter"
      ansible.builtin.stat:
        path: /usr/local/bin/node_exporter
        follow: false
      register: node_exporter_link

    - name: "Usuń legacy binarkę node_exporter z zarządzanej ścieżki"
      ansible.builtin.file:
        path: /usr/local/bin/node_exporter
        state: absent
      when:
        - node_exporter_link.stat.exists
        - not node_exporter_link.stat.islnk
      register: node_exporter_legacy_removed

    - name: "Wskaż zarządzaną ścieżkę na przypięty node_exporter"
      ansible.builtin.file:
        src: "{{ node_exporter_managed_binary }}"
        dest: /usr/local/bin/node_exporter
        state: link
        owner: root
        group: root
        force: true
      register: node_exporter_symlink

    - name: "Utwórz katalog atomowych metryk stanu klastra"
      ansible.builtin.file:
        path: "{{ node_exporter_textfile_dir }}"
        state: directory
        owner: root
        group: node_exporter
        mode: "0750"

    - name: "Zapisz sygnaturę argumentów node_exporter"
      ansible.builtin.copy:
        dest: /etc/node_exporter.args
        content: "{{ node_exporter_args }}\n"
        owner: root
        group: root
        mode: "0644"
      register: node_exporter_runtime_signature

    # Bramki cyklu zycia (isa_*_monitoring_enabled) publikuje f11_freshness.yml.
    # Byly TUTAJ, ale `hosts:` tego playa wyklucza grupy z monitoring.agent_groups,
    # wiec klaster z lokalnym pmm-agentem nigdy ich nie dostawal. Jeden wlasciciel
    # pliku zamiast dwoch warunkowych.

    - name: "Zainicjuj trwałe metryki cyklu życia bez nadpisywania dowodów"
      ansible.builtin.copy:
        dest: "{{ node_exporter_textfile_dir }}/isa_monitoring_state.prom"
        content: |
          # Ten plik aktualizują atomowo feature restore/TLS.
          # Wartość 0 oznacza brak potwierdzonego sukcesu.
          # HELP isa_restore_test_last_success_unixtime Unix time of the last successful restore drill.
          # TYPE isa_restore_test_last_success_unixtime gauge
          isa_restore_test_last_success_unixtime{cluster="{{ monitoring.pmm.cluster_name }}"} 0
          # HELP isa_tls_cert_expiry_unixtime Unix time when the monitored certificate expires.
          # TYPE isa_tls_cert_expiry_unixtime gauge
          isa_tls_cert_expiry_unixtime{cluster="{{ monitoring.pmm.cluster_name }}"} 0
        owner: root
        group: node_exporter
        mode: "0640"
        force: false
      when: inventory_hostname == groups['galera'][0]

    - name: "Ogranicz odczyt trwałych metryk cyklu życia"
      ansible.builtin.file:
        path: "{{ node_exporter_textfile_dir }}/isa_monitoring_state.prom"
        owner: root
        group: node_exporter
        mode: "0640"
      when: inventory_hostname == groups['galera'][0]


    - name: "Utwórz unit systemd node_exporter"
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          ExecStart=/usr/local/bin/node_exporter {{ node_exporter_args }}
          Restart=on-failure
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectHome=true
          ProtectSystem=strict
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictAddressFamilies=AF_INET AF_INET6

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      register: node_exporter_unit

    - name: "Włącz i uruchom node_exporter przez systemd"
      ansible.builtin.systemd:
        name: node_exporter
        state: "{{ 'restarted' if ((node_exporter_user.changed | default(false)) or (node_exporter_install.changed | default(false)) or (node_exporter_symlink.changed | default(false)) or (node_exporter_runtime_signature.changed | default(false)) or (node_exporter_unit.changed | default(false))) else 'started' }}"
        enabled: true
        daemon_reload: true

    - name: "Czekaj na endpoint node_exporter"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9100
        timeout: 10

    - name: "Sprawdź endpoint metryk node_exporter"
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        status_code: 200
        return_content: false
