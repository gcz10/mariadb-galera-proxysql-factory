---
# F12 — Rolling restart klastra Galera (ISC-50, ISC-51).
#
# ISC-50: restart odbywa się z serial:1 (jeden węzeł naraz).
# ISC-51: kolejny węzeł nie jest ruszany, dopóki poprzedni nie odzyska zdrowia
#         (wsrep_local_state=4 Synced + Primary + pełny cluster_size).
#
# Kolejność (research galeracluster.com): najpierw non-writer węzły, writer na końcu.
# ProxySQL mysql_galera_hostgroups automatycznie promuje backup-writera gdy writer
# pada, więc restart writera jest bezpieczny, ale minimalizujemy churn failoveru.
#

# === Play 0: ustal aktywnego writera i kolejność restartu ===
- name: "F12 — ustal aktywnego writera (ProxySQL runtime)"
  hosts: proxysql[0]
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - vars/secret_policy.yml
    - vars/proxysql_hostgroups.yml
  vars:
    proxysql_admin_password: "{{ lookup('ansible.builtin.env', 'PROXYSQL_ADMIN_PASSWORD') }}"
  environment:
    MYSQL_PWD: "{{ proxysql_admin_password }}"

  tasks:
    - name: "Wymagaj PROXYSQL_ADMIN_PASSWORD"
      ansible.builtin.assert:
        that:
          - proxysql_admin_password | length >= (isa_min_secret_length | default(12))
        fail_msg: "Ustaw PROXYSQL_ADMIN_PASSWORD poza repozytorium."

    - name: "Odczytaj aktywnego writera z ProxySQL runtime_mysql_servers"
      ansible.builtin.shell: >-
        mariadb -h127.0.0.1 -P6032 -uadmin -N -B -e
        "SELECT hostname FROM runtime_mysql_servers
         WHERE hostgroup_id={{ galera_writer_hg }} AND status='ONLINE'"
      register: writer_ip_raw
      changed_when: false
      no_log: true

    - name: "Ustal writer host (mapowanie IP inventory → hostname)"
      ansible.builtin.set_fact:
        f12_writer_host: "{{ item }}"
      loop: "{{ groups['galera'] }}"
      when: hostvars[item].galera_node_address | default('') == writer_ip_raw.stdout | trim
      no_log: true

    - name: "Wymagaj jednoznacznego writera"
      ansible.builtin.assert:
        that:
          - f12_writer_host is defined
          - f12_writer_host | length > 0
        fail_msg: "Nie udało się ustalić aktywnego writera (runtime_mysql_servers puste?)."

    - name: "Kolejność restartu: non-writers potem writer"
      ansible.builtin.set_fact:
        f12_restart_order: >-
          {{
            (groups['galera'] | reject('equalto', f12_writer_host) | list)
            + [f12_writer_host]
          }}

    - name: "Pokaż kolejność restartu"
      ansible.builtin.debug:
        msg: "Restart order: {{ f12_restart_order }} (writer={{ f12_writer_host }} ostatni)"

# === Play 1: rolling restart NON-WRITER węzłów (serial:1) ===
- name: "F12 — rolling restart non-writer węzłów Galera (serial:1)"
  hosts: galera
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  vars:
    expected_size: "{{ galera.nodes_expected | default(3) }}"

  tasks:
    - name: "Pomiń writera (restart na końcu, osobny play)"
      ansible.builtin.meta: end_host
      when: inventory_hostname == hostvars[groups['proxysql'][0]].f12_writer_host

    - name: "ISC-50: status wsrep PRZED restartem"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-50: status wsrep PRZED restartem"
        health_retries: 3

    - name: "ISC-50: restartuj MariaDB przez systemd"
      ansible.builtin.systemd_service:
        name: mariadb
        state: restarted

    - name: "ISC-51: czekaj na socket MariaDB (wydłużony timeout na wypadek SST/IST)"
      ansible.builtin.wait_for:
        path: /var/lib/mysql/mysql.sock
        timeout: "{{ galera_socket_wait_timeout | default(300) | int }}"

    - name: "ISC-51: brama zdrowia — Synced + Primary + pełny size (przed kolejnym węzłem)"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-51: brama zdrowia po restarcie (przed kolejnym węzłem)"
        health_retries: 30

    - name: "ISC-51: potwierdzenie zdrowia węzła"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} rejoined: {{ _galera_health.stdout | replace('\t',' = ') | replace('\n',', ') }}"

# === Play 2: restart WRITERA (serial:1, na końcu) ===
- name: "F12 — restart writera Galera (serial:1, ostatni)"
  hosts: galera
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  vars:
    expected_size: "{{ galera.nodes_expected | default(3) }}"

  tasks:
    - name: "Pomiń non-writery (obsłużone w Play 1)"
      ansible.builtin.meta: end_host
      when: inventory_hostname != hostvars[groups['proxysql'][0]].f12_writer_host

    - name: "ISC-50: brama zdrowia PRZED restartem writera"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-50: brama zdrowia PRZED restartem writera"
        health_retries: 3

    - name: "ISC-50: restartuj MariaDB writera przez systemd"
      ansible.builtin.systemd_service:
        name: mariadb
        state: restarted

    - name: "ISC-51: czekaj na socket MariaDB writera (wydłużony timeout na wypadek SST/IST)"
      ansible.builtin.wait_for:
        path: /var/lib/mysql/mysql.sock
        timeout: "{{ galera_socket_wait_timeout | default(300) | int }}"

    - name: "ISC-51: brama zdrowia writera — Synced + Primary + pełny size"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-51: brama zdrowia writera po restarcie"
        health_retries: 30

    - name: "ISC-51: potwierdzenie zdrowia writera"
      ansible.builtin.debug:
        msg: "Writer {{ inventory_hostname }} rejoined: {{ _galera_health.stdout | replace('\t',' = ') | replace('\n',', ') }}"
