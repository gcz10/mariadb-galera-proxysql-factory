# tls_certs.yml — dystrybucja certyfikatów TLS na węzeł (gdy tls.mode == 'full').
# Include z site.yml / bootstrap.yml / f5_join.yml (węzły Galera, owner=mysql)
#   oraz f7_proxysql.yml (ProxySQL, owner=root, bez klucza prywatnego).
# Źródło: tls.ca_reference / tls.certificate_reference / tls.private_key_reference
#   = ścieżki na hoście kontrolnym (certificate_source=file) lub artefakty PKI produkcji.
# Zmienne sterujące:
#   tls_file_owner  (domyślnie 'mysql')  — właściciel plików/katalogu
#   tls_deploy_key  (domyślnie true)     — czy kopiować klucz prywatny (ProxySQL: false)
---
# audit: `copy` rozwiazuje relatywny `src` wzgledem katalogu PLAYBOOKA, wiec
# repo-relatywne referencje z cluster.yml (np. "tests/lab/tls/ca.pem", tak jak
# ma je lab2-cluster) laduja jako "playbooks/tests/lab/tls/ca.pem" i zadanie
# pada na "Could not find or access". Sciezki bezwzgledne (artefakty PKI
# produkcji) zostaja bez zmian.
- name: "TLS: rozwiaz referencje wzgledem katalogu repozytorium"
  ansible.builtin.set_fact:
    tls_reference_root: "{{ playbook_dir | dirname }}"

- name: "TLS: ustal zrodlowe sciezki certyfikatow"
  ansible.builtin.set_fact:
    tls_ca_src: "{{ tls.ca_reference if tls.ca_reference.startswith('/') else tls_reference_root ~ '/' ~ tls.ca_reference }}"
    tls_cert_src: "{{ tls.certificate_reference if tls.certificate_reference.startswith('/') else tls_reference_root ~ '/' ~ tls.certificate_reference }}"
    tls_key_src: "{{ tls.private_key_reference if tls.private_key_reference.startswith('/') else tls_reference_root ~ '/' ~ tls.private_key_reference }}"

# audit: katalog nadrzedny musi byc PRZECHODNI dla uslugi, ktora czyta certy.
# Wczesniej powstawal jako efekt uboczny tworzenia /etc/mysql/tls i dziedziczyl
# tls_file_owner: na wezlach Galera wychodzilo mysql:mysql 0750 (dziala), ale na
# wezlach ProxySQL root:root 0750 — proces proxysql nie mogl wejsc do katalogu i
# monitor raportowal "TLS/SSL error: Permission denied (13)", co SHUNNOWALO
# wszystkie backendy. Zarzadzamy nim jawnie, zeby fix dzialal takze na hostach,
# gdzie katalog juz istnieje (Ansible nie zmienia wlasciciela istniejacych
# katalogow nadrzednych). 0755 jest bezpieczne: to sam kontener, a klucz
# prywatny zostaje 0600 w katalogu 0750 ponizej.
- name: "TLS: zapewnij przechodni katalog nadrzedny"
  ansible.builtin.file:
    path: /etc/mysql
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "TLS: utwórz katalog na certyfikaty"
  ansible.builtin.file:
    path: /etc/mysql/tls
    state: directory
    owner: "{{ tls_file_owner | default('mysql') }}"
    group: "{{ tls_file_owner | default('mysql') }}"
    mode: "0750"

- name: "TLS: skopiuj CA"
  ansible.builtin.copy:
    src: "{{ tls_ca_src }}"
    dest: /etc/mysql/tls/ca.pem
    owner: "{{ tls_file_owner | default('mysql') }}"
    group: "{{ tls_file_owner | default('mysql') }}"
    mode: "0644"
  register: tls_ca_copy

- name: "TLS: skopiuj certyfikat serwera"
  ansible.builtin.copy:
    src: "{{ tls_cert_src }}"
    dest: /etc/mysql/tls/server-cert.pem
    owner: "{{ tls_file_owner | default('mysql') }}"
    group: "{{ tls_file_owner | default('mysql') }}"
    mode: "0644"
  register: tls_cert_copy

- name: "TLS: skopiuj klucz prywatny (0600, tylko gdy potrzebny na węźle)"
  ansible.builtin.copy:
    src: "{{ tls_key_src }}"
    dest: /etc/mysql/tls/server-key.pem
    owner: "{{ tls_file_owner | default('mysql') }}"
    group: "{{ tls_file_owner | default('mysql') }}"
    mode: "0600"
  when: tls_deploy_key | default(true)
  register: tls_key_copy

# audit#8: include_tasks nie agreguje ,changed' dzieci — tls_deploy_result.changed
# zawsze False, więc sama rotacja PEM (bez zmiany server.cnf) nie restartowała MariaDB.
# set_fact jest widoczne w play-rodzicu po include → site.yml restartuje przy zmianie pliku.
- name: "TLS: zapamiętaj czy pliki uległy zmianie"
  ansible.builtin.set_fact:
    tls_files_changed: >-
      {{
        (tls_ca_copy.changed | default(false))
        or (tls_cert_copy.changed | default(false))
        or (tls_key_copy.changed | default(false))
      }}
