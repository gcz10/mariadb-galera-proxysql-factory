---
# F2: Repozytoria + instalacja pakietow z lockfile — wylacznie wezly klastra
# Satisfies: ISC-3 (wersje zgodne z lockfile), ISC-63 (no state:latest)
# Instaluje: MariaDB 11.4 + galera-4 + mariadb-backup (galera/restore).
# Sciezka ProxySQL (RPM + GPG + drop-in) mieszkala tutaj jako prerogatywa
# klastra-"ownera" pary — od wydzielenia warstwy wspolnej instaluje ja
# wylacznie platform_install.yml z lockfile platformy.

- name: F2 Instalacja repozytoriow i pakietow
  # Najemca instaluje WYLACZNIE na wlasnych wezlach (galera/restore). Zakres
  # `all` liczyl tez fcp1/fcp2/fcinfra/fcapp z inwentarza klastra, wiec
  # chrony czy qemu-guest-agent ladowaly na hostach, ktorych cyklem zycia
  # zarzadza `make platform-*` — dokladnie to wlasnosciowe sprzezenie,
  # ktore mialo zniknac.
  hosts: galera:restore
  become: true
  serial: 1
  max_fail_percentage: 0
  # R1: usunieto martwe zmienne tego play'a (zero uzyc, a niosly hardcode):
  #  - mariadb_version ("11.4")  -> repo konfiguruje lock.mariadb.repo_setup_args
  # Wzmianki o martwych zmiennych ProxySQL przeniesly sie razem z ta sciezka
  # do platform_install.yml.

  tasks:
    # Załaduj lockfile do namespace `lock` (nie kolizjonuje z proxysql/mariadb z cluster.yml).
    - name: "Załaduj versions.lock.yml (reprodukowalne wersje)"
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock

    # Obrazy GenericCloud startuja z hostname "localhost" i PVE go nie nadpisuje, gdy
    # user-data pochodzi z cicustom. Efekt: journald/syslog na KAZDYM wezle pisze
    # "localhost", co uniemozliwia korelacje logow miedzy hostami przy incydencie.
    - name: "Ustaw hostname zgodny z inventory (korelacja logow)"
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
      when: ansible_service_mgr == 'systemd'

    # === Galera nodes: MariaDB repo + pakiety ===
    - name: "MariaDB repo - pobierz mariadb_repo_setup (audit#6: weryfikacja sha256)"
      ansible.builtin.get_url:
        url: "https://downloads.mariadb.com/MariaDB/mariadb_repo_setup"
        dest: /usr/local/bin/mariadb_repo_setup
        mode: "0755"
        checksum: "sha256:{{ lock.mariadb.repo_setup_sha256 }}"
      when: "'galera' in group_names"


    # `creates:` pilnowalo samego ISTNIENIA pliku repo, wiec podbicie wersji w
    # lockfile nie docieralo do hosta, ktory juz raz byl konfigurowany: zostawal
    # przy starym repozytorium i instalowal z niego. Bramkujemy TRESCIA — repo
    # ma wskazywac dokladnie te wersje, ktora deklaruje lockfile.
    - name: "MariaDB repo - sprawdz, czy wskazuje wersje z lockfile"
      # Dwa udokumentowane uklady sciezki: `mariadb-server/<wersja>/` generuje
      # skrypt repo_setup, `mariadb-<wersja>/` ma archiwum MariaDB, ktorym
      # dokumentacja kaze przypinac recznie. Wzorzec musi uznac oba, inaczej
      # host przypiety recznie dostaje repo_setup przy kazdym converge.
      ansible.builtin.command: "grep -Eq 'mariadb-(server/)?{{ lock.mariadb.version | regex_escape }}/' /etc/yum.repos.d/mariadb.repo"
      register: mariadb_repo_pinned
      failed_when: false
      changed_when: false
      when: "'galera' in group_names"

    - name: "MariaDB repo - konfiguruj wersje z lockfile"
      ansible.builtin.command: "/usr/local/bin/mariadb_repo_setup {{ lock.mariadb.repo_setup_args }} --skip-check-installed"
      when:
        - "'galera' in group_names"
        - mariadb_repo_pinned.rc | default(1) != 0
      changed_when: true

    - name: Instaluj MariaDB Server + Galera + Backup (wersje PRZYPIĘTE z lockfile; audit#12)
      ansible.builtin.dnf:
        name:
          # audit#12: NEVRA z lockfile zamiast samej nazwy — bez tego dnf brał najnowszą
          # dostępną wersję, a zgodność sprawdzano dopiero PO mutacji hosta.
          - "{{ lock.mariadb.server_package | default('MariaDB-server') }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
          - "{{ lock.mariadb.client_package | default('MariaDB-client') }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
          - "{{ lock.mariadb.mariadb_backup_package | default('MariaDB-backup') }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
          - "{{ lock.mariadb.galera_provider | default('galera-4') }}-{{ lock.mariadb.galera_provider_version }}-{{ lock.mariadb.galera_provider_rpm_release }}"
          - socat
          - rsync
          - lsof
          - python3-PyMySQL
          - policycoreutils-python-utils
          - checkpolicy
        state: present
      when: "'galera' in group_names"

    # Oficjalny pakiet MariaDB dostarcza źródło polityki Galera, ale nie ładuje
    # skompilowanego modułu. Bez niego SST mariabackup jest blokowany m.in. na setpgid.
    - name: "SELinux - przygotuj katalog budowy polityki MariaDB Galera"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /var/cache/isa-selinux
        - /var/cache/isa-selinux/active
      when:
        - "'galera' in group_names"
        - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    - name: "SELinux - skompiluj pakietową politykę MariaDB Galera"
      ansible.builtin.command:
        argv:
          - /usr/bin/checkmodule
          - -M
          - -m
          - -o
          - /var/cache/isa-selinux/mariadb-server.mod
          - /usr/share/mariadb/policy/selinux/mariadb-server.te
      changed_when: false
      when:
        - "'galera' in group_names"
        - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    - name: "SELinux - zbuduj moduł MariaDB Galera"
      ansible.builtin.command:
        argv:
          - /usr/bin/semodule_package
          - -o
          - /var/cache/isa-selinux/mariadb-server.pp
          - -m
          - /var/cache/isa-selinux/mariadb-server.mod
      changed_when: false
      when:
        - "'galera' in group_names"
        - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    - name: "SELinux - usuń poprzednią kopię aktywnego modułu"
      ansible.builtin.file:
        path: /var/cache/isa-selinux/active/mariadb-server.pp
        state: absent
      changed_when: false
      when:
        - "'galera' in group_names"
        - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    - name: "SELinux - pobierz aktywny moduł MariaDB Galera"
      ansible.builtin.command:
        argv:
          - /usr/sbin/semodule
          - -X
          - "400"
          - -E
          - mariadb-server
      args:
        chdir: /var/cache/isa-selinux/active
      changed_when: false
      failed_when: false
      when:
        - "'galera' in group_names"
        - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    - name: "SELinux - oblicz checksumę zbudowanego modułu"
      ansible.builtin.stat:
        path: /var/cache/isa-selinux/mariadb-server.pp
        checksum_algorithm: sha256
      register: mariadb_galera_policy_candidate
      when:
        - "'galera' in group_names"
        - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    - name: "SELinux - oblicz checksumę aktywnego modułu"
      ansible.builtin.stat:
        path: /var/cache/isa-selinux/active/mariadb-server.pp
        checksum_algorithm: sha256
      register: mariadb_galera_policy_active
      when:
        - "'galera' in group_names"
        - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    - name: "SELinux - załaduj politykę MariaDB Galera gdy zmieniona"
      ansible.builtin.command:
        argv:
          - /usr/sbin/semodule
          - -X
          - "400"
          - -i
          - /var/cache/isa-selinux/mariadb-server.pp
      # Laduje modul polityki SELinux — mutacja stanu hosta; zadanie jest
      # juz ograniczone warunkiem checksumy modulu (nie poleci bez zmiany).
      changed_when: true
      when:
        - "'galera' in group_names"
        - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'
        - >-
          not mariadb_galera_policy_active.stat.exists or
          mariadb_galera_policy_candidate.stat.checksum !=
          (mariadb_galera_policy_active.stat.checksum | default(''))


    - name: "Katalog drop-in mariadb.service"
      ansible.builtin.file:
        path: /etc/systemd/system/mariadb.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - "'galera' in group_names"
        - ansible_facts['service_mgr'] == 'systemd'

    - name: "SST bywa dłuższy niż domyślny TimeoutStartSec — drop-in zapobiega zabiciu mariadbd przez systemd"
      ansible.builtin.copy:
        content: |
          [Service]
          TimeoutStartSec=infinity
          LimitNOFILE=1048576
          # Rekomendacja produkcyjna: OOMScoreAdjust=-800 chroni proces bazy
          # przed ubiciem przez kernel OOM killer przed innymi procesami w tle.
          OOMScoreAdjust=-800
        dest: /etc/systemd/system/mariadb.service.d/timeoutstartsec.conf
        owner: root
        group: root
        mode: "0644"
      when:
        - "'galera' in group_names"
        - ansible_facts['service_mgr'] == 'systemd'

    - name: "Włącz mariadb.service na starcie (produkcja: boot persistence; start przez bootstrap/join)"
      ansible.builtin.systemd:
        name: mariadb
        enabled: true
        daemon_reload: true
      when:
        - "'galera' in group_names"
        - ansible_facts['service_mgr'] == 'systemd'
    # === Tuning jądra OS (sysctl) dla baz danych i load balancerów ===
    - name: "Wdróż konfigurację sysctl dla baz danych i ProxySQL"
      ansible.builtin.copy:
        content: |
          # ISA Database & ProxySQL sysctl tuning
          vm.swappiness = 10
          net.core.somaxconn = 4096
          net.ipv4.tcp_max_syn_backlog = 4096
          fs.file-max = 2097152
        dest: /etc/sysctl.d/90-database-tuning.conf
        owner: root
        group: root
        mode: "0644"
      when: ansible_facts['service_mgr'] == 'systemd'
      register: db_sysctl_conf

    - name: "Zastosuj parametry sysctl"
      ansible.builtin.command: sysctl --system
      when:
        - ansible_facts['service_mgr'] == 'systemd'
        - db_sysctl_conf.changed
      changed_when: true

    # === Transparent Huge Pages (THP) — wyłączenie dla baz danych ===
    # B-drzewa InnoDB oraz silnik pamięci ProxySQL mają rzadki dostęp do pamięci.
    # THP alokuje 2MB ciągłe strony i przy braku ciągłej pamięci wywołuje defragmentację
    # synchroniczną w jądrze, co powoduje skoki opóźnień (latency spikes) i fragmentację RAM.
    # Oficjalne przewodniki MariaDB/Percona zalecają wyłączenie THP (never).
    - name: "THP — wdróż usługę systemd wyłączającą Transparent Huge Pages"
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Disable Transparent Huge Pages (THP) for Database Performance
          DefaultDependencies=no
          After=sysinit.target local-fs.target
          Before=mongod.service mariadb.service mysql.service mysqld.service proxysql.service

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled && echo never > /sys/kernel/mm/transparent_hugepage/defrag'
          RemainAfterExit=yes

          [Install]
          WantedBy=basic.target
        dest: /etc/systemd/system/disable-thp.service
        owner: root
        group: root
        mode: "0644"
      when: ansible_facts['service_mgr'] == 'systemd'
      register: thp_service_unit

    - name: "THP — włącz i uruchom disable-thp.service"
      ansible.builtin.systemd:
        name: disable-thp
        enabled: true
        state: started
        daemon_reload: "{{ thp_service_unit.changed }}"
      when: ansible_facts['service_mgr'] == 'systemd'
    # === Wspolne: time sync ===
    - name: Instaluj i wlacz chrony
      ansible.builtin.dnf:
        name: chrony
        state: present

    - name: Wlacz chrony (jeśli systemd dostepny)
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true
      when: ansible_facts['service_mgr'] == 'systemd'

    # Agent gościa ma sens wylacznie pod KVM/QEMU (hypervisor widzi wtedy adresy
    # i potrafi zamknac maszyne czysto). Na blaszaku, w LXC albo pod innym
    # hypervisorem pakietu nie ma po co instalowac — a na czesci z nich nie ma
    # go w repozytoriach i bezwarunkowa instalacja wywracala caly przebieg.
    - name: "Zainstaluj qemu-guest-agent (tylko gosc KVM/QEMU)"
      ansible.builtin.dnf:
        name: qemu-guest-agent
        state: present
      when:
        - ansible_facts['virtualization_role'] | default('') == 'guest'
        - ansible_facts['virtualization_type'] | default('') in ['kvm', 'qemu', 'RHEV']

    - name: "Wlacz qemu-guest-agent (gdy systemd; nieblokujace — wymaga kanalu virtio-serial)"
      ansible.builtin.systemd:
        name: qemu-guest-agent
        state: started
        enabled: true
      when:
        - ansible_facts['service_mgr'] == 'systemd'
        - ansible_facts['virtualization_role'] | default('') == 'guest'
        - ansible_facts['virtualization_type'] | default('') in ['kvm', 'qemu', 'RHEV']
      failed_when: false
      changed_when: false

    - name: "ISC-3: asercja zainstalowanej wersji MariaDB zgodnej z lockfile"
      ansible.builtin.shell: "set -o pipefail; mariadbd --version | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+' | head -1"
      register: f2_installed_mariadb
      changed_when: false
      failed_when: false
      when: "'galera' in group_names"

    - name: "ISC-3: zatrzymaj jeśli wersja MariaDB odbiega od lockfile"
      ansible.builtin.assert:
        that:
          - f2_installed_mariadb.stdout == (lock.mariadb.version | default(f2_installed_mariadb.stdout))
        fail_msg: "Zainstalowana MariaDB {{ f2_installed_mariadb.stdout }} != lockfile {{ lock.mariadb.version | default('?') }}. Deployment zatrzymany (ISC-3)."
      when: "'galera' in group_names"

  handlers: []
