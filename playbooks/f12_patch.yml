---
# F12 — Rolling patch/upgrade z canary i bramą zdrowia (ISC-52, ISC-55, ISC-57).
#
# ISC-52: patching ma canary — jeden węzeł poza aktywnym writerem patchowany
#         pierwszy; dopiero po potwierdzeniu zdrowia kontynuuj pozostałe.
# ISC-55: upgrade zatrzymuje się po utracie zdrowia klastra — brama zdrowia
#         (Synced+Primary+size) po każdym węźle; porażka zatrzymuje rolling.
# ISC-57: ProxySQL aktualizuje się osobno, jedną instancję naraz (serial:1).
#
# audit#11: NIE ma już fałszywego "patcha". Bez -e f12_patch_packages/f12_patch_command
# playbook jawnie raportuje DRY-RUN (0 pakietów zmienionych) i ćwiczy tylko canary+health-gate.
# Realny patch: dnf update wskazanych pakietów + restart usługi gdy binarium się zmienił
# + weryfikacja wersji runtime przed/po (playbooks/f12_apply_patch.yml).
# Zgodnie z research (proxysql.com): SAVE ... TO DISK przed restartem ProxySQL.

# === Play 0: ustal writera (canary = non-writer) ===
- name: "F12 — ustal writera dla canary patch"
  hosts: proxysql[0]
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - vars/secret_policy.yml
    - vars/proxysql_hostgroups.yml
  vars:
    proxysql_admin_password: "{{ lookup('ansible.builtin.env', 'PROXYSQL_ADMIN_PASSWORD') }}"
  environment:
    MYSQL_PWD: "{{ proxysql_admin_password }}"
  tasks:
    - name: "Wymagaj PROXYSQL_ADMIN_PASSWORD"
      ansible.builtin.assert:
        that: [proxysql_admin_password | length >= (isa_min_secret_length | default(12))]
        fail_msg: "Ustaw PROXYSQL_ADMIN_PASSWORD poza repozytorium."
    - name: "Odczytaj writera (ProxySQL runtime)"
      ansible.builtin.command:
        argv:
          - mariadb
          - -h127.0.0.1
          - -P6032
          - -uadmin
          - -N
          - -B
          - -e
          - "SELECT hostname FROM runtime_mysql_servers WHERE hostgroup_id={{ galera_writer_hg }} AND status='ONLINE'"
      register: f12_patch_writer_ip
      changed_when: false
      no_log: true
    - name: "Ustal writer host"
      ansible.builtin.set_fact:
        f12_patch_writer: "{{ item }}"
      loop: "{{ groups['galera'] }}"
      when: hostvars[item].galera_node_address | default('') == f12_patch_writer_ip.stdout | trim
      no_log: true
    - name: "Wymagaj jednoznacznego writera"
      ansible.builtin.assert:
        that:
          - f12_patch_writer is defined
          - f12_patch_writer | length > 0
        fail_msg: "Nie udało się ustalić aktywnego writera; patch został zablokowany."

    - name: "Ustal canary host (pierwszy non-writer)"
      ansible.builtin.set_fact:
        f12_patch_canary: "{{ (groups['galera'] | reject('equalto', f12_patch_writer) | list)[0] }}"
    - name: "Raport kolejności patch"
      ansible.builtin.debug:
        msg: "Canary={{ f12_patch_canary }}, writer={{ f12_patch_writer }} (ostatni)"

# === Play 1: ISC-52 CANARY — patch jednego non-writera + brama zdrowia ===
- name: "F12 — ISC-52 canary patch (non-writer, z bramą zdrowia)"
  hosts: galera
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    f12_role: "galera"
    f12_service: "mariadb"
    f12_version_cmd: "mariadbd --version"
    expected_size: "{{ galera.nodes_expected | default(3) }}"
  tasks:
    - name: "Pomiń jeśli to nie canary"
      ansible.builtin.meta: end_host
      when: inventory_hostname != hostvars[groups['proxysql'][0]].f12_patch_canary
    - name: "ISC-52: brama zdrowia PRZED patchem canary (Synced+Primary+size)"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-52: brama zdrowia PRZED patchem canary"
        health_retries: 3
    - name: "ISC-52: canary — patch (real gdy podano pakiety/komendę; inaczej DRY-RUN)"
      ansible.builtin.include_tasks: f12_apply_patch.yml
    - name: "ISC-52: brama zdrowia canary — Synced+Primary+size"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-52: brama zdrowia canary PO patchu"
        health_retries: 24
    - name: "ISC-52: canary zdrowy — kontynuuj rolling"
      ansible.builtin.debug:
        msg: "Canary {{ inventory_hostname }} OK po patch — health stable"

# === Play 2: ISC-55 rolling patch pozostałych non-writerów (serial:1, stop na utracie zdrowia) ===
- name: "F12 — ISC-55 rolling patch non-writerów (serial:1, stop na utracie zdrowia)"
  hosts: galera
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  vars:
    f12_role: "galera"
    f12_service: "mariadb"
    f12_version_cmd: "mariadbd --version"
    expected_size: "{{ galera.nodes_expected | default(3) }}"
  tasks:
    - name: "Pomiń canary i writera"
      ansible.builtin.meta: end_host
      when: >-
        inventory_hostname == hostvars[groups['proxysql'][0]].f12_patch_canary
        or inventory_hostname == hostvars[groups['proxysql'][0]].f12_patch_writer
    - name: "ISC-55: brama zdrowia PRZED patchem non-writera (Synced+Primary+size)"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-55: brama zdrowia PRZED patchem non-writera"
        health_retries: 3
    - name: "ISC-55: patch non-writera (real lub DRY-RUN)"
      ansible.builtin.include_tasks: f12_apply_patch.yml
    - name: "ISC-55: brama zdrowia — STOP rolling jeśli klaster utracił zdrowie"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-55: brama zdrowia PO patchu non-writera (STOP przy utracie zdrowia)"
        health_retries: 24

# === Play 3: patch WRITERA (serial:1, ostatni) ===
- name: "F12 — patch writera (serial:1, ostatni, z bramą zdrowia)"
  hosts: galera
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  vars:
    f12_role: "galera"
    f12_service: "mariadb"
    f12_version_cmd: "mariadbd --version"
    expected_size: "{{ galera.nodes_expected | default(3) }}"
  tasks:
    - name: "Pomiń non-writery"
      ansible.builtin.meta: end_host
      when: inventory_hostname != hostvars[groups['proxysql'][0]].f12_patch_writer
    - name: "ISC-55: brama zdrowia PRZED patchem writera (Synced+Primary+size)"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-55: brama zdrowia PRZED patchem writera"
        health_retries: 3
    - name: "ISC-55: patch writera (real lub DRY-RUN)"
      ansible.builtin.include_tasks: f12_apply_patch.yml
    - name: "ISC-55: brama zdrowia writera"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "ISC-55: brama zdrowia writera PO patchu"
        health_retries: 24

# === Play 4: ISC-57 ProxySQL rolling patch (serial:1, osobno) ===
- name: "F12 — ISC-57 ProxySQL rolling patch (serial:1, osobno)"
  hosts: proxysql
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  vars_files:
    - vars/proxysql_hostgroups.yml
  vars:
    f12_role: "proxysql"
    f12_service: "proxysql"
    f12_version_cmd: "proxysql --version"
    f12_patch_command: "{{ f12_proxysql_patch_command | default('') }}"
    f12_patch_packages: "{{ f12_proxysql_patch_packages | default([]) }}"
    proxysql_admin_password: "{{ lookup('ansible.builtin.env', 'PROXYSQL_ADMIN_PASSWORD') }}"
  environment:
    MYSQL_PWD: "{{ proxysql_admin_password }}"
  tasks:
    - name: "ISC-57: zapisz config ProxySQL do DISK przed patch (proxysql.com)"
      ansible.builtin.shell: >-
        mariadb -h127.0.0.1 -P6032 -uadmin -N -B -e
        "SAVE MYSQL SERVERS TO DISK; SAVE MYSQL USERS TO DISK;
         SAVE MYSQL VARIABLES TO DISK; SAVE ADMIN VARIABLES TO DISK;"
      changed_when: false
      no_log: true
    - name: "ISC-57: patch ProxySQL, jedna instancja naraz (real lub DRY-RUN)"
      ansible.builtin.include_tasks: f12_apply_patch.yml
    - name: "ISC-57: brama zdrowia ProxySQL — admin port + backends ONLINE"
      ansible.builtin.shell: >-
        mariadb -h127.0.0.1 -P6032 -uadmin -N -B -e
        "SELECT COUNT(*) FROM runtime_mysql_servers WHERE hostgroup_id={{ galera_writer_hg }} AND status='ONLINE'"
      register: f12_proxysql_backends
      until: (f12_proxysql_backends.stdout | trim | int) >= 1
      retries: 12
      delay: 5
      changed_when: false
      no_log: true
    - name: "ISC-57: ProxySQL zdrowy po patch ({{ inventory_hostname }})"
      ansible.builtin.debug:
        msg: "ProxySQL {{ inventory_hostname }} online ({{ f12_proxysql_backends.stdout | trim }} backends ONLINE)"
