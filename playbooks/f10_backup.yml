---
# F10: Backup MariaDB → off-cluster S3 (szyfrowany, z checksumą i metadanymi).
# Satisfies: ISC-32 (off-cluster), ISC-33 (encrypted), ISC-34 (checksum),
# ISC-35 (metadata: wersja+czas+cluster+wsrep seqno), ISC-39 (brak degradacji writera).
#
# Off-cluster transport = S3 (MinIO). Lab OrbStack nie ma modułu jądra cifs,
# więc SMB (produkcyjny domyślny) nie jest tu testowalny (ograniczenie jądra).
# Źródło backupu = galera[1] (typowo NIE aktywny writer) → chroni writera (ISC-39).

- name: "F10 — backup MariaDB → S3"
  hosts: galera[1]
  become: true
  gather_facts: true
  vars:
    backup_staging: "{{ storage.backup_staging_directory | default('/var/tmp/mariadb-backup') }}"
    backup_enc_key: "{{ lookup('ansible.builtin.env', 'BACKUP_ENCRYPTION_KEY') }}"
    minio_sdk_version: "7.2.7"
    backup_ts: "{{ ansible_date_time.iso8601_basic_short }}"
    backup_name: "galera-{{ cluster.name }}-{{ backup_ts }}"
    writer_flow_threshold_ns: 1000000000
    state_dir: "/var/lib/mariadb-backup-state"
  environment:
    S3_ENDPOINT: "{{ backup.s3.endpoint }}"
    S3_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') }}"
    S3_SECRET_KEY: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') }}"
    S3_SECURE: "{{ backup.s3.secure | default(false) | string | lower }}"

  pre_tasks:
    - name: "Wymagaj włączonego backupu i sekretów"
      ansible.builtin.assert:
        that:
          - backup.enabled | bool
          - backup_enc_key | length > 0
          - lookup('ansible.builtin.env', 'MINIO_ROOT_USER') | length > 0
          - lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') | length > 0
        fail_msg: "Ustaw BACKUP_ENCRYPTION_KEY, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD poza repo."

    - name: "Wymagaj destination=s3 (SMB nietestowalny w tym labie — brak modułu cifs)"
      ansible.builtin.assert:
        that:
          - backup.destination == 's3'
        fail_msg: >-
          Ten playbook w labie obsługuje destination=s3. Produkcja: smb (cifs mount) —
          zaimplementuj mount przed backupem; lab OrbStack nie ma modułu jądra cifs.

  tasks:
    - name: "Zainstaluj klienta S3 (minio SDK, przypięty) i openssl"
      ansible.builtin.pip:
        name: "minio=={{ minio_sdk_version }}"
        state: present

    - name: "Wdróż helper S3"
      ansible.builtin.copy:
        src: ../roles/backup/files/s3_object.py
        dest: /usr/local/bin/s3_object.py
        mode: "0755"

    - name: "Utwórz katalog stanu backupu"
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        mode: "0750"

    - name: "Zapewnij bucket S3"
      ansible.builtin.command: "python3 /usr/local/bin/s3_object.py ensure-bucket {{ backup.s3.bucket }}"
      changed_when: false

    - name: "ISC-39: baseline flow control writera"
      ansible.builtin.shell: >-
        mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
        "SHOW STATUS LIKE 'wsrep_flow_control_paused_ns'" | awk '{print $2}'
      register: fc_before
      changed_when: false
      delegate_to: "{{ groups['galera'][0] }}"

    - name: "Wyczyść staging"
      ansible.builtin.file:
        path: "{{ backup_staging }}"
        state: absent

    - name: "Utwórz staging"
      ansible.builtin.file:
        path: "{{ backup_staging }}/raw"
        state: directory
        mode: "0700"

    - name: "mariadb-backup --backup (--galera-info)"
      ansible.builtin.command: >-
        mariadb-backup --backup --target-dir={{ backup_staging }}/raw
        --user=root --socket=/var/lib/mysql/mysql.sock --galera-info
      changed_when: true

    - name: "mariadb-backup --prepare (spójny backup)"
      ansible.builtin.command: >-
        mariadb-backup --prepare --target-dir={{ backup_staging }}/raw
      changed_when: true

    - name: "ISC-39: flow control writera po backupie"
      ansible.builtin.shell: >-
        mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
        "SHOW STATUS LIKE 'wsrep_flow_control_paused_ns'" | awk '{print $2}'
      register: fc_after
      changed_when: false
      delegate_to: "{{ groups['galera'][0] }}"

    - name: "ISC-39: backup nie wywołał flow control ponad threshold"
      ansible.builtin.assert:
        that:
          - (fc_after.stdout | int) - (fc_before.stdout | int) < writer_flow_threshold_ns
        fail_msg: >-
          Backup wywołał flow control {{ (fc_after.stdout | int) - (fc_before.stdout | int) }} ns
          (> {{ writer_flow_threshold_ns }} ns) — degradacja writera.

    - name: "ISC-35: odczytaj pozycję wsrep z backupu (mariadb_backup_galera_info)"
      ansible.builtin.shell: >-
        awk '{print $1}' {{ backup_staging }}/raw/mariadb_backup_galera_info
      register: galera_info
      changed_when: false

    - name: "ISC-35: odczytaj wersję MariaDB"
      ansible.builtin.shell: "mariadbd --version | sed -E 's/.*Distrib ([0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/'"
      register: mariadb_version
      changed_when: false

    - name: "Spakuj backup"
      ansible.builtin.command: >-
        tar -czf {{ backup_staging }}/backup.tar -C {{ backup_staging }}/raw .
      changed_when: true

    - name: "ISC-34: policz sha256 PLAINTEXT backupu (wykryje uszkodzenie przed szyfrowaniem)"
      ansible.builtin.shell: >-
        sha256sum {{ backup_staging }}/backup.tar | awk '{print $1}'
      register: plaintext_sha
      changed_when: false

    - name: "ISC-33: zaszyfruj backup (openssl aes-256-cbc, pbkdf2)"
      ansible.builtin.shell: >-
        openssl enc -aes-256-cbc -pbkdf2 -salt
        -in {{ backup_staging }}/backup.tar
        -out {{ backup_staging }}/backup.tar.enc
        -pass env:BACKUP_ENCRYPTION_KEY
      environment:
        BACKUP_ENCRYPTION_KEY: "{{ backup_enc_key }}"
      changed_when: true

    - name: "ISC-34: policz sha256 zaszyfrowanego backupu"
      ansible.builtin.shell: >-
        sha256sum {{ backup_staging }}/backup.tar.enc | awk '{print $1}'
      register: backup_sha
      changed_when: false

    - name: "ISC-34: zapisz plik checksum"
      ansible.builtin.copy:
        content: "{{ backup_sha.stdout }}  backup.tar.enc\n"
        dest: "{{ backup_staging }}/backup.sha256"
        mode: "0600"

    - name: "Rozmiar zaszyfrowanego backupu"
      ansible.builtin.stat:
        path: "{{ backup_staging }}/backup.tar.enc"
      register: enc_stat

    - name: "ISC-35: zapisz metadata.json"
      ansible.builtin.copy:
        content: |
          {
            "backup_name": "{{ backup_name }}",
            "cluster_name": "{{ cluster.name }}",
            "mariadb_version": "{{ mariadb_version.stdout }}",
            "created_at": "{{ ansible_date_time.iso8601 }}",
            "wsrep_galera_info": "{{ galera_info.stdout }}",
            "wsrep_uuid": "{{ galera_info.stdout.split(':')[0] }}",
            "wsrep_seqno": "{{ galera_info.stdout.split(':')[1] | default('') }}",
            "sha256": "{{ backup_sha.stdout }}",
            "size_bytes": {{ enc_stat.stat.size }},
            "sha256_plaintext": "{{ plaintext_sha.stdout }}",
            "encryption": "aes-256-cbc/pbkdf2",
            "source_host": "{{ inventory_hostname }}"
          }
        dest: "{{ backup_staging }}/metadata.json"
        mode: "0600"

    - name: "ISC-32: wyślij artefakty do S3 (off-cluster)"
      ansible.builtin.command: >-
        python3 /usr/local/bin/s3_object.py put {{ backup.s3.bucket }}
        {{ backup_name }}/{{ item }} {{ backup_staging }}/{{ item }}
      loop:
        - backup.tar.enc
        - backup.sha256
        - metadata.json
      changed_when: true

    - name: "Retencja: usuń backupy starsze niż {{ backup.retention_days }} dni"
      ansible.builtin.command: >-
        python3 /usr/local/bin/s3_object.py prune {{ backup.s3.bucket }}
        galera-{{ cluster.name }}- {{ backup.retention_days }}
      register: prune_result
      changed_when: "'pruned:0' not in prune_result.stdout"

    - name: "ISC-32: usuń lokalny staging (backup istnieje tylko off-cluster)"
      ansible.builtin.file:
        path: "{{ backup_staging }}"
        state: absent

    - name: "Zapisz stan ostatniego udanego backupu (ISC-37/38)"
      ansible.builtin.copy:
        content: |
          {"last_backup": "{{ ansible_date_time.iso8601 }}", "backup_name": "{{ backup_name }}", "status": "success"}
        dest: "{{ state_dir }}/last_backup.json"
        mode: "0640"

    - name: "Raport backupu"
      ansible.builtin.debug:
        msg: >-
          Backup {{ backup_name }} → s3://{{ backup.s3.bucket }} (szyfr aes-256-cbc,
          sha256={{ backup_sha.stdout[:16] }}…, seqno={{ galera_info.stdout }},
          flow_control_delta={{ (fc_after.stdout | int) - (fc_before.stdout | int) }} ns)

  handlers: []
