---
# F10: Backup MariaDB — Dispatcher to galera-backup runner and per-cluster configuration.

- name: Remove legacy and stale scheduler cron from Galera nodes
  hosts: galera
  become: true
  gather_facts: false
  vars_files:
    - vars/proxysql_hostgroups.yml
  vars:
    galera_backup_action: "{{ action | default('configure') }}"
  pre_tasks:
    - name: Load platform lockfile
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock
  tasks:
    - name: Remove legacy controller-era cron
      ansible.builtin.file:
        path: "/etc/cron.d/mariadb-backup-{{ cluster.name }}"
        state: absent
      when: galera_backup_action == 'configure'

    # Cron stoi teraz na KAZDYM wezle Galery: donora wybiera runner przy starcie
    # (backup hostgroup ProxySQL), a wezel niewybrany konczy sie rc=0. Wczesniej
    # cron byl tylko na przypietym hoscie, wiec failover NA niego zabieral
    # klastrowi backupy do czasu recznej zmiany cluster.yml.

- name: Configure or run Galera backup on the selected scheduler
  # W runtime `default` jest martwe (make zawsze podaje -e @clusters/<name>/cluster.yml),
  # ale bez niego `hosts` jest nierozwiazywalne dla ansible-lint, ktory w przeciwienstwie
  # do ansible-playbook nie przyjmuje extra-vars. Ta sama konwencja co bootstrap.yml
  # (bootstrap_node | default('galera[0]')) i f13_remove_node.yml.
  hosts: "{{ backup.scheduler.host | default('galera[0]') }}"
  become: true
  gather_facts: true
  vars_files:
    - vars/proxysql_hostgroups.yml
  vars:
    galera_backup_action: "{{ action | default('configure') }}"
    galera_backup_encryption_key: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_ENCRYPTION_KEY') | default(lookup('ansible.builtin.env', 'BACKUP_ENCRYPTION_KEY'), true) }}"
    galera_backup_s3_access_key: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_S3_ACCESS_KEY') | default('', true) }}"
    galera_backup_s3_secret_key: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_S3_SECRET_KEY') | default('', true) }}"
    galera_backup_smb_username: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_SMB_USERNAME') | default('', true) }}"
    galera_backup_smb_password: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_SMB_PASSWORD') | default('', true) }}"
    galera_backup_smb_domain: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_SMB_DOMAIN') | default('', true) }}"
    # Straznik writera dostaje konto READ-ONLY z admin-stats_credentials, nie
    # admina. Sekret laduje na dysku wezla Galery, a runner laczy sie po sieci
    # (ProxySQL nie wpuszcza `admin` spoza loopbacku).
    galera_backup_proxysql_stats_user: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_PROXYSQL_STATS_USER') | default(proxysql_stats_user, true) }}"
    galera_backup_proxysql_stats_password: "{{ lookup('ansible.builtin.env', 'PROXYSQL_STATS_PASSWORD') }}"
  pre_tasks:
    - name: Load platform lockfile
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock

    - name: Validate action variable
      ansible.builtin.assert:
        that:
          - galera_backup_action in ['configure', 'run']
        fail_msg: "galera_backup_action must be 'configure' or 'run'"
    - name: Require ProxySQL read-only credentials for the scheduler writer guard
      ansible.builtin.assert:
        that:
          - galera_backup_proxysql_stats_password | length > 0
        fail_msg: "Ustaw PROXYSQL_STATS_PASSWORD — backup musi odrzucać aktywnego writera."
      when: backup.enabled | bool

    - name: Validate scheduler host membership
      ansible.builtin.assert:
        that:
          - backup.scheduler.host in groups['galera']
        fail_msg: "backup.scheduler.host '{{ backup.scheduler.host }}' must be in inventory group 'galera'"
  roles:
    - role: galera_backup
      vars:
        galera_backup_local_role: scheduler
      when: galera_backup_action == 'configure'

- name: Pre-position backup runner and cron on remaining Galera candidates
  # Osobny play, nie rozszerzenie poprzedniego: koordynator publikuje
  # `galera_backup_shared_secrets` dopiero w trakcie swojego przebiegu, a
  # asercja o dziedziczonych sekretach wypada wczesniej. Rozdzielenie na plays
  # daje te sama gwarancje kolejnosci, ktora od dawna dziala dla hosta restore.
  hosts: "galera:!{{ backup.scheduler.host | default('galera[0]') }}"
  become: true
  vars_files:
    - vars/proxysql_hostgroups.yml
  gather_facts: true
  vars:
    galera_backup_action: "{{ action | default('configure') }}"
    # Kandydat sam wykonuje elekcje i straznika writera, wiec potrzebuje tego
    # samego konta read-only co koordynator. Klucze szyfrowania i S3 dziedziczy.
    galera_backup_proxysql_stats_user: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_PROXYSQL_STATS_USER') | default(proxysql_stats_user, true) }}"
    galera_backup_proxysql_stats_password: "{{ lookup('ansible.builtin.env', 'PROXYSQL_STATS_PASSWORD') }}"
  pre_tasks:
    - name: Load platform lockfile
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock
  roles:
    - role: galera_backup
      vars:
        galera_backup_local_role: scheduler
        # Cron TAK: kazdy kandydat musi sam sprawdzic, czy zostal donorem.
        galera_backup_install_cron: true
        # MinIO i sekrety zostaja wlasnoscia koordynatora — kandydat ich nie
        # tworzy ani nie obraca, tylko konsumuje.
        galera_backup_provision_s3: false
        galera_backup_inherited_shared_secrets: >-
          {{ hostvars[backup.scheduler.host].galera_backup_shared_secrets | default({}) }}
      when: galera_backup_action == 'configure'

- name: Execute manual backup on whichever Galera node is elected donor
  # Reczne `make cluster-backup` musi trafic tam, gdzie cron: na kazdego
  # kandydata. Runner sam rozstrzyga, kto jest donorem — pozostali koncza rc=0.
  # Gdyby ten play zostal przypiety do jednego hosta, backup uruchomiony w chwili,
  # gdy ten host jest writerem, bylby cichym no-opem zamiast kopii.
  hosts: galera
  become: true
  gather_facts: false
  vars_files:
    - vars/proxysql_hostgroups.yml
  vars:
    galera_backup_action: "{{ action | default('configure') }}"
  tasks:
    - name: Execute manual backup runner
      ansible.builtin.command:
        argv:
          - /opt/galera-backup/galera-backup
          - backup
          - "{{ cluster.name }}"
      # Reczne uruchomienie backupu tworzy nowy snapshot w S3/SMB na wybranym
      # wezle — to jest cel akcji 'run'. Na pozostalych to sprawdzenie, rc=0.
      changed_when: true
      when: galera_backup_action == 'run'

- name: Pre-position restore executable and scoped secrets
  hosts: restore
  become: true
  vars_files:
    - vars/proxysql_hostgroups.yml
  gather_facts: true
  vars:
    galera_backup_action: "{{ action | default('configure') }}"
    galera_backup_encryption_key: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_ENCRYPTION_KEY') | default(lookup('ansible.builtin.env', 'BACKUP_ENCRYPTION_KEY'), true) }}"
    galera_backup_s3_access_key: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_S3_ACCESS_KEY') | default('', true) }}"
    galera_backup_s3_secret_key: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_S3_SECRET_KEY') | default('', true) }}"
    galera_backup_smb_username: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_SMB_USERNAME') | default('', true) }}"
    galera_backup_smb_password: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_SMB_PASSWORD') | default('', true) }}"
    galera_backup_smb_domain: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_SMB_DOMAIN') | default('', true) }}"
  pre_tasks:
    - name: Load platform lockfile
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock
  roles:
    - role: galera_backup
      vars:
        galera_backup_local_role: restore
        galera_backup_install_cron: false
        galera_backup_provision_s3: false
        galera_backup_inherited_shared_secrets: >-
          {{ hostvars[backup.scheduler.host].galera_backup_shared_secrets | default({}) }}
      when: galera_backup_action == 'configure'
