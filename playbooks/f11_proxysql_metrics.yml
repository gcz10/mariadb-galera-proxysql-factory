---
# F11 — ProxySQL metrics WARSTWY WSPOLNEJ: restapi + rejestracja w PMM Inventory.
# Satisfies: ISC-46 (ProxySQL metrics do PMM).
#
# Playbook PLATFORMY — uruchamiany wylacznie z platform/shared/
# (make platform-monitoring). Wezly ProxySQL naleza do warstwy wspolnej, wiec
# to ona wlacza restapi i rejestruje eksportery w PMM; najemca (klaster Galera)
# nie ma tu czego szukac — pilnuje tego asercja fail-closed w pre_tasks obu
# playow. Kiedys te czynnosc wykonywal klaster z rola ownera w swoim cluster.yml,
# co czynilo monitoring pary wlasnoscia jednego klastra.
#
# Galera + MariaDB najemcy pokrywa f11_pmm_client.yml / f11_pmm_agent.yml
# uruchamiane z definicji klastra.
#
# Ten playbook:
#   1. wlacza admin-restapi_enabled=true na kazdym wezle ProxySQL (LOAD + SAVE = trwale),
#   2. tworzy brakujace generic nodes, rejestruje usluge external (group=proxysql)
#      + external_exporter agent (port 6070) w PMM Inventory.
#
# Kolejnosc: po platform-deploy (pakiety ProxySQL) i platform-proxysql
# (konfiguracja pary); PMM Server zyje po platform-infra.

# === Play 1: włącz restapi na węzłach ProxySQL ===
- name: "F11 — włącz restapi ProxySQL (metryki Prometheus :6070)"
  hosts: proxysql
  become: true
  gather_facts: true
  vars:
    proxysql_admin_password: "{{ lookup('ansible.builtin.env', 'PROXYSQL_ADMIN_PASSWORD') }}"
    restapi_port: 6070
  environment:
    MYSQL_PWD: "{{ proxysql_admin_password }}"

  pre_tasks:
    - name: "Odrzuc uruchomienie z definicja inna niz platforma"
      ansible.builtin.assert:
        that:
          - platform.name is defined
          - platform.name | length > 0
          - galera is not defined
        fail_msg: >-
          Ten playbook zarzadza warstwa wspolna i wymaga definicji platformy
          (platform/shared/platform.yml) — definicja klastra (blok galera)
          oznacza najemce, a najemca nie zarzadza ta warstwa.
          Uruchom: make platform-monitoring

    - name: "Wymagaj PROXYSQL_ADMIN_PASSWORD"
      ansible.builtin.assert:
        that:
          - proxysql_admin_password | length >= (isa_min_secret_length | default(12))
        fail_msg: "Ustaw PROXYSQL_ADMIN_PASSWORD poza repozytorium."

  tasks:

    - name: "Sprawdź aktualny stan admin-restapi_enabled (runtime)"
      ansible.builtin.command:
        argv:
          - mariadb
          - -h127.0.0.1
          - -P6032
          - -uadmin
          - -N
          - -B
          - -e
          - "SELECT variable_value FROM global_variables WHERE variable_name='admin-restapi_enabled'"
      register: restapi_current
      changed_when: false
      no_log: true

    - name: "Włącz admin-restapi_enabled=true (trwale)"
      ansible.builtin.shell: >-
        mariadb -h127.0.0.1 -P6032 -uadmin -N -B -e
        "UPDATE global_variables SET variable_value='true' WHERE variable_name='admin-restapi_enabled';
         LOAD ADMIN VARIABLES TO RUNTIME; SAVE ADMIN VARIABLES TO DISK;"
      when: restapi_current.stdout | trim != 'true'
      changed_when: true
      no_log: true

    - name: "Zapewnij trwałość dla już-włączonego restapi (SAVE TO DISK)"
      ansible.builtin.shell: >-
        mariadb -h127.0.0.1 -P6032 -uadmin -N -B -e
        "SAVE ADMIN VARIABLES TO DISK;"
      when: restapi_current.stdout | trim == 'true'
      changed_when: false
      no_log: true

    - name: "Czekaj na port restapi ({{ restapi_port }})"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ restapi_port }}"
        timeout: 15

    # uri zamiast `curl -s | grep -c`: brak pipe, rc nie zalezy od grep, a tresc
    # odpowiedzi asertujemy w Jinja (search z flaga (?m) — ten sam wzorzec, ktorego
    # uzywa bootstrap.yml dla safe_to_bootstrap w grastate.dat).
    - name: "Potwierdź metryki Prometheus na porcie {{ restapi_port }}"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ restapi_port }}/metrics"
        return_content: true
      register: proxysql_metrics_scrape
      changed_when: false

    - name: "Wymagaj niepustych metryk ProxySQL"
      ansible.builtin.assert:
        that:
          - proxysql_metrics_scrape.content is search('(?m)^proxysql_')
        fail_msg: "Brak metryk ProxySQL na :{{ restapi_port }}/metrics."

# === Play 2: zarejestruj ProxySQL metrics w PMM Inventory ===
- name: "F11 — zarejestruj metryki ProxySQL w PMM Inventory"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - vars/secret_policy.yml
    - "../{{ versions.lock_file }}"

  vars:
    ansible_become: false
    pmm_api_url: "{{ lookup('ansible.builtin.env', 'PMM_SERVER_URL') | default(monitoring.get('pmm', {}).get('server_url', 'https://127.0.0.1:8443'), true) }}"
    pmm_admin_user: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_USER') | default('admin', true) }}"
    pmm_admin_password: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_PASSWORD') }}"
    pmm_validate_certs_effective: "{{ monitoring.get('pmm', {}).get('validate_certs', true) | bool }}"
    # Namespace PMM warstwy wspolnej ("shared") — NIE etykieta najemcy: wezly
    # pary nie moga znikac z PMM razem z derejestracja jakiegos klastra.
    pmm_cluster_name_effective: "{{ monitoring.pmm.cluster_name }}"
    pmm_environment_effective: "{{ platform.environment }}"
    pmm_proxysql_hosts: "{{ groups.get('proxysql', []) }}"
    pmm_proxysql_node_names: "{{ pmm_proxysql_hosts | map('regex_replace', '^', pmm_cluster_name_effective ~ '-') | list }}"
    pmm_proxysql_service_names: "{{ pmm_proxysql_node_names | map('regex_replace', '$', '-proxysql') | list }}"
    proxysql_metrics_port: 6070

  pre_tasks:
    - name: "Odrzuc uruchomienie z definicja inna niz platforma"
      ansible.builtin.assert:
        that:
          - platform.name is defined
          - platform.name | length > 0
          - galera is not defined
        fail_msg: >-
          Ten playbook zarzadza warstwa wspolna i wymaga definicji platformy
          (platform/shared/platform.yml) — definicja klastra (blok galera)
          oznacza najemce, a najemca nie zarzadza ta warstwa.
          Uruchom: make platform-monitoring

    - name: "Wymagaj danych dostępowych PMM"
      ansible.builtin.assert:
        that:
          - pmm_admin_password | length >= (isa_min_secret_length | default(12))
          - pmm_api_url is match('^https://')
          - pmm_proxysql_node_names | length > 0
        fail_msg: "Ustaw PMM_ADMIN_PASSWORD poza repozytorium oraz użyj PMM URL z https://."

  tasks:

    # === Pobierz node IDs dla węzłów ProxySQL ===
    - name: "Pobierz PMM node inventory"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/nodes"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        return_content: true
      register: pmm_nodes
      no_log: true

    # Generic nodes dla wezlow pary wczesniej tworzyl f11_pmm_client.yml ownera.
    # Po wyniesieniu warstwy wspolnej z definicji klastrow platforma nie ma skad
    # ich wziac, wiec playbook jest samowystarczalny: tworzy brakujace wezly
    # we wlasnym namespace'u, a asercja nizej pilnuje efektu end-to-end.
    - name: "Utworz generic nodes dla wezlow ProxySQL (jesli brak)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/nodes"
        method: POST
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        body_format: json
        body:
          generic:
            node_name: "{{ pmm_cluster_name_effective }}-{{ item }}"
            address: "{{ hostvars[item].proxysql_node_address | default(hostvars[item].ansible_host) }}"
            distro: "rocky-{{ hostvars[item].ansible_distribution_major_version | default(platform.rocky_linux_major) }}"
            custom_labels:
              cluster: "{{ pmm_cluster_name_effective }}"
              environment: "{{ pmm_environment_effective }}"
        status_code: 200
      loop: "{{ pmm_proxysql_hosts }}"
      when: (pmm_cluster_name_effective ~ '-' ~ item) not in (pmm_nodes.json.generic | default([]) | map(attribute='node_name') | list)
      no_log: true

    - name: "Odswiez PMM node inventory po tworzeniu"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/nodes"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        return_content: true
      register: pmm_nodes
      no_log: true

    - name: "Zbuduj mapę proxysql node name → node ID"
      ansible.builtin.set_fact:
        pmm_proxysql_node_ids: "{{ pmm_proxysql_node_ids | default({}) | combine({item.node_name: item.node_id}) }}"
      loop: "{{ pmm_nodes.json.generic | default([]) }}"
      when: item.node_name in pmm_proxysql_node_names

    - name: "Wymagaj istnienia generic nodes dla ProxySQL"
      ansible.builtin.assert:
        that:
          - (pmm_proxysql_node_ids | default({}) | length) == (pmm_proxysql_node_names | length)
        fail_msg: "Brak generic nodes ProxySQL w PMM po probie utworzenia — sprawdz odpowiedzi PMM Inventory API nad zadaniem tworzenia."

    # === Cleanup starych usług ProxySQL o złym przypisaniu ===
    - name: "Pobierz PMM service inventory"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/services"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        return_content: true
      register: pmm_services_initial
      no_log: true

    - name: "Usuń nieaktualne ProxySQL services (zła grupa / node)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/management/services/{{ item.service_id }}"
        method: DELETE
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        status_code: 200
      loop: "{{ pmm_services_initial.json.external | default([]) }}"
      when:
        - item.service_name in pmm_proxysql_service_names
        - item.group != 'proxysql' or item.cluster != pmm_cluster_name_effective or item.environment != pmm_environment_effective
      no_log: true

    # === Utwórz usługi external ProxySQL ===
    - name: "Odśwież PMM service inventory"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/services"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        return_content: true
      register: pmm_services
      no_log: true

    - name: "Utwórz natywne usługi ProxySQL (external, group=proxysql)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/services"
        method: POST
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        body_format: json
        body:
          external:
            service_name: "{{ pmm_cluster_name_effective }}-{{ item }}-proxysql"
            node_id: "{{ pmm_proxysql_node_ids[pmm_cluster_name_effective ~ '-' ~ item] }}"
            environment: "{{ pmm_environment_effective }}"
            cluster: "{{ pmm_cluster_name_effective }}"
            group: "proxysql"
        status_code: 200
      loop: "{{ pmm_proxysql_hosts }}"
      # Host jest monitorowany ALBO natywnie (lokalny pmm-agent, typ `proxysql`),
      # ALBO agentless (typ `external`) — nigdy oboma. Warunek patrzyl wylacznie
      # na liste `external`, wiec po dolozeniu agenta na fcp1/fcp2 probowal
      # utworzyc druga usluge o tej samej nazwie i dostawal HTTP 409.
      when: >-
        (pmm_cluster_name_effective ~ '-' ~ item ~ '-proxysql') not in
        (((pmm_services.json.external | default([])) + (pmm_services.json.proxysql | default([])))
         | map(attribute='service_name') | list)
      no_log: true

    - name: "Pobierz docelowy PMM service inventory"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/services"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        return_content: true
      register: pmm_services_final
      no_log: true

    - name: "Zbuduj mapę proxysql service name → service ID"
      ansible.builtin.set_fact:
        pmm_proxysql_service_ids: "{{ pmm_proxysql_service_ids | default({}) | combine({item.service_name: item.service_id}) }}"
      loop: "{{ pmm_services_final.json.external | default([]) }}"
      when: item.service_name in pmm_proxysql_service_names

    # === Rejestracja external exporter agent (port 6070) ===
    - name: "Pobierz PMM agent inventory"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/agents"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        return_content: true
      register: pmm_agents
      no_log: true

    - name: "Utwórz external exporter agents dla ProxySQL (port {{ proxysql_metrics_port }})"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/agents"
        method: POST
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs_effective }}"
        body_format: json
        body:
          external_exporter:
            runs_on_node_id: "{{ pmm_proxysql_node_ids[pmm_cluster_name_effective ~ '-' ~ item] }}"
            service_id: "{{ pmm_proxysql_service_ids[pmm_cluster_name_effective ~ '-' ~ item ~ '-proxysql'] }}"
            scheme: "http"
            metrics_path: "/metrics"
            listen_port: "{{ proxysql_metrics_port }}"
        status_code: 200
      loop: "{{ pmm_proxysql_hosts }}"
      # Ta sama zasada "albo/albo" co przy tworzeniu uslugi: host z lokalnym
      # pmm-agentem ma usluge natywna typu `proxysql` i wlasny eksporter, wiec
      # nie ma dla niego wpisu w `pmm_proxysql_service_ids` (mapa powstaje z
      # listy `external`). Bez pierwszego warunku zadanie wywalalo sie na
      # `'pmm_proxysql_service_ids' is undefined` zamiast po prostu pominac
      # hosta juz monitorowanego natywnie.
      when:
        - (pmm_cluster_name_effective ~ '-' ~ item ~ '-proxysql') in (pmm_proxysql_service_ids | default({}))
        - pmm_proxysql_service_ids[pmm_cluster_name_effective ~ '-' ~ item ~ '-proxysql'] not in (pmm_agents.json.external_exporter | default([]) | selectattr('listen_port', 'equalto', proxysql_metrics_port) | map(attribute='service_id') | list)
      no_log: true

    - name: "Raport ProxySQL metrics w PMM"
      ansible.builtin.debug:
        msg: >-
          Zarejestrowano {{ pmm_proxysql_service_ids | default({}) | length }} uslug ProxySQL (external exporter,
          port {{ proxysql_metrics_port }}) w PMM Inventory.
