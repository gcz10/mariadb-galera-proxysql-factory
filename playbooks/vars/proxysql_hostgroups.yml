---
# Jedyne źródło prawdy dla ID hostgroup ProxySQL (mysql_galera_hostgroups).
# f7_proxysql.yml je ZAPISUJE, f10/f12/f13/f15 je CZYTAJĄ. Rozjazd między
# zapisem a odczytem = playbooki odpytują pusty hostgroup, nie wykrywają
# aktywnego writera i wybierają go jako źródło backupu (łamie ISC-39).
#
# ID są wyprowadzane z `proxysql.hostgroup_base` klastra (domyślnie 10), bo
# JEDNA para ProxySQL obsługuje CAŁĄ flotę. Gdy ID były globalną stałą,
# `f7_proxysql.yml` drugiego klastra wykonywał
#   DELETE FROM mysql_servers WHERE hostgroup_id IN (10,20,30,40)
# i kasował backendy pierwszego — drugi klaster wypychał pierwszego z ProxySQL.
# Każdy klaster dzielący tę samą parę MUSI mieć rozłączną bazę; pilnuje tego
# tests/validation/probe-proxysql-tenancy.py.
galera_hostgroup_base: "{{ proxysql.hostgroup_base | default(10) | int }}"
galera_writer_hg: "{{ galera_hostgroup_base | int }}"
galera_backup_hg: "{{ galera_hostgroup_base | int + 10 }}"
galera_reader_hg: "{{ galera_hostgroup_base | int + 20 }}"
galera_offline_hg: "{{ galera_hostgroup_base | int + 30 }}"

# Nazwa użytkownika aplikacyjnego. Też musi być rozłączna między klastrami na
# wspólnym ProxySQL: `mysql_users` jest globalną tabelą, a `default_hostgroup`
# tego wpisu decyduje, do którego klastra trafia połączenie. Rozdzielenie po
# użytkowniku (nie po porcie) pozwala obu klastrom dzielić VIP:6033 bez
# zarządzania `mysql-interfaces` i bez restartu ProxySQL.
galera_app_user: "{{ proxysql.app_user | default('app_user') }}"

# Zdalna tozsamosc administracyjna ProxySQL. ProxySQL twardo odrzuca uzytkownika
# o nazwie `admin` spoza loopbacku ("ERROR 1040: User 'admin' can only connect
# locally"), wiec operacje mutujace warstwy wspolnej (f12/f13/f11) uzywaja tej
# nazwy z hosta kontrolnego. Konto nalezy do puli READ-WRITE.
proxysql_remote_admin_user: "isa_admin"

# Tozsamosc READ-ONLY dla straznika writera w backupie. Runner backupu jest
# cronem na wezle Galery, wiec jego poswiadczenie lezy na dysku bazy danych —
# dawanie mu puli read-write calego wspolnego ProxySQL oznaczalo, ze przejecie
# jednego wezla najemcy daje zapis do proxy CALEJ floty, i to po to, by odczytac
# jedna informacje: kto jest teraz writerem.
#
# Zmierzone na ProxySQL 3.0 (green, 2026-08-24) kontem z admin-stats_credentials:
#   SELECT srv_host FROM stats_mysql_connection_pool WHERE hostgroup=<writer>  -> OK
#   SELECT hostname FROM runtime_mysql_servers                                 -> ERROR 1045: no such table
#   UPDATE global_variables ...                                                -> ERROR 1045: attempt to write a readonly database
#
# Dlatego straznik czyta tabele statystyczna, a nie schemat konfiguracyjny.
proxysql_stats_user: "isa_stats"
