---
# Polityka dlugosci sekretow — JEDNO miejsce, bo rozsypana po plikach rozjezdza
# sie po pierwszej zmianie. Do 2026-08-24 czesc asercji wymagala `length > 0`,
# czyli niepustosci: haslo "x" przechodzilo bramke i padalo dopiero na API PMM
# albo przy logowaniu do bazy, komunikatem bez zwiazku z przyczyna.
#
# 12 znakow to prog dla sekretow, ktore SAMI generujemy i rotujemy. Nie jest to
# wymog kryptograficzny, tylko granica odsiewajaca haslo wpisane recznie "na
# chwile" — takie zwykle zostaje na lata.
isa_min_secret_length: 12

# WYJATEK PROTOKOLU, nie ustepstwo. VRRP przenosi haslo w polu o stalej
# dlugosci: "Only the first eight (8) characters are used"
# (doc/man/man5/keepalived.conf.5.in oraz www/docs/documentation/keepalived-conf.md
# w repozytorium acassen/keepalived).
#
# Haslo dluzsze niz 8 znakow nie jest wiec mocniejsze — jest MYLACE: operator
# widzi 32 znaki w swoim magazynie sekretow, a uwierzytelnianie porownuje osiem
# pierwszych. Dlatego gorna granica jest tu bramka, a nie sugestia.
isa_vrrp_auth_length: 8
