---
# F2: Preflight + repo + pakiety + time sync + SELinux + firewalld
# Satisfies: ISC-3 (wersje z lockfile), ISC-4 (SELinux), ISC-5 (firewalld), ISC-6 (preflight), ISC-63 (no state:latest)
# Depends: F0 (discovery), F1 (lockfile)

- name: "F2 Preflight - walidacja preconditions"
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    # R1/A1: lockfile wskazywany per klaster (versions.lock_file z cluster.yml),
    # nie ścieżka wpisana na sztywno. Ten sam wzorzec co f2_install — jedna konwencja w repo.
    - name: "Załaduj lockfile platformy (reprodukowalne wersje)"
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock

    - name: "Preflight - wymagany Rocky Linux {{ lock.rocky_linux.major }} (wg lockfile)"
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Rocky"
          - ansible_distribution_major_version | int == lock.rocky_linux.major | int
        fail_msg: >-
          Host musi byc Rocky Linux {{ lock.rocky_linux.major }} (wg lockfile),
          jest {{ ansible_distribution }} {{ ansible_distribution_major_version }}

    # R1/D: allowed_minors bylo martwa dana. compatibility-report.md deklarowal
    # kontrole minora "w F2 preflight", ktorej nie bylo w kodzie. Teraz jest.
    - name: "Preflight - minor OS dopuszczony przez lockfile"
      ansible.builtin.assert:
        that:
          - ansible_distribution_version in lock.rocky_linux.allowed_minors
        fail_msg: >-
          Minor {{ ansible_distribution_version }} nie jest w allowed_minors
          {{ lock.rocky_linux.allowed_minors }} - zaktualizuj hosty albo lockfile

    # R1: spojnosc wewnetrzna lockfile. `repo_setup_args` i `version` to dwa niezalezne
    # pola opisujace te sama serie MariaDB - rozjechanie sie ich instaluje inna wersje,
    # niz deklaruje lockfile, a wykryto by to dopiero po mutacji hosta.
    - name: "Preflight - lockfile spojny (repo_setup_args zgodne z mariadb.version)"
      ansible.builtin.assert:
        that:
          - lock.mariadb.repo_setup_args is search(lock.mariadb.version.split('.')[:2] | join('.'))
        fail_msg: >-
          Lockfile niespojny: repo_setup_args "{{ lock.mariadb.repo_setup_args }}"
          nie pasuje do serii {{ lock.mariadb.version.split('.')[:2] | join('.') }}
          wynikajacej z mariadb.version {{ lock.mariadb.version }}
      run_once: true

    - name: "Preflight - minimal RAM 2GB"
      ansible.builtin.assert:
        that:
          - ansible_memtotal_mb >= 2048
        fail_msg: "Minimum 2GB RAM required, got {{ ansible_memtotal_mb }}MB"

    - name: "Preflight - wolne miejsce na dysku (minimum 5GB)"
      ansible.builtin.shell: df -B1 / | awk 'NR==2{print $4}'
      changed_when: false
      register: disk_free

    - name: "Preflight - waliduj wolne miejsce"
      ansible.builtin.assert:
        that:
          - disk_free.stdout | int >= 5368709120
        fail_msg: "Minimum 5GB free space required, got {{ disk_free.stdout }} bytes"
      when: "'galera' in group_names"

    - name: "Preflight — wykryj istniejące pakiety MariaDB/Galera (audit#3)"
      ansible.builtin.shell: rpm -qa | grep -iE '^(mariadb|galera)' | sort -u || true
      args:
        executable: /bin/bash
      changed_when: false
      register: mariadb_pkgs

    - name: "Preflight — wykryj istniejący datadir MariaDB"
      ansible.builtin.stat:
        path: "{{ mariadb_data_dir | default('/var/lib/mysql') }}"
      register: mariadb_datadir

    - name: "Preflight — wykryj działający proces mariadbd"
      ansible.builtin.shell: pgrep -x mariadbd >/dev/null 2>&1 && echo RUNNING || echo STOPPED
      args:
        executable: /bin/bash
      changed_when: false
      register: mariadb_proc

    - name: "Preflight — host czysty (brak MariaDB); ISC-6/audit#3"
      ansible.builtin.assert:
        that:
          - mariadb_pkgs.stdout | trim | length == 0
          - not mariadb_datadir.stat.exists
          - mariadb_proc.stdout == "STOPPED"
        fail_msg: >-
          Host nie jest czysty: pakiety=[{{ mariadb_pkgs.stdout | trim }}],
          datadir istnieje={{ mariadb_datadir.stat.exists }}, proces={{ mariadb_proc.stdout }}.
          F2 oczekuje czystych hostów. Jeśli klaster jest już wdrożony — to oczekiwane:
          użyj ,make cluster-health' zamiast ,cluster-validate' na wdrożonym klastrze.
      when: "'galera' in group_names"

  handlers: []
