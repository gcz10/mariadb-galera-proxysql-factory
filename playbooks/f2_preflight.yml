---
# F2: Preflight + repo + pakiety + time sync + SELinux + firewalld
# Satisfies: ISC-3 (wersje z lockfile), ISC-4 (SELinux), ISC-5 (firewalld), ISC-6 (preflight), ISC-63 (no state:latest)
# Depends: F0 (discovery), F1 (lockfile)

- name: "F2 Preflight - walidacja preconditions"
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  vars:
    lockfile: "{{ lookup('file', 'versions/versions.lock.yml') | from_yaml }}"

  tasks:
    - name: "Preflight - Rocky Linux 9 required"
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Rocky"
          - ansible_distribution_major_version == "9"
        fail_msg: "Host must be Rocky Linux 9, got {{ ansible_distribution }} {{ ansible_distribution_major_version }}"

    - name: "Preflight - minimal RAM 2GB"
      ansible.builtin.assert:
        that:
          - ansible_memtotal_mb >= 2048
        fail_msg: "Minimum 2GB RAM required, got {{ ansible_memtotal_mb }}MB"

    - name: "Preflight - wolne miejsce na dysku (minimum 5GB)"
      ansible.builtin.shell: df -B1 / | awk 'NR==2{print $4}'
      changed_when: false
      register: disk_free

    - name: "Preflight - waliduj wolne miejsce"
      ansible.builtin.assert:
        that:
          - disk_free.stdout | int >= 5368709120
        fail_msg: "Minimum 5GB free space required, got {{ disk_free.stdout }} bytes"
      when: "'galera' in group_names"

    - name: "Preflight — wykryj istniejące pakiety MariaDB/Galera (audit#3)"
      ansible.builtin.shell: rpm -qa | grep -iE '^(mariadb|galera)' | sort -u || true
      args:
        executable: /bin/bash
      changed_when: false
      register: mariadb_pkgs

    - name: "Preflight — wykryj istniejący datadir MariaDB"
      ansible.builtin.stat:
        path: "{{ mariadb_data_dir | default('/var/lib/mysql') }}"
      register: mariadb_datadir

    - name: "Preflight — wykryj działający proces mariadbd"
      ansible.builtin.shell: pgrep -x mariadbd >/dev/null 2>&1 && echo RUNNING || echo STOPPED
      args:
        executable: /bin/bash
      changed_when: false
      register: mariadb_proc

    - name: "Preflight — host czysty (brak MariaDB); ISC-6/audit#3"
      ansible.builtin.assert:
        that:
          - mariadb_pkgs.stdout | trim | length == 0
          - not mariadb_datadir.stat.exists
          - mariadb_proc.stdout == "STOPPED"
        fail_msg: >-
          Host nie jest czysty: pakiety=[{{ mariadb_pkgs.stdout | trim }}],
          datadir istnieje={{ mariadb_datadir.stat.exists }}, proces={{ mariadb_proc.stdout }}.
          F2 oczekuje czystych hostów. Jeśli klaster jest już wdrożony — to oczekiwane:
          użyj ,make cluster-health' zamiast ,cluster-validate' na wdrożonym klastrze.
      when: "'galera' in group_names"

  handlers: []
