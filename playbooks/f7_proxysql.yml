---
# F7: najemca na wspoldzielonej parze ProxySQL.
#
# Ten playbook rejestruje TYLKO zasoby wlasciwe dla klastra: konta na wezlach
# Galera, CA backendu, hostgroupy (mysql_galera_hostgroups), backendy, reguly
# read/write split i app_user. Sama instancja ProxySQL — daemon, uprawnienia
# plikow, tozsamosc admina, globalne zmienne monitora i material TLS frontendu —
# jest wlasnoscia warstwy wspolnej (playbooks/platform_proxysql.yml,
# make platform-proxysql). Do 2026-08-21 te zadania siedzialy tutaj, wiec
# zaden klaster nie mial wlasnych zasobow: ostatnio uruchomiony build nadpisywal
# tozsamosc admina i monitor pozostalym najemcom.
# Satisfies: ISC-18, ISC-19, ISC-20, ISC-21, ISC-23.
# Lab: brak systemd — instancje uruchamia platform_proxysql.yml.

- name: "F7 — utwórz konta ProxySQL na klastrze Galera"
  hosts: galera[0]
  become: true
  # Ten play tworzy konto aplikacyjne NA GALERZE, wiec musi znac te sama nazwe
  # co play konfigurujacy ProxySQL — inaczej ProxySQL wpuszczalby uzytkownika,
  # ktorego backend nie zna. Nazwa jest per klaster (wspolna para ProxySQL).
  vars_files:
    - vars/proxysql_hostgroups.yml
  vars:
    proxysql_monitor_user: "{{ lookup('ansible.builtin.env', 'PROXYSQL_MONITOR_USER') | default('proxysql_monitor', true) }}"
    proxysql_monitor_password: "{{ lookup('ansible.builtin.env', 'PROXYSQL_MONITOR_PASSWORD') }}"
    app_user: "{{ galera_app_user }}"
    app_password: "{{ lookup('ansible.builtin.env', 'APP_DB_PASSWORD') }}"

  pre_tasks:
    - name: "Wymagaj haseł ProxySQL i app"
      ansible.builtin.assert:
        that:
          - proxysql_monitor_password | length > 0
          - app_password | length > 0
        fail_msg: "Ustaw PROXYSQL_MONITOR_PASSWORD i APP_DB_PASSWORD poza repozytorium."

  tasks:
    - name: "Utwórz proxysql_monitor (PROCESS, REPLICATION CLIENT)"
      ansible.mysql.mysql_user:
        name: "{{ proxysql_monitor_user }}"
        password: "{{ proxysql_monitor_password }}"
        host: "%"
        priv: "*.*:PROCESS,REPLICATION CLIENT"
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      no_log: true

    - name: "Utwórz app_user (test application access)"
      ansible.mysql.mysql_user:
        name: "{{ app_user }}"
        password: "{{ app_password }}"
        host: "%"
        priv: "isa_test.*:ALL"
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      no_log: true

- name: "F7 — zarejestruj najemcę we wspoldzielonym ProxySQL"
  hosts: proxysql
  become: true
  serial: 1
  max_fail_percentage: 0
  vars_files:
    - vars/proxysql_hostgroups.yml
  vars:
    app_user: "{{ galera_app_user }}"
    app_password: "{{ lookup('ansible.builtin.env', 'APP_DB_PASSWORD') }}"
    app_password_sql: >-
      {{ app_password | replace("'", "''") }}
    galera_backends: "{{ groups['galera'] | map('extract', hostvars, 'galera_node_address') | list }}"
    tls_use_ssl: "{{ 1 if (tls | default({})).mode | default('disabled') == 'full' else 0 }}"
    # Katalog CA per klaster na WSPOLDZIELONYCH wezlach ProxySQL.
    #
    # Pod /etc/mysql/tls, a NIE /etc/proxysql/tls: `/etc/proxysql` jest celowo
    # zamkniete (0750 root:root, trzyma proxysql.cnf z haslem admina), wiec
    # uzytkownik `proxysql` nie moze tamtedy przejsc i CA byloby nieczytelne.
    # Sprawdzone na zywo: przy sciezce /etc/proxysql/tls/<klaster>/ca.pem
    # `sudo -u proxysql cat` odmawia dostepu, a TLS dziala tylko dzieki
    # zostawionej starej zmiennej globalnej — czyli awaria czeka na pierwsza
    # zmiane. Nazwa klastra jest walidowana przez schema (^[A-Za-z0-9_-]+$).
    proxysql_cluster_tls_dir: "/etc/mysql/tls/{{ cluster.name }}"
    # Tozsamosc administratora (admin-check.cnf) wdraza platforma; najemca
    # korzysta z niej przez defaults-extra-file, wiec zaden sekret nie przechodzi
    # przez argv ani przez zmienne najemcy.
    proxysql_admin_cli:
      - mariadb
      - --defaults-extra-file=/etc/proxysql/admin-check.cnf
      - -h127.0.0.1
      - -P6032
      - -uadmin
      - -N
      - -B

  pre_tasks:
    - name: "Wymagaj hasła app"
      ansible.builtin.assert:
        that:
          - app_password | length > 0
        fail_msg: "Ustaw APP_DB_PASSWORD poza repozytorium."

  tasks:
    - name: "Sprawdź profil administracyjny wdrozony przez platforme"
      ansible.builtin.stat:
        path: /etc/proxysql/admin-check.cnf
      register: proxysql_admin_profile

    # Fail-closed zamiast przypadkowego bledu polaczenia: bez tego pliku kazde
    # kolejne zadanie admin CLI wywali sie nieczytelnie, a operator nie dowie
    # sie, ze pominal krok wlasnie warstwy wspolnej.
    - name: "Wymagaj tozsamosci administratora z warstwy wspolnej"
      ansible.builtin.assert:
        that:
          - proxysql_admin_profile.stat.exists
        fail_msg: >-
          Brak /etc/proxysql/admin-check.cnf — tozsamosc administratora pary
          ProxySQL wdraza warstwa wspolna, nie najemca. Uruchom:
          make platform-proxysql

    - name: "Czekaj na admin port ProxySQL (6032)"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6032
        timeout: 20

    # tls_file_owner MUSI byc uzytkownikiem uslugi, a nie rootem: proxysql dziala
    # jako uzytkownik `proxysql` i sam czyta CA, zeby zweryfikowac certyfikat
    # backendu. Przy owner=root katalog wychodzil 0750 root:root, monitor
    # raportowal "TLS/SSL error: Permission denied (13)" i SHUNNOWAL wszystkie
    # backendy, czyli caly odcinek ProxySQL->MariaDB po TLS byl nieczynny.
    # Klucz prywatny nadal NIE jest tu kopiowany (tls_deploy_key: false).
    #
    # Sciezka jest PER KLASTER, bo ta para ProxySQL obsluguje cala flote. Wczesniej
    # kazdy klaster pisal swoje CA do /etc/mysql/tls/ca.pem i do globalnej zmiennej
    # `mysql-ssl_p2s_ca` — drugi klaster z tls.mode=full nadpisywal CA pierwszego,
    # a ProxySQL ufal juz tylko temu, kto uruchomil f7 jako ostatni. Bledu nie bylo
    # widac, dopoki TLS mial wlaczony tylko jeden klaster.
    # NAZWA PLIKU ZALEZY OD TRESCI (`ca-<skrot>.pem`), i to nie jest ozdoba.
    #
    # ProxySQL buforuje kontekst TLS POD SCIEZKA. Podmiana zawartosci pod ta sama
    # nazwa NIE tworzy nowego kontekstu: proces dalej ufa CA, ktore wczytal przy
    # starcie. Zlapane 2026-08-25 na odbudowie `orion-r9` — najemca postawiony
    # od nowa pod ta sama nazwa dostal nowe CA, plik na ProxySQL byl juz nowy
    # (odcisk zgodny co do bajtu), a monitor i tak dostawal
    # `certificate signature failure`, dopoki nie zrestartowalem uslugi. Skutek
    # byl dotkliwy: wszystkie backendy SHUNNED, hostgroupa writera pusta, a po
    # godzinie nieudanych handshake'ow wezly zablokowaly adres ProxySQL przez
    # `max_connect_errors`.
    #
    # Dokumentacja ProxySQL (SSL Support -> Backend certificates renewal) podaje
    # dokladnie te droge: wskazac NOWA sciezke i przeladowac konfiguracje —
    # operacja jest wtedy atomowa. Skrot z tresci daje to za darmo, bo kazde nowe
    # CA to nowa nazwa pliku, wiec nowy kontekst.
    # Sciezka jak w tls_certs.yml: `ca_reference` jest wzgledem KORZENIA repo,
    # a nie katalogu playbooka — `lookup('file')` bez tego szuka w playbooks/.
    - name: "TLS: policz skrót CA najemcy (nazwa pliku = treść)"
      ansible.builtin.set_fact:
        proxysql_ca_src: "{{ tls.ca_reference if tls.ca_reference.startswith('/') else (playbook_dir | dirname) ~ '/' ~ tls.ca_reference }}"
        proxysql_ca_basename: "ca-{{ lookup('ansible.builtin.file', tls.ca_reference if tls.ca_reference.startswith('/') else (playbook_dir | dirname) ~ '/' ~ tls.ca_reference) | hash('sha256') | truncate(12, true, '') }}.pem"
      when: (tls | default({})).mode | default('disabled') == 'full'

    - name: "TLS: rozprowadź CA na węzeł ProxySQL (walidacja backendu; gdy tls.mode=full)"
      ansible.builtin.include_tasks: tls_certs.yml
      vars:
        tls_file_owner: proxysql
        tls_deploy_key: false
        tls_dir: "{{ proxysql_cluster_tls_dir }}"
      when: (tls | default({})).mode | default('disabled') == 'full'

    - name: "TLS: zapisz CA pod nazwą zależną od treści"
      ansible.builtin.copy:
        src: "{{ proxysql_ca_src }}"
        dest: "{{ proxysql_cluster_tls_dir }}/{{ proxysql_ca_basename }}"
        owner: proxysql
        group: proxysql
        mode: "0644"
      register: proxysql_backend_ca
      when: (tls | default({})).mode | default('disabled') == 'full'

    # Stare odciski tego najemcy sa smieciem, ale kasujemy je DOPIERO po tym, jak
    # nowa sciezka trafi do konfiguracji — inaczej ProxySQL zostalby bez pliku,
    # do ktorego wciaz sie odwoluje.
    - name: "TLS: znajdź nieaktualne CA tego najemcy"
      ansible.builtin.find:
        paths: "{{ proxysql_cluster_tls_dir }}"
        patterns: "ca-*.pem"
        excludes: "{{ proxysql_ca_basename }}"
      register: proxysql_stale_ca
      when: (tls | default({})).mode | default('disabled') == 'full'

    # Lista hostow budowana JAWNA PETLA, nie `regex_replace` z backreferencja.
    # W bloku YAML `|`/`>-` zapis "'\\1'" nie dociera do Jinja jako odwolanie do
    # grupy — renderowal sie jako '' i cala klauzula wychodzila `IN ('','')`.
    # Skutek byl cichy: DELETE nie pasowal do niczego, licznik ponizej zawsze
    # zwracal 0, wiec zadanie NIGDY nie bylo idempotentne, a przy drugim
    # przebiegu INSERT wywalal sie na UNIQUE constraint.
    - name: "TLS: sprawdź CA per backend (mysql_servers_ssl_params)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: >-
          SELECT COUNT(*) FROM mysql_servers_ssl_params
          WHERE ssl_ca='{{ proxysql_cluster_tls_dir }}/{{ proxysql_ca_basename }}'
          AND hostname IN ({% for b in galera_backends %}'{{ b }}'{% if not loop.last %},{% endif %}{% endfor %});
      register: proxysql_tls_ca_rows
      changed_when: false
      no_log: true
      when: (tls | default({})).mode | default('disabled') == 'full'

    # DELETE jest skopowany do nazw hostow TEGO klastra. Tabela nie ma kolumny
    # hostgroup, wiec czyszczenie "wszystkiego" skasowaloby wpisy sasiada.
    - name: "TLS: ustaw CA per backend (rozlacznie miedzy klastrami)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: |
          DELETE FROM mysql_servers_ssl_params
          WHERE hostname IN ({% for b in galera_backends %}'{{ b }}'{% if not loop.last %},{% endif %}{% endfor %});
          {% for backend in galera_backends %}
          INSERT INTO mysql_servers_ssl_params (hostname, port, username, ssl_ca)
          VALUES ('{{ backend }}', 3306, '', '{{ proxysql_cluster_tls_dir }}/{{ proxysql_ca_basename }}');
          {% endfor %}
          LOAD MYSQL SERVERS TO RUNTIME;
          SAVE MYSQL SERVERS TO DISK;
      no_log: true
      changed_when: true
      when:
        - (tls | default({})).mode | default('disabled') == 'full'
        - (proxysql_tls_ca_rows.stdout | default('0') | trim | int) != (galera_backends | length)

    # Dopiero teraz: konfiguracja wskazuje juz nowy plik i zostala przeladowana.
    - name: "TLS: usuń nieaktualne CA tego najemcy"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ proxysql_stale_ca.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (tls | default({})).mode | default('disabled') == 'full'

    - name: "Sprawdź aktualne backendy Galera"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: |
          SELECT GROUP_CONCAT(DISTINCT CONCAT(hostname,'|',use_ssl) ORDER BY hostname)
          FROM mysql_servers
          WHERE hostgroup_id IN ({{ galera_writer_hg }},{{ galera_backup_hg }},{{ galera_reader_hg }},{{ galera_offline_hg }});
      register: current_backends
      changed_when: false
      no_log: true

    - name: "Skonfiguruj backendy Galera (jeśli różne od repo)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: |
          DELETE FROM mysql_servers
          WHERE hostgroup_id IN ({{ galera_writer_hg }},{{ galera_backup_hg }},{{ galera_reader_hg }},{{ galera_offline_hg }})
             OR hostname IN ({% for b in galera_backends %}'{{ b }}'{% if not loop.last %},{% endif %}{% endfor %});
          {% for backend in galera_backends %}
          INSERT INTO mysql_servers (hostgroup_id, hostname, port, use_ssl)
          VALUES ({{ galera_writer_hg }}, '{{ backend }}', 3306, {{ tls_use_ssl }});
          {% endfor %}
          LOAD MYSQL SERVERS TO RUNTIME;
          SAVE MYSQL SERVERS TO DISK;
      when: current_backends.stdout | trim != (galera_backends | sort | map('regex_replace', '$', '|' ~ (tls_use_ssl | string)) | join(','))
      changed_when: true
      no_log: true

    - name: "Sprawdź aktualną konfigurację galera_hostgroups"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: |
          SELECT CONCAT_WS(',', writer_hostgroup, backup_writer_hostgroup, reader_hostgroup,
          offline_hostgroup, max_writers, writer_is_also_reader)
          FROM mysql_galera_hostgroups
          WHERE writer_hostgroup={{ galera_writer_hg }};
      register: current_galera_hg
      changed_when: false
      no_log: true

    # Wiersz najemcy pod INNA baza niz biezaca zostaje sierota po zmianie
    # `proxysql.hostgroup_base`: kasowanie po `writer_hostgroup` go nie widzi,
    # a nachodzace zakresy blokuja `LOAD ... TO RUNTIME` dla CALEJ instancji.
    # Objaw jest mylacy — najemca nie dostaje writera, wiec bramka ISC-20 pada
    # tak, jakby zawiodl monitor Galery.
    - name: "Wykryj osierocone hostgroupy tego najemcy"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: |
          SELECT COUNT(*) FROM mysql_galera_hostgroups
          WHERE comment='{{ monitoring.pmm.cluster_name }}'
            AND writer_hostgroup!={{ galera_writer_hg }};
      register: stale_galera_hg
      changed_when: false
      no_log: true

    - name: "Skonfiguruj mysql_galera_hostgroups (jeśli różne od repo)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: |
          DELETE FROM mysql_galera_hostgroups
          WHERE writer_hostgroup={{ galera_writer_hg }}
             OR comment='{{ monitoring.pmm.cluster_name }}';
          INSERT INTO mysql_galera_hostgroups
          (writer_hostgroup, backup_writer_hostgroup, reader_hostgroup, offline_hostgroup,
           active, max_writers, writer_is_also_reader, max_transactions_behind, comment)
          VALUES ({{ galera_writer_hg }}, {{ galera_backup_hg }}, {{ galera_reader_hg }}, {{ galera_offline_hg }},
           1, 1, 0, 100, '{{ monitoring.pmm.cluster_name }}');
          LOAD MYSQL SERVERS TO RUNTIME;
          SAVE MYSQL SERVERS TO DISK;
      when: >-
        current_galera_hg.stdout | trim != ([galera_writer_hg, galera_backup_hg, galera_reader_hg, galera_offline_hg, 1, 0] | join(','))
        or (stale_galera_hg.stdout | trim | int) > 0
      changed_when: true
      no_log: true

    # ProxySQL 3.9.1 nie odswieza kontekstu backend TLS po samej podmianie
    # mysql_servers_ssl_params + LOAD TO RUNTIME. Dowod live: nowy plik i nowa
    # sciezka byly w runtime, mariadb CLI z tego samego kp2 laczyl sie poprawnie,
    # a proces ProxySQL nadal zwracal certificate signature failure. Restart
    # natychmiast przywrocil backend. Play ma serial:1, wiec druga instancja i VIP
    # pozostaja dostepne.
    - name: "TLS: przeładuj proces ProxySQL po zmianie CA backendu"
      ansible.builtin.systemd_service:
        name: proxysql
        state: restarted
      when: proxysql_backend_ca.changed | default(false)

    - name: "TLS: czekaj na admin port po przeładowaniu backend CA"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6032
        state: started
        timeout: 30
      when: proxysql_backend_ca.changed | default(false)

    - name: "Sprawdź aktualnego app_user w ProxySQL"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: "SELECT CONCAT_WS(',', username, default_hostgroup, active) FROM mysql_users WHERE username='{{ app_user }}';"
      register: current_app_user
      changed_when: false
      no_log: true

    # audit#13: porównanie username/hostgroup/active NIE wykrywa rotacji samego hasła —
    # backend przyjmował nowe APP_DB_PASSWORD, a ProxySQL trzymał stare (aplikacja odcięta).
    # Zamiast zgadywać hash (ProxySQL hashuje przy LOAD TO RUNTIME) sprawdzamy zachowanie:
    # czy app_user faktycznie loguje się przez ProxySQL bieżącym hasłem.
    - name: "Audit#13: probe logowania app_user przez ProxySQL (wykrycie rotacji hasła)"
      ansible.builtin.command:
        argv:
          - mariadb
          - -h127.0.0.1
          - -P6033
          - "-u{{ app_user }}"
          - -N
          - -B
          - -e
          - "SELECT 1"
      environment:
        MYSQL_PWD: "{{ app_password }}"
      register: app_login_probe
      changed_when: false
      failed_when: false
      no_log: true

    - name: "Zarejestruj app_user w ProxySQL (jeśli brak/różny)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: |
          DELETE FROM mysql_users WHERE username='{{ app_user }}';
          INSERT INTO mysql_users (username, password, default_hostgroup, active)
          VALUES ('{{ app_user }}', '{{ app_password_sql }}', {{ galera_writer_hg }}, 1);
          LOAD MYSQL USERS TO RUNTIME;
          SAVE MYSQL USERS TO DISK;
      when: >-
        current_app_user.stdout | trim != ([app_user, galera_writer_hg, 1] | join(','))
        or app_login_probe.rc != 0
      changed_when: true
      no_log: true

    - name: "Audit#13: potwierdź logowanie app_user przez ProxySQL po synchronizacji"
      ansible.builtin.command:
        argv:
          - mariadb
          - -h127.0.0.1
          - -P6033
          - "-u{{ app_user }}"
          - -N
          - -B
          - -e
          - "SELECT 1"
      environment:
        MYSQL_PWD: "{{ app_password }}"
      register: app_login_verify
      until: app_login_verify.rc == 0
      retries: 6
      delay: 5
      changed_when: false
      no_log: true

    - name: "Audit#13: raport synchronizacji hasła app_user"
      ansible.builtin.debug:
        msg: >-
          app_user loguje się przez ProxySQL (6033) — hasło zsynchronizowane backend↔ProxySQL.
          Rotacja APP_DB_PASSWORD nie rozłącza już aplikacji.

    # `mysql_query_rules` jest tabela GLOBALNA instancji ProxySQL, a jedna para
    # obsluguje cala flote. Bezzakresowe `DELETE FROM mysql_query_rules` z tego
    # playbooka skasowaloby reguly KAZDEGO klastra na wspoldzielonym ProxySQL —
    # dokladnie ten sam blad, ktory naprawiono juz dla `mysql_servers` przez
    # hostgroup_base. Ograniczamy sie do wlasnych hostgroup; reguly bez
    # destination_hostgroup (np. przepisywanie SQL) nie sa nasze i zostaja.
    - name: "ISC-23: sprawdź reguły read/write split (tylko hostgroupy tego klastra)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: >-
          SELECT COUNT(*) FROM mysql_query_rules WHERE destination_hostgroup IN
          ({{ galera_writer_hg }},{{ galera_backup_hg }},{{ galera_reader_hg }},{{ galera_offline_hg }});
      register: current_query_rules
      no_log: true
      changed_when: false

    - name: "ISC-23: wyłącz read/write split (tylko hostgroupy tego klastra)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: |
          DELETE FROM mysql_query_rules WHERE destination_hostgroup IN
          ({{ galera_writer_hg }},{{ galera_backup_hg }},{{ galera_reader_hg }},{{ galera_offline_hg }});
          LOAD MYSQL QUERY RULES TO RUNTIME;
          SAVE MYSQL QUERY RULES TO DISK;
      when: current_query_rules.stdout | trim != '0'
      no_log: true
      changed_when: true

    - name: "ISC-20: czekaj na konwergencję Galera monitora (jeden aktywny writer)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: "SELECT COUNT(*) FROM runtime_mysql_servers WHERE hostgroup_id={{ galera_writer_hg }} AND status='ONLINE';"
      register: writer_count
      until: writer_count.stdout | trim == '1'
      retries: 15
      delay: 3
      changed_when: false
      no_log: true


    - name: "Raport ProxySQL (runtime hostgroups)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: "SELECT hostgroup_id, hostname, status FROM runtime_mysql_servers ORDER BY hostgroup_id, hostname;"
      register: server_status
      changed_when: false
      no_log: true

    - name: "Wydrukuj status serwerów ProxySQL"
      ansible.builtin.debug:
        msg: "{{ server_status.stdout_lines }}"
  handlers: []
