---
# cluster_deregister.yml — pelna derejestracja klastra z monitoringu, alertingu, ProxySQL
# oraz konta serwisowego zarzadzanego MinIO.
#
# DOKLADNA ODWROTNOSC faz F11 (monitoring), F15 (alerty) oraz F7 (ProxySQL
# per-klaster); odwolywane jest tez konto serwisowe MinIO z F10 (backup).
# Wolana PRZED `infra-teardown` (zniszczeniem maszyn).
#
# Zapobiega powstawaniu "sierot":
#   1. Wylaczone/zniszczone maszyny nie generuja falszywych alertow w Grafanie.
#   2. Inwentarz PMM nie zawiera martwych wezlow ani uslug.
#   3. Wspoldzielona para ProxySQL nie trzyma martwych backendow ani uzytkownikow.
#   4. Wspoldzielone MinIO nie trzyma konta serwisowego `galera-backup-<cluster>`
#      klastra, ktory juz nie istnieje.
#
# Bezpieczenstwo wspoldzielenia:
#   - Czyszczenie PMM i Grafany jest scisle filtrowane po `monitoring.pmm.cluster_name`.
#   - Czyszczenie ProxySQL jest scisle ograniczone do hostgroup klastra (hg_base..hg_base+30),
#     app_user klastra oraz per-klaster certyfikatu CA.
#   - Odwolanie konta MinIO dotyczy WYLACZNIE dokladnej nazwy `galera-backup-<cluster>`;
#     bucket, obiekty backupow i owner marker pozostaja nietkniete (dane operatora).
#   - Zasoby innych klastrow na wspolnym PMM, ProxySQL i MinIO pozostaja NIETKNIETE.
#
# Uruchomienie:
#   ansible-playbook playbooks/cluster_deregister.yml -i clusters/<name>/inventory.yml -e @clusters/<name>/cluster.yml

- name: "Preflight F10 — sprawdz poswiadczenia zarzadzanego MinIO przed mutacjami"
  # Pierwszy play calosci, celowo PRZED PMM/Grafana/ProxySQL: brak lub niebezpieczne
  # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD musi wywolic derejestracje ZANIM cokolwiek
  # zostanie zmutowane — po naprawie poswiadczen operator odpala caly playbook od
  # nowa, zamiast dostac polsprzatany stan w polowie faz.
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: "Ustal czy klaster korzysta z zarzadzanego MinIO"
      # Ten sam predykat "zarzadzane MinIO" co w roles/galera_backup/tasks/main.yml,
      # ale CELOWO bez `backup.enabled`: klaster, ktorego backup wylaczono PRZED
      # teardownem, nadal moze posiadac konto z czasow, gdy backup dzialal. Tez
      # celowo bez `galera_backup_provision_s3` — derejestracja sprzata konto
      # zawsze, gdy endpoint wskazuje na infra tego inventory. Endpoint porownujemy
      # po odcieciu portu, bo operator moze wpisac host:9000. set_fact na localhost
      # trwa przez caly przebieg playbooka — play F10 na dole reuzywa tego faktu.
      ansible.builtin.set_fact:
        galera_backup_managed_minio: >-
          {{
            backup.destination == 's3'
            and groups['infra'] is defined
            and (groups['infra'] | length) > 0
            and (
              (backup.s3.endpoint | regex_replace(':[0-9]+$', ''))
              == (hostvars[groups['infra'][0]].ansible_host | string)
            )
          }}

    - name: "Preflight MinIO — wymagaj poswiadczen root zarzadzanego MinIO"
      # Widoczna, nie-sekretna diagnostyka: `quiet: true` i bez `no_log` — asercja
      # wypisuje wylacznie statyczny fail_msg i nazwy zmiennych srodowiskowych,
      # nigdy wartosci. `mc` czyta userinfo doslownie, wiec znaki / @ : i biale
      # rozjechalby parsowanie URL-a (SignatureDoesNotMatch bez czytelnego
      # komunikatu); percent-encoding NIE jest rozwiazaniem, bo mc go nie dekoduje.
      # Klasa MUSI byc skladnia Pythona (`is search` wola re.search): POSIX-owe
      # [:space:] nie istnieje w re i dawaloby klase {/@:[space} + literal ']'.
      # Rola galera_backup trzyma ten sam guard defensywnie — preflight chroni
      # caly przebieg derejestracji, guard w roli chroni jej bezposrednie wywolania.
      # Zewnetrzne S3/SMB/filesystem nie spelniaja predykatu i przechodza dalej
      # bez jakichkolwiek poswiadczen MinIO.
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'MINIO_ROOT_USER') | length > 0
          - lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') | length > 0
          - lookup('ansible.builtin.env', 'MINIO_ROOT_USER') is not search('[/@:\s]')
          - lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') is not search('[/@:\s]')
        fail_msg: >-
          MINIO_ROOT_USER/MINIO_ROOT_PASSWORD sa wymagane na kontrolerze
          (niepuste, bez znakow / @ : i bialych) — bez nich derejestracja nie
          moze odwolac konta serwisowego zarzadzanego MinIO tego klastra.
        quiet: true
      when: galera_backup_managed_minio | bool

- name: "F15/F11 — usun reguly alertow, contact point, folder i inwentarz PMM"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    pmm_api_url: "{{ lookup('ansible.builtin.env', 'PMM_SERVER_URL') | default((monitoring | default({})).get('pmm', {}).get('server_url', 'https://192.168.1.130'), true) | regex_replace('/$', '') }}"
    pmm_admin_password: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_PASSWORD') }}"
    cluster_label: "{{ (monitoring | default({})).get('pmm', {}).get('cluster_name', cluster.name) }}"
    f15_folder_uid: "{{ (monitoring | default({})).get('alerts', {}).get('folder_uid', 'isa-alerts-' ~ cluster_label) }}"
    # Jeden wzorzec, jedno miejsce. Derejestracja NAJEMCY kasuje wylacznie reguly
    # wlasnego namespace'u `^isa-<cluster_label>-`: reguly `isa-shared-*` naleza
    # do warstwy wspolnej, ktora zyje dluzej niz kazdy klaster, wiec jej koniec
    # zycia obsluguje wylacznie platforma. To ta sama klasa bledu co konto MinIO
    # w deregister_minio.yml: sprzatanie zasobu wspoldzielonego przez najemce
    # osierocalo by go dla calej floty. `cluster_label` zawiera myslniki
    # (np. n11-galera), co w tym regexpie jest nieszkodliwe.
    f15_dereg_pattern: >-
      {{ '^isa-' ~ cluster_label ~ '-' }}
    f15_contact_uid: "email-isa-{{ cluster_label }}"
    f15_contact_name: "ISA Email Alerts ({{ cluster_label }})"

  tasks:
    - name: "Pomin jesli PMM_ADMIN_PASSWORD nie jest ustawione"
      ansible.builtin.meta: end_play
      when: pmm_admin_password | length == 0

    # ==========================================================================
    # KROK 1: Usun reguly alertow Grafana (musza zniknac PRZED folderem)
    # ==========================================================================
    - name: "Pobierz istniejace reguly alertow Grafana"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules"
        method: GET
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 404]
      register: f15_dereg_rules
      no_log: true

    - name: "Usun reguly alertow nalezace do klastra"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules/{{ item.uid }}"
        method: DELETE
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 204, 404]
      # Najemca NIGDY nie zdejmuje regul `isa-shared-*`: naleza do warstwy
      # wspolnej i kasuje je wylacznie jej wlasny cykl zycia. Gdyby kazdy
      # klaster zabieral je przy swoim teardownie, pierwsza derejestracja
      # zgasilaby alerty endpointu dla calej floty — wlasciwym wlascicielem
      # jest platforma, nie "kto odchodzi ostatni".
      #
      # Wzorzec jest budowany w JEDNYM miejscu (`f15_dereg_pattern` w varsach),
      # a nie sklejany w wyrazeniu `loop`. Poprzednia wersja skladala nawiasy
      # warunkowo i produkowala regexp niezbalansowany w OBU wariantach:
      #   konsument -> ^isa-(n11-galera))-      owner -> ^isa-(fc10-galera)|(shared))-
      # Zadanie padalo z no_log, wiec komunikat byl ocenzurowany, a jedynym
      # objawem bylo `failed=1` w PLAY RECAP. Skutek: derejestracja nie kasowala
      # NICZEGO, a operator niszczyl VM-y przekonany, ze posprzatal — reguly
      # alertowe zostawaly w Grafanie jako sieroty (zmierzone na n11: 9 sztuk).
      loop: >-
        {{ (f15_dereg_rules.json | default([]))
           | selectattr('uid', 'defined')
           | selectattr('uid', 'search', f15_dereg_pattern)
           | list }}
      loop_control:
        label: "{{ item.uid }}"
      no_log: true

    # ==========================================================================
    # KROK 2: Usun trase z Notification Policy (musi zniknac PRZED contact pointem)
    # ==========================================================================
    - name: "Pobierz biezaca notification policy"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/policies"
        method: GET
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: f15_dereg_policy
      no_log: true

    - name: "Wytnij trase tego klastra z notification policy"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/policies"
        method: PUT
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: >-
          {{
            f15_dereg_policy.json | combine({
              'routes': (f15_dereg_policy.json.routes | default([]))
                        | rejectattr('receiver', 'equalto', f15_contact_name)
                        | list
            })
          }}
        status_code: [200, 202]
      when: >-
        (f15_dereg_policy.json.routes | default([]))
        | selectattr('receiver', 'equalto', f15_contact_name)
        | list | length > 0
      no_log: true

    # ==========================================================================
    # KROK 3: Usun contact point (po wycieciu trasy z polityki)
    # ==========================================================================
    - name: "Usun email contact point klastra"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/contact-points/{{ f15_contact_uid }}"
        method: DELETE
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 202, 204, 404]
      no_log: true

    # ==========================================================================
    # KROK 4: Usun folder alertow Grafana
    # ==========================================================================
    - name: "Pobierz foldery Grafany"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/folders"
        method: GET
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: f15_dereg_folders
      no_log: true

    - name: "Usun folder ISA Alerts tego klastra"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/folders/{{ item.uid }}?forceDeleteRules=true"
        method: DELETE
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 204, 404]
      loop: >-
        {{ (f15_dereg_folders.json | default([]))
           | selectattr('title', 'equalto', 'ISA Alerts (' ~ cluster_label ~ ')')
           | list }}
      loop_control:
        label: "{{ item.title }} ({{ item.uid }})"
      no_log: true

    # ==========================================================================
    # KROK 5: Usun uslugi z PMM Inventory (kaskadowo usuwa eksportery i QAN)
    # ==========================================================================
    - name: "Pobierz uslugi PMM Inventory"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/services"
        method: GET
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: pmm_dereg_services
      no_log: true

    - name: "Wyznacz liste ID uslug nalezacych do klastra"
      ansible.builtin.set_fact:
        pmm_cluster_service_ids: >-
          {{
            [
              pmm_dereg_services.json.mysql | default([]),
              pmm_dereg_services.json.proxysql | default([]),
              pmm_dereg_services.json.external | default([]),
              pmm_dereg_services.json.postgresql | default([])
            ]
            | flatten
            | selectattr('service_name', 'defined')
            | selectattr('service_name', 'search', '^' ~ cluster_label ~ '-')
            | map(attribute='service_id')
            | list
          }}

    - name: "Usun uslugi klastra z PMM Inventory (Management API / kaskada)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/management/services/{{ item }}"
        method: DELETE
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 204, 404]
      loop: "{{ pmm_cluster_service_ids | default([]) }}"
      no_log: true

    # ==========================================================================
    # KROK 6: Usun wezly z PMM Inventory (po usunieciu uslug)
    # ==========================================================================
    - name: "Pobierz wezly PMM Inventory"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/nodes"
        method: GET
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      register: pmm_dereg_nodes
      no_log: true

    - name: "Wyznacz liste ID wezlow nalezacych do klastra"
      ansible.builtin.set_fact:
        pmm_cluster_node_ids: >-
          {{
            [
              pmm_dereg_nodes.json.generic | default([]),
              pmm_dereg_nodes.json.container | default([]),
              pmm_dereg_nodes.json.remote | default([])
            ]
            | flatten
            | selectattr('node_name', 'defined')
            | selectattr('node_name', 'search', '^' ~ cluster_label ~ '-')
            | map(attribute='node_id')
            | list
          }}

    - name: "Usun wezly klastra z PMM Inventory (force=true)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/nodes/{{ item }}?force=true"
        method: DELETE
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 204, 404]
      loop: "{{ pmm_cluster_node_ids | default([]) }}"
      no_log: true

    - name: "Raport derejestracji PMM i Grafany"
      ansible.builtin.debug:
        msg: >-
          Derejestracja monitoringu zakonczona dla '{{ cluster_label }}':
          uslug={{ pmm_cluster_service_ids | default([]) | length }},
          wezlow={{ pmm_cluster_node_ids | default([]) | length }},
          folder={{ f15_folder_uid }}.


- name: "F7 — usun konfiguracje klastra ze wspoldzielonego ProxySQL"
  hosts: proxysql
  become: true
  serial: 1
  vars:
    proxysql_admin_cli:
      - mariadb
      - --defaults-extra-file=/etc/proxysql/admin-check.cnf
      - -h127.0.0.1
      - -P6032
      - -uadmin
      - -N
      - -B
    galera_writer_hg: "{{ proxysql.hostgroup_base | default(10) | int }}"
    galera_backup_hg: "{{ proxysql.hostgroup_base | default(10) | int + 10 }}"
    galera_reader_hg: "{{ proxysql.hostgroup_base | default(10) | int + 20 }}"
    galera_offline_hg: "{{ proxysql.hostgroup_base | default(10) | int + 30 }}"
    galera_app_user: "{{ proxysql.app_user | default('app_user') }}"
    galera_backends: "{{ groups['galera'] | default([]) | map('extract', hostvars, 'galera_node_address') | select('defined') | list }}"

  tasks:
    - name: "Wyczysc wpisy klastra w tabelach ProxySQL (scisle zakresowane)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: |
          DELETE FROM mysql_servers WHERE hostgroup_id IN ({{ galera_writer_hg }}, {{ galera_backup_hg }}, {{ galera_reader_hg }}, {{ galera_offline_hg }});
          DELETE FROM mysql_galera_hostgroups WHERE writer_hostgroup={{ galera_writer_hg }};
          DELETE FROM mysql_users WHERE username='{{ galera_app_user }}' AND default_hostgroup={{ galera_writer_hg }};
          DELETE FROM mysql_query_rules WHERE destination_hostgroup IN ({{ galera_writer_hg }}, {{ galera_backup_hg }}, {{ galera_reader_hg }}, {{ galera_offline_hg }});
          {% if galera_backends | length > 0 %}
          DELETE FROM mysql_servers_ssl_params WHERE hostname IN ({% for b in galera_backends %}'{{ b }}'{% if not loop.last %},{% endif %}{% endfor %});
          {% endif %}
          DELETE FROM mysql_servers_ssl_params WHERE ssl_ca LIKE '%/{{ cluster.name }}/%';
          LOAD MYSQL SERVERS TO RUNTIME;
          LOAD MYSQL USERS TO RUNTIME;
          LOAD MYSQL QUERY RULES TO RUNTIME;
          SAVE MYSQL SERVERS TO DISK;
          SAVE MYSQL USERS TO DISK;
          SAVE MYSQL QUERY RULES TO DISK;
      no_log: true
      changed_when: true

    - name: "Usun katalog certyfikatow CA per-klaster na ProxySQL"
      ansible.builtin.file:
        path: "/etc/mysql/tls/{{ cluster.name }}"
        state: absent

    - name: "Raport czyszczenia ProxySQL"
      ansible.builtin.debug:
        msg: "ProxySQL oczyszczone z hostgroup {{ galera_writer_hg }}-{{ galera_offline_hg }} i usera {{ galera_app_user }} na {{ inventory_hostname }}."

- name: "F10 — odwolaj konto serwisowe zarzadzanego MinIO tego klastra"
  # BEZ `connection: local` (precedens f13_remove_node.yml: przy nim zadania z
  # `delegate_to` wykonywaly sie NA KONTROLERZE, potwierdzone empirycznie).
  # Niejawny localhost i tak laczy sie lokalnie, a delegacja na infra dostaje
  # polaczenie wezla z inventory. Zadania delegowane maja wlasne `become: true`
  # (play-level `become: false` dotyczy wylacznie zadan kontrolera).
  # Predykat `galera_backup_managed_minio` NIE jest tu przepisywany: pochodzi
  # z preflightu (play 1) jako set_fact na localhost i trwa przez caly przebieg
  # playbooka, wiec `when` nizej po prostu go reuzywa.
  hosts: localhost
  become: false
  gather_facts: false

  tasks:
    - name: "Odwolaj konto MinIO wylacznie dla zarzadzanej instancji tego inventory"
      # include_role (a nie include_tasks) po to, zeby filtry roli —
      # minio_service_account_keys i minio_access_keys_named — byly dostepne
      # w tasks_from: deregister_minio.yml. Rola odwoluje wylacznie konto
      # 'galera-backup-<cluster>'; bucket, owner marker i kopie pozostaja
      # danymi operatora. Zewnetrzne S3/SMB/filesystem spelniaja warunek
      # destination/endpoint i przechodza po cichu.
      ansible.builtin.include_role:
        name: galera_backup
        tasks_from: deregister_minio.yml
      when: galera_backup_managed_minio | bool
