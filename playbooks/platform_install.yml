---
# Instalacja pakietow warstwy wspolnej na wezlach ProxySQL (fcp1/fcp2).
# Satisfies: ISC-3 (wersje zgodne z lockfile), ISC-63 (no state:latest)
#
# Ta sciezka mieszkala w f2_install.yml jako prerogatywa klastra-"ownera"
# pary — czyli instalacja NAJEMCY na hostach, ktore dzis naleza do platformy.
# Wydzielenie warstwy wspolnej czyni ja wylacznie platformowa: zaden klaster
# nie ma tu czego szukac, a lockfile (EL10) wybiera platform.yml, nie
# cluster.yml najemcy — wlasnie ten rozjazd byl objawem sprzezenia
# wlascicielskiego, ktore usuwamy.

- name: Platform Install - pakiety warstwy wspolnej (ProxySQL)
  hosts: proxysql
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0

  tasks:
    # Lockfile platformy (EL10), nie najemcy: wezly warstwy wspolnej moga stac
    # na innym EL major niz bazy klastrow najemcow i to jest stan zamierzony,
    # nie blad konfiguracji.
    - name: "Zaladuj lockfile platformy (reprodukowalne wersje)"
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock

    # GenericCloud startuje z hostname "localhost" i PVE go nie nadpisuje, gdy
    # user-data pochodzi z cicustom. Efekt: journald na KAZDYM wezle pisze
    # "localhost", co uniemozliwia korelacje logow miedzy hostami przy
    # incydencie. Wczesniej robil to f2_install klastra-wlasciciela (hosts: all);
    # po ograniczeniu tego play'u do galera:restore wlascicielem tej czynnosci
    # na wezlach wspolnych jest platforma.
    - name: "Ustaw hostname zgodny z inventory (korelacja logow)"
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    # === ProxySQL: RPM z realna weryfikacja podpisu wydawcy (audit#6) ===
    # Wczesniej stalo tu `disable_gpg_check: true` z komentarzem, ze klucz jest
    # binarny i nieimportowalny. To bylo nieprawda: `repo_pub_key.gpg` faktycznie
    # jest binarny, ale `repo_pub_key` (bez rozszerzenia) to ASCII-armored blok,
    # ktory `rpm --import` przyjmuje bez problemu. sha256 z lockfile chroni tylko
    # przed bledem pobierania — podmiana pliku na serwerze wydawcy przechodzila.
    # hosts: proxysql jest jedynym zakresem tego play'u, wiec zadne when-grupy
    # nie sa potrzebne (w f2_install.yml chronily przed najemca na tych hostach).
    # R1 (przeniesione z f2_install.yml): martwe zmienne proxysql_repo_baseurl
    # (wskazywal na 404 — sciezka `rocky/<major>` u wydawcy nie istnieje) i
    # proxysql_repo_gpgkey padly razem z podejsciem repo-file: ProxySQL idzie
    # bezposrednim RPM-em z sha256, a stary /etc/yum.repos.d/proxysql.repo
    # jest celowo usuwany nizej.
    - name: "ProxySQL - wymagaj sha256 RPM dla aktualnej arch w lockfile"
      ansible.builtin.assert:
        that:
          - (lock.proxysql.rpm_sha256 | default({})).get(ansible_architecture) is defined
        fail_msg: >-
          Brak sha256 dla ProxySQL {{ lock.proxysql.version }} arch {{ ansible_architecture }}
          w lockfile platformy (proxysql.rpm_sha256). Dodaj przed instalacja (audit#6).

    - name: "ProxySQL - pobierz RPM z weryfikacja sha256 (audit#6)"
      ansible.builtin.get_url:
        url: "{{ proxysql_rpm_url | default('https://repo.proxysql.com/ProxySQL/proxysql-' ~ lock.proxysql.series ~ '.x/centos/' ~ lock.rocky_linux.major ~ '/proxysql-' ~ lock.proxysql.version ~ '-' ~ lock.proxysql.rpm_release ~ '-centos' ~ lock.rocky_linux.major ~ '.' ~ ansible_architecture ~ '.rpm') }}"
        dest: "/var/tmp/proxysql-{{ lock.proxysql.version }}-{{ lock.proxysql.rpm_release }}.{{ ansible_architecture }}.rpm"
        checksum: "sha256:{{ (lock.proxysql.rpm_sha256 | default({})).get(ansible_architecture) }}"
        mode: "0644"
      register: proxysql_rpm_dl

    # RPM z repo.proxysql.com jest podpisywany, ale repo NIE jest uzywane jako
    # zrodlo dnf (instalacja idzie z pobranego pliku) — plik repo pozostawiony
    # przez starsze wdrozenia wprowadzalby cichy drugi kanal wersji.
    - name: "ProxySQL - usun stary repo file (jesli istnieje)"
      ansible.builtin.file:
        path: /etc/yum.repos.d/proxysql.repo
        state: absent

    - name: "ProxySQL - zaimportuj klucz GPG wydawcy (ASCII-armored)"
      ansible.builtin.rpm_key:
        key: "{{ proxysql_gpg_key_url | default('https://repo.proxysql.com/ProxySQL/proxysql-' ~ lock.proxysql.series ~ '.x/repo_pub_key') }}"
        fingerprint: "{{ proxysql_gpg_fingerprint | default('653F85BB38256DF8A96206C3E8CA2E8D8217C97E') }}"
        state: present

    - name: "ProxySQL - instaluj RPM (sha256 z lockfile + podpis GPG wydawcy)"
      ansible.builtin.dnf:
        name: "{{ proxysql_rpm_dl.dest }}"
        state: present

    - name: "ProxySQL - instaluj klienta mariadb (wymagany do admin port 6032)"
      ansible.builtin.dnf:
        name: mariadb
        state: present

    - name: "Katalog drop-in proxysql.service"
      ansible.builtin.file:
        path: /etc/systemd/system/proxysql.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "ProxySQL - drop-in LimitNOFILE"
      ansible.builtin.copy:
        content: |
          [Service]
          LimitNOFILE=1048576
          # Rekomendacja produkcyjna: OOMScoreAdjust=-800 chroni ProxySQL
          # przed ubiciem przez kernel OOM killer.
          OOMScoreAdjust=-800
        dest: /etc/systemd/system/proxysql.service.d/limits.conf
        owner: root
        group: root
        mode: "0644"
      notify: "ProxySQL - daemon-reload po zmianie drop-in systemd"

    # Pidfile ProxySQL lezy w TRWALYM katalogu danych (/var/lib/proxysql), nie
    # w /run. Czyste zatrzymanie go usuwa (systemd sprzata PIDFile=), ale utrata
    # zasilania zostawia stary numer PID. libdaemon sprawdza wtedy wylacznie
    # `kill(pid, 0)` i traktuje EPERM jako "zyje" — ProxySQL dziala jako
    # uzytkownik `proxysql`, wiec DOWOLNY proces roota, ktory w nowym boocie
    # dostal ten numer, blokuje start: "Daemon already running on PID file N".
    # Zmierzone 2026-09-23 na x17p2 po 14 h bez zasilania hypervisora; tak samo
    # odtworzone pidfile'em z PID 1 (identyczny komunikat, rc=1).
    #
    # Straznik sprawdza TOZSAMOSC, nie tylko zycie procesu: pidfile wskazujacy
    # na dzialajacy `proxysql` zostaje (wtedy odmowa startu jest poprawna),
    # kazdy inny — martwy numer, obcy proces, smieci — jest usuwany. Prefiks `+`
    # uruchamia komende z pelnymi uprawnieniami mimo User=proxysql. `$$` to
    # doslowny `$` dla powloki (systemd podstawia pojedynczy `$`).
    #
    # To NIE jest samoleczenie: decyzja `Restart=no` (tests/lab/chaos-proxysql-
    # failover.py) zostaje nietknieta — crash petla nadal nie jest maskowana,
    # a alert isa-shared-proxysql-down nadal mowi prawde. Zmienia sie wylacznie
    # to, ze pierwszy start po utracie zasilania przestaje zalezec od tego, czy
    # stary numer PID trafil na inny proces.
    - name: "ProxySQL - drop-in: straznik osieroconego pidfile po utracie zasilania"
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStartPre=+/bin/sh -c 'p=$$(cat /var/lib/proxysql/proxysql.pid 2>/dev/null) || exit 0; [ "$$(cat /proc/$$p/comm 2>/dev/null)" = proxysql ] || rm -f /var/lib/proxysql/proxysql.pid'
        dest: /etc/systemd/system/proxysql.service.d/stale-pidfile.conf
        owner: root
        group: root
        mode: "0644"
      notify: "ProxySQL - daemon-reload po zmianie drop-in systemd"

    # === Cykl zycia logu ProxySQL (ISC-48 dla warstwy wspolnej) ===
    # f11_log_lifecycle.yml obejmuje wylacznie galera:restore, wiec na wezlach
    # ProxySQL obowiazywala jedynie polityka z RPM (tygodniowa, bez `su`) i nie
    # zadzialala ANI RAZU: log rosl od 12 wrzesnia do 95 MB. Dwie bariery:
    #   1. DAC [INFERENCE] — katalog danych to 0700 proxysql, a przebiegi 13
    #      i 20 wrzesnia konczyly sie "error opening ... Permission denied" bez
    #      zarejestrowanego AVC. Brak AVC moze jednak wynikac z regul dontaudit,
    #      wiec udzialu DAC nie oddzielono eksperymentem od SELinux. `su proxysql
    #      proxysql` zostaje: otwiera plik jako wlasciciel, niczego nie psuje
    #      i usuwa te bariere, jesli istnieje.
    #   2. SELinux — sam `su` NIE wystarcza: logrotate.service dziala w domenie
    #      logrotate_t, a plik ma etykiete katalogu (var_lib_t). Zmierzone
    #      2026-09-23: AVC `denied { write } comm="logrotate" name="proxysql.log"`.
    #      Log dostaje wiec etykiete var_log_t — te sama, co kazdy log w /var/log;
    #      ProxySQL (bez wlasnej polityki, domena unconfined_service_t) pisze do
    #      niej dalej. Regula obejmuje tez obrocone kopie (proxysql.log-DATA.gz).
    # Weryfikowac wylacznie przez `systemctl start logrotate.service`: reczny
    # `logrotate` z sesji roota dziala jako unconfined_t i obchodzi bariere 2.
    - name: "SELinux - etykieta var_log_t dla logu ProxySQL (rotacja przez logrotate_t)"
      community.general.sefcontext:
        target: "/var/lib/proxysql/proxysql.log.*"
        setype: var_log_t
        state: present
      when: ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    - name: "SELinux - przywroc kontekst logu ProxySQL"
      ansible.builtin.command:
        argv: [restorecon, -RFv, /var/lib/proxysql]
      register: proxysql_log_restorecon
      changed_when: proxysql_log_restorecon.stdout | length > 0
      when: ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    # Nadpisujemy plik producenta zamiast dodawac drugi: dwie reguly dla jednej
    # sciezki to dla logrotate blad konfiguracji. To %config(noreplace), wiec
    # aktualizacja RPM zostawi te tresc i odlozy swoja jako .rpmnew (logrotate
    # ignoruje to rozszerzenie). Parametry jak w f11: daily / 14 / maxsize 100M.
    - name: "ProxySQL - rotacja logu jako wlasciciel pliku"
      ansible.builtin.copy:
        dest: /etc/logrotate.d/proxysql
        owner: root
        group: root
        mode: "0644"
        content: |
          # Zarzadzane przez playbooks/platform_install.yml (ISC-48).
          /var/lib/proxysql/proxysql.log {
              su proxysql proxysql
              daily
              rotate 14
              maxsize 100M
              missingok
              notifempty
              compress
              delaycompress
              dateext
              copytruncate
          }

    - name: "ProxySQL - sprawdz skladnie pelnej konfiguracji logrotate"
      ansible.builtin.command:
        argv:
          - logrotate
          - --debug
          - /etc/logrotate.conf
      changed_when: false

    - name: "ProxySQL - wlacz systemowy timer rotacji logow"
      ansible.builtin.systemd:
        name: logrotate.timer
        enabled: true
        state: started

    # === Tuning OS wezlow warstwy wspolnej (sysctl, THP, chrony, qemu-guest-agent) ===
    - name: "Tuning OS i komponenty wspólne"
      ansible.builtin.include_tasks: tasks/os_tuning.yml

  handlers:
    - name: "ProxySQL - daemon-reload po zmianie drop-in systemd"
      ansible.builtin.systemd:
        daemon_reload: true
    - name: "Zastosuj parametry sysctl"
      ansible.builtin.command: sysctl --system
      changed_when: true
