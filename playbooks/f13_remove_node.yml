---
# F13 — Remove-node (decommission węzła Galera): WYKONANIE z jawne potwierdzenie.
# MASTER_PROMPT §714: remove node wymaga planu + jawnego potwierdzenia.
# Użycie: ansible-playbook f13_remove_node.yml -e node=gnode2 -e confirm=yes
# NIGDY bez -e confirm=yes. Najpierw uruchom f13_remove_node_plan.yml.
#
# Struktura: prawdziwe playe na docelowych hostach (NIE zagnieżdżony `ansible` ad-hoc
# z localhost — to robiło hasło admina ProxySQL widocznym w argv procesu shella).
# Sekrety: ProxySQL admin przez MYSQL_PWD (env, nie argv); PMM przez uri.url_password.

# === Play 0: walidacja wejścia + quorum guard ===
- name: "F13 — walidacja + strażnik quorum"
  # BEZ `connection: local`: przy nim zadania z `delegate_to` wykonywaly sie NA KONTROLERZE
  # (potwierdzone: `hostname -f` zwracalo maszyne operatora), wiec odczyt stanu klastra
  # przez `mariadb --socket=...` padal rc=2 i cala sciezka remove-node byla nieuzywalna.
  # Niejawny localhost i tak laczy sie lokalnie, a delegacja dostaje polaczenie wezla.
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_become: false

  tasks:
    - name: "Wymagaj confirm=yes + node= (galera host)"
      ansible.builtin.assert:
        that:
          - confirm is defined and confirm | bool
          - node is defined and node | length > 0
          - node in groups['galera']
        fail_msg: >-
          Remove-node wymaga -e confirm=yes -e node=<gnodeX> należącego do grupy galera.
          Najpierw uruchom f13_remove_node_plan.yml. Nigdy bez jawnego potwierdzenia.

    # audit#18: plan nie może być ozdobą — wymagamy jego artefaktu, świeżości (TTL)
    # i zgodności ze stanem klastra. Bez tego "wymaga planu" było tylko w komentarzu.
    - name: "Audit#18: wczytaj artefakt planu remove-node"
      ansible.builtin.slurp:
        src: "{{ f13_plan_dir | default('/tmp/isa-plans') }}/remove-node-{{ cluster.name }}-{{ node }}.json"
      register: f13_plan_raw
      failed_when: false

    - name: "Audit#18: plan musi istnieć (uruchom najpierw f13_remove_node_plan.yml)"
      ansible.builtin.assert:
        that:
          # `failed_when: false` na slurpie ZERUJE pole `failed`, wiec warunek
          # `not f13_plan_raw.failed` przechodzil zawsze — takze przy braku pliku.
          # Przebieg wywracal sie dopiero linijke nizej, na `.content`, bledem
          # o slowniku bez atrybutu. Pytamy wprost o to, czego uzywamy dalej.
          - f13_plan_raw.content is defined
        fail_msg: >-
          Brak artefaktu planu dla {{ node }}. Uruchom najpierw:
          make cluster-remove-node-plan CLUSTER={{ cluster.name }} NODE={{ node }}

    - name: "Audit#18: sparsuj plan"
      ansible.builtin.set_fact:
        f13_plan: "{{ f13_plan_raw.content | b64decode | from_json }}"

    - name: "Audit#18: plan świeży (TTL) i dla właściwego węzła/klastra"
      ansible.builtin.assert:
        that:
          - f13_plan.node == node
          - f13_plan.cluster == cluster.name
          - (lookup('ansible.builtin.pipe', 'date +%s') | int) - (f13_plan.generated_unix | int)
            < (f13_plan_ttl | default(3600) | int)
        fail_msg: >-
          Plan nieaktualny lub dla innego węzła/klastra
          (plan: {{ f13_plan.cluster }}/{{ f13_plan.node }}, wiek
          {{ (lookup('ansible.builtin.pipe', 'date +%s') | int) - (f13_plan.generated_unix | int) }}s,
          TTL {{ f13_plan_ttl | default(3600) }}s). Wygeneruj plan ponownie.

    - name: "Pozostali członkowie galera (poza usuwanym węzłem)"
      ansible.builtin.set_fact:
        f13_survivors: "{{ groups['galera'] | reject('equalto', node) | list }}"

    - name: "Strażnik quorum: odmów jeśli zostanie mniej niż 2 węzły"
      ansible.builtin.assert:
        that:
          - f13_survivors | length >= 2
        fail_msg: >-
          ODRZUCONE: usunięcie {{ node }} zejdzie poniżej quorum (zostanie
          {{ f13_survivors | length }} węzłów). Minimum 2 dla Primary Component.

    # audit#18: po usunięciu klaster ma inną liczebność niż galera.nodes_expected.
    # Walidator schema, brama zdrowia i alerty nadal oczekują starej wartości, a 2-węzłowa
    # Galera bez arbitra traci odporność na awarię pojedynczego węzła — wymagaj świadomej zgody.
    - name: "Audit#18: zmiana topologii wymaga -e accept_topology_change=yes"
      ansible.builtin.assert:
        that:
          - accept_topology_change is defined and accept_topology_change | bool
        fail_msg: >-
          Usunięcie {{ node }} zmienia topologię {{ galera.nodes_expected }} → {{ f13_survivors | length }}.
          Po operacji MUSISZ zaktualizować galera.nodes_expected w clusters/{{ cluster.name }}/cluster.yml
          oraz usunąć węzeł z inventory, inaczej cluster-validate/health-gate/alerty będą zgłaszać awarię.
          Klaster 2-węzłowy bez arbitra (garbd) nie przetrwa awarii jednego węzła — wymaga decyzji/ADR.
          Potwierdź świadomie: -e accept_topology_change=yes
      when: (f13_survivors | length) != (galera.nodes_expected | int)
    # CELOWO inline, nie `tasks/assert_galera_healthy.yml`. Trzy roznice: (1) mierzy
    # rozmiar wzgledem `groups['galera'] | length` (inwentarz), nie `nodes_expected`;
    # (2) `delegate_to` na ocalalego, bo wezel usuwany moze juz nie odpowiadac;
    # (3) jednorazowy odczyt + assert, bez petli `until` — przed operacja
    # destrukcyjna czekanie na poprawe stanu jest niepozadane, klaster ma byc
    # zdrowy JUZ TERAZ albo operacja ma sie nie odbyc.
    - name: "Odczytaj stan klastra przed operacją destrukcyjną"
      ansible.builtin.command:
        argv:
          - mariadb
          - --socket=/var/lib/mysql/mysql.sock
          - -N
          - -B
          - -e
          - "SHOW STATUS WHERE Variable_name IN ('wsrep_local_state','wsrep_cluster_status','wsrep_ready','wsrep_cluster_size')"
      delegate_to: "{{ f13_survivors | first }}"
      become: true
      register: f13_health_before
      changed_when: false

    - name: "Blokuj remove-node z klastra, który już jest zdegradowany"
      ansible.builtin.assert:
        that:
          - f13_health_before.stdout is search('wsrep_local_state\t4')
          - f13_health_before.stdout is search('wsrep_cluster_status\tPrimary')
          - f13_health_before.stdout is search('wsrep_ready\tON')
          - f13_health_before.stdout is search('wsrep_cluster_size\t' ~ (groups['galera'] | length | string))
        fail_msg: "ODRZUCONE: przed remove-node wszystkie zadeklarowane węzły muszą być w zdrowym Primary Component."


# === Play 1: drain + usuń węzeł z ProxySQL hostgroups ===
- name: "F13 — usuń węzeł z ProxySQL hostgroups (drain + delete)"
  hosts: proxysql
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  vars:
    proxysql_admin_password: "{{ lookup('ansible.builtin.env', 'PROXYSQL_ADMIN_PASSWORD') }}"
  environment:
    MYSQL_PWD: "{{ proxysql_admin_password }}"

  tasks:
    - name: "Wymagaj PROXYSQL_ADMIN_PASSWORD"
      ansible.builtin.assert:
        that: [proxysql_admin_password | length > 0]
        fail_msg: "Ustaw PROXYSQL_ADMIN_PASSWORD poza repozytorium."

    - name: "Drain: przestaw backend w stan OFFLINE_SOFT (brak nowych połączeń)"
      ansible.builtin.shell: >-
        mariadb -h127.0.0.1 -P6032 -uadmin -N -B -e
        "UPDATE mysql_servers SET status='OFFLINE_SOFT' WHERE hostname='{{ hostvars[node].galera_node_address }}';
         LOAD MYSQL SERVERS TO RUNTIME;"
      changed_when: true
      no_log: true

    - name: "Drain: czekaj na zakończenie aktywnych połączeń do usuwanego węzła"
      ansible.builtin.command:
        argv:
          - mariadb
          - -h127.0.0.1
          - -P6032
          - -uadmin
          - -N
          - -B
          - -e
          - "SELECT COALESCE(SUM(ConnUsed), 0) FROM stats_mysql_connection_pool WHERE srv_host='{{ hostvars[node].galera_node_address }}'"
      register: f13_drain_conns
      until: (f13_drain_conns.stdout | trim | int) == 0
      retries: "{{ f13_drain_retries | default(30) | int }}"
      delay: 2
      changed_when: false
      no_log: true

    - name: "Usuń backend usuwanego węzła z ProxySQL"
      ansible.builtin.shell: >-
        mariadb -h127.0.0.1 -P6032 -uadmin -N -B -e
        "DELETE FROM mysql_servers WHERE hostname='{{ hostvars[node].galera_node_address }}';
         LOAD MYSQL SERVERS TO RUNTIME; SAVE MYSQL SERVERS TO DISK;"
      changed_when: true
      no_log: true
# === Play 2: usuń usługi węzła z PMM Inventory (uri, nie curl z hasłem w argv) ===
- name: "F13 — usuń usługi węzła z PMM Inventory"
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_become: false
    pmm_admin_password: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_PASSWORD') }}"
    pmm_admin_user: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_USER') | default('admin', true) }}"
    pmm_api_url: "{{ lookup('ansible.builtin.env', 'PMM_SERVER_URL') | default(monitoring.pmm.server_url, true) | regex_replace('/$', '') }}"
    pmm_cluster_name: "{{ monitoring.pmm.cluster_name }}"
    pmm_validate_certs: "{{ monitoring.get('pmm', {}).get('validate_certs', true) | bool }}"

  tasks:
    - name: "Wymagaj PMM_ADMIN_PASSWORD"
      ansible.builtin.assert:
        that: [pmm_admin_password | length > 0]
        fail_msg: "Ustaw PMM_ADMIN_PASSWORD poza repozytorium."

    - name: "Pobierz usługi PMM Inventory"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/inventory/services"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: pmm_services
      no_log: true

    - name: "Service ID wszystkich typów usług węzła do usunięcia"
      ansible.builtin.set_fact:
        f13_pmm_service_ids: >-
          {{
            pmm_services.json
            | dict2items
            | map(attribute='value')
            | flatten
            | selectattr('service_name', 'defined')
            | selectattr('service_name', 'search', pmm_cluster_name ~ '-' ~ node)
            | map(attribute='service_id')
            | list
          }}

    - name: "Usuń usługi PMM węzła"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/v1/management/services/{{ item }}"
        method: DELETE
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        status_code: 200
      loop: "{{ f13_pmm_service_ids }}"
      no_log: true

# === Play 3: zatrzymaj mariadbd na usuwanym węźle ===
- name: "F13 — stop mariadbd na usuwanym węźle"
  hosts: "{{ node | default('localhost') }}"
  become: true
  gather_facts: true
  any_errors_fatal: true

  tasks:
    - name: "Zatrzymaj i wyłącz mariadb.service na usuwanym węźle"
      ansible.builtin.systemd_service:
        name: mariadb
        state: stopped
        enabled: false

# === Play 4: zaktualizuj wsrep_cluster_address na ocalałych węzłach ===
- name: "F13 — zaktualizuj wsrep_cluster_address na ocalałych węzłach"
  hosts: galera
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: "Pomiń usuwany węzeł"
      ansible.builtin.meta: end_host
      when: inventory_hostname == node

    - name: "Nowa lista peerów (bez usuwanego węzła)"
      ansible.builtin.set_fact:
        f13_new_cluster_address: >-
          gcomm://{{
            groups['galera']
            | reject('equalto', node)
            | map('extract', hostvars, 'galera_node_address')
            | join(',')
          }}


    - name: "Utrwal nowy adres w server.cnf (next restart nie spróbuje martwego seeda)"
      ansible.builtin.replace:
        path: /etc/my.cnf.d/server.cnf
        regexp: '^wsrep_cluster_address = gcomm://.*$'
        replace: 'wsrep_cluster_address = {{ f13_new_cluster_address }}'

# === Play 5: czekaj na stabilizację klastra + raport ===
- name: "F13 — weryfikuj quorum po usunięciu"
  hosts: "{{ (groups.get('galera', []) | reject('equalto', node | default('')) | list | first) | default('localhost') }}"
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: "Czekaj na ustabilizowanie rozmiaru klastra (quorum utrzymane)"
      ansible.builtin.command:
        argv:
          - mariadb
          - --socket=/var/lib/mysql/mysql.sock
          - -N
          - -B
          - -e
          - "SHOW STATUS WHERE Variable_name='wsrep_cluster_size'"
      register: f13_size_after
      until: (f13_size_after.stdout | regex_search('\d+') | int) == (groups['galera'] | length) - 1
      retries: 12
      delay: 5
      changed_when: false

    - name: "Weryfikuj Primary Component"
      ansible.builtin.command:
        argv:
          - mariadb
          - --socket=/var/lib/mysql/mysql.sock
          - -N
          - -B
          - -e
          - "SHOW STATUS WHERE Variable_name='wsrep_cluster_status'"
      register: f13_status_after
      changed_when: false

    - name: "Quorum utrzymane"
      ansible.builtin.assert:
        that:
          - "'Primary' in f13_status_after.stdout"
        fail_msg: "Klaster nie jest Primary po usunięciu {{ node }}: {{ f13_status_after.stdout }}"

    - name: "Raport remove-node"
      ansible.builtin.debug:
        msg: >-
          Usunięto {{ node }}: cluster size = {{ (groups['galera'] | length) - 1 }}
          (Primary utrzymane). ProxySQL hostgroups zaktualizowane na wszystkich instancjach,
          usługi PMM usunięte, mariadbd zatrzymany i wyłączony, a wsrep_cluster_address
          zaktualizowany na ocalałych węzłach. Usuń teraz {{ node }} z inventory przed kolejnym converge.
