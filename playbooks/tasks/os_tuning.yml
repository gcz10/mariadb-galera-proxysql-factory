---
# playbooks/tasks/os_tuning.yml — tuning jądra OS (sysctl), THP, chrony, qemu-guest-agent
#
# Wspólne zadania utrzymaniowe dla węzłów bazodanowych (f2_install) oraz ProxySQL
# (platform_install).

# === Tuning jądra OS (sysctl) dla baz danych i load balancerów ===
- name: "Wdróż konfigurację sysctl dla baz danych i ProxySQL"
  ansible.builtin.copy:
    content: |
      # ISA Database & ProxySQL sysctl tuning
      vm.swappiness = 10
      net.core.somaxconn = 4096
      net.ipv4.tcp_max_syn_backlog = 4096
      fs.file-max = 2097152
    dest: /etc/sysctl.d/90-database-tuning.conf
    owner: root
    group: root
    mode: "0644"
  notify: "Zastosuj parametry sysctl"

# === Transparent Huge Pages (THP) — wyłączenie dla baz danych i ProxySQL ===
# B-drzewa InnoDB oraz silnik pamięci ProxySQL mają rzadki dostęp do pamięci.
# THP alokuje 2MB ciągłe strony i przy braku ciągłej pamięci wywołuje defragmentację
# synchroniczną w jądrze, co powoduje skoki opóźnień (latency spikes) i fragmentację RAM.
# Oficjalne przewodniki MariaDB/Percona zalecają wyłączenie THP (never).
- name: "THP — wdróż usługę systemd wyłączającą Transparent Huge Pages"
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Disable Transparent Huge Pages (THP) for Database Performance
      DefaultDependencies=no
      After=sysinit.target local-fs.target
      Before=mongod.service mariadb.service mysql.service mysqld.service proxysql.service

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled && echo never > /sys/kernel/mm/transparent_hugepage/defrag'
      RemainAfterExit=yes

      [Install]
      WantedBy=basic.target
    dest: /etc/systemd/system/disable-thp.service
    owner: root
    group: root
    mode: "0644"
  register: _thp_service_unit

- name: "THP — włącz i uruchom disable-thp.service"
  ansible.builtin.systemd:
    name: disable-thp
    enabled: true
    state: started
    daemon_reload: "{{ _thp_service_unit.changed }}"

# === Wspólne: time sync ===
- name: "Instaluj i włącz chrony"
  ansible.builtin.dnf:
    name: chrony
    state: present

- name: "Włącz chrony (jeśli systemd dostępny)"
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true

# Agent gościa ma sens wyłącznie pod KVM/QEMU (hypervisor widzi wtedy adresy
# i potrafi zamknąć maszynę czysto). Na blaszaku, w LXC albo pod innym
# hypervisorem pakietu nie ma po co instalować.
- name: "Zainstaluj qemu-guest-agent (tylko gość KVM/QEMU)"
  ansible.builtin.dnf:
    name: qemu-guest-agent
    state: present
  when:
    - ansible_facts['virtualization_role'] | default('') == 'guest'
    - ansible_facts['virtualization_type'] | default('') in ['kvm', 'qemu', 'RHEV']

- name: "Włącz qemu-guest-agent (gdy systemd; nieblokujące — wymaga kanału virtio-serial)"
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true
  when:
    - ansible_facts['virtualization_role'] | default('') == 'guest'
    - ansible_facts['virtualization_type'] | default('') in ['kvm', 'qemu', 'RHEV']
  failed_when: false
  changed_when: false
