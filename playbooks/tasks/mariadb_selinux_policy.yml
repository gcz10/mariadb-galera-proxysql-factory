---
# Polityka SELinux MariaDB Galera z ZAINSTALOWANEGO pakietu + etykieta demona.
# Wspólna dla instalacji (f2_install.yml) i major upgrade'u węzła
# (cluster_upgrade_node.yml): nowy pakiet niesie nowe źródło polityki, a
# moduł aktywny zostaje stary, dopóki ktoś go nie przebuduje. Zmierzone
# 2026-10-20 na cassiopeiav18-r9: po upgrade 11.4.13 -> 12.3.3 pierwszy
# converge ładował moduł na 3/3 węzłach — węzły pracowały na polityce
# starszego pakietu.
#
# Oficjalny pakiet MariaDB dostarcza źródło polityki Galera, ale nie ładuje
# skompilowanego modułu. Bez niego SST mariabackup jest blokowany m.in. na setpgid.

- name: "SELinux - odczytaj stan, gdy play nie zebrał faktów"
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", "selinux"]
  when: ansible_facts.selinux is not defined

- name: "SELinux - polityka MariaDB Galera"
  when: ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'
  block:
    - name: "SELinux - przygotuj katalog budowy polityki MariaDB Galera"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /var/cache/isa-selinux
        - /var/cache/isa-selinux/active

    - name: "SELinux - skompiluj pakietową politykę MariaDB Galera"
      ansible.builtin.command:
        argv:
          - /usr/bin/checkmodule
          - -M
          - -m
          - -o
          - /var/cache/isa-selinux/mariadb-server.mod
          - /usr/share/mariadb/policy/selinux/mariadb-server.te
      changed_when: false

    - name: "SELinux - zbuduj moduł MariaDB Galera"
      ansible.builtin.command:
        argv:
          - /usr/bin/semodule_package
          - -o
          - /var/cache/isa-selinux/mariadb-server.pp
          - -m
          - /var/cache/isa-selinux/mariadb-server.mod
      changed_when: false

    - name: "SELinux - usuń poprzednią kopię aktywnego modułu"
      ansible.builtin.file:
        path: /var/cache/isa-selinux/active/mariadb-server.pp
        state: absent
      changed_when: false

    - name: "SELinux - pobierz aktywny moduł MariaDB Galera"
      ansible.builtin.command:
        argv:
          - /usr/sbin/semodule
          - -X
          - "400"
          - -E
          - mariadb-server
      args:
        chdir: /var/cache/isa-selinux/active
      changed_when: false
      failed_when: false

    - name: "SELinux - oblicz checksumę zbudowanego modułu"
      ansible.builtin.stat:
        path: /var/cache/isa-selinux/mariadb-server.pp
        checksum_algorithm: sha256
      register: mariadb_galera_policy_candidate

    - name: "SELinux - oblicz checksumę aktywnego modułu"
      ansible.builtin.stat:
        path: /var/cache/isa-selinux/active/mariadb-server.pp
        checksum_algorithm: sha256
      register: mariadb_galera_policy_active

    - name: "SELinux - załaduj politykę MariaDB Galera gdy zmieniona"
      ansible.builtin.command:
        argv:
          - /usr/sbin/semodule
          - -X
          - "400"
          - -i
          - /var/cache/isa-selinux/mariadb-server.pp
      # Laduje modul polityki SELinux — mutacja stanu hosta; zadanie jest
      # juz ograniczone warunkiem checksumy modulu (nie poleci bez zmiany).
      changed_when: true
      when: >-
        not mariadb_galera_policy_active.stat.exists or
        mariadb_galera_policy_candidate.stat.checksum !=
        (mariadb_galera_policy_active.stat.checksum | default(''))

    # Pakiety MariaDB.org instaluja demona jako /usr/sbin/mariadbd, a polityka
    # dystrybucji zna wylacznie sciezke Rocky (/usr/libexec/mariadbd). Bez tej
    # etykiety plik zostaje `bin_t`, systemd startuje baze w domenie `initrc_t`
    # i SELinux BLOKUJE dawce SST: `mariadb-backup` (poprawnie `mysqld_t`) nie ma
    # prawa `connectto` gniazda `initrc_t`. Zmierzone na swiezej budowie:
    # "Failed to connect to MariaDB server: ... (13 Permission denied)" i AVC
    # denied { connectto } ... tclass=unix_stream_socket. Pakietowy plik .fc
    # etykietuje mariabackup i skrypty wsrep, ale demona juz nie. Regula celuje
    # w /usr/bin/mariadbd, bo przy usrmerge SELinux ma rownowaznosc
    # `/usr/sbin -> /usr/bin` i odrzuca spec na /usr/sbin (ten sam plik).
    - name: "SELinux - etykieta mysqld_exec_t dla demona z pakietu MariaDB.org"
      community.general.sefcontext:
        target: "/usr/bin/mariadbd"
        setype: mysqld_exec_t
        state: present
      register: mariadb_daemon_fcontext

    - name: "SELinux - przywroc kontekst demona po zmianie etykiety"
      ansible.builtin.command:
        argv: [restorecon, -Fv, /usr/sbin/mariadbd]
      register: mariadb_daemon_restorecon
      changed_when: mariadb_daemon_restorecon.stdout | length > 0
