---
# Uslugi wspierajace FLOTE na hoscie infra warstwy wspolnej (fcinfra):
# PMM serwuje monitoring wszystkim najemcom, MinIO backupy, Maildev alerty.
# Zakres: Docker CE + PMM Server + MinIO + Maildev. Bez Samby.
# Odpalane wyłącznie z definicji platformy (`make platform-infra`,
# `-e @platform.yml`). Host infra należy do warstwy współdzielonej;
# playbook nie czyta żadnej zmiennej z konfiguracji najemcy.

- name: "Infra — wymagaj ownership warstwy wspólnej"
  hosts: infra
  vars_files:
    - vars/secret_policy.yml
  become: false
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Wymagaj konfiguracji platformy przed mutacją hosta"
      ansible.builtin.assert:
        that:
          - platform is defined
          - platform is mapping
          - cluster is not defined
          - versions is defined
          - versions is mapping
        fail_msg: >-
          infra_services.yml przyjmuje wyłącznie konfigurację platformy.
          Użyj kanonicznego celu platform-infra.

- name: "Infra — wymuś dokładną politykę host firewall przed uruchomieniem usług"
  ansible.builtin.import_playbook: firewall.yml
  vars:
    firewall_target_hosts: infra

- name: "Infra — uslugi warstwy wspolnej zadeklarowane przez platforme"
  hosts: infra
  become: true
  gather_facts: true
  serial: 1
  max_fail_percentage: 0
  vars:
    # Sklad uslug jest DEKLARACJA platformy. Domyslnie pelny zestaw, bo tak
    # dzialaly wszystkie istniejace platformy — ale monitoring, magazyn kopii i
    # relay maja rozne cykle zycia i musza dac sie stawiac osobno. Zroslo sie to
    # w jeden zestaw i przebudowa PMM zabierala ze soba magazyn kopii floty.
    infra_services: "{{ platform.infra.services | default(['pmm', 'minio', 'maildev']) }}"
    pmm_admin_password: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_PASSWORD') }}"
    minio_root_user: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') }}"
    minio_root_password: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') }}"
    infra_compose_dir: /etc/isa-infra
    infra_compose_file: /etc/isa-infra/compose.yml
    infra_pmm_data_volume: isa-pmm-data
    infra_pmm_desired_image: "{{ lock.pmm.image }}@{{ lock.pmm.image_digest }}"
    infra_pmm_backup_volume: "isa-pmm-data-backup-{{ ansible_date_time.epoch }}-{{ lock.pmm.version }}"
    infra_firewall_rules: >-
      {{
        (
          network.administration_cidrs
          | product(['80', '443', '9001', '8025'])
          | list
        )
        +
        (
          network.database_cluster_cidrs
          | product(['443', '9000'])
          | list
        )
        +
        (network.monitoring_cidrs | product(['443']) | list)
      }}
    infra_published_ports: >-
      {{ (['pmm'] | intersect(infra_services) | ternary([80, 443], []))
         + (['minio'] | intersect(infra_services) | ternary([9000, 9001], []))
         + (['maildev'] | intersect(infra_services) | ternary([8025], [])) }}

  pre_tasks:
    - name: "Załaduj lockfile wersji"
      ansible.builtin.include_vars:
        file: "../{{ versions.lock_file | default('versions/versions.lock.yml') }}"
        name: lock

    - name: "Wymagaj kompletnej konfiguracji infra"
      ansible.builtin.assert:
        that:
          - platform.environment != 'production'
          - groups['infra'] | length == 1
          - ansible_facts.architecture == 'x86_64'
          - lock.docker.engine_version | length > 0
          - "'pmm' not in infra_services or lock.pmm.image_digest is match('^sha256:[0-9a-f]{64}$')"
          - "'minio' not in infra_services or lock.minio.image_digest is match('^sha256:[0-9a-f]{64}$')"
          - monitoring.pmm.backup_retention | int >= 1
          - monitoring.pmm.backup_retention | int <= 5
        fail_msg: >-
          Infra wymaga jednego hosta x86_64, środowiska nieprodukcyjnego,
          poprawnych lockfile'ów i retencji backupów PMM 1..5.

    - name: "Wymagaj sekretow zadeklarowanych uslug"
      ansible.builtin.assert:
        that:
          - "'pmm' not in infra_services or pmm_admin_password | length >= (isa_min_secret_length | default(12))"
          - "'minio' not in infra_services or minio_root_user | length >= 3"
          - "'minio' not in infra_services or minio_root_password | length >= (isa_min_secret_length | default(12))"
        fail_msg: >-
          Ustaw sekrety uslug zadeklarowanych w platform.infra.services:
          PMM_ADMIN_PASSWORD dla pmm, MINIO_ROOT_USER i MINIO_ROOT_PASSWORD dla minio.
      no_log: true

  tasks:
    - name: "Zainstaluj zależności repozytorium Docker"
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present


    - name: "Skonfiguruj oficjalne repozytorium Docker CE"
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: "{{ lock.docker.repo_baseurl }}"
        enabled: true
        gpgcheck: true
        gpgkey: "{{ lock.docker.repo_gpgkey }}"
        module_hotfixes: true

    - name: "Zainstaluj przypięty Docker Engine i Compose"
      ansible.builtin.dnf:
        name:
          - "docker-ce-{{ lock.docker.engine_version }}"
          - "docker-ce-cli-{{ lock.docker.cli_version }}"
          - "containerd.io-{{ lock.docker.containerd_version }}"
          - "docker-buildx-plugin-{{ lock.docker.buildx_version }}"
          - "docker-compose-plugin-{{ lock.docker.compose_version }}"
        state: present


    # Filtr ingress Dockera (DOCKER-USER + ISA-INFRA) opiera sie na module xt_conntrack.
    # Po instalacji pakietow dnf potrafi wciagnac NOWSZY kernel; dopoki host go nie zaladuje,
    # /lib/modules zawiera moduly TYLKO dla nowego kernela, a modprobe dla dzialajacego
    # zwraca "Module not found" -> iptables failuje na kazdym matchu -> filtr nie powstaje,
    # a Docker (Requires=isa-docker-firewall) nie startuje. Nie obchodzimy tego cicho:
    # brak dzialajacego filtra to luka (strefa 'docker' ma target=ACCEPT i omija rich rules).
    - name: "Wykryj kernel zainstalowany, ale niezaladowany"
      ansible.builtin.shell: |
        set -o pipefail
        running=$(uname -r)
        newest=$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | sort -V | tail -1)
        [ "$running" = "$newest" ] && echo MATCH || echo "STALE running=$running newest=$newest"
      args:
        executable: /bin/bash
      register: infra_kernel_state
      changed_when: false

    - name: "Wymagaj restartu do zainstalowanego kernela (albo -e allow_kernel_reboot=yes)"
      ansible.builtin.assert:
        that:
          - infra_kernel_state.stdout is search('MATCH')
        fail_msg: >-
          {{ infra_kernel_state.stdout }} — host dziala na starszym kernelu niz zainstalowany,
          wiec brakuje modulow xtables i filtr ingress Dockera nie powstanie.
          Zrestartuj hosta albo uruchom z -e allow_kernel_reboot=yes.
      when: not (allow_kernel_reboot | default(false) | bool)

    - name: "Restart do zainstalowanego kernela (gdy operator na to pozwolil)"
      ansible.builtin.reboot:
        reboot_timeout: 600
      when:
        - allow_kernel_reboot | default(false) | bool
        - infra_kernel_state.stdout is not search('MATCH')
    - name: "Wdróż filtr DOCKER-USER dla opublikowanych portów"
      ansible.builtin.template:
        src: ../roles/infra_services/templates/docker-user-firewall.sh.j2
        dest: /usr/local/sbin/isa-docker-firewall
        owner: root
        group: root
        mode: "0750"
      register: infra_docker_firewall_script

    - name: "Wdróż unit trwałości filtra Docker"
      ansible.builtin.template:
        src: ../roles/infra_services/templates/isa-docker-firewall.service.j2
        dest: /etc/systemd/system/isa-docker-firewall.service
        owner: root
        group: root
        mode: "0644"
      register: infra_docker_firewall_unit
    - name: "Utwórz katalog drop-in docker.service"
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Wymagaj filtra ingress przed startem Docker"
      ansible.builtin.copy:
        content: |
          [Unit]
          Requires=isa-docker-firewall.service
          After=isa-docker-firewall.service
        dest: /etc/systemd/system/docker.service.d/isa-firewall.conf
        owner: root
        group: root
        mode: "0644"

    - name: "Włącz filtr portów publikowanych przez Docker"
      ansible.builtin.systemd:
        name: isa-docker-firewall.service
        daemon_reload: true
        enabled: true
        state: "{{ 'restarted' if infra_docker_firewall_script.changed or infra_docker_firewall_unit.changed else 'started' }}"


    - name: "Docker - wlacz ip_forward (Rocky 10 domyslnie 0; wymagane przez bridge network)"
      ansible.builtin.copy:
        content: "net.ipv4.ip_forward = 1"
        dest: /etc/sysctl.d/98-docker-ipforward.conf
        owner: root
        group: root
        mode: "0644"
      # Handler zamiast zadania z `when: ...changed` — flush_handlers ponizej trzyma
      # restart w tym SAMYM miejscu play (przed `docker compose up`), a deduplikacja
      # handlerow daje jeden restart nawet przy wielu powiadomieniach.
      notify: Restart Docker po zmianie sysctl ip_forward

    - name: "Docker - zastosuj sysctl ip_forward"
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: false

    - name: "Włącz Docker dopiero po aktywacji filtra ingress"
      ansible.builtin.systemd:
        name: docker
        daemon_reload: true
        enabled: true
        state: started

    - name: "Restart Docker jesli sysctl ip_forward sie zmienil"
      # Wypycha handler DOPIERO TUTAJ: w tym miejscu play robi to samo, co dawne
      # zadanie restartu. Bez flush handler wystapilby dopiero na koncu play,
      # czyli po `docker compose up` — zrestartowany daemon zdjalby kontenery.
      ansible.builtin.meta: flush_handlers
    - name: "PMM — zabezpiecz zmianę obrazu"
      ansible.builtin.include_tasks: tasks/infra_pmm_upgrade.yml
      when: "'pmm' in infra_services"


    - name: "Utwórz prywatny katalog konfiguracji infra"
      ansible.builtin.file:
        path: "{{ infra_compose_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: "Wdróż konfigurację Compose bez sekretów w argv"
      ansible.builtin.template:
        src: ../roles/infra_services/templates/compose.yml.j2
        dest: "{{ infra_compose_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: "Uruchom usługi infra"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ infra_compose_file }}"
          - up
          - --detach
          - --remove-orphans
          - --pull
          - always
      register: infra_compose_up
      changed_when: >-
        'Created' in (infra_compose_up.stdout ~ infra_compose_up.stderr)
        or 'Recreated' in (infra_compose_up.stdout ~ infra_compose_up.stderr)
        or 'Started' in (infra_compose_up.stdout ~ infra_compose_up.stderr)

    - name: "Czekaj na porty zadeklarowanych usług"
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ item }}"
        timeout: 180
      loop: "{{ infra_published_ports }}"

    - name: "Sprawdź gotowość PMM"
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}/"
        method: GET
        validate_certs: false
        status_code: 200
      register: pmm_readiness
      until: pmm_readiness.status == 200
      retries: 60
      delay: 5
      when: "'pmm' in infra_services"

    - name: "Sprawdź gotowość MinIO"
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9000/minio/health/live"
        method: GET
        status_code: 200
      register: minio_readiness
      until: minio_readiness.status == 200
      retries: 30
      delay: 2
      when: "'minio' in infra_services"

    - name: "Sprawdź gotowość Maildev"
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8025/"
        method: GET
        status_code: 200
      register: maildev_readiness
      until: maildev_readiness.status == 200
      retries: 30
      delay: 2
      when: "'maildev' in infra_services"

    - name: "Pobierz listę uruchomionych usług Compose"
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ infra_compose_file }}"
          - ps
          - --status
          - running
          - --services
      register: infra_running_services
      changed_when: false

    - name: "Potwierdź komplet zadeklarowanych usług"
      ansible.builtin.assert:
        that:
          - infra_running_services.stdout_lines | sort == expected_infra_containers
        fail_msg: >-
          Dziala {{ infra_running_services.stdout_lines }},
          a platforma deklaruje {{ expected_infra_containers }}.
        success_msg: "Uslugi {{ expected_infra_containers | join(', ') }} dzialaja na {{ inventory_hostname }}."
      vars:
        # Nazwa uslugi w compose rozni sie od nazwy w deklaracji tylko dla PMM.
        expected_infra_containers: >-
          {{ infra_services | map('regex_replace', '^pmm$', 'pmm-server') | sort | list }}


    # Na trwałym volume docelowe haslo moze byc juz ustawione — wtedy pierwszy
    # test wystarcza. Fallback ponizej obsluguje WYLACZNIE pierwszy bootstrap
    # z admin/admin; inne stare haslo wymaga jawnej rotacji przez operatora.
    - name: "PMM — sprawdz czy haslo admina z compose dziala (uri, bez wycieku w argv)"
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:443/graph/api/user"
        user: "{{ pmm_admin_user | default('admin') }}"
        password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code:
          - 200
          - 401
      register: pmm_admin_auth
      when: "'pmm' in infra_services"
      no_log: true

    - name: "PMM — zmien domyslne haslo admina przez Grafana User API (uri, bez wycieku w argv)"
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:443/graph/api/user/password"
        method: PUT
        user: "{{ pmm_admin_user | default('admin') }}"
        password: "{{ pmm_default_bootstrap_password | default('admin') }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          oldPassword: "{{ pmm_default_bootstrap_password | default('admin') }}"
          newPassword: "{{ pmm_admin_password }}"
          confirmNew: "{{ pmm_admin_password }}"
        status_code:
          - 200
      when:
        - "'pmm' in infra_services"
        - pmm_admin_auth.status | default(0) == 401
      no_log: true
    - name: "PMM — zastosuj retencję zweryfikowanych backupów"
      ansible.builtin.include_tasks: tasks/infra_pmm_backup_retention.yml
      when: "'pmm' in infra_services"

  handlers:
    - name: "Restart Docker po zmianie sysctl ip_forward"
      ansible.builtin.systemd:
        name: docker
        state: restarted
