---
# F15 — Reguły alertów ISC-47 (quorum/writer/node loss + freshness).
#
# Reguły, email contact point i notification policy są zarządzane przez Ansible.
# Weryfikacja delivery: kontrolowany alert musi trafić do skonfigurowanego SMTP.
#
# ISC-47: Alert powstaje po utracie quorum, utracie writera lub utracie węzła.
# - node loss / writer loss: wsrep_cluster_size < expected (writer jest węzłem)
# - quorum loss: wsrep_cluster_status != 1 (Primary)
# - node not Synced: wsrep_local_state != 4
# - backup stale: ostatni backup przekracza jawny freshness SLA
#
# Delivery: email przez SMTP; laboratorium używa Maildev.

- name: "F15 — reguły alertów ISC-47 w PMM/Grafana"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/secret_policy.yml
    - vars/proxysql_hostgroups.yml
  vars:
    ansible_become: false
    pmm_api_url: "{{ lookup('ansible.builtin.env', 'PMM_SERVER_URL') | default(monitoring.pmm.server_url, true) | regex_replace('/$', '') }}"
    pmm_admin_user: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_USER') | default('admin', true) }}"
    pmm_admin_password: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_PASSWORD') }}"
    pmm_validate_certs: "{{ monitoring.get('pmm', {}).get('validate_certs', true) | bool }}"
    cluster_label: "{{ monitoring.pmm.cluster_name }}"
    folder_uid: "{{ (monitoring.alerts | default({})).folder_uid | default('isa-alerts-' ~ cluster_label) }}"
    ds_uid: "{{ (monitoring.alerts | default({})).datasource_uid | default('') }}"
    backup_freshness_sla_hours: "{{ backup.freshness_sla_hours }}"
    f15_email: "{{ (monitoring.alerts | default({})).email | default('') }}"
    f15_folder_title: "ISA Alerts ({{ cluster_label }})"
    f15_contact_uid: "email-isa-{{ cluster_label }}"
    f15_contact_name: "ISA Email Alerts ({{ cluster_label }})"

    # audit#9: reguły MUSZĄ zawsze zwracać wartość (operator `bool` + `or vector(...)`).
    # Wyrażenie filtrujące (np. `size < 3`) zwraca PUSTY wektor gdy jest zdrowo — Grafana
    # interpretuje to jako NoData, więc noDataState=Alerting zapalałoby alarm na zdrowym
    # klastrze (zweryfikowane na claude-pve: "Alerting (NoData)" przy 3/3 Synced).
    # Konstrukcja poniżej: zdrowo => 0 (Normal), awaria => 1 (Alerting),
    # BRAK metryk => `or vector(...)` daje wartość awaryjną => 1 (wykrywa utratę monitoringu).
    # noDataState=Alerting zostaje jako ostatnia linia obrony (padnięta datasource).
    # audit#14: UID-y/folder/contact point namespacowane cluster_name.
    # restore-drill-stale i backup-metrics-frozen mierzą ŚWIEŻOŚĆ metryk, nie ich brak:
    # `or vector(0)` NIE widzi .prom, które node_exporter podaje bez zmian (zamrożony
    # plik textfile po padniętym runnerze/kolektorze), więc mtime/last_success
    # porównujemy z time() jawnie — to jedyny sygnał tego trybu awarii.
    # Wlasciciela regul rozstrzyga DEFINICJA, nie flaga konfiguracyjna: blok
    # `galera` oznacza klaster (najemce), jego brak — definicje platformy.
    # Klaster wdraza wylacznie reguly klastrowe, platforma wylacznie
    # `isa-shared-*`. Wczesniej rozwidlenie robila flaga roli w cluster.yml i to
    # wlasnie ona czynila reguly warstwy wspolnej wlasnoscia jednego klastra.
    # Dwie osobne listy, a nie znaczniki na wspolnej liscie: reguly klastrowe
    # czytaja `{{ galera.* }}` i `{{ backup.* }}`, ktorych definicja platformy
    # nie ma, a Jinja evaluuje wylacznie brana galez wyrazenia warunkowego —
    # wiec przy definicji platformy szablony klastrowe nie sa nawet dotykane.
    # Filtr na wspolnej liscie tez by przeszedl (Ansible odklada render
    # zagniezdzonych szablonow do uzycia wartosci), ale zostawialby martwe
    # reguly klastrowe o jeden `map(attribute='expr')` od wywalenia przebiegu
    # platformy — granice wlasciciela pilnujemy struktura, nie konwencja.
    # Reguly oznaczone `requires_tls` powstaja tylko przy tls.mode=full: przy
    # wylaczonym TLS f11_freshness publikuje isa_tls_cert_expiry_unixtime=0, wiec
    # regula liczaca "ile zostalo do wygasniecia" widzialaby cert przeterminowany
    # o pol wieku i palila sie wiecznie na klastrze, ktory certu nie ma.
    # `requires_backup` dziala jak `requires_tls`: regula o swiezosci kopii na
    # klastrze BEZ backupu nie ma czego mierzyc i pali sie wiecznie, zamieniajac
    # alerting w szum, ktory operator wycisza — a wtedy nie zadziala takze wtedy,
    # gdy naprawde bedzie mial racje.
    f15_effective_rules: >-
      {{ f15_shared_rules
         if galera is not defined
         else ((f15_cluster_rules
                | rejectattr('requires_tls', 'defined')
                | rejectattr('requires_backup', 'defined') | list)
               + (f15_cluster_rules | selectattr('requires_tls', 'defined') | list
                  if ((tls | default({})).mode | default('disabled')) == 'full' else [])
               + (f15_cluster_rules | selectattr('requires_backup', 'defined') | list
                  if (backup | default({})).enabled | default(false) else [])) }}
    f15_cluster_rules:
      - uid: "isa-{{ cluster_label }}-node-loss"
        title: "Galera node loss (cluster size < expected)"
        expr: "(min(mysql_global_status_wsrep_cluster_size{cluster=\"{{ cluster_label }}\"}) or vector(0)) < bool {{ galera.nodes_expected }}"
        summary: "Galera cluster size dropped below {{ galera.nodes_expected }} (node/writer lost) or metrics missing"
        severity: "critical"
        noDataState: "Alerting"
      - uid: "isa-{{ cluster_label }}-node-silent"
        title: "Galera node registered in PMM but reporting no metrics"
        # Uzupelnia `node-loss`, ktory czyta WLASNY widok Galery: gdy wezel
        # oslepnie monitoringowo, pozostale nadal raportuja pelny
        # `wsrep_cluster_size`, wiec `min` sie nie zmienia i alert nie strzela.
        # Zmierzone 2026-08-21 na n16g3: pmm-agent `active`+`enabled`, ale
        # `Connected:false` i zero eksporterow przez ~16 minut. Tutaj liczymy
        # wezly, ktore REALNIE oddaly probke.
        expr: "(count(count by (node_name) (node_boot_time_seconds{cluster=\"{{ cluster_label }}\"})) or vector(0)) < bool {{ galera.nodes_expected }}"
        summary: >-
          Mniej niz {{ galera.nodes_expected }} wezlow Galery oddaje metryki do PMM.
          Baza moze byc zdrowa, a wezel niewidoczny dla monitoringu — sprawdz `pmm-admin status`.
        severity: "critical"
        noDataState: "Alerting"
      - uid: "isa-{{ cluster_label }}-quorum-loss"
        title: "Galera quorum loss (not Primary)"
        expr: "(max(mysql_global_status_wsrep_cluster_status{cluster=\"{{ cluster_label }}\"}) or vector(0)) != bool 1"
        summary: "Galera left Primary Component (quorum at risk) or metrics missing"
        severity: "critical"
        noDataState: "Alerting"
      - uid: "isa-{{ cluster_label }}-not-synced"
        title: "Galera node not Synced"
        expr: "(min(mysql_global_status_wsrep_local_state{cluster=\"{{ cluster_label }}\"}) or vector(4)) != bool 4"
        summary: "Galera node not in Synced (local_state != 4)"
        severity: "warning"
        noDataState: "OK"
      # Metryka ZWERYFIKOWANA na claude-pve: proxysql_mysql_servers_status NIE ISTNIEJE w PMM 3.
      # Właściwa: proxysql_connpool_conns_status (cluster, hostgroup, endpoint, service_name;
      # 1=ONLINE, 2=SHUNNED, 4=OFFLINE_HARD). Zdrowo: >=1 seria ONLINE w writer hostgroup.
      # Nazwa metryki pochodzi z Perconowego proxysql_exportera (pmm-client).
      # Poprzednio bylo `proxysql_connpool_conns_status` z restapi ProxySQL —
      # po migracji na pmm-client ten namespace ma ZERO serii, wiec regula
      # znow palila sie falszywie. Semantyka wartosci jest ta sama (zweryfikowane
      # wobec stats_mysql_connection_pool: 1=ONLINE, 2=SHUNNED).
      #
      # BRAK FILTRA `cluster` JEST CELOWY — nie przywracaj go.
      # Para ProxySQL jest WSPOLNA dla floty i rejestruje ja w PMM wylacznie owner,
      # wiec KAZDA seria proxysql_* nosi etykiete cluster= ownera, takze te opisujace
      # hostgroupy konsumenta. Filtr cluster="<konsument>" nie trafial w nic, `or vector(0)`
      # dawal 0 i regula palila sie na stale jako critical, mimo dzialajacego writera.
      # Wlasciwym dyskryminatorem najemcy jest hostgroup: ID sa globalnie rozlaczne na
      # wspolnej parze, co wymusza tests/validation/probe-proxysql-tenancy.py.
      - uid: "isa-{{ cluster_label }}-backends-offline"
        title: "ProxySQL moved Galera backends to the offline hostgroup"
        # ZASTAPILA regule `no-writer`, ktora NIE MOGLA ZADZIALAC.
        #
        # Tamta brzmiala `count(...{hostgroup=<writer>} == 1) < 1`, czyli
        # "hostgroup writera jest pusty". Zmierzone 2026-08-21 na newclaude16-r9:
        # nie udalo sie jej zapalic w ZADNYM z trzech scenariuszy —
        #   1. jeden wezel poza kworum (partycja 4567): wypada do offline_hg,
        #      pozostale przejmuja role,
        #   2. CALKOWITA utrata kworum (wszystkie trzy non-Primary,
        #      primary_partition=NO, wsrep_local_state=0),
        #   3. wszystkie backendy nieosiagalne dla monitora (martwy port).
        # Za kazdym razem ProxySQL zostawial JEDEN wezel ONLINE w hostgroupie
        # writera. To polityka "last man standing": ProxySQL nie oprozni tej
        # hostgrupy do zera. Dokumentacja produktu tego nie opisuje — kryteria
        # sa wylacznie w schematach blokowych (obrazki na stronie Galera
        # Configuration), wiec zachowanie jest ZMIERZONE, nie zacytowane.
        # Efekt: 151 probek w oknie obu awarii, zero zapalen.
        #
        # Ta wersja mierzy DECYZJE ROUTINGOWA samego ProxySQL, ktora realnie sie
        # zmienia: 0 wezlow w offline_hostgroup przy zdrowym klastrze, N przy
        # awarii (zmierzone: 0 -> 1 -> 2 -> 4). Utrate kworum po stronie Galery
        # pokrywaja osobno `quorum-loss` i `not-synced` — obie zapalily sie
        # w tym samym oknie, wiec operator nie byl slepy; slepy byl ten alert.
        expr: "(count(proxysql_connection_pool_status{hostgroup=\"{{ galera_offline_hg }}\"}) or vector(0)) > bool 0"
        summary: >-
          ProxySQL przeniosl backendy klastra do offline hostgroup {{ galera_offline_hg }} —
          ruch nie jest do nich kierowany. Sprawdz Primary Component i stan wezlow Galery.
        severity: "critical"
        noDataState: "Alerting"

      - uid: "isa-{{ cluster_label }}-backup-failed"
        requires_backup: true
        title: "Backup run failed"
        expr: "(min(galera_backup_last_run_success{cluster=\"{{ cluster_label }}\"}) or vector(0)) != bool 1"
        summary: "Last Galera backup run failed or metrics missing for cluster {{ cluster_label }}"
        severity: "critical"
        noDataState: "Alerting"
        pending_for: "0s"
      - uid: "isa-{{ cluster_label }}-backup-stale"
        requires_backup: true
        title: "Backup freshness stale"
        expr: "(time() - (max(galera_backup_last_success_unixtime{cluster=\"{{ cluster_label }}\"}) or vector(0))) > bool ({{ backup_freshness_sla_hours }} * 3600)"
        summary: "Last successful backup older than {{ backup_freshness_sla_hours }} hours (or freshness metric missing)"
        severity: "critical"
        noDataState: "Alerting"
      # Swiezosc drillu ma DWIE zrodla prawdy, bo sa dwie sciezki uruchomienia:
      #   * `isa_restore_test_last_success_unixtime` — publikuje f11_freshness na
      #     galera[0] (sciezka Ansible: `make cluster-restore-drill`),
      #   * `galera_restore_last_success_unixtime` — publikuje SAM runner na hoscie
      #     restore (sciezka cron: /etc/cron.d/galera-restore-<cluster>).
      # Regula bierze `max` z obu. Wczesniej czytala wylacznie pierwsza, wiec
      # mierzyla "kiedy ostatnio puszczono Ansible", a nie "kiedy udal sie drill".
      - uid: "isa-{{ cluster_label }}-restore-drill-stale"
        requires_backup: true
        title: "Restore drill stale (no successful drill in 8 days)"
        expr: "(time() - max((max(isa_restore_test_last_success_unixtime{cluster=\"{{ cluster_label }}\"}) or vector(0)) or (max(galera_restore_last_success_unixtime{cluster=\"{{ cluster_label }}\"}) or vector(0)))) > bool (8 * 24 * 3600)"
        summary: "Last successful restore drill older than 8 days (schedule: {{ backup.restore_test_schedule }}) or drill metric missing"
        severity: "critical"
        noDataState: "Alerting"
      - uid: "isa-{{ cluster_label }}-backup-metrics-frozen"
        requires_backup: true
        title: "Backup metrics file frozen (node_exporter serves stale .prom)"
        # PromQL kotwiczy `=~` z OBU stron, a etykieta `file` niesie pelna sciezke
        # (/var/lib/node_exporter/textfile_collector/...), wiec bez wiodacego `.*`
        # regex nie trafia w nic i regula alarmuje bez przerwy (zweryfikowane na PMM).
        expr: "(time() - (max(node_textfile_mtime_seconds{file=~\".*galera_backup-.*[.]prom\"}) or vector(0))) > bool ({{ backup_freshness_sla_hours }} * 3600)"
        summary: "galera_backup textfile mtime older than {{ backup_freshness_sla_hours }} hours — runner stopped rewriting metrics"
        severity: "critical"
        noDataState: "Alerting"

      # Metryka isa_tls_cert_expiry_unixtime byla publikowana przez f11_freshness
      # od dawna i NIKT jej nie pilnowal — klasyczny martwy sygnal: koszt zbierania
      # ponoszony, wartosc zerowa. Wygasly certyfikat Galery to natychmiastowe
      # zerwanie replikacji, awaria bez ostrzezenia i bez zwiazku z obciazeniem.
      #
      # Prog 30 dni jest CELOWO ten sam co TLS_CERT_MIN_DAYS w probe-hardening.py:
      # jedna liczba do uzasadnienia zamiast dwoch, ktore z czasem sie rozjada.
      #
      # `requires_tls` — regula nie powstaje przy tls.mode != full. Przy wylaczonym
      # TLS f11_freshness publikuje 0, a 0 - time() jest gleboko ujemne, wiec regula
      # palilaby sie wiecznie na klastrze, ktory certu w ogole nie ma.
      - uid: "isa-{{ cluster_label }}-tls-cert-expiring"
        requires_tls: true
        title: "TLS certificate expiring (Galera nodes)"
        expr: "((max(isa_tls_cert_expiry_unixtime{cluster=\"{{ cluster_label }}\"}) or vector(0)) - time()) < bool (30 * 24 * 3600)"
        summary: >-
          Certyfikat TLS wezlow Galery wygasa w ciagu 30 dni albo metryka zniknela.
          Rotacja bez przestoju: `make cluster-tls-rotate CLUSTER={{ cluster.name }}`.
        severity: "critical"
        noDataState: "Alerting"

    f15_shared_rules:
      # === Alert WARSTWY WSPOLNEJ — patrz komentarz przy samej regule ===
      #
      # Luka znaleziona przy testach failoveru endpointu: gdy pada JEDEN wezel
      # ProxySQL, keepalived przenosi VIP i aplikacja dziala dalej — wiec zadna
      # istniejaca regula nie zapala sie NIGDY. Para po cichu degraduje sie do
      # jednego proxy i zostaje tak do momentu, az padnie drugi. Wtedy nie ma juz
      # dokad przeniesc VIP-a i awaria jest natychmiastowa i pelna.
      #
      # Liczymy ZDROWE instancje, a nie `min(proxysql_up) != 1`. Przy utracie
      # calej maszyny eksporter znika razem z nia i seria PRZESTAJE ISTNIEC —
      # `min()` po pozostalych daje wtedy 1, czyli "zdrowo". Zliczanie wylapuje
      # oba tryby: wygaszony proces (proxysql_up=0) i zniknieta maszyne.
      # Zmierzone na fcp1/fcp2: `proxysql_up` ma etykiete node_name per wezel.
      - uid: "isa-shared-proxysql-down"
        # UID bez etykiety klastra jest zamierzony: regula NIE NALEZY do zadnego
        # klastra, tylko do warstwy wspolnej — tworzy ja i kasuje wylacznie
        # platforma (make platform-alerts), a derejestracja najemcy omija ja
        # wzorcem `^isa-<cluster_label>-`. Gdyby wzial ja najemca, jedno
        # padniecie fcp1 wyslaloby N identycznych maili, a UID trzyma tylko
        # jedna kopie — ostatnio uruchomiony klaster cicho nadpisywalby regule
        # pozostalym.
        title: "ProxySQL instance down (shared endpoint pair degraded)"
        expr: "(count(proxysql_up == 1) or vector(0)) < bool {{ proxysql.nodes_expected }}"
        summary: >-
          Zdrowych instancji ProxySQL mniej niz {{ proxysql.nodes_expected }} —
          endpoint dziala, ale stracil redundancje. Kolejna awaria zdejmie VIP bez zapasu.
        severity: "critical"
        noDataState: "Alerting"

      - uid: "isa-shared-node-silent"
        title: "Node registered in PMM but reporting no metrics"
        # Wykrywa DOKLADNIE stan zmierzony 2026-08-21 na n16g3 po twardej utracie
        # maszyny: `systemctl is-active pmm-agent` = active, `is-enabled` = enabled,
        # a `pmm-admin status` = Connected:false i ZERO eksporterow. Wezel milczal
        # ~16 minut, monitoring go nie widzial, a zaden istniejacy alert nie mogl
        # tego zlapac: `node-loss` czyta `wsrep_cluster_size`, czyli WLASNY widok
        # Galery — pozostale wezly nadal raportowaly size=3, wiec `min` = 3.
        #
        # Tu liczymy wezly, ktore REALNIE oddaly probke, a nie to, co mowi o sobie
        # klaster. Zmierzona latencja wykrycia to ~5 min (staleness magazynu
        # metryk), wiec `for` trzymamy krotkie — inaczej okno slepoty rosnie.
        expr: "(count(count by (node_name) (node_boot_time_seconds{cluster=\"{{ cluster_label }}\"})) or vector(0)) < bool {{ proxysql.nodes_expected }}"
        summary: >-
          Mniej niz {{ proxysql.nodes_expected }} wezlow warstwy wspolnej oddaje metryki.
          Wezel moze byc zarejestrowany i miec dzialajaca usluge pmm-agent, a mimo to nie raportowac.
        severity: "critical"
        noDataState: "Alerting"

  pre_tasks:
    - name: "Wymagaj PMM_ADMIN_PASSWORD i adresu alertów"
      ansible.builtin.assert:
        that:
          - pmm_admin_password | length >= (isa_min_secret_length | default(12))
          - f15_email | length > 3
          - "'@' in f15_email"
        fail_msg: "Ustaw PMM_ADMIN_PASSWORD poza repozytorium i monitoring.alerts.email w definicji (cluster.yml albo platform.yml)."

  tasks:
    # === Zapewnij folder ISA Alerts ===
    - name: "Pobierz foldery alertów"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/folders"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_folders
      no_log: true

    - name: "Utwórz folder ISA Alerts (jeśli brak wg tytułu; jawny uid = deterministyczny)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/folders"
        method: POST
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        # Bez force_basic_auth Ansible czeka na challenge 401, ktorego Grafana API nie wysyla
        # -> auth nigdy nie dochodzi. body_format json: bez tego leci form-encoded (400).
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body: {uid: "{{ folder_uid }}", title: "{{ f15_folder_title }}"}
        status_code: [200, 201]   # Grafana 12 zwraca 201 Created
      register: f15_folder_create
      no_log: true
      when: "f15_folder_title not in (f15_folders.json | map(attribute='title') | list)"

    # UID folderu bierzemy z listy po TYTULE (Grafana generuje własne uid, gdy folder
    # powstał wcześniej); dopiero gdy folder tworzymy my — ma uid = folder_uid.
    - name: "Ustal folder UID (istniejący wg tytułu albo nowo utworzony)"
      ansible.builtin.set_fact:
        f15_effective_folder: "{{ (f15_folders.json | selectattr('title', 'equalto', f15_folder_title) | map(attribute='uid') | list | first) | default(folder_uid) }}"

    - name: "Pobierz datasources PMM (znajdź Prometheus UID)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/datasources"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_datasources
      no_log: true

    - name: "Ustaw datasource_uid (Prometheus z PMM; fallback na ds_uid z config)"
      ansible.builtin.set_fact:
        f15_effective_ds: "{{ (f15_datasources.json | selectattr('type', 'equalto', 'prometheus') | map(attribute='uid') | list | first) | default(ds_uid) }}"


    # === Pobierz istniejące reguły ===
    - name: "Pobierz istniejące reguły alertów"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_existing_rules
      no_log: true

    - name: "Ustal zestaw UID istniejących reguł"
      ansible.builtin.set_fact:
        f15_existing_uids: "{{ f15_existing_rules.json | map(attribute='uid') | list }}"

    # audit#14: usuń stare reguły bez namespace'u (jednorazowa migracja UID → isa-<cluster>-*)
    - name: "Usuń legacy reguły alertów (UID bez namespace'u cluster)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules/{{ item }}"
        method: DELETE
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        status_code: [200, 202, 204, 404]   # Grafana provisioning DELETE zwraca 204
      loop:
        - "isa-galera-node-loss"
        - "isa-galera-quorum-loss"
        - "isa-galera-not-synced"
        - "isa-backup-stale"
      when: "item in f15_existing_uids"
      no_log: true

    # === Provisioning reguł (idempotentne: PUT jeśli istnieje, POST jeśli brak) ===
    - name: "Utwórz/aktualizuj reguły alertów ISC-47"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules{{ '' if item.uid not in f15_existing_uids else '/' ~ item.uid }}"
        method: "{{ 'POST' if item.uid not in f15_existing_uids else 'PUT' }}"
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body:
          uid: "{{ item.uid }}"
          orgID: 1
          folderUID: "{{ f15_effective_folder }}"
          ruleGroup: "isa-{{ cluster_label }}"
          title: "{{ item.title }}"
          condition: "A"
          for: "{{ item.pending_for | default('2m') }}"
          noDataState: "{{ item.noDataState | default('Alerting') }}"
          execErrState: "Error"
          isPaused: false
          data:
            - refId: "A"
              relativeTimeRange: {from: 600, to: 0}
              datasourceUid: "{{ f15_effective_ds }}"
              model:
                expr: "{{ item.expr }}"
                instant: true
                refId: "A"
                editorMode: "code"
          annotations:
            summary: "{{ item.summary }}"
          labels:
            managed_by: "ansible"
            cluster: "{{ cluster_label }}"
            severity: "{{ item.severity }}"
            isc: "ISC-47"
        status_code: [200, 201, 202]
      loop: "{{ f15_effective_rules }}"
      no_log: true

    # Rekoncyliacja: skasuj reguly ZARZADZANE przez ten zakres, ktorych juz nie
    # ma w definicji. Bez tego kroku kazda usunieta albo przemianowana regula
    # zostawala w Grafanie NA ZAWSZE — zmierzone 2026-08-21: po zastapieniu
    # `no-writer` przez `backends-offline` obie istnialy obok siebie, a stara
    # nie miala juz zadnego wlasciciela. Ta sama klasa sieroty co wezly PMM po
    # bylym ownerze warstwy wspolnej.
    #
    # Zawezenie po `managed_by` I `cluster` jest konieczne: bez niego jeden
    # najemca skasowalby reguly pozostalym oraz `isa-shared-*`, czyli powtorzylby
    # blad, ktory repo naprawialo juz przy wzorcu derejestracji i koncie MinIO.
    - name: "Pobierz aktualne reguły po provisioningu"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_rules_after
      no_log: true

    - name: "Usuń osierocone reguły tego zakresu (nie ma ich już w definicji)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules/{{ item }}"
        method: DELETE
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        status_code: [200, 202, 204, 404]
      loop: >-
        {{ f15_rules_after.json
           | selectattr('labels', 'defined')
           | selectattr('labels.managed_by', 'defined')
           | selectattr('labels.managed_by', 'equalto', 'ansible')
           | selectattr('labels.cluster', 'defined')
           | selectattr('labels.cluster', 'equalto', cluster_label)
           | map(attribute='uid')
           | reject('in', f15_effective_rules | map(attribute='uid') | list)
           | list }}
      loop_control:
        label: "{{ item }}"

    # === BLK-5: email contact point + notification policy (delivery) ===
    - name: "Pobierz istniejące contact points"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/contact-points"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_contacts
      no_log: true

    - name: "Utwórz email contact point (jeśli brak)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/contact-points"
        method: POST
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body:
          uid: "{{ f15_contact_uid }}"
          name: "{{ f15_contact_name }}"
          type: "email"
          settings: {addresses: "{{ f15_email }}", singleEmail: false}
          disableResolveMessage: false
        status_code: [200, 202]
      no_log: true
      when: "f15_contact_uid not in (f15_contacts.json | map(attribute='uid') | list)"

    - name: "Aktualizuj email contact point po zmianie adresu"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/contact-points/{{ f15_contact_uid }}"
        method: PUT
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body:
          uid: "{{ f15_contact_uid }}"
          name: "{{ f15_contact_name }}"
          type: "email"
          settings: {addresses: "{{ f15_email }}", singleEmail: false}
          disableResolveMessage: false
        status_code: [200, 202]
      no_log: true
      when:
        - "f15_contact_uid in (f15_contacts.json | map(attribute='uid') | list)"
        - >-
          (f15_contacts.json
           | selectattr('uid', 'equalto', f15_contact_uid)
           | map(attribute='settings.addresses')
           | first
           | default('')) != f15_email

    - name: "Pobierz bieżącą notification policy"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/policies"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_current_policy
      no_log: true

    - name: "Zachowaj trasy notification policy niezarządzane przez ten playbook"
      ansible.builtin.set_fact:
        f15_unmanaged_policy_routes: >-
          {{
            (f15_unmanaged_policy_routes | default([]))
            + [ item | dict2items | rejectattr('key', 'equalto', 'provenance') | items2dict ]
          }}
      loop: "{{ f15_current_policy.json.routes | default([]) }}"
      when: >-
        not (
          (['managed_by', '=', 'ansible'] in (item.object_matchers | default([])))
          and (
            (['cluster', '=', cluster_label] in (item.object_matchers | default([])))
            or ((item.object_matchers | default([]) | map('first') | select('equalto', 'cluster') | list | length) == 0)
          )
        )
      no_log: true

    - name: "Zbuduj notification policy bez nadpisywania cudzych tras"
      ansible.builtin.set_fact:
        f15_desired_policy: >-
          {{
            (
              f15_current_policy.json
              | dict2items
              | rejectattr('key', 'equalto', 'provenance')
              | items2dict
            )
            | combine({
                'routes': (f15_unmanaged_policy_routes | default([])) + [{
                  'receiver': f15_contact_name,
                  'object_matchers': [['managed_by', '=', 'ansible'], ['cluster', '=', cluster_label]]
                }]
              })
          }}
      no_log: true

    - name: "Ustaw notification policy (ISA alerts → ISA Email)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/policies"
        method: PUT
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body: "{{ f15_desired_policy }}"
        status_code: [200, 202]
      no_log: true
      when: >-
        (
          f15_current_policy.json
          | dict2items
          | rejectattr('key', 'equalto', 'provenance')
          | items2dict
        ) != f15_desired_policy

    - name: "Raport alertów ISC-47 (reguły + email delivery)"
      ansible.builtin.debug:
        msg: >-
          ISC-47: {{ f15_effective_rules | length }} reguł alertów + email contact point (ISA Email Alerts)
          + notification policy (managed_by=ansible → email). Delivery skonfigurowane;
          test dostarczenia wykonuje kontrolowana symulacja alertu.
          Cluster={{ cluster_label }}.
