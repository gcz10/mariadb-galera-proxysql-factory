---
# F15 — Reguły alertów ISC-47 (quorum/writer/node loss + freshness).
#
# Reguły, email contact point i notification policy są zarządzane przez Ansible.
# Weryfikacja delivery: kontrolowany alert musi trafić do skonfigurowanego SMTP.
#
# ISC-47: Alert powstaje po utracie quorum, utracie writera lub utracie węzła.
# - node loss / writer loss: wsrep_cluster_size < expected (writer jest węzłem)
# - quorum loss: wsrep_cluster_status != 1 (Primary)
# - node not Synced: wsrep_local_state != 4
# - backup stale: ostatni backup przekracza jawny freshness SLA
#
# Delivery: email przez SMTP; laboratorium używa Maildev.

- name: "F15 — reguły alertów ISC-47 w PMM/Grafana"
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/secret_policy.yml
    - vars/proxysql_hostgroups.yml
    - vars/alert_identity.yml
    - vars/alert_rules.yml
  vars:
    ansible_become: false
    pmm_api_url: "{{ lookup('ansible.builtin.env', 'PMM_SERVER_URL') | default(monitoring.pmm.server_url, true) | regex_replace('/$', '') }}"
    pmm_admin_user: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_USER') | default('admin', true) }}"
    pmm_admin_password: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_PASSWORD') }}"
    pmm_validate_certs: "{{ monitoring.get('pmm', {}).get('validate_certs', true) | bool }}"
    cluster_label: "{{ monitoring.pmm.cluster_name }}"
    tls_full: "{{ (tls | default({})).mode | default('disabled') == 'full' }}"
    # `default(..., true)` a nie samo `default`: pusty string tez ma wpasc na
    # wyprowadzenie. Szablon do 2026-08-25 wysylal twarde `isa-alerts` — wspolne
    # dla WSZYSTKICH najemcow — wiec drugi klaster na tym samym PMM dostawal
    # od Grafany 412 (uid zajety), mimo ze tytul folderu jest per najemca.
    folder_uid: "{{ (monitoring.alerts | default({})).folder_uid | default('isa-alerts-' ~ cluster_label, true) }}"
    ds_uid: "{{ (monitoring.alerts | default({})).datasource_uid | default('') }}"
    backup_freshness_sla_hours: "{{ backup.freshness_sla_hours }}"
    f15_email: "{{ (monitoring.alerts | default({})).email | default('') }}"
    f15_folder_title: "ISA Alerts ({{ cluster_label }})"
    f15_contact_uid: "email-isa-{{ cluster_label }}"
    f15_contact_name: "ISA Email Alerts ({{ cluster_label }})"

    # audit#9: reguły MUSZĄ zawsze zwracać wartość (operator `bool` + `or vector(...)`).
    # Wyrażenie filtrujące (np. `size < 3`) zwraca PUSTY wektor gdy jest zdrowo — Grafana
    # interpretuje to jako NoData, więc noDataState=Alerting zapalałoby alarm na zdrowym
    # klastrze (zweryfikowane na claude-pve: "Alerting (NoData)" przy 3/3 Synced).
    # Konstrukcja poniżej: zdrowo => 0 (Normal), awaria => 1 (Alerting),
    # BRAK metryk => `or vector(...)` daje wartość awaryjną => 1 (wykrywa utratę monitoringu).
    # noDataState=Alerting zostaje jako ostatnia linia obrony (padnięta datasource).
    # audit#14: UID-y/folder/contact point namespacowane cluster_name.
    # restore-drill-stale i metrics-frozen mierzą ŚWIEŻOŚĆ metryk, nie ich brak:
    # `or vector(0)` NIE widzi .prom, które node_exporter podaje bez zmian (zamrożony
    # plik textfile po padniętym runnerze/kolektorze), więc mtime/last_success
    # porównujemy z time() jawnie — to jedyny sygnał tego trybu awarii.
    # Wlasciciela regul rozstrzyga DEFINICJA, nie flaga konfiguracyjna: blok
    # `galera` oznacza klaster (najemce), jego brak — definicje platformy.
    # Klaster wdraza wylacznie reguly klastrowe, platforma wylacznie
    # `isa-shared-*`. Wczesniej rozwidlenie robila flaga roli w cluster.yml i to
    # wlasnie ona czynila reguly warstwy wspolnej wlasnoscia jednego klastra.
    # Dwie osobne listy, a nie znaczniki na wspolnej liscie: reguly klastrowe
    # czytaja `{{ galera.* }}` i `{{ backup.* }}`, ktorych definicja platformy
    # nie ma, a Jinja evaluuje wylacznie brana galez wyrazenia warunkowego —
    # wiec przy definicji platformy szablony klastrowe nie sa nawet dotykane.
    # Filtr na wspolnej liscie tez by przeszedl (Ansible odklada render
    # zagniezdzonych szablonow do uzycia wartosci), ale zostawialby martwe
    # reguly klastrowe o jeden `map(attribute='expr')` od wywalenia przebiegu
    # platformy — granice wlasciciela pilnujemy struktura, nie konwencja.
    # Reguly oznaczone `requires_tls` powstaja tylko przy tls.mode=full: przy
    # wylaczonym TLS f11_freshness publikuje isa_tls_cert_expiry_unixtime=0, wiec
    # regula liczaca "ile zostalo do wygasniecia" widzialaby cert przeterminowany
    # o pol wieku i palila sie wiecznie na klastrze, ktory certu nie ma.
    # `requires_backup` dziala jak `requires_tls`: regula o swiezosci kopii na
    # klastrze BEZ backupu nie ma czego mierzyc i pali sie wiecznie, zamieniajac
    # alerting w szum, ktory operator wycisza — a wtedy nie zadziala takze wtedy,
    # gdy naprawde bedzie mial racje.
    f15_effective_rules: >-
      {{ f15_shared_rules
         if galera is not defined
         else ((f15_cluster_rules
                | rejectattr('requires_tls', 'defined')
                | rejectattr('requires_backup', 'defined') | list)
               + (f15_cluster_rules | selectattr('requires_tls', 'defined') | list
                  if tls_full | bool else [])
               + (f15_cluster_rules | selectattr('requires_backup', 'defined') | list
                  if (backup | default({})).enabled | default(false) else [])) }}
  pre_tasks:
    - name: "Wymagaj PMM_ADMIN_PASSWORD i adresu alertów"
      ansible.builtin.assert:
        that:
          - pmm_admin_password | length >= (isa_min_secret_length | default(12))
          - f15_email | length > 3
          - "'@' in f15_email"
        fail_msg: "Ustaw PMM_ADMIN_PASSWORD poza repozytorium i monitoring.alerts.email w definicji (cluster.yml albo platform.yml)."

  tasks:
    # === Zapewnij folder ISA Alerts ===
    - name: "Pobierz foldery alertów"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/folders"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_folders
      no_log: true

    - name: "Utwórz folder ISA Alerts (jeśli brak wg tytułu; jawny uid = deterministyczny)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/folders"
        method: POST
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        # Bez force_basic_auth Ansible czeka na challenge 401, ktorego Grafana API nie wysyla
        # -> auth nigdy nie dochodzi. body_format json: bez tego leci form-encoded (400).
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body: {uid: "{{ folder_uid }}", title: "{{ f15_folder_title }}"}
        status_code: [200, 201]   # Grafana 12 zwraca 201 Created
      register: f15_folder_create
      no_log: true
      when: "f15_folder_title not in (f15_folders.json | map(attribute='title') | list)"

    # UID folderu bierzemy z listy po TYTULE (Grafana generuje własne uid, gdy folder
    # powstał wcześniej); dopiero gdy folder tworzymy my — ma uid = folder_uid.
    - name: "Ustal folder UID (istniejący wg tytułu albo nowo utworzony)"
      ansible.builtin.set_fact:
        f15_effective_folder: "{{ (f15_folders.json | selectattr('title', 'equalto', f15_folder_title) | map(attribute='uid') | list | first) | default(folder_uid) }}"

    - name: "Pobierz datasources PMM (znajdź Prometheus UID)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/datasources"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_datasources
      no_log: true

    - name: "Ustaw datasource_uid (Prometheus z PMM; fallback na ds_uid z config)"
      ansible.builtin.set_fact:
        f15_effective_ds: "{{ (f15_datasources.json | selectattr('type', 'equalto', 'prometheus') | map(attribute='uid') | list | first) | default(ds_uid) }}"


    # === Pobierz istniejące reguły ===
    - name: "Pobierz istniejące reguły alertów"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_existing_rules
      no_log: true

    - name: "Ustal zestaw UID istniejących reguł"
      ansible.builtin.set_fact:
        f15_existing_uids: "{{ f15_existing_rules.json | map(attribute='uid') | list }}"

    # audit#14: usuń stare reguły bez namespace'u (jednorazowa migracja UID → isa-<cluster>-*)
    - name: "Usuń legacy reguły alertów (UID bez namespace'u cluster)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules/{{ item }}"
        method: DELETE
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        status_code: [200, 202, 204, 404]   # Grafana provisioning DELETE zwraca 204
      loop:
        - "isa-galera-node-loss"
        - "isa-galera-quorum-loss"
        - "isa-galera-not-synced"
        - "isa-backup-stale"
      when: "item in f15_existing_uids"
      no_log: true

    # === Provisioning reguł (idempotentne: PUT jeśli istnieje, POST jeśli brak) ===
    - name: "Utwórz/aktualizuj reguły alertów ISC-47"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules{{ '' if item.uid not in f15_existing_uids else '/' ~ item.uid }}"
        method: "{{ 'POST' if item.uid not in f15_existing_uids else 'PUT' }}"
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body:
          uid: "{{ item.uid }}"
          orgID: 1
          folderUID: "{{ f15_effective_folder }}"
          ruleGroup: "isa-{{ cluster_label }}"
          title: "{{ item.title }}"
          condition: "A"
          for: "{{ item.pending_for | default('2m') }}"
          noDataState: "{{ item.noDataState | default('Alerting') }}"
          execErrState: "Error"
          isPaused: false
          data:
            - refId: "A"
              relativeTimeRange: {from: 600, to: 0}
              datasourceUid: "{{ f15_effective_ds }}"
              model:
                expr: "{{ item.expr }}"
                instant: true
                refId: "A"
                editorMode: "code"
          annotations:
            summary: "{{ item.summary }}"
          labels:
            managed_by: "ansible"
            cluster: "{{ cluster_label }}"
            severity: "{{ item.severity }}"
            isc: "ISC-47"
        status_code: [200, 201, 202]
      loop: "{{ f15_effective_rules }}"
      no_log: true

    # Rekoncyliacja: skasuj reguly ZARZADZANE przez ten zakres, ktorych juz nie
    # ma w definicji. Bez tego kroku kazda usunieta albo przemianowana regula
    # zostawala w Grafanie NA ZAWSZE — zmierzone 2026-08-21: po zastapieniu
    # `no-writer` przez `backends-offline` obie istnialy obok siebie, a stara
    # nie miala juz zadnego wlasciciela. Ta sama klasa sieroty co wezly PMM po
    # bylym ownerze warstwy wspolnej.
    #
    # Zawezenie po `managed_by` I `cluster` jest konieczne: bez niego jeden
    # najemca skasowalby reguly pozostalym oraz `isa-shared-*`, czyli powtorzylby
    # blad, ktory repo naprawialo juz przy wzorcu derejestracji i koncie MinIO.
    - name: "Pobierz aktualne reguły po provisioningu"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_rules_after
      no_log: true

    - name: "Usuń osierocone reguły tego zakresu (nie ma ich już w definicji)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/alert-rules/{{ item }}"
        method: DELETE
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        status_code: [200, 202, 204, 404]
      loop: >-
        {{ f15_rules_after.json
           | selectattr('labels', 'defined')
           | selectattr('labels.managed_by', 'defined')
           | selectattr('labels.managed_by', 'equalto', 'ansible')
           | selectattr('labels.cluster', 'defined')
           | selectattr('labels.cluster', 'equalto', cluster_label)
           | map(attribute='uid')
           | reject('in', f15_effective_rules | map(attribute='uid') | list)
           | list }}
      loop_control:
        label: "{{ item }}"

    # === BLK-5: email contact point + notification policy (delivery) ===
    - name: "Pobierz istniejące contact points"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/contact-points"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_contacts
      no_log: true

    - name: "Utwórz email contact point (jeśli brak)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/contact-points"
        method: POST
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body:
          uid: "{{ f15_contact_uid }}"
          name: "{{ f15_contact_name }}"
          type: "email"
          settings: {addresses: "{{ f15_email }}", singleEmail: false}
          disableResolveMessage: false
        status_code: [200, 202]
      no_log: true
      when: "f15_contact_uid not in (f15_contacts.json | map(attribute='uid') | list)"

    - name: "Aktualizuj email contact point po zmianie adresu"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/contact-points/{{ f15_contact_uid }}"
        method: PUT
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body:
          uid: "{{ f15_contact_uid }}"
          name: "{{ f15_contact_name }}"
          type: "email"
          settings: {addresses: "{{ f15_email }}", singleEmail: false}
          disableResolveMessage: false
        status_code: [200, 202]
      no_log: true
      when:
        - "f15_contact_uid in (f15_contacts.json | map(attribute='uid') | list)"
        - >-
          (f15_contacts.json
           | selectattr('uid', 'equalto', f15_contact_uid)
           | map(attribute='settings.addresses')
           | first
           | default('')) != f15_email

    - name: "Pobierz bieżącą notification policy"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/policies"
        method: GET
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        return_content: true
        status_code: 200
      register: f15_current_policy
      no_log: true

    - name: "Zachowaj trasy notification policy niezarządzane przez ten playbook"
      ansible.builtin.set_fact:
        f15_unmanaged_policy_routes: >-
          {{
            (f15_unmanaged_policy_routes | default([]))
            + [ item | dict2items | rejectattr('key', 'equalto', 'provenance') | items2dict ]
          }}
      loop: "{{ f15_current_policy.json.routes | default([]) }}"
      when: >-
        not (
          (['managed_by', '=', 'ansible'] in (item.object_matchers | default([])))
          and (
            (['cluster', '=', cluster_label] in (item.object_matchers | default([])))
            or ((item.object_matchers | default([]) | map('first') | select('equalto', 'cluster') | list | length) == 0)
          )
        )
      no_log: true

    - name: "Zbuduj notification policy bez nadpisywania cudzych tras"
      ansible.builtin.set_fact:
        f15_desired_policy: >-
          {{
            (
              f15_current_policy.json
              | dict2items
              | rejectattr('key', 'equalto', 'provenance')
              | items2dict
            )
            | combine({
                'routes': (f15_unmanaged_policy_routes | default([])) + [{
                  'receiver': f15_contact_name,
                  'object_matchers': [['managed_by', '=', 'ansible'], ['cluster', '=', cluster_label]]
                }]
              })
          }}
      no_log: true

    - name: "Ustaw notification policy (ISA alerts → ISA Email)"
      ansible.builtin.uri:
        url: "{{ pmm_api_url }}/graph/api/v1/provisioning/policies"
        method: PUT
        url_username: "{{ pmm_admin_user }}"
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ pmm_validate_certs }}"
        body_format: json
        body: "{{ f15_desired_policy }}"
        status_code: [200, 202]
      no_log: true
      when: >-
        (
          f15_current_policy.json
          | dict2items
          | rejectattr('key', 'equalto', 'provenance')
          | items2dict
        ) != f15_desired_policy

    - name: "Raport alertów ISC-47 (reguły + email delivery)"
      ansible.builtin.debug:
        msg: >-
          ISC-47: {{ f15_effective_rules | length }} reguł alertów + email contact point (ISA Email Alerts)
          + notification policy (managed_by=ansible → email). Delivery skonfigurowane;
          test dostarczenia wykonuje kontrolowana symulacja alertu.
          Cluster={{ cluster_label }}.
