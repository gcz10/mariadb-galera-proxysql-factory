---
# F11 agentless: cienki wrapper nad rola roles/pmm.
# Sceny i hosts zostaja bez zmian, aby Makefile oraz CI mialy ten sam interfejs.

- name: "F11 - Sprawdź PMM API przed zmianami na hostach"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - vars/secret_policy.yml
    - "../{{ versions.lock_file }}"
  vars:
    ansible_become: false
  roles:
    - role: pmm
      vars:
        pmm_mode: agentless
        pmm_stage: preflight
      module_defaults:
        ansible.builtin.uri:
          url_username: "{{ pmm_admin_user }}"
          url_password: "{{ pmm_admin_password }}"
          force_basic_auth: true
          validate_certs: "{{ pmm_validate_certs_effective }}"

- name: "F11 - Przygotuj konto monitorujące MariaDB"
  hosts: galera
  gather_facts: false
  become: true
  roles:
    - role: pmm
      vars:
        pmm_mode: agentless
        pmm_stage: monitor_account

- name: "F11 - Zarejestruj natywne obiekty PMM"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_become: false
  roles:
    - role: pmm
      vars:
        pmm_mode: agentless
        pmm_stage: register
      module_defaults:
        ansible.builtin.uri:
          url_username: "{{ pmm_admin_user }}"
          url_password: "{{ pmm_admin_password }}"
          force_basic_auth: true
          validate_certs: "{{ pmm_validate_certs_effective }}"

- name: "F11 - Usuń zastąpiony monitoring standalone"
  hosts: galera
  gather_facts: false
  become: true
  roles:
    - role: pmm
      vars:
        pmm_mode: agentless
        pmm_stage: legacy_cleanup
