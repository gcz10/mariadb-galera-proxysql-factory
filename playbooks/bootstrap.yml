---
# bootstrap.yml — initial bootstrap klastra Galera (OSOBNY od site.yml)
# Wymaga: site.yml (config deployed)
# Uruchomienie: ansible-playbook bootstrap.yml -i clusters/<name>/inventory.yml -e confirm=yes
# NIGDY nie uruchamiaj bez -e confirm=yes (ISC-12, ISC-13, ISC-65). Celuje w galera[0].

- name: "Bootstrap - initial Galera cluster (JEDEN węzeł, jawne potwierdzenie)"
  hosts: "{{ bootstrap_node | default('galera[0]') }}"
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    sst_user: "sst_user"
    sst_password: "{{ lookup('ansible.builtin.env', 'SST_PASSWORD') }}"
    use_systemd: "{{ ansible_facts['service_mgr'] == 'systemd' }}"

  pre_tasks:
    - name: "Blokuj bootstrap bez confirm=yes"
      ansible.builtin.assert:
        that:
          - confirm is defined
          - confirm | bool
        fail_msg: "Bootstrap wymaga -e confirm=yes. Nigdy nie uruchamiaj bez jawnego potwierdzenia."
    - name: "Wymagaj SST_PASSWORD"
      ansible.builtin.assert:
        that:
          - sst_password | length > 0
        fail_msg: "Ustaw SST_PASSWORD poza repozytorium (env). Puste hasło = konto SST bez hasła."

    - name: "Sprawdź, czy którykolwiek węzeł już należy do Primary Component"
      ansible.builtin.command:
        argv:
          - mariadb
          - --socket=/var/lib/mysql/mysql.sock
          - -N
          - -B
          - -e
          - "SHOW STATUS LIKE 'wsrep_cluster_status'"
      delegate_to: "{{ item }}"
      loop: "{{ groups['galera'] }}"
      register: bootstrap_primary_checks
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: "ISC-65: blokuj bootstrap, gdy istnieje Primary Component"
      ansible.builtin.assert:
        that:
          - (bootstrap_primary_checks.results | map(attribute='stdout', default='') | join('\n')) is not search('wsrep_cluster_status\\s+Primary')
        fail_msg: "Bootstrap zablokowany: co najmniej jeden węzeł już raportuje Primary Component."

    - name: "Tylko jeden węzeł do bootstrap"
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | length == 1
        fail_msg: "Bootstrap na jednym węźle (galera[0], hosts: galera[0]). (ISC-12, ISC-65)"

    - name: "Zabij stary proces MariaDB (tylko lab: brak systemd)"
      ansible.builtin.shell: "lsof -ti /var/lib/mysql/ibdata1 2>/dev/null | xargs kill -9 2>/dev/null || true"
      changed_when: false
      when: not use_systemd

    - name: "Wyczyść aria log (tylko lab: brak systemd)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/mysql/aria_log_control
        - /var/lib/mysql/aria_log.00000001
      changed_when: false
      when: not use_systemd

  tasks:
    - name: "Dystrybuuj certyfikaty TLS (gdy tls.mode=full)"
      ansible.builtin.include_tasks: tls_certs.yml
      when: (tls | default({})).mode | default('disabled') == 'full'

    - name: "Bootstrap Galera — lab (--wsrep-new-cluster, bez systemd)"
      ansible.builtin.shell: |
        mariadbd --user=mysql --datadir=/var/lib/mysql --socket=/var/lib/mysql/mysql.sock \
          --wsrep-new-cluster > /var/log/mariadb/mariadb.log 2>&1 &
        sleep 15
      changed_when: false
      when: not use_systemd

    - name: "Bootstrap Galera — produkcja (galera_new_cluster przez systemd)"
      ansible.builtin.command: galera_new_cluster
      changed_when: true
      when: use_systemd

    - name: "Włącz mariadb.service na starcie (produkcja)"
      ansible.builtin.systemd:
        name: mariadb
        enabled: true
      when: use_systemd

    - name: "Czekaj na Primary Component"
      ansible.builtin.wait_for:
        port: 3306
        timeout: 30

    - name: "Weryfikuj cluster status"
      ansible.mysql.mysql_query:
        query: "SHOW STATUS WHERE Variable_name IN ('wsrep_cluster_status','wsrep_cluster_size','wsrep_connected','wsrep_ready','wsrep_local_state','wsrep_provider_name','wsrep_provider_version')"
        login_unix_socket: /var/lib/mysql/mysql.sock
      register: wsrep_status

    - name: "Wypisz cluster status"
      ansible.builtin.debug:
        msg: "{{ wsrep_status.query_result }}"

    - name: "Utworz SST user"
      ansible.mysql.mysql_user:
        name: "{{ sst_user }}"
        password: "{{ sst_password }}"
        priv: "*.*:RELOAD,PROCESS,LOCK TABLES,BINLOG ADMIN,REPLICATION CLIENT"
        host: localhost
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      no_log: true

    - name: "Zapisz dowód bootstrap"
      ansible.builtin.copy:
        content: "Bootstrap completed at {{ ansible_facts['date_time']['iso8601'] }} on {{ inventory_hostname }}\n{{ wsrep_status.query_result }}"
        dest: /var/lib/mysql/.isa_bootstrap_proof
        mode: "0644"

  handlers: []
