---
# bootstrap.yml — initial bootstrap klastra Galera (OSOBNY od site.yml)
# Wymaga: site.yml (config deployed)
# Uruchomienie: ansible-playbook bootstrap.yml -i clusters/<name>/inventory.yml -e confirm=yes
# NIGDY nie uruchamiaj bez -e confirm=yes (ISC-12, ISC-13, ISC-65). Celuje w galera[0].

- name: "Bootstrap - initial Galera cluster (JEDEN węzeł, jawne potwierdzenie)"
  hosts: "{{ bootstrap_node | default('galera[0]') }}"
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    sst_user: "sst_user"
    sst_password: "{{ lookup('ansible.builtin.env', 'SST_PASSWORD') }}"

  pre_tasks:
    - name: "Blokuj bootstrap bez confirm=yes"
      ansible.builtin.assert:
        that:
          - confirm is defined
          - confirm | bool
        fail_msg: "Bootstrap wymaga -e confirm=yes. Nigdy nie uruchamiaj bez jawnego potwierdzenia."
    - name: "Wymagaj SST_PASSWORD"
      ansible.builtin.assert:
        that:
          - sst_password | length > 0
        fail_msg: "Ustaw SST_PASSWORD poza repozytorium (env). Puste hasło = konto SST bez hasła."

    - name: "Sonduj stan wszystkich wezlow Galera (wspolny klasyfikator)"
      ansible.builtin.include_tasks: tasks/galera_state_probe.yml

    # Fail-closed bez furtki: `bootstrap_confirm_all_down` potwierdza WIEDZE
    # operatora o wezlach nieosiagalnych, a nie o takich, ktorych stanu nie
    # udalo sie odczytac mimo dzialajacego SSH. Te drugie trzeba zbadac.
    - name: "Fail-closed: kazdy wezel ma jednoznaczny stan"
      ansible.builtin.assert:
        that:
          - galera_state_unknown | length == 0
        fail_msg: >-
          Nieznany stan wezlow: {{ galera_state_unknown }}. SSH dziala, ale sonda
          nie zwrocila rozstrzygajacej odpowiedzi — nie mozna wykluczyc zywego
          Primary. Zbadaj klienta bazy/socket na tych wezlach i powtorz.

    - name: "ISC-65: brak żywego Primary Component (anti split-brain)"
      ansible.builtin.assert:
        that:
          - >-
            (galera_state_primary | length == 0)
            or (bootstrap_skip_existing_primary | default(false) | bool)
        fail_msg: >-
          Żywy Primary Component wykryty: {{ galera_state_primary }}.
          Bootstrap = drugi Primary → split-brain / utrata danych. Dołącz zamiast bootstrappować.

    # TYLKO graf cluster-build moze poprosic o bezpieczny no-op. Bezposrednie
    # `make cluster-bootstrap` nie przekazuje flagi i nadal fail-closed odmawia.
    # Stan (zywy Primary), nie intencja operatora, rozstrzyga czy krok jest zbedny.
    - name: "Wznawialny build — zakoncz krok bootstrap przy istniejacym Primary"
      ansible.builtin.meta: end_play
      when:
        - galera_state_primary | length > 0
        - bootstrap_skip_existing_primary | default(false) | bool

    - name: "Audit#2: nieosiągalne węzły wymagają bootstrap_confirm_all_down=true"
      ansible.builtin.assert:
        that:
          - (galera_state_unreachable | length == 0) or (bootstrap_confirm_all_down | default(false) | bool)
        fail_msg: >-
          Nieosiągalne węzły: {{ galera_state_unreachable }}. Nie można wykluczyć, że któryś
          działa jako Primary (sieć/partycja). Jeśli na PEWNO wszystkie stoją — przekaż
          -e bootstrap_confirm_all_down=true. W przeciwnym razie zbadaj osiągalność najpierw.

    - name: "Tylko jeden węzeł do bootstrap"
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | length == 1
        fail_msg: "Bootstrap na jednym węźle (galera[0], hosts: galera[0]). (ISC-12, ISC-65)"

    - name: "Odczytaj grastate.dat na węźle bootstrap (recovery guard)"
      ansible.builtin.slurp:
        path: /var/lib/mysql/grastate.dat
      register: bootstrap_grastate
      failed_when: false
      changed_when: false

    - name: "ISC-65: recovery — safe_to_bootstrap=1 na węźle bootstrap (chyba że bootstrap_force=yes)"
      ansible.builtin.assert:
        that:
          - >-
            (bootstrap_grastate.content is not defined)
            or ((bootstrap_grastate.content | b64decode) is search('(?m)^safe_to_bootstrap:\s*1'))
        fail_msg: >-
          grastate.dat na {{ inventory_hostname }} nie ma safe_to_bootstrap:1.
          Klaster nie został czysto zatrzymany LUB to nie ten węzeł ma najwyższy seqno.
          Recovery: znajdź węzeł z safe_to_bootstrap:1 (lub max seqno w grastate.dat/
          wsrep_local_causes_uuid) i bootstrappuj go przez -e bootstrap_node=<ten_węzeł>.
          Bootstrappowanie dowolnego węzła = ryzyko utraty zatwierdzonych transakcji.
          Pierwszy bootstrap na pustym datadir: użyj -e bootstrap_force=yes.
      when:
        - not bootstrap_grastate.failed
        - not (bootstrap_force | default(false)) | bool


  tasks:
    - name: "Dystrybuuj certyfikaty TLS (gdy tls.mode=full)"
      ansible.builtin.include_tasks: tls_certs.yml
      when: (tls | default({})).mode | default('disabled') == 'full'

    - name: "Bootstrap Galera (galera_new_cluster przez systemd)"
      ansible.builtin.command: galera_new_cluster
      changed_when: true

    - name: "Włącz mariadb.service na starcie"
      ansible.builtin.systemd:
        name: mariadb
        enabled: true
    - name: "Czekaj na Primary Component (port + socket)"
      ansible.builtin.wait_for:
        port: 3306
        timeout: 30

    - name: "Czekaj na gniazdo unix"
      ansible.builtin.wait_for:
        path: /var/lib/mysql/mysql.sock
        timeout: 30

    # CELOWO inline, nie `tasks/assert_galera_healthy.yml`. Bootstrap tworzy
    # JEDNOWEZLOWY Primary Component, wiec asertuje `size == 1`, a nie
    # `nodes_expected` — helper padlby tu zawsze. Uzywa tez modulu
    # `mysql_query` (`query_result`), nie `shell` (`stdout`), wiec ksztalt
    # danych jest inny.
    - name: "Weryfikuj cluster status"
      ansible.mysql.mysql_query:
        query: "SHOW STATUS WHERE Variable_name IN ('wsrep_cluster_status','wsrep_cluster_size','wsrep_connected','wsrep_ready','wsrep_local_state')"
        login_unix_socket: /var/lib/mysql/mysql.sock
      register: wsrep_status

    - name: "ISC-12/65: asercje stanu po bootstrap (Primary/Synced/Ready/size=1)"
      ansible.builtin.assert:
        that:
          - wsrep_status.query_result[0] | selectattr('Variable_name', 'equalto', 'wsrep_cluster_status') | map(attribute='Value') | first == 'Primary'
          - wsrep_status.query_result[0] | selectattr('Variable_name', 'equalto', 'wsrep_local_state') | map(attribute='Value') | first == '4'
          - wsrep_status.query_result[0] | selectattr('Variable_name', 'equalto', 'wsrep_ready') | map(attribute='Value') | first == 'ON'
          - wsrep_status.query_result[0] | selectattr('Variable_name', 'equalto', 'wsrep_cluster_size') | map(attribute='Value') | first == '1'
        fail_msg: >-
          Bootstrap nie osiągnął zdrowego Primary: {{ wsrep_status.query_result }}.
          Oczekiwano: cluster_status=Primary, local_state=4 (Synced), ready=ON, cluster_size=1.
        success_msg: "Bootstrap OK: Primary/Synced/Ready, size=1"

    - name: "Wypisz cluster status"
      ansible.builtin.debug:
        msg: "{{ wsrep_status.query_result }}"

    - name: "Utworz SST user"
      ansible.mysql.mysql_user:
        name: "{{ sst_user }}"
        password: "{{ sst_password }}"
        priv: "*.*:RELOAD,PROCESS,LOCK TABLES,BINLOG ADMIN,REPLICATION CLIENT"
        host: localhost
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      no_log: true

    - name: "Zapisz dowód bootstrap"
      ansible.builtin.copy:
        content: "Bootstrap completed at {{ ansible_facts['date_time']['iso8601'] }} on {{ inventory_hostname }}\n{{ wsrep_status.query_result }}"
        dest: /var/lib/mysql/.isa_bootstrap_proof
        mode: "0644"

  handlers: []
