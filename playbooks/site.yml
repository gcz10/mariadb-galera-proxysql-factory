---
# site.yml — główny playbook converge (NIGDY nie bootstrapuje, nie czyści datadir, nie resetuje kont)
# Powtarzalny: drugi uruchomiony converge raportuje changed=0 (ISC-2)
# Uruchomienie: ansible-playbook site.yml -i clusters/<name>/inventory.yml

- name: "Converge - konfiguracja klastra (bez bootstrap)"
  hosts: galera
  become: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  vars:
    galera_cluster_name: "{{ galera.cluster_name }}"
    galera_nodes_csv: "{{ groups['galera'] | map('extract', hostvars, 'galera_node_address') | join(',') }}"
    sst_user: "sst_user"
    sst_password: "{{ lookup('ansible.builtin.env', 'SST_PASSWORD') }}"
    gcache_size: "{{ (mariadb_tuning | default({})).gcache_size | default('128M') }}"
    mariadb_config_dir: /etc/my.cnf.d
    use_systemd: "{{ ansible_facts['service_mgr'] == 'systemd' }}"

  pre_tasks:
    - name: "Wymagaj SST_PASSWORD (zapobiega pustemu wsrep_sst_auth)"
      ansible.builtin.assert:
        that:
          - sst_password | length > 0
        fail_msg: "Ustaw SST_PASSWORD poza repozytorium (env). Puste hasło = konto SST bez hasła."
    - name: "Zabij stary proces MariaDB (tylko lab: brak systemd)"
      ansible.builtin.shell: "lsof -ti /var/lib/mysql/ibdata1 2>/dev/null | xargs kill -9 2>/dev/null; lsof -ti :4567 2>/dev/null | xargs kill -9 2>/dev/null; lsof -ti :4568 2>/dev/null | xargs kill -9 2>/dev/null; true"
      changed_when: false
      when: not use_systemd

    - name: "Wyczyść aria log (tylko lab: brak systemd, po crashu)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/mysql/aria_log_control
        - /var/lib/mysql/aria_log.00000001
      changed_when: false
      when: not use_systemd

    - name: "Utworz katalogi"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /run/mariadb, owner: mysql, group: mysql, mode: "0755" }
        - { path: /var/log/mariadb, owner: mysql, group: mysql, mode: "0755" }
        - { path: "{{ mariadb_config_dir }}", owner: root, group: root, mode: "0755" }

    - name: "Utworz plik logu MariaDB z poprawnymi uprawnieniami"
      ansible.builtin.file:
        path: /var/log/mariadb/mariadb.log
        state: touch
        owner: mysql
        group: mysql
        mode: "0640"
        access_time: preserve
        modification_time: preserve

    - name: "SELinux — oznacz porty TCP Galery jako mysqld_port_t"
      community.general.seport:
        ports:
          - 4444
          - 4567
          - 4568
        proto: tcp
        setype: mysqld_port_t
        state: present
        local: true
        reload: true
      when: ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'
      tags: [selinux]

    - name: "SELinux — oznacz port UDP Galery jako mysqld_port_t"
      community.general.seport:
        ports: 4567
        proto: udp
        setype: mysqld_port_t
        state: present
        local: true
        reload: true
      when: ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'
      tags: [selinux]

    - name: "SELinux — przywroc kontekst logow MariaDB"
      ansible.builtin.command:
        argv:
          - restorecon
          - -RFv
          - /var/log/mariadb
      register: mariadb_log_restorecon
      changed_when: mariadb_log_restorecon.stdout | length > 0
      when: ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'
      tags: [selinux]

  tasks:
    - name: "Konfiguruj Galera server.cnf"
      ansible.builtin.template:
        src: ../roles/mariadb_install/templates/server.cnf.j2
        dest: "{{ mariadb_config_dir }}/server.cnf"
        owner: root
        group: mysql
        mode: "0640"
      register: config_result
      notify:
        - "Restart MariaDB (systemd, on config change)"
        - "Verify MariaDB health after config restart"

    - name: "Dystrybuuj certyfikaty TLS (gdy tls.mode=full)"
      ansible.builtin.include_tasks: tls_certs.yml
      register: tls_deploy_result
      when: (tls | default({})).mode | default('disabled') == 'full'

    - name: "Zaplanuj bezpieczny restart po rotacji certyfikatu TLS"
      ansible.builtin.debug:
        msg: "Pliki TLS zmienione; restart MariaDB zostanie wykonany po bramie zdrowia."
      changed_when: (tls_files_changed | default(false)) | bool
      notify:
        - "Restart MariaDB (systemd, on config change)"
        - "Verify MariaDB health after config restart"
      when: (tls | default({})).mode | default('disabled') == 'full'

    - name: "Inicjalizuj datadir (jeśli pusty)"
      ansible.builtin.command: mariadb-install-db --user=mysql --datadir=/var/lib/mysql
      args:
        creates: /var/lib/mysql/mysql
      register: init_result

    - name: "Uruchom MariaDB (tylko lab: bez systemd, jako daemon)"
      ansible.builtin.shell: |
        mariadbd --user=mysql --datadir=/var/lib/mysql --socket=/var/lib/mysql/mysql.sock \
          > /var/log/mariadb/mariadb.log 2>&1 &
        sleep 15
      changed_when: false
      when: not use_systemd

    - name: "Włącz mariadb.service na starcie (produkcja: systemd; start przez bootstrap/join, NIE converge)"
      ansible.builtin.systemd:
        name: mariadb
        enabled: true
      when: use_systemd

    - name: "Sprawdź czy MariaDB działa (produkcja: converge nie startuje zatrzymanego węzła)"
      ansible.builtin.command: systemctl is-active mariadb
      register: mariadb_active
      changed_when: false
      failed_when: false
      when: use_systemd
    - name: "Brama zdrowia przed zaplanowanym restartem konfiguracji"
      ansible.builtin.shell: >-
        mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
        "SHOW STATUS WHERE Variable_name IN
        ('wsrep_local_state','wsrep_cluster_status','wsrep_ready','wsrep_cluster_size')"
      register: mariadb_health_before_config_restart
      until: >-
        mariadb_health_before_config_restart.stdout is search('wsrep_local_state\t4')
        and mariadb_health_before_config_restart.stdout is search('wsrep_cluster_status\tPrimary')
        and mariadb_health_before_config_restart.stdout is search('wsrep_ready\tON')
        and mariadb_health_before_config_restart.stdout is search(
          'wsrep_cluster_size\t' ~ (galera.nodes_expected | int | string)
        )
      retries: 3
      delay: 5
      changed_when: false
      when:
        - use_systemd
        - config_result.changed or ((tls_deploy_result | default({})).changed | default(false))
        - (mariadb_active | default({})).rc | default(1) == 0


    # Czekamy TYLKO gdy mariadbd faktycznie dziala. Na swiezym klastrze (przed bootstrapem)
    # port 3306 nigdy nie wstanie - nie ma Primary Component do dolaczenia - a bezwarunkowe
    # wait_for marnowalo 120 s NA KAZDYM wezle Galera, czyli 6 minut na kazdym deployu
    # od zera. Ta sama bramka co w handlerach nizej.
    - name: "Czekaj na gotowość MariaDB"
      ansible.builtin.wait_for:
        port: 3306
        timeout: 60
      register: mariadb_ready
      # Bez `ignore_errors`. Warunek ponizej juz odsiewa przypadek sprzed
      # bootstrapu (mariadbd nie dziala -> task pominiety w calosci). Gdy
      # mariadbd JEST aktywny, a port 3306 nie wstaje przez 60 s, to awaria:
      # wyciszenie jej sprawialo, ze playbook przewracal sie dopiero na
      # kolejnym zadaniu, z mylacym bledem o braku gniazda zamiast o timeoucie.
      when: (mariadb_active | default({})).rc | default(1) == 0

    - name: "Utworz SST user (tylko na pierwszym węźle, jeśli nie istnieje)"
      ansible.mysql.mysql_user:
        name: "{{ sst_user }}"
        password: "{{ sst_password }}"
        priv: "*.*:RELOAD,PROCESS,LOCK TABLES,BINLOG ADMIN,REPLICATION CLIENT"
        host: localhost
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      # Warunek musi sprawdzac czy MariaDB FAKTYCZNIE dziala (mariadb_active),
      # nie tylko czy wait_for sie powiodl. Gdy wait_for jest pominiety (brak mariadbd),
      # mariadb_ready jest defined z failed=False, wiec stary warunek przepuszczal
      # i mysql_user padal na braku socketu.
      when:
        - galera_node_idx | default(1) == 1
        - (mariadb_active | default({})).rc | default(1) == 0
      no_log: true

  handlers:
    - name: "Restart MariaDB (systemd, on config change)"
      ansible.builtin.systemd:
        name: mariadb
        state: restarted
      when:
        - use_systemd
        - (mariadb_active | default({})).rc | default(1) == 0

    - name: "Verify MariaDB health after config restart"
      ansible.builtin.shell: >-
        mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
        "SHOW STATUS WHERE Variable_name IN
        ('wsrep_local_state','wsrep_cluster_status','wsrep_ready','wsrep_cluster_size')"
      register: mariadb_health_after_config_restart
      until: >-
        mariadb_health_after_config_restart.stdout is search('wsrep_local_state\t4')
        and mariadb_health_after_config_restart.stdout is search('wsrep_cluster_status\tPrimary')
        and mariadb_health_after_config_restart.stdout is search('wsrep_ready\tON')
        and mariadb_health_after_config_restart.stdout is search(
          'wsrep_cluster_size\t' ~ (galera.nodes_expected | int | string)
        )
      retries: 30
      delay: 5
      changed_when: false
      when:
        - use_systemd
        - (mariadb_active | default({})).rc | default(1) == 0
