---
# F5: Dołącz węzły Galera do Primary Component.
# Domyślny bootstrap to galera[0]; recovery przekazuje jawny join_bootstrap_node.
# Satisfies: ISC-14 (SST mariabackup), ISC-29 (auto rejoin).

- name: "F5 — wdróż konfigurację mariabackup SST"
  hosts: galera
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    galera_cluster_name: "{{ galera.cluster_name }}"
    galera_nodes_csv: "{{ groups['galera'] | map('extract', hostvars, 'galera_node_address') | join(',') }}"
    sst_user: "sst_user"
    sst_password: "{{ lookup('ansible.builtin.env', 'SST_PASSWORD') | default('', true) }}"
    gcache_size: "{{ (mariadb_tuning | default({})).gcache_size | default('128M') }}"
    mariadb_config_dir: /etc/my.cnf.d
  pre_tasks:
    - name: "Wymagaj SST_PASSWORD przed konfiguracja"
      ansible.builtin.assert:
        that:
          - sst_user is string
          - sst_user | length > 0
          - sst_password is string
          - sst_password | length > 0
        fail_msg: "Ustaw SST_PASSWORD poza repozytorium (env)."
        quiet: true
      no_log: true

  tasks:
    - name: "Utwórz katalogi MariaDB"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        # owner: katalogi zapisywane przez mariadbd (User=mysql) musza byc mysql-owned.
        # Poprzedni heuryst 'mysql in item' nie lapol /run/mariadb (nie zawiera slowa
        # "mysql") -> tworzyl go jako root -> na EL10 (brak RuntimeDirectory w unicie)
        # ExecStartPre nie mogl zapisac wsrep-start-position. Tylko config_dir jest root.
        owner: "{{ 'root' if item == mariadb_config_dir else 'mysql' }}"
        group: "{{ 'root' if item == mariadb_config_dir else 'mysql' }}"
        mode: "0755"
      loop:
        - /run/mariadb
        - /var/log/mariadb
        - "{{ mariadb_config_dir }}"

    - name: "Wdróż server.cnf z mariabackup SST"
      ansible.builtin.template:
        src: ../roles/mariadb_install/templates/server.cnf.j2
        dest: "{{ mariadb_config_dir }}/server.cnf"
        owner: root
        group: mysql
        mode: "0640"
      no_log: true
    - name: "Dystrybuuj certyfikaty TLS (gdy tls.mode=full)"
      ansible.builtin.include_tasks: tls_certs.yml
      when: (tls | default({})).mode | default('disabled') == 'full'

- name: "F5 — zapewnij konto SST na klastrze"
  hosts: "{{ join_bootstrap_node | default('galera[0]') }}"
  become: true
  vars:
    sst_user: "sst_user"
    sst_password: "{{ lookup('ansible.builtin.env', 'SST_PASSWORD') | default('', true) }}"
  pre_tasks:
    - name: "Wymagaj SST_PASSWORD przed utworzeniem konta"
      ansible.builtin.assert:
        that:
          - sst_user is string
          - sst_user | length > 0
          - sst_password is string
          - sst_password | length > 0
        fail_msg: "Ustaw SST_PASSWORD poza repozytorium (env)."
        quiet: true
      no_log: true
  tasks:
    - name: "Sprawdź czy MariaDB jest uruchomiona"
      ansible.builtin.shell: "mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e 'SELECT 1' 2>/dev/null"
      register: mariadb_check
      changed_when: false
      failed_when: false

    - name: "Utwórz konto SST (jeśli brak)"
      ansible.mysql.mysql_user:
        name: "{{ sst_user }}"
        password: "{{ sst_password }}"
        priv: "*.*:RELOAD,PROCESS,LOCK TABLES,BINLOG ADMIN,REPLICATION CLIENT"
        host: localhost
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      when: mariadb_check.rc == 0
      no_log: true

# audit: wsrep_sst_auth jest wczytywany z pliku TYLKO przy starcie mysqld.
# Rotacja SST_PASSWORD aktualizuje server.cnf oraz konto w bazie, ale dzialajacy
# mysqld trzyma w pamieci STARA wartosc. Dawca uwierzytelnia sie wtedy starym
# haslem do konta, ktore ma juz nowe, i SST pada:
#   [Warning] Access denied for user 'sst_user'@'localhost' (using password: YES)
#   WSREP_SST: [ERROR] mariadb-backup finished with error: 1
# Awaria jest UTAJONA — klaster raportuje sie zdrowo, dopoki jakis wezel nie musi
# sie dolaczyc, czyli ujawnia sie dopiero w trakcie awarii. site.yml tego nie
# ratuje: konfiguracje zapisal juz ten playbook, wiec nie widzi zmiany i nie
# restartuje. Zmienna jest dynamiczna, wiec synchronizujemy runtime bez restartu.
#
# Haslo idzie przez stdin, nie przez argv — argv jest widoczne w ps dla kazdego.
- name: "F5 — zsynchronizuj wsrep_sst_auth w działającym mysqld (rotacja hasła)"
  hosts: galera
  become: true
  gather_facts: false
  vars:
    sst_user: "sst_user"
    sst_password: "{{ lookup('ansible.builtin.env', 'SST_PASSWORD') | default('', true) }}"
  pre_tasks:
    - name: "Wymagaj SST_PASSWORD przed synchronizacja runtime"
      ansible.builtin.assert:
        that:
          - sst_user is string
          - sst_user | length > 0
          - sst_password is string
          - sst_password | length > 0
        fail_msg: "Ustaw SST_PASSWORD poza repozytorium (env)."
        quiet: true
      no_log: true
  tasks:
    - name: "Sprawdź czy MariaDB jest uruchomiona"
      ansible.builtin.command:
        argv:
          - mariadb
          - --socket=/var/lib/mysql/mysql.sock
          - -N
          - -B
          - -e
          - "SELECT 1"
      register: f5_sst_auth_alive
      changed_when: false
      failed_when: false

    - name: "Ustaw wsrep_sst_auth zgodnie z konfiguracja"
      ansible.mysql.mysql_query:
        login_unix_socket: /var/lib/mysql/mysql.sock
        query: "SET GLOBAL wsrep_sst_auth = %s"
        positional_args:
          - "{{ sst_user }}:{{ sst_password }}"
      when: f5_sst_auth_alive.rc == 0
      changed_when: true
      no_log: true

- name: "F5 — dołącz węzły do Primary Component"
  hosts: galera
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    expected_cluster_size: 3

  tasks:
    - name: "Pomiń faktyczny węzeł Primary"
      ansible.builtin.meta: end_host
      when: inventory_hostname == (join_bootstrap_node | default(groups['galera'][0]))

    - name: "Sprawdź czy MariaDB już działa i jest Synced"
      ansible.builtin.shell: >
        mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
        "SHOW STATUS WHERE Variable_name='wsrep_local_state'" 2>/dev/null
      register: node_state
      changed_when: false
      failed_when: false

    - name: "Pomiń jeśli węzeł już Synced"
      ansible.builtin.meta: end_host
      when: "'4' in (node_state.stdout | default(''))"

    - name: "Wydrukuj adres klastra dla dołączającego węzła"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} dołącza do klastra jako node {{ galera_node_idx }}"

    - name: "Katalog drop-in mariadb.service"
      ansible.builtin.file:
        path: /etc/systemd/system/mariadb.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "SST bywa dłuższy niż domyślny TimeoutStartSec — drop-in zapobiega zabiciu mariadbd przez systemd"
      ansible.builtin.copy:
        content: |
          [Service]
          TimeoutStartSec=infinity
          LimitNOFILE=1048576
          # Rekomendacja produkcyjna: OOMScoreAdjust=-800 chroni proces bazy
          # przed ubiciem przez kernel OOM killer przed innymi procesami w tle.
          OOMScoreAdjust=-800
        dest: /etc/systemd/system/mariadb.service.d/timeoutstartsec.conf
        owner: root
        group: root
        mode: "0644"

    # `no_block: true` jest tu WARUNKIEM dzialania bramki ponizej, nie optymalizacja.
    # Jednostka ma Type=notify, wiec dla systemd start konczy sie dopiero na
    # "READY=1", a drop-in wylacza logike timeoutu (TimeoutStartSec=infinity).
    # Blokujacy `state: started` przy zawieszonym SST NIE WRACA NIGDY, wiec bounded
    # wait ponizej byl kodem nieosiagalnym: playbook wisial bez limitu i bez sladu.
    # Dokumentacja modulu: "Do not synchronously wait for the requested operation
    # to finish. Enqueued job will continue without Ansible blocking on its
    # completion."
    - name: "Uruchom MariaDB jako węzeł dołączający (start bez blokowania; deadline pilnuje playbook)"
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: true
        daemon_reload: true
        no_block: true

    # JEDYNY wlasciciel deadline'u dolaczania. `until` jest z zalozenia dla zadan,
    # ktore po drodze padaja ("tasks that are likely to fail"), wiec pierwsze proby
    # bez socketu to poprawny stan przejsciowy — porazka pada dopiero po wyczerpaniu
    # `retries`. Domyslnie 360 x 5 s = 30 min.
    - name: "Dołączanie węzła z jawnym oknem czasowym"
      block:
        - name: "Czekaj na osiągnięcie stanu Synced (SST dużej bazy trwa od minut do godzin)"
          ansible.builtin.shell: >
            mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
            "SHOW STATUS WHERE Variable_name='wsrep_local_state'" 2>/dev/null
          register: join_state
          until: "'4' in (join_state.stdout | default(''))"
          retries: "{{ galera_join_wait_retries | default(360) | int }}"
          delay: 5
          changed_when: false
      rescue:
        # Bez tego operator dostawal wylacznie "until nie spelnione" i musial
        # sam wchodzic na wezel. Trzy pytania rozstrzygaja przypadek: czy jednostka
        # jeszcze wstaje, co mowi log, i czy transfer w ogole ruszyl.
        - name: "Diagnostyka — stan jednostki systemd"
          ansible.builtin.command: systemctl status mariadb --no-pager --lines=0
          register: sst_unit_status
          changed_when: false
          failed_when: false

        - name: "Diagnostyka — ogon journala mariadb"
          ansible.builtin.command: journalctl -u mariadb --no-pager --lines=50
          register: sst_journal
          changed_when: false
          failed_when: false

        - name: "Diagnostyka — stan wsrep_local_state i postęp SST"
          ansible.builtin.shell: >
            mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
            "SHOW STATUS WHERE Variable_name IN
            ('wsrep_local_state','wsrep_local_state_comment','wsrep_cluster_status')" 2>&1;
            ls -la /var/lib/mysql/.sst 2>&1 || true
          register: sst_progress
          changed_when: false
          failed_when: false

        - name: "Przekrocz okno dołączania z kompletem dowodów"
          ansible.builtin.fail:
            msg: |
              {{ inventory_hostname }} nie osiagnal stanu Synced w oknie
              {{ (galera_join_wait_retries | default(360) | int) * 5 }} s.
              Jednostka pozostaje w stanie startu (TimeoutStartSec=infinity celowo
              nie pozwala systemd przerwac transferu) — decyzje o przerwaniu
              podejmuje operator na podstawie ponizszych danych.

              [systemctl] {{ sst_unit_status.stdout | default('brak') }}

              [wsrep + katalog SST] {{ sst_progress.stdout | default('brak') }}

              [journal -50] {{ sst_journal.stdout | default('brak') }}

    # CELOWO inline, nie `tasks/assert_galera_healthy.yml`. Helper asertuje
    # `wsrep_cluster_size == expected_size`, a dolaczanie wezla pilnuje INNEGO
    # niezmiennika: `size >= galera_node_idx` (klaster rosnie stopniowo, wiec
    # przy dolaczaniu drugiego z trzech wezlow pelny rozmiar jeszcze nie istnieje).
    # Podstawienie helpera zamienioby dzialajaca brame w taka, ktora zawsze pada.
    - name: "Weryfikuj rozmiar i stan klastra po dołączeniu"
      ansible.builtin.shell: >
        mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
        "SHOW STATUS WHERE Variable_name IN
        ('wsrep_cluster_status','wsrep_ready','wsrep_cluster_size')" 2>/dev/null
      register: cluster_state_after
      changed_when: false

    - name: "Potwierdź dołączenie (Synced + Primary + ready + rozmiar)"
      ansible.builtin.assert:
        that:
          - "'4' in (join_state.stdout | default(''))"
          - cluster_state_after.stdout is search('wsrep_cluster_status\tPrimary')
          - cluster_state_after.stdout is search('wsrep_ready\tON')
          - cluster_state_after.stdout | regex_search('wsrep_cluster_size\t(\d+)', '\\1') | first | int >= galera_node_idx | int
        fail_msg: >
          {{ inventory_hostname }} nie osiągnął stanu Synced/Primary/ready lub rozmiar klastra
          jest niepoprawny: state={{ join_state.stdout }}, cluster={{ cluster_state_after.stdout }}
        success_msg: "{{ inventory_hostname }} dołączył do klastra (Synced, Primary, ready, size={{ cluster_state_after.stdout | regex_search('wsrep_cluster_size\t(\\d+)', '\\1') | first }})"

  handlers: []
