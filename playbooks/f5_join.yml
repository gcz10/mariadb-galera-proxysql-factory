---
# F5: Dołącz węzły Galera do Primary Component.
# Wymaga: gnode1 uruchomiony jako Primary Component (F4 bootstrap).
# Satisfies: ISC-14 (SST mariabackup), ISC-29 (auto rejoin).
# Lab: brak systemd — MariaDB uruchamiana jako daemon.

- name: "F5 — wdróż konfigurację mariabackup SST"
  hosts: galera
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    galera_cluster_name: "{{ galera.cluster_name }}"
    galera_nodes_csv: "{{ groups['galera'] | map('extract', hostvars, 'galera_node_address') | join(',') }}"
    sst_user: "sst_user"
    sst_password: "{{ lookup('ansible.builtin.env', 'SST_PASSWORD') }}"
    gcache_size: "{{ (mariadb_tuning | default({})).gcache_size | default('128M') }}"
    mariadb_config_dir: /etc/my.cnf.d

  tasks:
    - name: "Utwórz katalogi MariaDB"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        # owner: katalogi zapisywane przez mariadbd (User=mysql) musza byc mysql-owned.
        # Poprzedni heuryst 'mysql in item' nie lapol /run/mariadb (nie zawiera slowa
        # "mysql") -> tworzyl go jako root -> na EL10 (brak RuntimeDirectory w unicie)
        # ExecStartPre nie mogl zapisac wsrep-start-position. Tylko config_dir jest root.
        owner: "{{ 'root' if item == mariadb_config_dir else 'mysql' }}"
        group: "{{ 'root' if item == mariadb_config_dir else 'mysql' }}"
        mode: "0755"
      loop:
        - /run/mariadb
        - /var/log/mariadb
        - "{{ mariadb_config_dir }}"

    - name: "Wdróż server.cnf z mariabackup SST"
      ansible.builtin.template:
        src: ../roles/mariadb_install/templates/server.cnf.j2
        dest: "{{ mariadb_config_dir }}/server.cnf"
        owner: root
        group: mysql
        mode: "0640"

    - name: "Dystrybuuj certyfikaty TLS (gdy tls.mode=full)"
      ansible.builtin.include_tasks: tls_certs.yml
      when: (tls | default({})).mode | default('disabled') == 'full'

- name: "F5 — zapewnij konto SST na klastrze"
  hosts: galera[0]
  become: true
  vars:
    sst_user: "sst_user"
    sst_password: "{{ lookup('ansible.builtin.env', 'SST_PASSWORD') }}"
  pre_tasks:
    - name: "Wymagaj SST_PASSWORD"
      ansible.builtin.assert:
        that:
          - sst_password | length > 0
        fail_msg: "Ustaw SST_PASSWORD poza repozytorium (env)."

  tasks:
    - name: "Sprawdź czy MariaDB jest uruchomiona"
      ansible.builtin.shell: "mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e 'SELECT 1' 2>/dev/null"
      register: mariadb_check
      changed_when: false
      failed_when: false

    - name: "Utwórz konto SST (jeśli brak)"
      ansible.mysql.mysql_user:
        name: "{{ sst_user }}"
        password: "{{ sst_password }}"
        priv: "*.*:RELOAD,PROCESS,LOCK TABLES,BINLOG ADMIN,REPLICATION CLIENT"
        host: localhost
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      when: mariadb_check.rc == 0
      no_log: true

# audit: wsrep_sst_auth jest wczytywany z pliku TYLKO przy starcie mysqld.
# Rotacja SST_PASSWORD aktualizuje server.cnf oraz konto w bazie, ale dzialajacy
# mysqld trzyma w pamieci STARA wartosc. Dawca uwierzytelnia sie wtedy starym
# haslem do konta, ktore ma juz nowe, i SST pada:
#   [Warning] Access denied for user 'sst_user'@'localhost' (using password: YES)
#   WSREP_SST: [ERROR] mariadb-backup finished with error: 1
# Awaria jest UTAJONA — klaster raportuje sie zdrowo, dopoki jakis wezel nie musi
# sie dolaczyc, czyli ujawnia sie dopiero w trakcie awarii. site.yml tego nie
# ratuje: konfiguracje zapisal juz ten playbook, wiec nie widzi zmiany i nie
# restartuje. Zmienna jest dynamiczna, wiec synchronizujemy runtime bez restartu.
#
# Haslo idzie przez stdin, nie przez argv — argv jest widoczne w ps dla kazdego.
- name: "F5 — zsynchronizuj wsrep_sst_auth w działającym mysqld (rotacja hasła)"
  hosts: galera
  become: true
  gather_facts: false
  vars:
    sst_user: "sst_user"
    sst_password: "{{ lookup('ansible.builtin.env', 'SST_PASSWORD') }}"
  tasks:
    - name: "Sprawdź czy MariaDB jest uruchomiona"
      ansible.builtin.command:
        argv:
          - mariadb
          - --socket=/var/lib/mysql/mysql.sock
          - -N
          - -B
          - -e
          - "SELECT 1"
      register: f5_sst_auth_alive
      changed_when: false
      failed_when: false

    - name: "Ustaw wsrep_sst_auth zgodnie z konfiguracją"
      ansible.builtin.command:
        argv:
          - mariadb
          - --socket=/var/lib/mysql/mysql.sock
        stdin: "SET GLOBAL wsrep_sst_auth='{{ sst_user }}:{{ sst_password }}';"
      when: f5_sst_auth_alive.rc == 0
      changed_when: true
      no_log: true

- name: "F5 — dołącz węzły do Primary Component"
  hosts: galera
  become: true
  serial: 1
  max_fail_percentage: 0
  vars:
    expected_cluster_size: 3
    use_systemd: "{{ ansible_facts['service_mgr'] == 'systemd' }}"

  tasks:
    - name: "Pomiń węzeł Primary (gnode1)"
      ansible.builtin.meta: end_host
      when: galera_node_idx | default(1) == 1

    - name: "Sprawdź czy MariaDB już działa i jest Synced"
      ansible.builtin.shell: >
        mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
        "SHOW STATUS WHERE Variable_name='wsrep_local_state'" 2>/dev/null
      register: node_state
      changed_when: false
      failed_when: false

    - name: "Pomiń jeśli węzeł już Synced"
      ansible.builtin.meta: end_host
      when: "'4' in (node_state.stdout | default(''))"

    - name: "Zatrzymaj ewentualny proces MariaDB (tylko lab: brak systemd)"
      ansible.builtin.shell: "pkill -x mariadbd 2>/dev/null; sleep 2; true"
      changed_when: false
      when: not use_systemd

    - name: "Usuń aria log (tylko lab: brak systemd)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/mysql/aria_log_control
        - /var/lib/mysql/aria_log.00000001
      changed_when: false
      when: not use_systemd

    - name: "Wydrukuj adres klastra dla dołączającego węzła"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} dołącza do klastra jako node {{ galera_node_idx }}"

    - name: "Uruchom MariaDB jako węzeł dołączający — lab (bez systemd)"
      ansible.builtin.shell: |
        mariadbd --user=mysql --datadir=/var/lib/mysql \
          --socket=/var/lib/mysql/mysql.sock \
          > /var/log/mariadb/mariadb.log 2>&1 &
      changed_when: true
      when: not use_systemd

    - name: "Uruchom MariaDB jako węzeł dołączający — produkcja (systemctl start → SST/IST)"
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: true
      when: use_systemd

    - name: "Czekaj na osiągnięcie stanu Synced"
      ansible.builtin.shell: >
        mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
        "SHOW STATUS WHERE Variable_name='wsrep_local_state'" 2>/dev/null
      register: join_state
      until: "'4' in (join_state.stdout | default(''))"
      retries: 30
      delay: 5
      changed_when: false

    - name: "Weryfikuj rozmiar klastra po dołączeniu"
      ansible.builtin.shell: >
        mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e
        "SHOW STATUS WHERE Variable_name='wsrep_cluster_size'" 2>/dev/null
      register: cluster_size_after
      changed_when: false

    - name: "Potwierdź dołączenie"
      ansible.builtin.assert:
        that:
          - "'4' in (join_state.stdout | default(''))"
          - cluster_size_after.stdout | regex_search('\d+') | int >= galera_node_idx | int
        fail_msg: >
          {{ inventory_hostname }} nie osiągnął stanu Synced lub rozmiar klastra
          jest niepoprawny: state={{ join_state.stdout }}, size={{ cluster_size_after.stdout }}
        success_msg: "{{ inventory_hostname }} dołączył do klastra (Synced, size={{ cluster_size_after.stdout | regex_search('\\d+') }})"

  handlers: []
