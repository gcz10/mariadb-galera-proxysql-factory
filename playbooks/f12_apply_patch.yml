---
# f12_apply_patch.yml — wspólna logika patcha dla f12_patch.yml (audit#11).
# Wcześniej domyślna komenda `dnf check-update` udawała patch (operator dostawał
# "zdrowy raport" bez zmiany pakietów), a nadpisana komenda nie restartowała usługi
# ani nie weryfikowała runtime.
#
# Vars (ustawiane przez play-rodzica):
#   f12_role:           'galera' | 'proxysql'
#   f12_service:        usługa systemd do restartu gdy binarium się zmieni ('mariadb' / 'proxysql' / 'proxysql-nr')
#   f12_version_cmd:    komenda zwracająca wersję binaria ('mariadbd --version' / 'proxysql --version')
#   f12_patch_packages: lista pakietów do `dnf update` (real) — domyślnie [] → dry-run
#   f12_patch_command:  komenda operatora (real) — domyślnie '' → dry-run

- name: "Audit#11: odczytaj wersję binaria PRZED patch"
  ansible.builtin.command: "{{ f12_version_cmd }}"
  register: f12_ver_before
  changed_when: false

- name: "Audit#11: tryb patcha (real gdy pakiety LUB komenda operatora)"
  ansible.builtin.set_fact:
    f12_real_patch: >-
      {{ ((f12_patch_packages | default([])) | length > 0)
         or ((f12_patch_command | default('')) | length > 0) }}

- name: "Audit#11: DRY-RUN — brak f12_patch_packages/f12_patch_command (0 pakietów zmienionych)"
  ansible.builtin.debug:
    msg: >-
      DRY-RUN {{ inventory_hostname }}: wykonano tylko bramę zdrowia; 0 pakietów zmienionych.
      Realny patch: -e f12_patch_packages='[pkg1,pkg2]' (dnf update) lub f12_patch_command='...'.
  when: not (f12_real_patch | bool)

# Moduł ansible.builtin.dnf wymaga `state: latest` żeby zaktualizować
# zainstalowany pakiet — a ISC-63 bezwzględnie zabrania `state: latest`.
# `dnf update` przez command omija ten zakaz, bo lista pakietów jest jawna
# i kontrolowana (operator podaje -e f12_patch_packages='[...]'), a nie
# "zaktualizuj wszystko co możliwe". Moduł dnf traci idempotencję, ale
# patching z natury nie jest idempotentny — drugi przebieg nic nie zmienia.
- name: "Audit#11: real patch — dnf update wskazanych pakietów"
  ansible.builtin.command:
    argv: "{{ ['dnf', 'update', '-y'] + (f12_patch_packages | list) }}"
  register: f12_dnf_result
  # Drugi przebieg po juz spatchowanym wezle (np. converge zrobil mutacje
  # przed sciezka f12) konczy sie rc=1 "No packages marked for upgrade".
  # To legalny no-op, nie blad: pakiety sa w wersji docelowej. Tolerujemy
  # WYLACZNIE ten stderr — kazdy inny rc nadal pada. changed=false, wiec
  # restart uslugi nie nastapi.
  failed_when: >-
    f12_dnf_result.rc != 0
    and 'No packages marked for upgrade' not in (f12_dnf_result.stderr | default(''))
  changed_when: >-
    f12_dnf_result.rc == 0
  when:
    - f12_real_patch | bool
    - (f12_patch_packages | default([]) | length) > 0

- name: "Audit#11: real patch — komenda operatora"
  # noqa: command-instead-of-shell — komenda operatora (-e f12_patch_command=...)
  # moze legalnie uzywac featurow shella (potoki, &&, redyrekcje), bo to dane
  # operatora, nie nasz staly kod; wymuszenie modulu command zepsuloby kazda
  # taka komenda w runtime.
  ansible.builtin.shell: "{{ f12_patch_command }}"
  register: f12_cmd_result
  changed_when: true
  when:
    - f12_real_patch | bool
    - (f12_patch_command | default('') | length) > 0
    - (f12_patch_packages | default([]) | length) == 0

- name: "Audit#11: odczytaj wersję binaria PO patch"
  ansible.builtin.command: "{{ f12_version_cmd }}"
  register: f12_ver_after
  changed_when: false

- name: "Audit#11: restart usługi gdy binarium się zmienił (kontrolowany; bramę zdrowia sprawdzi play)"
  ansible.builtin.systemd:
    name: "{{ f12_service }}"
    state: restarted
  # Restart gdy cokolwiek realnie sie zmienilo — nie tylko gdy string
  # `--version` sie roznil. dnf update galera-4, mariadb-backup albo
  # bibliotek systemowych nie rusza `mariadbd --version`, ale proces w
  # pamieci nadal wykonuje stary kod. changed_when: true na dnf/command
  # jest tu wlasciwe: patching z definicji zmienia stan.
  when: >-
    f12_real_patch | bool
    and ((f12_dnf_result.changed | default(false))
         or (f12_cmd_result.changed | default(false))
         or (f12_ver_before.stdout != f12_ver_after.stdout))

- name: "Audit#11: raport wersji (przed/po) + decyzja restart"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} [{{ f12_role }}]
      przed={{ f12_ver_before.stdout }} | po={{ f12_ver_after.stdout }}
      {{ ' | RESTART ' ~ f12_service if ((f12_real_patch | bool) and ((f12_dnf_result.changed | default(false)) or (f12_cmd_result.changed | default(false)) or (f12_ver_before.stdout != f12_ver_after.stdout))) else (' | bez restartu (binarium niezmieniony)' if (f12_real_patch | bool) else ' | DRY-RUN') }}
