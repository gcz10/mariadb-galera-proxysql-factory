---
# Major upgrade JEDNEGO węzła Galera wg docs/runbooks/upgrade-mariadb-major.md
# (procedura 11.4.12 -> 11.8.9, wykonana 2026-08-31 na orionv13-r10 i
# cassiopeiav12-r9). Operator sekwencjonuje: canary non-writer, pozostali
# non-writers, writer ostatni (runbook §4). Playbook obsługuje JEDEN węzeł.
#
# Użycie:
#   make cluster-upgrade-node CLUSTER=<klaster> target_node=<węzeł> \
#     old_mariadb_version=<wersja instalowana przed upgrade>
# Drain/undrain wykonuje się na KAŻDYM węźle grupy proxysql i jest fail-closed:
# brak rejestracji węzła, błąd zapytania albo aktywne połączenia przerywają
# przebieg zanim playbook zatrzyma MariaDB. Szczegóły kontraktu przy play 1.
#
# Rollback: NIE istnieje jako downgrade (ISC-56) — po mariadb-upgrade jedyny
# rollback to restore z backupu. Backup PRZED (runbook §3) jest kontraktem
# operatora; playbook go nie robi.

# === Play 0: Walidacja parametrów (localhost, przed dotknięciem floty) ===
- name: "F12-node — walidacja parametrów"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_become: false
  tasks:
    - name: "Weryfikacja podania target_node i old_mariadb_version"
      ansible.builtin.assert:
        that:
          - target_node is defined
          - target_node | length > 0
          - target_node in (groups['galera'] | default([]))
          - groups['proxysql'] | default([]) | length > 0
          - old_mariadb_version is defined
          - old_mariadb_version | length > 0
        fail_msg: >-
          Ustaw -e target_node=<hostname z grupy galera: {{ groups['galera'] | default([]) | join(', ') }}>
          oraz -e old_mariadb_version=<wersja> (np. -e old_mariadb_version=11.4.12).

# === Play 1: Drain węzła w ProxySQL (OFFLINE_SOFT + dowód opróżnienia) ===
# WSZYSTKIE węzły grupy proxysql (jak f13_remove_node/cluster_deregister),
# nie [0]: każda instancja ProxySQL trzyma własne pule połączeń, więc drain
# pojedynczej zostawia ruch do węzła przez pozostałe. Fail-closed: brak
# tożsamości admina, brak rejestracji węzła, błąd zapytania albo timeout
# oczekiwania na ConnUsed==0 przerywa cały przebieg (serial+any_errors_fatal)
# zanim cokolwiek dotknie węzła Galera. Sekrety: tożsamość z
# /etc/proxysql/admin-check.cnf (zero haseł w argv/env), SQL przez stdin —
# nie trafia na listę procesów. Już odłączony węzeł = świadomy no-op
# (changed liczony ze stanu PRZED aktualizacją, nie na sztywno).
- name: "F12-node — drain węzła w ProxySQL (OFFLINE_SOFT + dowód opróżnienia)"
  hosts: proxysql
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  vars:
    target_ip: "{{ hostvars[target_node].galera_node_address }}"
    upgrade_drain_retries: 60
    upgrade_drain_delay: 2
    proxysql_admin_cli:
      - mariadb
      - --defaults-extra-file=/etc/proxysql/admin-check.cnf
      - --connect-timeout=2
      - -h127.0.0.1
      - -P6032
      - -uadmin
      - -N
      - -B
  tasks:
    - name: "Tożsamość admina ProxySQL musi istnieć (fail-closed zamiast błędu połączenia)"
      ansible.builtin.stat:
        path: /etc/proxysql/admin-check.cnf
      register: upgrade_admin_identity

    - name: "Blokuj drain bez /etc/proxysql/admin-check.cnf"
      ansible.builtin.assert:
        that: [upgrade_admin_identity.stat.exists]
        fail_msg: >-
          Brak /etc/proxysql/admin-check.cnf na {{ inventory_hostname }} —
          tożsamość administratora pary ProxySQL wdraża `make platform-proxysql`.
          Bez niej nie da się bezpiecznie odłączyć węzła od ruchu.

    - name: "Dowód rejestracji węzła w konfiguracji ProxySQL (SELECT, nie ROW_COUNT)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: "SELECT COUNT(*), COALESCE(SUM(status<>'OFFLINE_SOFT'),0) FROM mysql_servers WHERE hostname='{{ target_ip }}'"
      register: upgrade_drain_cfg
      changed_when: false

    - name: "Rozłóż odczyt rejestracji na liczby"
      ansible.builtin.set_fact:
        upgrade_drain_cfg_read: "{{ upgrade_drain_cfg.stdout | trim | split('\t') | map('int') | list }}"

    - name: "Fail-closed: węzeł musi być zarejestrowany na TYM ProxySQL"
      ansible.builtin.assert:
        that:
          - upgrade_drain_cfg_read[0] | int >= 1
        fail_msg: >-
          {{ inventory_hostname }}: {{ target_node }} ({{ target_ip }}) nie ma wpisu
          w mysql_servers. UPDATE po niezarejestrowanym hoście to cichy no-op —
          upgrade zatrzymałby MariaDB pod żywym ruchem. Popraw konfigurację
          ProxySQL/inventory i uruchom ponownie.

    - name: "Drain: OFFLINE_SOFT w konfiguracji + runtime (klienci idą na backup-writera)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: >-
          UPDATE mysql_servers SET status='OFFLINE_SOFT' WHERE hostname='{{ target_ip }}';
          LOAD MYSQL SERVERS TO RUNTIME
      # Stan PRZED aktualizacją decyduje o "changed": węzeł już odłączony
      # (suma niedrainowanych wpisów == 0) to no-op, nie udawana zmiana.
      changed_when: upgrade_drain_cfg_read[1] | int > 0
      no_log: true

    # ZMIENIONE 2026-09-09: jednorazowy odczyt przegrywal WYSCIG z monitorem
    # Galery w ProxySQL. Przy `mysql_galera_hostgroups` monitor sam przepisuje
    # status wezla (ONLINE/SHUNNED wg stanu wsrep) i potrafi nadpisac swiezo
    # zaladowany OFFLINE_SOFT, zanim sonda go zobaczy. Zmierzone dwa razy tego
    # samego dnia: `c15db2` i `o16db1` — bramka slusznie odmawiala zatrzymania
    # MariaDB, ale przyczyna byla przejsciowa, a nie realna.
    # Dlatego: PONAWIAMY drain wraz z odczytem, zamiast czytac raz. Bramka
    # ponizej pozostaje fail-closed — po wyczerpaniu prob nadal odmawia.
    - name: "Dowód w runtime: żaden wpis węzła nie przyjmie nowych połączeń"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: >-
          UPDATE mysql_servers SET status='OFFLINE_SOFT' WHERE hostname='{{ target_ip }}';
          LOAD MYSQL SERVERS TO RUNTIME;
          SELECT COUNT(*), COALESCE(SUM(status<>'OFFLINE_SOFT'),0) FROM runtime_mysql_servers WHERE hostname='{{ target_ip }}'
      register: upgrade_drain_rt
      changed_when: false
      until: >-
        (upgrade_drain_rt.stdout | trim | split('\t') | map('int') | list)[1] | int == 0
      retries: 12
      delay: 5

    - name: "Rozłóż odczyt runtime na liczby"
      ansible.builtin.set_fact:
        upgrade_drain_rt_read: "{{ upgrade_drain_rt.stdout | trim | split('\t') | map('int') | list }}"

    - name: "Fail-closed: runtime musi pokazywać OFFLINE_SOFT dla wszystkich wpisów"
      ansible.builtin.assert:
        that:
          - upgrade_drain_rt_read[0] | int >= 1
          - upgrade_drain_rt_read[1] | int == 0
        fail_msg: >-
          {{ inventory_hostname }}: runtime ProxySQL nie odzwierciedla OFFLINE_SOFT
          dla {{ target_ip }} (wpisy={{ upgrade_drain_rt_read[0] }},
          niedrainowane={{ upgrade_drain_rt_read[1] }}). LOAD MYSQL SERVERS TO
          RUNTIME nie doszedł do skutku — nie zatrzymuj MariaDB w tym stanie.

    - name: "Czekaj na zerowe aktywne połączenia do węzła (SUM(ConnUsed)==0, wzorzec f13)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: "SELECT COALESCE(SUM(ConnUsed),0) FROM stats_mysql_connection_pool WHERE srv_host='{{ target_ip }}'"
      register: upgrade_drain_conns
      until: >-
        upgrade_drain_conns.rc == 0 and
        (upgrade_drain_conns.stdout | trim) == '0'
      retries: "{{ upgrade_drain_retries }}"
      delay: "{{ upgrade_drain_delay }}"
      changed_when: false
      no_log: true

    - name: "Zapisz potwierdzenie zakończenia drain na tej instancji"
      ansible.builtin.set_fact:
        upgrade_node_drained: "{{ target_node }}"


# === Play 2: Upgrade pakietów i bazy na wskazanym węźle ===
- name: "F12-node — upgrade pakietów i tabele systemowe na wskazanym węźle"
  hosts: '{{ (target_node | default("__NIE_ZDEFINIOWANO_target_node__")) }}:&galera'
  become: true
  gather_facts: false
  serial: 1
  vars:
    # Rozmiar gcache na czas i po upgrade. Domyslnie DEKLARACJA najemcy, zeby
    # upgrade nie zmienial po cichu rozmiaru ustalonego przez operatora.
    # Wieksze okno IST na czas migracji: `-e upgrade_gcache_size=2G`.
    upgrade_gcache_size: >-
      {{ (mariadb_tuning | default({})).gcache_size | default('512M', true) }}
  vars_files:
    - vars/secret_policy.yml
  tasks:
    - name: "Wymagaj potwierdzenia drain od każdej instancji ProxySQL"
      ansible.builtin.assert:
        that:
          - groups['proxysql'] | default([]) | length > 0
          - hostvars[item].upgrade_node_drained | default('') == target_node
        fail_msg: "Brak potwierdzonego drain {{ target_node }} na {{ item }} — stop MariaDB zabroniony."
      loop: "{{ groups['proxysql'] | default(['__missing_proxysql__'], true) }}"

    - name: "Zaladuj lockfile klastra do namespace lock"
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock

    - name: "Brama zdrowia klastra przed dotknięciem węzła (ISC-55)"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml

    - name: "Czysty flush i stop MariaDB (runbook §5b)"
      ansible.builtin.command:
        argv:
          - mariadb
          - -u
          - root
          - -e
          - "SET GLOBAL innodb_fast_shutdown=0;"
      changed_when: true

    - name: "Zatrzymaj usługę mariadb"
      ansible.builtin.systemd:
        name: mariadb
        state: stopped

    - name: "Swap repo mariadb-server na serię docelową"
      ansible.builtin.replace:
        path: /etc/yum.repos.d/mariadb.repo
        regexp: "/repo/mariadb-server/{{ old_mariadb_version }}/"
        replace: "/repo/mariadb-server/{{ lock.mariadb.version }}/"

    # ZMIENIONE 2026-09-09: bylo `replace: "gcache.size=2G"` na sztywno, z
    # dowodem grepujacym te sama stala. Upgrade po cichu uchylal wiec decyzje
    # operatora o rozmiarze gcache (ISA: 512M -> 1G, swiadomie) i zostawial
    # rozjazd `cluster.yml` (1G) vs wdrozone (2G) — czyli dokladnie ten rodzaj
    # cichej zmiany stanu, ktora repo tepi gdzie indziej. Zrodlem jest teraz
    # DEKLARACJA najemcy; wieksze okno IST na czas upgrade robi sie jawnie:
    # `-e upgrade_gcache_size=2G`.
    - name: "Wymus gcache z deklaracji najemcy (okno IST, warunek #2 planu F12)"
      ansible.builtin.replace:
        path: /etc/my.cnf.d/server.cnf
        # Wartość OGRANICZONA do ';', cudzysłowów i końca linii. Stare
        # [^ \t\n]+ zjadało całą resztę listy opcji (gcache.page_size,
        # socket.dynamic, socket.ssl_*) — między opcjami wsrep_provider_options
        # nie ma spacji, więc każda podmiana rozmiaru wycinała TLS z configu.
        regexp: "gcache\\.size=[^;\"'\\n]+"
        replace: "gcache.size={{ upgrade_gcache_size }}"

    - name: "Dowód podmiany gcache (replace przy braku dopasowania przechodzi cicho)"
      ansible.builtin.command:
        argv:
          - grep
          - -q
          - "gcache\\.size={{ upgrade_gcache_size }}"
          - /etc/my.cnf.d/server.cnf
      changed_when: false

    - name: "Odśwież metadata repozytorium MariaDB"
      ansible.builtin.command:
        argv:
          - dnf
          - -q
          - makecache
          - --disablerepo=*
          - --enablerepo=mariadb-main
      changed_when: false

    # PRZEJSCIE MIEDZY RODZINAMI (11.x -> 12.x) NIE IDZIE PRZEZ `dnf upgrade`.
    # Scriptlet pakietu odmawia wprost: "Upgrading directly from MariaDB or
    # MySQL 11 to MariaDB 12 may not be safe... A manual upgrade is required...
    # Remove the existing MariaDB packages". Zmierzone na `o16db1` przy 11.4.13
    # i powtorzone przy 11.8.9 — to nie jest bledna konfiguracja, tylko kontrakt
    # pakietu. Oficjalna procedura dla RHEL (mariadb.com/docs .../upgrading-from
    # -mariadb-11-8-to-mariadb-12-3, krok 3: "yum remove MariaDB-server") kaze
    # WYMIENIC pakiet serwera. Datadir zostaje nietkniety — usuwamy pakiety, nie
    # dane, a `mariadb-upgrade` ponizej dokanca migracje tabel systemowych.
    # `server.cnf` NALEZY DO PAKIETU `MariaDB-server`, wiec `dnf remove` zabiera
    # go razem z pakietem, a nowy pakiet kladzie swoj domyslny — z ZAKOMENTOWANYM
    # `wsrep_provider`. Zmierzone na `o16db1`: po wymianie serwer wstal, ale z
    # `wsrep_cluster_size 0` i pusta nazwa providera, czyli POZA klastrem.
    # Dlatego kopia przed wymiana i przywrocenie po niej; rpm zostawia wprawdzie
    # `.rpmsave`, ale opieranie sie na jego nazewnictwie jest krucha umowa.
    - name: "Wymiana rodziny: zachowaj konfiguracje najemcy przed usunieciem pakietu"
      ansible.builtin.copy:
        src: /etc/my.cnf.d/server.cnf
        dest: /root/server.cnf.preupgrade
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: (old_mariadb_version | split('.'))[0] != (lock.mariadb.version | split('.'))[0]

    - name: "Wymiana rodziny: usun stary pakiet serwera (tylko gdy zmienia sie major)"
      ansible.builtin.dnf:
        name:
          - "{{ lock.mariadb.server_package | default('MariaDB-server') }}"
          - "MariaDB-server-compat"
        state: absent
        autoremove: false
      when: (old_mariadb_version | split('.'))[0] != (lock.mariadb.version | split('.'))[0]

    # MariaDB 12.3 wydzielilo wsparcie Galery z `MariaDB-server` do OSOBNEGO
    # pakietu `MariaDB-server-galera` — bez niego jednostka systemd startuje
    # bez providera wsrep, wiec wezel nie wraca do klastra. Serie 11.x takiego
    # pakietu NIE MAJA, dlatego pozycja jest warunkowa: wchodzi tylko wtedy,
    # gdy lockfile ja deklaruje (`server_galera_package`).
    - name: "Instaluj pakiety docelowej serii (piny z lockfile; ISC-56: allow_downgrade=false)"
      ansible.builtin.dnf:
        name:
          - "{{ lock.mariadb.server_package | default('MariaDB-server') }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
          - "{{ lock.mariadb.client_package | default('MariaDB-client') }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
          - "{{ lock.mariadb.mariadb_backup_package | default('MariaDB-backup') }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
          - "{{ lock.mariadb.galera_provider | default('galera-4') }}-{{ lock.mariadb.galera_provider_version }}-{{ lock.mariadb.galera_provider_rpm_release }}"
        state: present
        disablerepo: "*"
        enablerepo: "mariadb-main"
        allow_downgrade: false

    - name: "Instaluj pakiet Galery serwera (osobny pakiet dopiero od 12.3, wiec warunkowo)"
      ansible.builtin.dnf:
        name:
          - "{{ lock.mariadb.server_galera_package | default('') }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
        state: present
        disablerepo: "*"
        enablerepo: "mariadb-main"
        allow_downgrade: false
      when: (lock.mariadb.server_galera_package | default('')) | length > 0

    - name: "Wymiana rodziny: przywroc konfiguracje najemcy po instalacji"
      ansible.builtin.copy:
        src: /root/server.cnf.preupgrade
        dest: /etc/my.cnf.d/server.cnf
        remote_src: true
        owner: root
        group: mysql
        mode: "0640"
      when: (old_mariadb_version | split('.'))[0] != (lock.mariadb.version | split('.'))[0]

    - name: "Dowod: przywrocona konfiguracja ma providera wsrep"
      ansible.builtin.command:
        argv:
          - grep
          - -qE
          - "^wsrep_provider *= *[^ ]+"
          - /etc/my.cnf.d/server.cnf
      changed_when: false
      when: (old_mariadb_version | split('.'))[0] != (lock.mariadb.version | split('.'))[0]

    - name: "Start MariaDB"
      ansible.builtin.systemd:
        name: mariadb
        state: started

    - name: "Czekaj na powrót węzła do Synced (runbook §5b — 5 min, ISC-55)"
      ansible.builtin.command:
        argv:
          - mariadb
          - -u
          - root
          - -N
          - -B
          - -e
          - "SHOW GLOBAL STATUS LIKE 'wsrep_local_state_comment'"
      register: wsrep_state
      until: "'Synced' in wsrep_state.stdout"
      retries: 60
      delay: 5
      changed_when: false

    - name: "MariaDB-upgrade tabel systemowych (--skip-write-binlog, runbook §5b)"
      ansible.builtin.command:
        argv:
          - mariadb-upgrade
          - --skip-write-binlog
      register: mupgrade
      changed_when: "'Phase' in mupgrade.stdout and mupgrade.rc == 0"


# === Play 3: Undrain w ProxySQL (ONLINE) ===
# Ten sam zestaw ProxySQL co drain (play 1) — każdy host utrzymuje własny
# stan, więc ONLINE musi wrócić wszędzie. Fail-closed na braku rejestracji:
# zniknięcie węzła z mysql_servers w trakcie upgrade = konfiguracja zmieniona
# poza playbookiem; cichy no-op undrain zostawiłby węzeł poza rotacją.
- name: "F12-node — undrain węzła w ProxySQL (ONLINE)"
  hosts: proxysql
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  vars:
    target_ip: "{{ hostvars[target_node].galera_node_address }}"
    proxysql_admin_cli:
      - mariadb
      - --defaults-extra-file=/etc/proxysql/admin-check.cnf
      - --connect-timeout=2
      - -h127.0.0.1
      - -P6032
      - -uadmin
      - -N
      - -B
  tasks:
    - name: "Tożsamość admina ProxySQL musi istnieć (fail-closed zamiast błędu połączenia)"
      ansible.builtin.stat:
        path: /etc/proxysql/admin-check.cnf
      register: upgrade_admin_identity

    - name: "Blokuj undrain bez /etc/proxysql/admin-check.cnf"
      ansible.builtin.assert:
        that: [upgrade_admin_identity.stat.exists]
        fail_msg: >-
          Brak /etc/proxysql/admin-check.cnf na {{ inventory_hostname }} —
          tożsamość administratora pary ProxySQL wdraża `make platform-proxysql`.
          Bez niej węzeł po upgrade nie wróci do rotacji na tej instancji.

    - name: "Dowód rejestracji węzła w konfiguracji ProxySQL (SELECT, nie ROW_COUNT)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: "SELECT COUNT(*), COALESCE(SUM(status<>'ONLINE'),0) FROM mysql_servers WHERE hostname='{{ target_ip }}'"
      register: upgrade_undrain_cfg
      changed_when: false

    - name: "Rozłóż odczyt rejestracji na liczby"
      ansible.builtin.set_fact:
        upgrade_undrain_cfg_read: "{{ upgrade_undrain_cfg.stdout | trim | split('\t') | map('int') | list }}"

    - name: "Fail-closed: węzeł musi nadal być zarejestrowany na TYM ProxySQL"
      ansible.builtin.assert:
        that:
          - upgrade_undrain_cfg_read[0] | int >= 1
        fail_msg: >-
          {{ inventory_hostname }}: {{ target_node }} ({{ target_ip }}) zniknął
          z mysql_servers w trakcie upgrade — konfiguracja ProxySQL została
          zmieniona poza playbookiem. Undrain cichego braku rejestracji byłby
          no-op i węzeł nie wróciłby do rotacji. Wyjaśnij rozjazd, potem ponów.

    - name: "Undrain: ONLINE w konfiguracji + runtime (monitor galera wyrówna placement)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: >-
          UPDATE mysql_servers SET status='ONLINE' WHERE hostname='{{ target_ip }}';
          LOAD MYSQL SERVERS TO RUNTIME
      changed_when: upgrade_undrain_cfg_read[1] | int > 0
      no_log: true

    - name: "Dowód w runtime: wszystkie wpisy węzła z powrotem ONLINE"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: "SELECT COUNT(*), COALESCE(SUM(status<>'ONLINE'),0) FROM runtime_mysql_servers WHERE hostname='{{ target_ip }}'"
      register: upgrade_undrain_rt
      changed_when: false

    - name: "Rozłóż odczyt runtime na liczby"
      ansible.builtin.set_fact:
        upgrade_undrain_rt_read: "{{ upgrade_undrain_rt.stdout | trim | split('\t') | map('int') | list }}"

    - name: "Fail-closed: runtime musi pokazywać ONLINE dla wszystkich wpisów"
      ansible.builtin.assert:
        that:
          - upgrade_undrain_rt_read[0] | int >= 1
          - upgrade_undrain_rt_read[1] | int == 0
        fail_msg: >-
          {{ inventory_hostname }}: runtime ProxySQL nie pokazuje ONLINE dla
          {{ target_ip }} (wpisy={{ upgrade_undrain_rt_read[0] }},
          pozostające offline={{ upgrade_undrain_rt_read[1] }}). Węzeł nie wróci
          do rotacji — sprawdź monitor galera i konfigurację hostgroup.


# === Play 4: Weryfikacja po upgrade na wskazanym węźle ===
- name: "F12-node — weryfikacja po upgrade na wskazanym węźle"
  hosts: '{{ (target_node | default("__NIE_ZDEFINIOWANO_target_node__")) }}:&galera'
  become: true
  gather_facts: false
  tasks:
    - name: "Zaladuj lockfile klastra do namespace lock"
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock

    - name: "Brama zdrowia klastra po upgrade (ISC-55)"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml

    - name: "Wersja po upgrade = wersja z lockfile"
      ansible.builtin.command:
        argv:
          - mariadb
          - -u
          - root
          - -N
          - -B
          - -e
          - "SELECT @@version"
      register: version_after
      changed_when: false

    - name: "Assert wersji docelowej"
      ansible.builtin.assert:
        that:
          - "lock.mariadb.version in version_after.stdout"
        fail_msg: "Węzeł {{ inventory_hostname }} raportuje {{ version_after.stdout | trim }} zamiast {{ lock.mariadb.version }}"
