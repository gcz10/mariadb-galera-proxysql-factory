---
# F8: Redundantny endpoint ProxySQL — Keepalived VIP.
#
# Playbook WYLACZNIE warstwy wspolnej (make platform-endpoint). VIP .133 jest
# wspoldzielony przez cala flote, wiec zaden klaster Galera nie moze go
# konfigurowac: build dowolnego najemcy nadpisalby VRRP pozostalym, a teardown
# najemcy zdjalby endpoint wszystkim. Do niedawna nie bylo tu bramki wlasciciela
# i kazdy `make cluster-endpoint` odpalal ten playbook przeciw wspolnej parze
# fcp1/fcp2 — dlatego ponizej definicja platformy jest sprawdzana jawnie.
#
# Satisfies: ISC-24 (VIP działa gdy oba ProxySQL zdrowe),
# ISC-25 (awaria aktywnego ProxySQL < RTO węzła — klient wznawia przez VIP),
# ISC-26 (VIP nie kieruje ruchu do niesprawnej instancji).
# VRRP unicast — stabilne w sieciach bez multicast (Docker/OrbStack).
# Lab: brak systemd — keepalived uruchamiany jako daemon.

- name: "F8 — Keepalived VIP dla endpointu ProxySQL"
  hosts: proxysql
  serial: 1
  max_fail_percentage: 0
  become: true
  vars:
    keepalived_interface: "{{ proxysql_endpoint_interface | default('eth0') }}"
    keepalived_vip_prefix: "{{ proxysql_endpoint_prefix | default(24) }}"
    keepalived_virtual_router_id: "{{ proxysql.endpoint.virtual_router_id | default(51) }}"
    keepalived_auth_pass: "{{ lookup('ansible.builtin.env', 'KEEPALIVED_AUTH_PASS') }}"

  pre_tasks:
    # VIP jest wlasnoscia warstwy wspolnej, a nie zadnego klastra, wiec
    # uruchomienie z definicji najemcy jest bledem operatora — i musi wywalc
    # sie od razu, zanim cokolwiek dotknie wspolnej pary fcp1/fcp2. Dwa
    # rozrozniki, bo kazdy z osobna daje sie oszukac: definicja najemcy MOZE
    # deklarowac proxysql.endpoint (deklaruje go, zeby wiedziec, gdzie sie
    # laczyc), a plik niebedacy platforma moze nie miec bloku galera.
    # platform.name jest kluczem definicji platformy — najemca ma blok
    # platform tylko z rocky_linux_major.
    - name: "Odrzuc uruchomienie z definicja inna niz platforma"
      ansible.builtin.assert:
        that:
          - platform.name is defined
          - platform.name | length > 0
          - galera is not defined
        fail_msg: >-
          Ten playbook zarzadza warstwa wspolna i wymaga definicji platformy
          (platform/shared/platform.yml) — definicja klastra (blok galera)
          oznacza najemce, a najemca nie zarzadza ta warstwa.
          Uruchom: make platform-endpoint

    - name: "Wymagaj endpointu typu keepalived_vip"
      ansible.builtin.assert:
        that:
          - proxysql.endpoint.type == 'keepalived_vip'
          - proxysql.endpoint.address | length > 0
        fail_msg: "F8 wymaga proxysql.endpoint.type=keepalived_vip z ustawionym address."

    - name: "Wymagaj hasła VRRP"
      ansible.builtin.assert:
        that:
          - keepalived_auth_pass | length > 0
        fail_msg: "Ustaw KEEPALIVED_AUTH_PASS poza repozytorium."

    - name: "Wymagaj uruchomionego ProxySQL"
      ansible.builtin.command: pgrep -x proxysql
      changed_when: false

  tasks:
    - name: "Instaluj keepalived"
      ansible.builtin.dnf:
        name: keepalived
        state: present

    # SELinux blokuje domenie keepalived_t polaczenia na porty bez dedykowanej etykiety
    # (ProxySQL 6033 = unreserved_port_t). Bez tego vrrp_script chk_proxysql konczy sie
    # na pierwszym checku ("avc: denied { name_connect } dest=6033"), instancja wpada
    # w FAULT i VIP nigdy nie wstaje - przy czym ten sam skrypt uruchomiony recznie
    # z sesji SSH dziala, bo dziala w innej domenie. Dedykowany boolean zamiast
    # wlasnego modulu polityki.
    - name: "SELinux - pozwol keepalived laczyc sie z portem ProxySQL (health-check)"
      ansible.posix.seboolean:
        name: keepalived_connect_any
        state: true
        persistent: true
      when: ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

    - name: "Wdróż skrypt health-check ProxySQL"
      ansible.builtin.copy:
        src: ../roles/proxysql_endpoint/files/check_proxysql.sh
        dest: /usr/local/bin/check_proxysql.sh
        owner: root
        group: root
        mode: "0755"
      register: kl_script

    - name: "Wdróż konfigurację keepalived"
      ansible.builtin.template:
        src: ../roles/proxysql_endpoint/templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0600"
      register: kl_config
      no_log: true

    - name: "Sprawdź dostępność systemd"
      ansible.builtin.stat:
        path: /run/systemd/system
      register: kl_systemd

    # --- Ścieżka systemd (produkcja) ---
    - name: "Włącz i uruchom keepalived przez systemd"
      ansible.builtin.systemd:
        name: keepalived
        state: "{{ 'restarted' if (kl_config.changed or kl_script.changed) else 'started' }}"
        enabled: true
        daemon_reload: true
      when: kl_systemd.stat.exists

    # --- Ścieżka bez systemd (laboratorium) ---
    - name: "Sprawdź proces keepalived bez systemd"
      ansible.builtin.command: pgrep -x keepalived
      register: kl_process
      changed_when: false
      failed_when: false
      when: not kl_systemd.stat.exists

    - name: "Zatrzymaj keepalived po zmianie konfiguracji (lab)"
      ansible.builtin.command: pkill -TERM -x keepalived
      when:
        - not kl_systemd.stat.exists
        - kl_process.rc == 0
        - kl_config.changed or kl_script.changed
      changed_when: true
      failed_when: false

    - name: "Poczekaj na zwolnienie VIP po restarcie (lab)"
      ansible.builtin.pause:
        seconds: 2
      when:
        - not kl_systemd.stat.exists
        - kl_process.rc == 0
        - kl_config.changed or kl_script.changed

    - name: "Uruchom keepalived bez systemd (lab)"
      ansible.builtin.command: keepalived -D -f /etc/keepalived/keepalived.conf
      when:
        - not kl_systemd.stat.exists
        - (kl_process.rc != 0) or (kl_config.changed or kl_script.changed)
      changed_when: true

    - name: "ISC-24: czekaj na VIP na węźle MASTER"
      # pipefail nie zmienia semantyki: ip zawsze konczy sie rc=0, o wyniku
      # decysuje grep; wyjscie ip to pojedyncze linie adresow, daleko
      # ponizej bufora potoku, wiec grep -q nie moze wywolas SIGPIPE.
      ansible.builtin.shell: >-
        set -o pipefail;
        ip -o -4 addr show dev {{ keepalived_interface }} | grep -q "{{ proxysql.endpoint.address }}/"
      register: vip_master_check
      until: vip_master_check.rc == 0
      retries: 15
      delay: 2
      changed_when: false
      when: proxysql_node_idx | int == 1

    - name: "ISC-26: BACKUP nie trzyma VIP gdy MASTER zdrowy"
      ansible.builtin.shell: >-
        set -o pipefail;
        ip -o -4 addr show dev {{ keepalived_interface }} | grep -q "{{ proxysql.endpoint.address }}/"
      register: vip_backup_check
      changed_when: false
      failed_when: vip_backup_check.rc == 0
      when: proxysql_node_idx | int != 1

  handlers: []
