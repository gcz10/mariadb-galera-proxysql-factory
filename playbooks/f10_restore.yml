---
# F10: Restore drill — odtwórz backup na CZYSTY IZOLOWANY host (rnode1) i sprawdź integralność.
# Satisfies: ISC-34 (weryfikacja checksum), ISC-36 (restore + integrity), ISC-37 (drill + stan).
# rnode1 NIE jest częścią klastra Galera — standalone MariaDB (dowód, że backup jest samodzielnie odtwarzalny).

- name: "F10 — restore drill na rnode1 (czysty izolowany host)"
  hosts: restore
  become: true
  gather_facts: true
  vars_files:
    - vars/proxysql_hostgroups.yml
  vars:
    mariadb_version: "{{ lock.mariadb.version.split('.')[:2] | join('.') }}"
    galera_backup_encryption_key: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_ENCRYPTION_KEY') | default(lookup('ansible.builtin.env', 'BACKUP_ENCRYPTION_KEY'), true) }}"
    galera_backup_s3_access_key: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_S3_ACCESS_KEY') | default('', true) }}"
    galera_backup_s3_secret_key: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_S3_SECRET_KEY') | default('', true) }}"
    galera_backup_smb_username: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_SMB_USERNAME') | default('', true) }}"
    galera_backup_smb_password: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_SMB_PASSWORD') | default('', true) }}"
    galera_backup_smb_domain: "{{ lookup('ansible.builtin.env', 'GALERA_BACKUP_SMB_DOMAIN') | default('', true) }}"

  pre_tasks:
    - name: "Zaladuj lockfile platformy (reprodukowalne wersje)"
      ansible.builtin.include_vars:
        file: "../{{ (versions | default({})).lock_file | default('versions/versions.lock.yml') }}"
        name: lock

    - name: "Audit#5: restore wymaga -e restore_confirm=yes"
      ansible.builtin.assert:
        that:
          - restore_confirm is defined
          - restore_confirm | bool
        fail_msg: "Restore usuwa datadir na hoście docelowym — wymaga -e restore_confirm=yes."

    - name: "Audit#5: host restore NIE może należeć do galera/proxysql (ochrona żywego klastra)"
      ansible.builtin.assert:
        that:
          - inventory_hostname not in (groups['galera'] | default([]))
          - inventory_hostname not in (groups['proxysql'] | default([]))
        fail_msg: >-
          Host restore ({{ inventory_hostname }}) jest też w grupie galera/proxysql.
          Restore wyczyści datadir i zniszczy żywy klaster. Użyj osobnego hosta (grupa restore).

  roles:
    - role: galera_backup
      vars:
        galera_backup_local_role: restore
        galera_backup_install_cron: false
        galera_backup_provision_s3: false
        galera_backup_inherited_shared_secrets: >-
          {{ hostvars[backup.scheduler.host].galera_backup_shared_secrets | default({}) }}
  tasks:
    - name: "MariaDB repo - pobierz setup (audit#6: weryfikacja sha256)"
      ansible.builtin.get_url:
        url: "{{ lock.mariadb.repo_setup_script }}"
        dest: /usr/local/bin/mariadb_repo_setup
        mode: "0755"
        checksum: "sha256:{{ lock.mariadb.repo_setup_sha256 }}"

    # Jak w f2_install: bramka na TRESCI, nie na istnieniu pliku. Host restore
    # jest odtwarzany co drill, ale gdy przetrwa podbicie wersji, `creates:`
    # zostawiloby go przy starym repozytorium.
    - name: "MariaDB repo - sprawdz, czy wskazuje wersje z lockfile ({{ mariadb_version }})"
      ansible.builtin.command: "grep -Eq 'mariadb-(server/)?{{ lock.mariadb.version | regex_escape }}/' /etc/yum.repos.d/mariadb.repo"
      register: restore_repo_pinned
      failed_when: false
      changed_when: false

    - name: "MariaDB repo - konfiguruj wersje z lockfile ({{ mariadb_version }})"
      ansible.builtin.command: "/usr/local/bin/mariadb_repo_setup {{ lock.mariadb.repo_setup_args }} --skip-check-installed"
      when: restore_repo_pinned.rc != 0
      changed_when: true

    # Host restore przechodzi te sama pulapke co wezly klastra: scriptlet
    # pakietu ODMAWIA przejscia 11.x -> 12.x przez `dnf upgrade` i kaze wymienic
    # pakiet serwera (mariadb.com/docs .../upgrading-from-mariadb-11-8-to-
    # mariadb-12-3, krok 3). Zmierzone na `o16r1`: drill po upgrade klastra do
    # 12.3.3 padal, bo host mial jeszcze serwer 11.4.13. Tu wymiana jest TANSZA
    # niz na wezle: host jest poza klastrem, a jego datadir i tak kasuje
    # `galera-backup restore` przy kazdym drillu.
    - name: "Odczytaj zainstalowane pakiety hosta restore"
      ansible.builtin.package_facts:
        manager: rpm

    - name: "Wymiana rodziny: usun stary pakiet serwera na hoscie restore"
      ansible.builtin.dnf:
        name:
          - "{{ lock.mariadb.server_package }}"
          - "MariaDB-server-compat"
        state: absent
        autoremove: false
      when:
        - lock.mariadb.server_package in ansible_facts.packages
        - (ansible_facts.packages[lock.mariadb.server_package][0].version | split('.'))[0]
          != (lock.mariadb.version | split('.'))[0]

    - name: "Instaluj MariaDB server/backup/klienta (wersje PRZYPIETE z lockfile; audit#12)"
      ansible.builtin.dnf:
        name:
          - "{{ lock.mariadb.server_package }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
          - "{{ lock.mariadb.client_package }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
          - "{{ lock.mariadb.mariadb_backup_package }}-{{ lock.mariadb.version }}-{{ lock.mariadb.rpm_release }}"
          - socat
          - python3-pip
          - openssl
        state: present

    # Host restore jest poza klastrem (asercja wyzej), ale pakiet MariaDB-server
    # instalujemy tu sami — a `galera-backup restore` kasuje katalog danych i
    # robi `--copy-back`. Gdyby systemowy mariadbd akurat dzialal (recznie
    # wystartowany, zostawiony przez poprzedni drill, wlaczony presetem), obie
    # operacje szlyby po ZYWYM datadirze: to korupcja, nie odtworzenie.
    #
    # Maskujemy, nie tylko zatrzymujemy: sam `stop` wraca po reboocie i kolejny
    # drill trafilby znowu na dzialajaca usluge. Weryfikacja nie potrzebuje tej
    # jednostki — restore.py uruchamia wlasny, izolowany `mariadbd`
    # (--skip-networking, --wsrep-provider=none) bezposrednio, poza systemd.
    - name: "Zbierz stan usług hosta restore"
      ansible.builtin.service_facts:

    - name: "Zatrzymaj i zamaskuj systemowy mariadb.service przed czyszczeniem datadir"
      ansible.builtin.systemd_service:
        name: mariadb
        state: stopped
        enabled: false
        masked: true
      when: "'mariadb.service' in (ansible_facts.services | default({}))"

    - name: "Odtwórz i zweryfikuj backup za pomocą galera-backup runnera"
      ansible.builtin.command:
        argv:
          - /opt/galera-backup/galera-backup
          - restore
          - "{{ cluster.name }}"
          - --confirm
      # Restore z definicji mutuje datadir na hoście docelowym — to nie jest
      # zadanie "check-only", wiec zmienilismy stan zawsze, gdy doszlo do skutku.
      changed_when: true

# Drill zapisuje sukces do state.json na hoscie restore, ale metryka
# `isa_restore_test_last_success_unixtime` mieszka w textfile collectorze na
# galera[0] i byla odswiezana WYLACZNIE recznym uruchomieniem F11. Skutek: alert
# ISC-47 "Restore drill stale" mierzyl, kiedy ostatnio puszczono Ansible, a nie
# kiedy ostatnio udal sie drill. Domykamy to tutaj — po udanym drillu metryka
# jest publikowana w tym samym przebiegu.
- name: "F10 — opublikuj swiezosc drillu (ISC-49) zaraz po jego sukcesie"
  ansible.builtin.import_playbook: f11_freshness.yml
