---
# F11 — pmm-client (pmm-agent) na wybranych hostach.
#
# DLACZEGO ISTNIEJE: domyslna sciezka repo jest AGENTLESS — PMM Server sam laczy
# sie do baz, a node_exporter jest tarballem z GitHuba. Dziala, ale:
#   * stockowe dashboardy ProxySQL sa MARTWE (0/40 metryk) — oczekuja namespace'u
#     Perconowego proxysql_exportera, a restapi ProxySQL emituje inne nazwy,
#   * tarball nie ma kanalu aktualizacji (brak dnf, brak cyklu zycia pakietu),
#   * konto monitorujace musi byc otwarte na siec (pmm_monitor@%).
# pmm-client rozwiazuje wszystkie trzy — kosztem paczki na hoscie.
#
# ZAKRES: host dostaje agenta, gdy jego grupa jest w `monitoring.agent_groups`
# danego klastra. Konsument wspolnej pary ProxySQL nie rusza jej wezlow (naleza
# do ownera) — patrz proxysql.role.
#
# TRYB METRYK: zawsze `push`. Domyslka `pmm-admin add` to `auto`, ktore w tym
# srodowisku wybiera `pull`, a pull wymaga otwarcia 42000-51999 przychodzaco —
# czego minimalna polityka firewalld (ISC-5) nie dopuszcza. Zweryfikowane:
# przy `auto` eksporter startowal, ale `up=0` i curl z PMM zwracal 000.
#
# SEKRETY: haslo PMM idzie przez PMM_AGENT_SERVER_PASSWORD (env), haslo bazy/
# ProxySQL przez body zadania API. `pmm-admin add` przyjmuje je tylko jako
# --password w argv, co lamie ISC-43 — dlatego uslugi tworzymy przez API.

- name: "F11 — zainstaluj i zarejestruj pmm-agent"
  hosts: all
  become: true
  serial: 1
  vars_files:
    - "../{{ versions.lock_file }}"
  vars:
    pmm_agent_target: >-
      {{ (group_names | intersect(monitoring.agent_groups | default([])) | length > 0)
         and not ((proxysql.role | default('owner')) == 'consumer'
                  and (group_names | intersect(['proxysql', 'infra']) | length > 0)) }}
    pmm_admin_password: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_PASSWORD') }}"
    pmm_server_host: "{{ monitoring.pmm.server_url | regex_replace('^https?://', '') | regex_replace('/$', '') }}"
    pmm_node_name: "{{ monitoring.pmm.cluster_name }}-{{ inventory_hostname }}"
    # Ten sam przelacznik, ktory steruje wywolaniami API nizej i cala rejestracja
    # w f11_pmm_client.yml. Wczesniej `pmm-agent setup` mial pominiecie weryfikacji
    # TLS wpisane na sztywno, wiec `validate_certs: true` nie mialo zadnego
    # przelozenia na kanal agent -> serwer PMM.
    pmm_validate_certs_effective: "{{ monitoring.get('pmm', {}).get('validate_certs', false) | bool }}"
  environment:
    PMM_AGENT_SERVER_ADDRESS: "{{ pmm_server_host }}:443"
    PMM_AGENT_SERVER_USERNAME: admin
    PMM_AGENT_SERVER_INSECURE_TLS: "{{ '0' if pmm_validate_certs_effective else '1' }}"
    PMM_AGENT_CONFIG_FILE: /usr/local/percona/pmm/config/pmm-agent.yaml
    # Wezel zarejestrowany przez `pmm-agent setup` NIE dostaje etykiet klastra —
    # te ustawia tylko rejestracja przez API (f11_pmm_client.yml). Bez nich PMM
    # nie przypisze wezla do klastra: znika z dashboardow filtrowanych po `cluster`
    # i z sondy akceptacyjnej. API nie pozwala ich dodac pozniej (501), wiec MUSZA
    # byc podane przy rejestracji.
    PMM_AGENT_SETUP_CUSTOM_LABELS: "cluster={{ monitoring.pmm.cluster_name }},environment={{ cluster.environment }}"

  tasks:
    - name: "Pomin hosty spoza monitoring.agent_groups"
      ansible.builtin.meta: end_host
      when: not (pmm_agent_target | bool)

    - name: "Wymagaj hasla PMM poza repozytorium"
      ansible.builtin.assert:
        that: pmm_admin_password | length > 0
        fail_msg: "Ustaw PMM_ADMIN_PASSWORD poza repozytorium."

    # Eksportery tworzone nizej przez API PMM sa walidowane POLACZENIEM: PMM
    # loguje sie jako pmm_monitor i odrzuca zadanie golym HTTP 400, gdy konta
    # nie ma. f11_pmm_client.yml tworzy je tez, ale biegnie PO tym playbooku,
    # wiec na swiezym klastrze bylo za pozno.
    #
    # WYLACZNIE @'%'. Konto @localhost jest w tym repo uznane za legacy i
    # f11_pmm_client.yml:677 je kasuje — tworzenie go tutaj dawalo ping-pong
    # (agent tworzy, client kasuje) i F11 nigdy nie zbiegalo do changed=0.
    #
    # CIEN ANONIMOWYCH KONT: swieza instalacja Mariadb tworzy ''@'localhost'
    # (i ''@'<hostname>'), a MariaDB resolvuje 127.0.0.1 do 'localhost'.
    # Anonim o bardziej konkretnym hoscie WYGRYWA z pmm_monitor@'%' — eksporter
    # laczy sie po TCP na 127.0.0.1 i dostaje "Access denied for user
    # 'pmm_monitor'@'localhost'", a API PMM odrzuca POST golym 400 bez
    # wskazania przyczyny. F6 (ISC-40) usuwa anonimowych, ale biegnie PO F11,
    # wiec na swiezym klastrze kazde tworzenie eksportera pod lokalnym agentem
    # padalo. Tu idzie identyczne SQL jak w F6 — F6 zostaje audytorem, a jego
    # drugi przebieg jest no-op. DDL replikuje sie Galera-wide z jednego wezla.
    - name: "Usun anonimowe konta cieniujace pmm_monitor (to samo SQL co F6)"
      ansible.builtin.shell: |-
        set -o pipefail
        stmts=$(mariadb --socket=/var/lib/mysql/mysql.sock -N -B -e "SELECT CONCAT('DROP USER IF EXISTS ', QUOTE(user), '@', QUOTE(host), ';') FROM mysql.user WHERE user=''")
        if [ -n "$stmts" ]; then echo "$stmts" | mariadb --socket=/var/lib/mysql/mysql.sock; fi
      register: pmm_anon_cleanup
      changed_when: "'DROP USER' in pmm_anon_cleanup.stdout | default('')"
      when:
        - inventory_hostname in groups.get('galera', [])
        - galera_node_idx | default(1) == 1

    - name: "Zapewnij konto bazy danych pmm_monitor"
      ansible.mysql.mysql_user:
        name: pmm_monitor
        password: "{{ lookup('ansible.builtin.env', 'PMM_MONITOR_PASSWORD') }}"
        host: "%"
        priv: "*.*:PROCESS,REPLICATION CLIENT,SELECT,SHOW DATABASES,RELOAD"
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
      when:
        - inventory_hostname in groups.get('galera', [])
        - galera_node_idx | default(1) == 1
      no_log: true

    - name: "Repozytorium Percony"
      ansible.builtin.dnf:
        name: "{{ pmm_client.release_rpm }}"
        state: present
        disable_gpg_check: true
      register: pmm_release_rpm
      changed_when: pmm_release_rpm.changed

    - name: "Wlacz komponent pmm3-client"
      ansible.builtin.command:
        argv: [percona-release, enable, "{{ pmm_client.repo_component }}"]
      args:
        # percona-release dopisuje sufiks `-release` do nazwy pliku; bez niego
        # `creates` nigdy nie trafial i zadanie raportowalo `changed` co przebieg.
        creates: "/etc/yum.repos.d/percona-{{ pmm_client.repo_component }}-release.repo"

    - name: "Zainstaluj PRZYPIETA wersje pmm-client"
      ansible.builtin.dnf:
        name: "{{ pmm_client.package }}"
        state: present
        allow_downgrade: true

    - name: "Sprawdz, czy agent jest juz skonfigurowany"
      ansible.builtin.command:
        # Limit czasu jest KONIECZNY: gdy lokalne API agenta sie zaklinuje,
        # `pmm-admin status` nie wraca nigdy i caly playbook wisi bez zadnego
        # komunikatu. Obserwowane zaklinowania mialy zrodlo w eksporterach z
        # wyczyszczonym haslem (patrz uzgadnianie ponizej) — samo DELETE przez API
        # sprawdzono i agenta NIE wiesza. Timeout zamienia zwis w czytelna porazke.
        argv: [timeout, "20", pmm-admin, status, --json]
      register: pmm_state
      changed_when: false
      failed_when: false

    - name: "Zarejestruj wezel (haslo przez env, nie argv)"
      ansible.builtin.command:
        # Flaga pomijajaca weryfikacje TLS musi znikac z argv, gdy klaster ma
        # validate_certs=true — inaczej `pmm-agent setup` i tak zestawi kanal
        # bez sprawdzenia certyfikatu serwera PMM. Lista sklejana warunkowo,
        # bo `argv` nie przyjmuje `when` na pojedynczym elemencie.
        argv: >-
          {{ ['pmm-agent', 'setup', '--force']
             + ([] if pmm_validate_certs_effective else ['--server-insecure-tls'])
             + [ansible_host, 'generic', pmm_node_name] }}
      environment:
        PMM_AGENT_SERVER_PASSWORD: "{{ pmm_admin_password }}"
      # Nie wystarczy 'czy zainstalowany': agent moze byc skonfigurowany, ale
      # jego wezel usuniety po stronie serwera — wtedy status zwraca rc=0,
      # a agent nigdy sie nie polaczy. Kryterium jest POLACZENIE.
      when: pmm_state.rc != 0 or not ((pmm_state.stdout | default('{}') | from_json).pmm_agent_status.connected | default(false)) or (pmm_force_resetup | default(false) | bool)
      changed_when: true
      no_log: true
    - name: "Wlacz i zrestartuj pmm-agent"
      ansible.builtin.systemd_service:
        name: pmm-agent
        state: restarted
        enabled: true
      when: pmm_state.rc != 0 or not ((pmm_state.stdout | default('{}') | from_json).pmm_agent_status.connected | default(false))

    - name: "Poczekaj na polaczenie agenta"
      ansible.builtin.command:
        argv: [pmm-admin, status, --json]
      register: pmm_ready
      until: pmm_ready.rc == 0 and (pmm_ready.stdout | from_json).pmm_agent_status.connected | default(false)
      retries: 12
      delay: 5
      changed_when: false

    - name: "Zapamietaj identyfikatory agenta"
      ansible.builtin.set_fact:
        pmm_local_agent_id: "{{ (pmm_ready.stdout | from_json).pmm_agent_status.agent_id }}"
        pmm_local_node_id: "{{ (pmm_ready.stdout | from_json).pmm_agent_status.node_id }}"

    # node_exporter niesie teraz pmm-agent. Tarballowy standalone zostawiony
    # dzialalby rownolegle na 9100 i dublowal metryki tego samego hosta.
    - name: "Zatrzymaj samodzielny node_exporter (zastapiony przez agenta)"
      ansible.builtin.systemd_service:
        name: node_exporter
        state: stopped
        enabled: false
      failed_when: false

    # KRYTYCZNE: runner backupu pisze metryki do /var/lib/node_exporter/textfile_collector
    # (roles/galera_backup/templates/config.json.j2). Ten katalog obslugiwal tarballowy
    # node_exporter, ktory wlasnie zatrzymalismy — node_exporter Z PACZKI czyta wlasne
    # katalogi. Bez tego kroku runner dalej PISZE pliki, ale nikt ich nie czyta:
    # galera_backup_* i isa_restore_test_* znikaja, a alerty backup-failed/backup-stale/
    # restore-drill-stale CICHO przestaja dzialac. To wygaszenie alertowania backupu,
    # nie kosmetyka.
    #
    # Podpinamy KATALOG, nie pliki: runner podmienia pliki atomowym rename (nowy inode),
    # wiec symlink do pliku wskazywalby po pierwszym backupie na usuniety inode.
    # Zweryfikowane: po swiezym backupie unixtime metryki faktycznie rosnie.
    - name: "Sprawdz domyslny katalog textfile PMM"
      ansible.builtin.stat:
        path: /usr/local/percona/pmm/collectors/textfile-collector/medium-resolution
      register: pmm_textfile_stat

    - name: "Podepnij katalog textfile runnera pod node_exporter z paczki"
      block:
        - name: "Zapewnij katalog metryk runnera"
          ansible.builtin.file:
            path: /var/lib/node_exporter/textfile_collector
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: "Usun domyslny katalog textfile PMM (jesli nie jest juz symlinkiem)"
          ansible.builtin.file:
            path: "{{ pmm_textfile_dir }}"
            state: absent
          when: pmm_textfile_stat.stat.islnk is not defined or not pmm_textfile_stat.stat.islnk

        - name: "Symlink na katalog metryk runnera"
          ansible.builtin.file:
            src: /var/lib/node_exporter/textfile_collector
            dest: "{{ pmm_textfile_dir }}"
            state: link
      vars:
        pmm_textfile_dir: /usr/local/percona/pmm/collectors/textfile-collector/medium-resolution
- name: "F11 — zarejestruj uslugi bazodanowe pod lokalnym agentem"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - "../{{ versions.lock_file }}"
  vars:
    pmm_api: "{{ monitoring.pmm.server_url | regex_replace('/$', '') }}"
    pmm_admin_password: "{{ lookup('ansible.builtin.env', 'PMM_ADMIN_PASSWORD') }}"
    pmm_monitor_password: "{{ lookup('ansible.builtin.env', 'PMM_MONITOR_PASSWORD') }}"
    proxysql_admin_password: "{{ lookup('ansible.builtin.env', 'PROXYSQL_ADMIN_PASSWORD') }}"
    # Ta sama definicja co w f11_pmm_client.yml:108 — obie sciezki musza etykietowac
    # eksportery ta sama rewizja, inaczej kontrola rotacji hasel widzi tylko polowe floty.
    pmm_credentials_revision_effective: "{{ monitoring.get('pmm', {}).get('credentials_revision', 1) | string }}"
    pmm_qan_agent_key: "qan_mysql_{{ monitoring.qan_source | default('perfschema') }}_agent"
    pmm_local_agent_ids: >-
      {{ hostvars | dict2items | selectattr('value.pmm_local_agent_id', 'defined')
         | map(attribute='value.pmm_local_agent_id') | list }}
    # Splaszczone pary (typ, agent) — `pmm_agents_now` jest rejestrowane w runtime,
    # a zmienne play'a sa leniwe, wiec odwolanie tutaj rozwiazuje sie po pobraniu.
    #
    # Eksportery pod lokalnymi agentami, pogrupowane wg typu. `push` mowi, czy dany
    # typ w ogole zna tryb push (QAN nie zna) — sluzy do wykrywania dryfu.
    pmm_local_exporters: >-
      {{ [{'type': 'mysqld_exporter', 'push': true,
           'agents': pmm_agents_now.json.mysqld_exporter | default([])},
          {'type': 'proxysql_exporter', 'push': true,
           'agents': pmm_agents_now.json.proxysql_exporter | default([])},
          {'type': pmm_qan_agent_key, 'push': false,
           'agents': (pmm_agents_now.json | default({})).get(pmm_qan_agent_key, [])}] }}
    pmm_agent_hosts: >-
      {{ hostvars | dict2items
         | selectattr('value.pmm_local_agent_id', 'defined')
         | map(attribute='key') | list }}

  tasks:
    - name: "Nic do zrobienia, gdy zaden host nie ma agenta"
      ansible.builtin.meta: end_play
      when: pmm_agent_hosts | length == 0

    - name: "Pobierz aktualne uslugi"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/services"
        method: GET
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
      register: pmm_svcs
      no_log: true

    - name: "Utworz usluge ProxySQL pod lokalnym agentem"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/services"
        method: POST
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
        body_format: json
        body:
          proxysql:
            node_id: "{{ hostvars[item].pmm_local_node_id }}"
            service_name: "{{ monitoring.pmm.cluster_name }}-{{ item }}-proxysql"
            address: 127.0.0.1
            port: 6032
            cluster: "{{ monitoring.pmm.cluster_name }}"
            environment: "{{ cluster.environment }}"
        status_code: [200, 409]
      loop: "{{ pmm_agent_hosts | select('in', groups.get('proxysql', [])) | list }}"
      register: pmm_new_proxysql
      when: (monitoring.pmm.cluster_name ~ '-' ~ item ~ '-proxysql')
            not in (pmm_svcs.json.proxysql | default([]) | map(attribute='service_name') | list)

    - name: "Utworz usluge MySQL pod lokalnym agentem"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/services"
        method: POST
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
        body_format: json
        body:
          mysql:
            node_id: "{{ hostvars[item].pmm_local_node_id }}"
            service_name: "{{ monitoring.pmm.cluster_name }}-{{ item }}-mysql-agent"
            address: 127.0.0.1
            port: 3306
            cluster: "{{ monitoring.pmm.cluster_name }}"
            environment: "{{ cluster.environment }}"
        status_code: [200, 409]
      loop: "{{ pmm_agent_hosts | select('in', groups.get('galera', [])) | list }}"
      register: pmm_new_mysql
      when: (monitoring.pmm.cluster_name ~ '-' ~ item ~ '-mysql-agent')
            not in (pmm_svcs.json.mysql | default([]) | map(attribute='service_name') | list)

    - name: "Odswiez liste uslug po utworzeniu"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/services"
        method: GET
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
      register: pmm_svcs_now
      no_log: true

    - name: "Pobierz istniejacych agentow"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/agents"
        method: GET
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
      register: pmm_agents_now
      no_log: true

    # PUT na /v1/inventory/agents NADPISUJE caly obiekt: pole pominiete w ciele
    # wraca do domyslnej wartosci. Aktualizacja etykiet kasowala wiec haslo, a
    # eksporter zostawal w `Starting` bez metryk. Zamiast dopisywac pole po polu,
    # kasujemy rozjechany obiekt i odtwarzamy go ponizej pelnym POST-em — jedna
    # sciezka tworzenia zamiast dwoch, ktore moga sie rozjechac.
    - name: "Usun eksportery z dryfem konfiguracji (odtwarzane ponizej)"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/agents/{{ item.1.agent_id }}?force=true"
        method: DELETE
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
        status_code: 200
      loop: "{{ pmm_local_exporters | subelements('agents') }}"
      when:
        - item.1.pmm_agent_id in pmm_local_agent_ids
        - >-
          (item.1.custom_labels | default({})).get('credentials_revision', '')
          is ne pmm_credentials_revision_effective
          or (item.0.push and not item.1.get('push_metrics_enabled', false))
      no_log: true

    - name: "Odswiez liste agentow po usunieciu dryfu"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/agents"
        method: GET
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
      register: pmm_agents_now
      no_log: true

    # push_metrics: true jest OBOWIAZKOWE — bez niego PMM wybiera 'auto', ktore
    # tu konczy sie trybem pull i cichym up=0 (firewall nie przepuszcza 42000+).
    - name: "Utworz proxysql_exporter (push) pod lokalnym agentem"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/agents"
        method: POST
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
        body_format: json
        body:
          proxysql_exporter:
            pmm_agent_id: "{{ hostvars[item].pmm_local_agent_id }}"
            service_id: >-
              {{ (pmm_svcs_now.json.proxysql | default([]))
                 | selectattr('service_name', 'equalto', monitoring.pmm.cluster_name ~ '-' ~ item ~ '-proxysql')
                 | map(attribute='service_id') | first }}
            username: "{{ proxysql_remote_admin_user | default('isa_admin') }}"
            password: "{{ proxysql_admin_password }}"
            push_metrics: true
            # Etykieta rotacji hasel MUSI byc taka sama w obu trybach: to po niej
            # wykrywamy eksportery zostawione ze starym haslem po zmianie sekretu.
            # Bez niej sciezka agentowa byla niewidoczna dla tej kontroli.
            custom_labels:
              credentials_revision: "{{ pmm_credentials_revision_effective }}"
        status_code: [200, 409]
      loop: "{{ pmm_agent_hosts | select('in', groups.get('proxysql', [])) | list }}"
      when: >-
        ((pmm_svcs_now.json.proxysql | default([]))
         | selectattr('service_name', 'equalto', monitoring.pmm.cluster_name ~ '-' ~ item ~ '-proxysql')
         | map(attribute='service_id') | first | default('__none__'))
        not in ((pmm_agents_now.json.proxysql_exporter | default([])) | map(attribute='service_id') | list)
      no_log: true

    # `selectattr | first` bez wartosci domyslnej daje undefined, ktore trafia do
    # JSON jako null i PMM odrzuca zadanie golym HTTP 400 — bez wskazania przyczyny.
    # Ta asercja zamienia cichy blad API na komunikat mowiacy, ze usluga nie powstala.
    - name: "Wymagaj, by uslugi bazodanowe istnialy przed tworzeniem eksporterow"
      ansible.builtin.assert:
        that:
          - >-
            ((pmm_svcs_now.json.mysql | default([]))
             | selectattr('service_name', 'equalto', monitoring.pmm.cluster_name ~ '-' ~ item ~ '-mysql-agent')
             | list | length) == 1
        fail_msg: >-
          Brak uslugi {{ monitoring.pmm.cluster_name }}-{{ item }}-mysql-agent w PMM Inventory.
          Eksporter i QAN nie maja do czego sie podpiac — sprawdz wczesniejszy krok
          tworzacy usluge zamiast debugowac HTTP 400 z API.
      loop: "{{ pmm_agent_hosts | select('in', groups.get('galera', [])) | list }}"

    - name: "Utworz mysqld_exporter (push) pod lokalnym agentem"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/agents"
        method: POST
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
        body_format: json
        body:
          mysqld_exporter:
            pmm_agent_id: "{{ hostvars[item].pmm_local_agent_id }}"
            service_id: >-
              {{ (pmm_svcs_now.json.mysql | default([]))
                 | selectattr('service_name', 'equalto', monitoring.pmm.cluster_name ~ '-' ~ item ~ '-mysql-agent')
                 | map(attribute='service_id') | first }}
            username: pmm_monitor
            password: "{{ pmm_monitor_password }}"
            push_metrics: true
            custom_labels:
              credentials_revision: "{{ pmm_credentials_revision_effective }}"
        status_code: [200, 409]
      loop: "{{ pmm_agent_hosts | select('in', groups.get('galera', [])) | list }}"
      when: >-
        ((pmm_svcs_now.json.mysql | default([]))
         | selectattr('service_name', 'equalto', monitoring.pmm.cluster_name ~ '-' ~ item ~ '-mysql-agent')
         | map(attribute='service_id') | first | default('__none__'))
        not in ((pmm_agents_now.json.mysqld_exporter | default([])) | map(attribute='service_id') | list)
      no_log: true

    # QAN to OSOBNY agent od mysqld_exportera. Sciezka agentless dostaje go z
    # f11_pmm_client.yml; hosty z lokalnym agentem musza go dostac tutaj, inaczej
    # maja metryki, ale ZERO analizy zapytan — cicha utrata polowy monitoringu bazy.
    - name: "Utworz agenta QAN pod lokalnym agentem (typ wg monitoring.qan_source)"
      ansible.builtin.uri:
        url: "{{ pmm_api }}/v1/inventory/agents"
        method: POST
        url_username: admin
        url_password: "{{ pmm_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ monitoring.pmm.validate_certs | default(false) }}"
        body_format: json
        # Klucz ciala jest ZMIENNY (typ agenta wynika z monitoring.qan_source), a
        # templatowany klucz YAML nie rozwiazuje sie w ciele `uri` — PMM dostawal
        # "invalid agent type <nil>" i odrzucal zadanie golym 400. Cale cialo musi
        # byc jednym wyrazeniem Jinja. To zadanie nigdy nie utworzylo agenta QAN.
        body: >-
          {{ {pmm_qan_agent_key: {
                'pmm_agent_id': hostvars[item].pmm_local_agent_id,
                'service_id': ((pmm_svcs_now.json.mysql | default([]))
                  | selectattr('service_name', 'equalto',
                               monitoring.pmm.cluster_name ~ '-' ~ item ~ '-mysql-agent')
                  | map(attribute='service_id') | first),
                'username': 'pmm_monitor',
                'password': pmm_monitor_password,
                'custom_labels': {
                  'credentials_revision': pmm_credentials_revision_effective}}} }}
        status_code: [200, 409]
      loop: "{{ pmm_agent_hosts | select('in', groups.get('galera', [])) | list }}"
      when: >-
        ((pmm_svcs_now.json.mysql | default([]))
         | selectattr('service_name', 'equalto', monitoring.pmm.cluster_name ~ '-' ~ item ~ '-mysql-agent')
         | map(attribute='service_id') | first | default('__none__'))
        not in ((pmm_agents_now.json | dict2items | selectattr('key', 'equalto', 'qan_mysql_' ~ (monitoring.qan_source | default('perfschema')) ~ '_agent') | map(attribute='value') | flatten) | map(attribute='service_id') | list)
      no_log: true
