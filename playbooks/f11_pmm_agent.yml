---
# F11 agent: cienki wrapper nad rola roles/pmm.
# Instalacja pozostaje rolling serial:1, a publiczna sciezka Makefile bez zmian.

- name: "F11 — zainstaluj i zarejestruj pmm-agent"
  hosts: all
  become: true
  serial: 1
  vars_files:
    - "../{{ versions.lock_file }}"
  environment:
    PMM_AGENT_SERVER_ADDRESS: "{{ pmm_server_host }}:443"
    PMM_AGENT_SERVER_USERNAME: admin
    PMM_AGENT_SERVER_INSECURE_TLS: "{{ '0' if pmm_validate_certs_effective else '1' }}"
    PMM_AGENT_CONFIG_FILE: /usr/local/percona/pmm/config/pmm-agent.yaml
    # Ten playbook obsluguje OBIE definicje: najemce (blok `cluster`) i warstwe
    # wspolna (blok `platform`). Dyskryminatorem jest `platform.name`, a nie samo
    # istnienie bloku `platform` — kazdy cluster.yml tez go ma (rocky_linux_major),
    # tyle ze bez nazwy. Bez tego rozroznienia cel `platform-monitoring` padal na
    # `'cluster' is undefined`, wiec natywny pmm-agent nigdy nie wstawal na
    # fcp1/fcp2 i metryki `proxysql_connection_pool_*` nie istnialy.
    PMM_AGENT_SETUP_CUSTOM_LABELS: >-
      cluster={{ monitoring.pmm.cluster_name }},environment={{
        (platform | default({})).environment
        if ((platform | default({})).name is defined)
        else cluster.environment }}
  roles:
    - role: pmm
      vars:
        pmm_mode: agent
        pmm_stage: install

- name: "F11 — zarejestruj uslugi bazodanowe pod lokalnym agentem"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - "../{{ versions.lock_file }}"
  roles:
    - role: pmm
      vars:
        pmm_mode: agent
        pmm_stage: register
      module_defaults:
        ansible.builtin.uri:
          url_username: "{{ pmm_admin_user }}"
          url_password: "{{ pmm_admin_password }}"
          force_basic_auth: true
          validate_certs: "{{ pmm_validate_certs_effective }}"
