---
# F11 — kolektor świeżości: publikuj realne unixtimes restore/TLS.
# Satisfies: ISC-49 (restore/cert freshness do PMM textfile collector).
# Note: Backup metrics are published directly by galera-backup runner into
# /var/lib/node_exporter/textfile_collector/galera_backup-<cluster>.prom.
#
# Źródła dowodów:
#   /opt/galera-backup/clusters/<cluster>/state.json → last_success (ostatni udany restore drill)
#   Pomiar drillu (artifact.duration_seconds, artifact.size_bytes) jest OPCJONALNY:
#   stan zapisany przed wprowadzeniem pomiarów go nie ma i wtedy metryki pomiaru
#   są POMIJANE, a nie zerowane.
#
# Cel: node_exporter textfile collector na galera[0] → isa_monitoring_state.prom
# oraz galera_restore_drill-<cluster>.prom (świeżość i pomiary drillu).

- name: "F11 — zbierz stany restore/TLS i opublikuj świeżość na galera[0]"
  hosts: galera[0]
  become: true
  gather_facts: false
  vars:
    textfile_dir: "/var/lib/node_exporter/textfile_collector"
    state_file: "{{ textfile_dir }}/isa_monitoring_state.prom"
    config_file: "{{ textfile_dir }}/isa_monitoring_config.prom"
    cluster_label: "{{ monitoring.pmm.cluster_name }}"
    backup_state_file: "/opt/galera-backup/clusters/{{ cluster.name }}/state.json"
    # Mostek drillu: DOKŁADNIE ta sama nazwa pliku, którą po udanym backupie
    # zapisuje runner na hoście schedulera (galera_backup/common.py
    # `drill_metric_path`). Dwa pliki z tą samą rodziną metryk na jednym
    # hoście to odrzucony scrape, więc oba źródła piszą do JEDNEGO pliku.
    drill_file: "{{ textfile_dir }}/galera_restore_drill-{{ cluster.name }}.prom"
    # Etykiety 1:1 z runnerem: `cluster` to nazwa z PMM, `logical_cluster` to
    # nazwa klastra, `backend` to zadeklarowany cel kopii (config.json.j2:
    # backend.type = backup.destination, runner obniża go do małych liter).
    drill_labels: >-
      cluster="{{ cluster_label }}",logical_cluster="{{ cluster.name }}",backend="{{ backup.destination | lower }}"
    drill_label_set: "{{ '{' ~ drill_labels ~ '}' }}"
    tls_full: "{{ (tls | default({})).mode | default('disabled') == 'full' }}"
    # Klaster bez cwiczen odtworzeniowych (backup wylaczony) nie ma grupy
    # `restore` i to jest legalne. Bez tego domyslnika play wywracal sie na
    # `object of type 'dict' has no attribute 'restore'` — bledzie, ktory nie
    # mowi operatorowi nic o przyczynie.
    restore_host: "{{ (groups['restore'] | default([]) | first) | default('') }}"

  tasks:
    - name: "Odczytaj stan ostatniego udanego restore drill (restore[0])"
      # JEDEN odczyt pliku stanu daje wszystkie pola: świeżość i pomiar. Osobne
      # odczyty per pole mogłyby opisać pomiar z innego przebiegu niż świeżość.
      # Stan nieczytelny (uszkodzony JSON) przerywa przebieg z podaną ścieżką:
      # to uszkodzony dowód, a nie "brak drillu". Brak pliku to legalny stan
      # "drill jeszcze nie był" i daje świeżość 0.
      ansible.builtin.shell: |
        set -o pipefail
        python3 - "{{ backup_state_file }}" <<'PY'
        import json, math, sys

        path = sys.argv[1]
        absent = {"unixtime": 0, "duration_seconds": None, "size_bytes": None}


        def fail(message):
            sys.stderr.write(message + "\n")
            raise SystemExit(3)


        try:
            with open(path, encoding="utf-8") as handle:
                state = json.load(handle)
        except FileNotFoundError:
            print(json.dumps(absent))
            raise SystemExit(0)
        except (OSError, ValueError) as exc:
            fail(f"Stan restore '{path}' nie jest czytelnym JSON-em: {exc}")

        success = state.get("last_success") or {}
        if success.get("command") != "restore":
            print(json.dumps(absent))
            raise SystemExit(0)

        unixtime = success.get("unixtime")
        artifact = success.get("artifact")
        artifact = artifact if isinstance(artifact, dict) else {}


        def duration(raw):
            # Zero jest POMIAREM, brak pomiaru nie jest. Wartość obecna, ale
            # niemożliwa (ujemna, NaN, nieskończoność, tekst, bool) zatrzymuje
            # publikację: zmysłone zero wyglądałoby jak natychmiastowy drill,
            # a NaN/inf zatruwa serię bez błędu składni.
            if raw is None:
                return None
            if isinstance(raw, bool) or not isinstance(raw, (int, float)) or not math.isfinite(raw) or raw < 0:
                fail(f"artifact.duration_seconds w '{path}' nie jest skonczona liczba nieujemna: {raw!r}")
            return raw


        def size(raw):
            if raw is None:
                return None
            if isinstance(raw, bool) or not isinstance(raw, int) or raw < 0:
                fail(f"artifact.size_bytes w '{path}' nie jest calkowita liczba nieujemna: {raw!r}")
            return raw


        print(json.dumps({
            "unixtime": unixtime if isinstance(unixtime, int) and not isinstance(unixtime, bool) and unixtime >= 0 else 0,
            "duration_seconds": duration(artifact.get("duration_seconds")),
            "size_bytes": size(artifact.get("size_bytes")),
        }))
        PY
      args:
        executable: /bin/bash
      register: restore_state
      # `delegate_to` jest rozwiazywane PRZED `when`, wiec pusty ciag wywala
      # zadanie mimo pominiecia. Cel musi byc zawsze poprawnym hostem.
      delegate_to: "{{ restore_host if restore_host | length > 0 else inventory_hostname }}"
      changed_when: false
      when: restore_host | length > 0

    - name: "Rozpoznaj odczytane pola stanu drillu"
      ansible.builtin.set_fact:
        restore_measured: "{{ (restore_state.stdout | default('{}', true) | trim) | from_json }}"
      when: restore_host | length > 0

    # === Wygaśnięcie certyfikatu TLS (0 gdy tls.mode != full) ===
    - name: "Odczytaj unixtime wygaśnięcia certyfikatu TLS (0 gdy disabled)"
      ansible.builtin.shell: >-
        set -o pipefail;
        {% if (tls_full | bool) %}
        if [ -f "{{ tls_cert_path | default('/etc/mysql/tls/server-cert.pem') }}" ]; then
          openssl x509 -in "{{ tls_cert_path | default('/etc/mysql/tls/server-cert.pem') }}" -noout -enddate \
            | cut -d= -f2 | xargs -I{} date -d {} +%s;
        else echo 0; fi
        {% else %}
        echo 0
        {% endif %}
      args:
        executable: /bin/bash
      register: tls_expiry_epoch
      changed_when: false

    - name: "Zapewnij katalog textfile collector"
      ansible.builtin.file:
        path: "{{ textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
    # === Opublikuj realne unixtimes (Ansible copy = atomic write) ===
    - name: "Zapisz realne unixtimes do isa_monitoring_state.prom"
      ansible.builtin.copy:
        dest: "{{ state_file }}"
        content: |
          # Aktualizowany atomowo przez f11_freshness.yml (ISC-49).
          # Wartość 0 oznacza brak potwierdzonego sukcesu.
          # HELP isa_restore_test_last_success_unixtime Unix time of the last successful restore drill.
          # TYPE isa_restore_test_last_success_unixtime gauge
          isa_restore_test_last_success_unixtime{cluster="{{ cluster_label }}"} {{ (restore_measured | default({})).unixtime | default(0, true) }}
          # HELP isa_tls_cert_expiry_unixtime Unix time when the monitored certificate expires.
          # TYPE isa_tls_cert_expiry_unixtime gauge
          isa_tls_cert_expiry_unixtime{cluster="{{ cluster_label }}"} {{ tls_expiry_epoch.stdout | trim | int }}
        owner: root
        group: root
        mode: "0644"

    # === Mostek drillu: świeżość + pomiar w pliku runnera ===
    # Plik zapisuje runner na wybranym donorze (z znacznika w backendzie) i ten
    # play na galera[0] (ze stanu na hoście restore). Pisze tylko ten, kto MA
    # potwierdzony drill: gdy stan nie niesie świeżości, plik zostaje taki, jaki
    # jest. Wpisanie wtedy zera skasowałoby świeższy dowód donora z backendu
    # (a `galera[0]` bywa donorem — `backup.scheduler.host` to preferencja
    # elekcji), czyli alert "restore drill stale" zapaliłby się bez powodu.
    - name: "Opublikuj świeżość i pomiary drillu do wspólnego pliku mostka"
      ansible.builtin.copy:
        dest: "{{ drill_file }}"
        content: |
          # Świeżość i pomiary ostatniego UDANEGO restore drillu
          # ({{ backup_state_file }} na {{ restore_host }}).
          # Ten sam plik zapisuje runner po backupie na hoście schedulera.
          # Brak pomiaru (stan sprzed wprowadzenia pomiarów) = brak linii
          # pomiaru, nigdy zero: zero jest pomiarem, a brak pomiaru nie jest.
          {% set drill = restore_measured | default({}) %}
          {% set drill_duration = drill.duration_seconds | default(none) %}
          {% set drill_size = drill.size_bytes | default(none) %}
          # HELP galera_restore_last_success_unixtime Unix time of the last successful restore drill.
          # TYPE galera_restore_last_success_unixtime gauge
          galera_restore_last_success_unixtime{{ drill_label_set }} {{ drill.unixtime | default(0, true) }}
          {% if drill_duration is not none %}
          # HELP galera_restore_last_duration_seconds Duration of the last successful restore drill, in seconds.
          # TYPE galera_restore_last_duration_seconds gauge
          galera_restore_last_duration_seconds{{ drill_label_set }} {{ '%.3f' | format(drill_duration) }}
          {% endif %}
          {% if drill_size is not none %}
          # HELP galera_restore_last_size_bytes Size of the encrypted artifact restored by the last successful drill, in bytes.
          # TYPE galera_restore_last_size_bytes gauge
          galera_restore_last_size_bytes{{ drill_label_set }} {{ drill_size }}
          {% endif %}
        owner: root
        group: root
        mode: "0644"
      when: (restore_measured | default({})).unixtime | default(0, true) | int > 0

    # Bramki cyklu zycia mowia regulom alertowym, CZY dana swiezosc jest w ogole
    # wymagana. Publikowal je f11_node_exporter.yml, ale `hosts:` tamtego playa
    # wyklucza grupy z `monitoring.agent_groups` — na klastrze z lokalnym
    # pmm-agentem galera[0] nie wchodzila do playa i te trzy metryki NIE
    # POWSTAWALY. Alerty backup-stale/restore-drill-stale nie mialy wtedy
    # przelacznika, a sonda akceptacyjna zglaszala pusty wynik. Ten play celuje
    # w galera[0] bezwarunkowo, wiec jest jedynym wlascicielem tego pliku.
    - name: "Opublikuj bramki monitorowanych cykli zycia"
      ansible.builtin.copy:
        dest: "{{ config_file }}"
        content: |
          # HELP isa_backup_monitoring_enabled Whether backup freshness is required.
          # TYPE isa_backup_monitoring_enabled gauge
          isa_backup_monitoring_enabled{cluster="{{ cluster_label }}"} {{ backup.enabled | ternary(1, 0) }}
          # HELP isa_restore_test_monitoring_enabled Whether restore drill freshness is required.
          # TYPE isa_restore_test_monitoring_enabled gauge
          isa_restore_test_monitoring_enabled{cluster="{{ cluster_label }}"} {{ ((backup.enabled | default(false)) and (backup.restore_test_schedule | default('') | trim) not in ['', 'disabled']) | ternary(1, 0) }}
          # HELP isa_tls_monitoring_enabled Whether certificate expiry monitoring is required.
          # TYPE isa_tls_monitoring_enabled gauge
          isa_tls_monitoring_enabled{cluster="{{ cluster_label }}"} {{ (tls_full | bool) | ternary(1, 0) }}
        owner: root
        group: root
        mode: "0644"
