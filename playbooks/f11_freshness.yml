---
# F11 — kolektor świeżości: publikuj realne unixtimes restore/TLS.
# Satisfies: ISC-49 (restore/cert freshness do PMM textfile collector).
# Note: Backup metrics are published directly by galera-backup runner into
# /var/lib/node_exporter/textfile_collector/galera_backup-<cluster>.prom.
#
# Źródła dowodów:
#   /opt/galera-backup/clusters/<cluster>/state.json → restore[0] (ostatni udany restore drill)
#
# Cel: node_exporter textfile collector na galera[0] → isa_monitoring_state.prom.

- name: "F11 — zbierz stany restore/TLS i opublikuj świeżość na galera[0]"
  hosts: galera[0]
  become: true
  gather_facts: false
  vars:
    textfile_dir: "/var/lib/node_exporter/textfile_collector"
    state_file: "{{ textfile_dir }}/isa_monitoring_state.prom"
    config_file: "{{ textfile_dir }}/isa_monitoring_config.prom"
    cluster_label: "{{ monitoring.pmm.cluster_name }}"
    # Klaster bez cwiczen odtworzeniowych (backup wylaczony) nie ma grupy
    # `restore` i to jest legalne. Bez tego domyslnika play wywracal sie na
    # `object of type 'dict' has no attribute 'restore'` — bledzie, ktory nie
    # mowi operatorowi nic o przyczynie.
    restore_host: "{{ (groups['restore'] | default([]) | first) | default('') }}"

  tasks:
    - name: "Odczytaj unixtime ostatniego udanego restore drill (restore[0])"
      ansible.builtin.shell: >-
        set -o pipefail;
        f=/opt/galera-backup/clusters/{{ cluster.name }}/state.json;
        if [ -f "$f" ]; then
          python3 -c "import json,sys; d=json.load(open('$f')); ls=d.get('last_success') or {}; print(ls.get('unixtime', 0) if ls.get('command') == 'restore' else 0)";
        else echo 0; fi
      register: restore_epoch
      # `delegate_to` jest rozwiazywane PRZED `when`, wiec pusty ciag wywala
      # zadanie mimo pominiecia. Cel musi byc zawsze poprawnym hostem.
      delegate_to: "{{ restore_host if restore_host | length > 0 else inventory_hostname }}"
      changed_when: false
      when: restore_host | length > 0

    # === Wygaśnięcie certyfikatu TLS (0 gdy tls.mode != full) ===
    - name: "Odczytaj unixtime wygaśnięcia certyfikatu TLS (0 gdy disabled)"
      ansible.builtin.shell: >-
        set -o pipefail;
        {% if (tls | default({})).mode | default('disabled') == 'full' %}
        if [ -f "{{ tls_cert_path | default('/etc/mysql/tls/server-cert.pem') }}" ]; then
          openssl x509 -in "{{ tls_cert_path | default('/etc/mysql/tls/server-cert.pem') }}" -noout -enddate \
            | cut -d= -f2 | xargs -I{} date -d {} +%s;
        else echo 0; fi
        {% else %}
        echo 0
        {% endif %}
      register: tls_expiry_epoch
      changed_when: false

    - name: "Zapewnij katalog textfile collector"
      ansible.builtin.file:
        path: "{{ textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
    # === Opublikuj realne unixtimes (Ansible copy = atomic write) ===
    - name: "Zapisz realne unixtimes do isa_monitoring_state.prom"
      ansible.builtin.copy:
        dest: "{{ state_file }}"
        content: |
          # Aktualizowany atomowo przez f11_freshness.yml (ISC-49).
          # Wartość 0 oznacza brak potwierdzonego sukcesu.
          # HELP isa_restore_test_last_success_unixtime Unix time of the last successful restore drill.
          # TYPE isa_restore_test_last_success_unixtime gauge
          isa_restore_test_last_success_unixtime{cluster="{{ cluster_label }}"} {{ restore_epoch.stdout | default('0') | trim | int }}
          # HELP isa_tls_cert_expiry_unixtime Unix time when the monitored certificate expires.
          # TYPE isa_tls_cert_expiry_unixtime gauge
          isa_tls_cert_expiry_unixtime{cluster="{{ cluster_label }}"} {{ tls_expiry_epoch.stdout | trim | int }}
        owner: root
        group: root
        mode: "0644"

    # Bramki cyklu zycia mowia regulom alertowym, CZY dana swiezosc jest w ogole
    # wymagana. Publikowal je f11_node_exporter.yml, ale `hosts:` tamtego playa
    # wyklucza grupy z `monitoring.agent_groups` — na klastrze z lokalnym
    # pmm-agentem galera[0] nie wchodzila do playa i te trzy metryki NIE
    # POWSTAWALY. Alerty backup-stale/restore-drill-stale nie mialy wtedy
    # przelacznika, a sonda akceptacyjna zglaszala pusty wynik. Ten play celuje
    # w galera[0] bezwarunkowo, wiec jest jedynym wlascicielem tego pliku.
    - name: "Opublikuj bramki monitorowanych cykli zycia"
      ansible.builtin.copy:
        dest: "{{ config_file }}"
        content: |
          # HELP isa_backup_monitoring_enabled Whether backup freshness is required.
          # TYPE isa_backup_monitoring_enabled gauge
          isa_backup_monitoring_enabled{cluster="{{ cluster_label }}"} {{ backup.enabled | ternary(1, 0) }}
          # HELP isa_restore_test_monitoring_enabled Whether restore drill freshness is required.
          # TYPE isa_restore_test_monitoring_enabled gauge
          isa_restore_test_monitoring_enabled{cluster="{{ cluster_label }}"} {{ ((backup.enabled | default(false)) and (backup.restore_test_schedule | default('') | length > 0) and (backup.restore_test_schedule != 'disabled')) | ternary(1, 0) }}
          # HELP isa_tls_monitoring_enabled Whether certificate expiry monitoring is required.
          # TYPE isa_tls_monitoring_enabled gauge
          isa_tls_monitoring_enabled{cluster="{{ cluster_label }}"} {{ ((tls | default({})).mode | default('disabled') == 'full') | ternary(1, 0) }}
        owner: root
        group: root
        mode: "0644"
