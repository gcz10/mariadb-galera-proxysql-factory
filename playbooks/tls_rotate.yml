---
# Rotacja certyfikatów TLS klastra Galera BEZ przestoju.
#
# Realizuje procedurę opisaną w dokumentacji MariaDB
# (galera-cluster/galera-security/reloading-tls-certificates-without-downtime.md):
#   1. zapisz nowy certyfikat i klucz obok istniejących,
#   2. podmień pliki atomowo pod skonfigurowanymi ścieżkami,
#   3. wykonaj `FLUSH SSL` — przeładowuje kontekst TLS serwera ORAZ providera wsrep,
#   4. potwierdź, że węzeł serwuje nowy certyfikat,
#   5. powtórz na kolejnym węźle — bez skoordynowanego przestoju.
#
# `ansible.builtin.copy` zapisuje do pliku tymczasowego i wykonuje rename, więc
# krok 2 jest atomowy z definicji — czytelnik nigdy nie zobaczy pół pliku.
#
# serial:1 nie wynika z wymogu dokumentacji (rotacja jest bezprzestojowa), tylko
# z ostrożności operacyjnej: gdy nowy materiał jest wadliwy, zatrzymujemy się na
# pierwszym węźle zamiast rozlać go na cały klaster.
#
# Czego ten playbook NIE robi: nie zmienia ŚCIEŻEK do certyfikatów. Wartości
# ssl_cert/ssl_key/ssl_ca nie są dynamiczne — ich zmiana idzie przez server.cnf
# i restart, czyli przez `make cluster-deploy`.
#
# Użycie: make cluster-tls-rotate CLUSTER=<nazwa>

- name: "TLS — rotacja certyfikatów bez przestoju"
  hosts: galera
  become: true
  gather_facts: false
  serial: 1
  vars:
    tls_full: "{{ (tls | default({})).mode | default('disabled') == 'full' }}"
  pre_tasks:
    - name: "Wymagaj tls.mode=full"
      ansible.builtin.assert:
        that:
          - tls_full | bool
        fail_msg: >-
          Rotacja dotyczy wyłącznie klastrów z tls.mode=full;
          ten ma '{{ (tls | default({})).mode | default('disabled') }}'.

    - name: "Odczytaj odcisk certyfikatu SERWOWANEGO przed rotacją"
      ansible.builtin.shell: >-
        set -o pipefail;
        echo | openssl s_client -starttls mysql -connect 127.0.0.1:3306 2>/dev/null
        | openssl x509 -noout -fingerprint -sha256 2>/dev/null
        | cut -d= -f2
      args:
        executable: /bin/bash
      register: tls_served_before
      changed_when: false
      failed_when: false

  tasks:
    - name: "Podmień materiał TLS (atomowo, przez plik tymczasowy + rename)"
      ansible.builtin.include_tasks: tls_certs.yml

    - name: "Przeładuj kontekst TLS serwera i providera wsrep"
      ansible.builtin.command:
        argv: [mariadb, --socket=/var/lib/mysql/mysql.sock, -N, -B, -e, FLUSH SSL]
      changed_when: true
      when: (tls_files_changed | default(false)) | bool

    # Dowód, że rotacja faktycznie zadziałała: bez tego kroku playbook
    # potwierdzałby wyłącznie, że pliki leżą na dysku — a serwer mógłby dalej
    # trzymać stary kontekst w pamięci i nikt by się o tym nie dowiedział aż do
    # wygaśnięcia certu.
    - name: "Odczytaj odcisk certyfikatu SERWOWANEGO po rotacji"
      ansible.builtin.shell: >-
        set -o pipefail;
        echo | openssl s_client -starttls mysql -connect 127.0.0.1:3306 2>/dev/null
        | openssl x509 -noout -fingerprint -sha256 2>/dev/null
        | cut -d= -f2
      args:
        executable: /bin/bash
      register: tls_served_after
      changed_when: false

    - name: "Odczytaj odcisk certyfikatu z PLIKU na dysku"
      ansible.builtin.shell: >-
        set -o pipefail;
        openssl x509 -in {{ tls_dir | default('/etc/mysql/tls') }}/server-cert.pem
        -noout -fingerprint -sha256 | cut -d= -f2
      args:
        executable: /bin/bash
      register: tls_file_fp
      changed_when: false

    - name: "Wymagaj zgodności: serwowany certyfikat == certyfikat z dysku"
      ansible.builtin.assert:
        that:
          - tls_served_after.stdout | trim | length > 0
          - (tls_served_after.stdout | trim) == (tls_file_fp.stdout | trim)
        fail_msg: >-
          {{ inventory_hostname }}: po FLUSH SSL serwer nadal serwuje inny certyfikat
          niż ten na dysku (serwowany={{ tls_served_after.stdout | trim }},
          plik={{ tls_file_fp.stdout | trim }}). Rotacja NIE weszła w życie.

    - name: "Brama zdrowia — węzeł musi zostać w klastrze po rotacji"
      ansible.builtin.include_tasks: tasks/assert_galera_healthy.yml
      vars:
        health_gate_name: "Brama zdrowia PO rotacji TLS (Synced+Primary+size)"
        health_retries: 3

    - name: "Raport rotacji"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ 'certyfikat wymieniony' if (tls_files_changed | default(false)) | bool else 'bez zmian (materiał identyczny)' }};
          przed={{ (tls_served_before.stdout | default('') | trim)[:17] | default('?', true) }}...
          po={{ (tls_served_after.stdout | trim)[:17] }}...

# ProxySQL trzyma WLASNA kopie naszego CA i weryfikuje nia certyfikaty backendow
# (f7_proxysql.yml: mysql_servers_ssl_params.ssl_ca = /etc/mysql/tls/<klaster>/ca-<skrot>.pem).
# Przy rotacji SAMEGO LISCIA pod tym samym CA ten play jest no-opem, ale przy
# rotacji CA jest obowiazkowy: gdyby ProxySQL zostal ze starym CA, przestalby
# weryfikowac backendy prezentujace nowy certyfikat i zSHUNNowalby caly klaster.
#
# Zaufanie opiera sie na sciezce ze skrotem tresci CA (`ca-<skrot>.pem`) w tabeli
# `mysql_servers_ssl_params`. ProxySQL buforuje kontekst TLS pod sciezka — podmiana
# pod ta sama nazwa nie tworzy nowego kontekstu.
#
# Procedura jest sekwencyjna (serial: 1, max_fail_percentage: 0):
# 1. Zapis nowego CA pod sciezka zalezna od tresci i aktualizacja mysql_servers_ssl_params
#    poprzez wspolne zadania tasks/proxysql_ca_trust.yml.
# 2. Przeladowanie uslugi ProxySQL (restart) i oczekiwanie na powrot portu admina (6032).
# 3. Potwierdzenie konwergencji monitora (jeden aktywny writer w runtime_mysql_servers).
# serial: 1 zapewnia uporzadkowane wykonanie kroczace (aktualizacja i restart
# jednego wezla ProxySQL naraz zamiast masowego restartu obu instancji).
- name: "TLS — zaktualizuj zaufanie ProxySQL do backendow"
  hosts: proxysql
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  vars_files:
    - vars/proxysql_hostgroups.yml
  vars:
    galera_backends: "{{ groups['galera'] | map('extract', hostvars, 'galera_node_address') | list }}"
    tls_full: "{{ (tls | default({})).mode | default('disabled') == 'full' }}"
    proxysql_cluster_tls_dir: "/etc/mysql/tls/{{ cluster.name }}"
    proxysql_admin_cli:
      - mariadb
      - --defaults-extra-file=/etc/proxysql/admin-check.cnf
      - -h127.0.0.1
      - -P6032
      - -uadmin
      - -N
      - -B
  pre_tasks:
    - name: "Sprawdź profil administracyjny wdrozony przez platforme"
      ansible.builtin.stat:
        path: /etc/proxysql/admin-check.cnf
      register: proxysql_admin_profile
      when: tls_full | bool

    - name: "Wymagaj tozsamosci administratora z warstwy wspolnej"
      ansible.builtin.assert:
        that:
          - proxysql_admin_profile.stat.exists
        fail_msg: >-
          Brak /etc/proxysql/admin-check.cnf — tozsamosc administratora pary
          ProxySQL wdraza warstwa wspolna, nie najemca. Uruchom:
          make platform-proxysql
      when: tls_full | bool

    - name: "Czekaj na admin port ProxySQL (6032)"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6032
        timeout: 20
      when: tls_full | bool

  tasks:
    - name: "TLS: skonfiguruj zaufanie CA backendu w ProxySQL (mysql_servers_ssl_params)"
      ansible.builtin.include_tasks: tasks/proxysql_ca_trust.yml
      when: tls_full | bool

    - name: "TLS: zastosuj przeładowanie zaufania ProxySQL"
      ansible.builtin.meta: flush_handlers
      when: tls_full | bool

    - name: "ISC-20: czekaj na konwergencję Galera monitora (jeden aktywny writer)"
      ansible.builtin.command:
        argv: "{{ proxysql_admin_cli }}"
        stdin: "SELECT COUNT(*) FROM runtime_mysql_servers WHERE hostgroup_id={{ galera_writer_hg }} AND status='ONLINE';"
      register: writer_count
      until: writer_count.stdout | trim == '1'
      retries: 15
      delay: 3
      changed_when: false
      no_log: true
      when: tls_full | bool

    - name: "Raport zaufania ProxySQL"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: CA klastra {{ cluster.name }}
          {{ 'zaktualizowane (' ~ (proxysql_ca_basename | default('')) ~ ')' if ((proxysql_backend_ca.changed | default(false)) or (((proxysql_tls_ca_rows.stdout | default('0')) | trim | int) != (galera_backends | length))) else 'bez zmian' }}
      when: tls_full | bool

  handlers:
    - name: "Przeładuj ProxySQL po zmianie CA backendu"
      ansible.builtin.systemd_service:
        name: proxysql
        state: restarted
      listen: "proxysql-ca-reload"

    - name: "Czekaj na admin port ProxySQL po przeładowaniu"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6032
        state: started
        timeout: 30
      listen: "proxysql-ca-reload"

# Host aplikacyjny utrzymuje wlasna kopie CA klastra. Samo zrotowanie Galery i
# ProxySQL zostawia klienta ze starym zaufaniem: po fazie reissue polaczenie
# zweryfikowane pada na "self-signed certificate in certificate chain".
# Aktualizujemy ten sam katalog co app_host.yml w kazdej fazie, aby klient mial
# bundle przed nowymi liscmi i pojedyncze nowe CA po retire-old.
- name: "TLS — zaktualizuj zaufanie hostow aplikacyjnych do klastra"
  hosts: app
  become: true
  gather_facts: false
  vars:
    tls_full: "{{ (tls | default({})).mode | default('disabled') == 'full' }}"
  tasks:
    - name: "Podmień CA klastra na hoście aplikacyjnym (atomowo)"
      ansible.builtin.include_tasks: tls_certs.yml
      vars:
        tls_file_owner: root
        tls_deploy_key: false
        tls_dir: "/etc/mysql/app/{{ cluster.name }}"
      when: tls_full | bool

    - name: "Raport zaufania hosta aplikacyjnego"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: CA klastra {{ cluster.name }}
          {{ 'zaktualizowane' if (tls_files_changed | default(false)) | bool else 'bez zmian' }}
