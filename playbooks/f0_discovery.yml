---
# F1 finding: community.mysql deprecated -> ansible.mysql (2026-07-22, ansible.mysql 5.1.0).
# Nie modyfikuje usług produkcyjnych.
#
# Satisfies: ISC-66 (raport discovery), ISC-67 (read-only)
# (ISC-68 realizuje tests/validation/calc-gcache.py — tutaj nie ma pomiaru
#  write rate: snapshot licznika bez delty/interwału go nie daje.)
# Status: PRZYGOTOWANY — nie uruchomiony (BLK-1, BLK-2: brak testowych hostów)

- name: F0 Discovery — zbierz fakty
  hosts: all
  become: true
  gather_facts: true
  vars:
    ist_window_minutes: 30

  tasks:
    - name: Zbierz Ansible facts (OS, kernel, CPU, RAM, mounts)
      ansible.builtin.setup:
        gather_subset:
          - all

    - name: Wersja Rocky Linux
      ansible.builtin.command: cat /etc/rocky-release
      changed_when: false
      register: rocky_release

    - name: Dostępne repozytoria (dnf)
      ansible.builtin.command: dnf repolist --all
      changed_when: false
      register: dnf_repolist

    - name: SELinux status
      ansible.builtin.command: getenforce
      changed_when: false
      register: selinux_status

    - name: Firewalld status
      ansible.builtin.command: firewall-cmd --state
      changed_when: false
      ignore_errors: true
      register: firewalld_state

    - name: Firewalld — otwarte usługi/porty
      ansible.builtin.command: firewall-cmd --list-all
      changed_when: false
      ignore_errors: true
      register: firewalld_list

    - name: Chrony/NTP status
      ansible.builtin.command: chronyc tracking
      changed_when: false
      ignore_errors: true
      register: chronyc_tracking

    - name: DNS — resolvery
      ansible.builtin.command: cat /etc/resolv.conf
      changed_when: false
      register: resolv_conf

    - name: Trasy sieciowe
      ansible.builtin.command: ip -json route
      changed_when: false
      register: ip_route

    - name: Interfejsy sieciowe
      ansible.builtin.command: ip -json addr
      changed_when: false
      register: ip_addr

    - name: Osiągalność portów Galery/ProxySQL (localhost probe)
      ansible.builtin.shell: |
        set -o pipefail
        for p in 3306 4567 4568 6033 6032; do
          (ss -tlnp | grep -q ":$p " && echo "$p LISTEN") || echo "$p CLOSED"
        done
      args:
        executable: /bin/bash
      changed_when: false
      register: port_probe

    - name: Dyski i filesystem
      ansible.builtin.command: lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT,MODEL -J
      changed_when: false
      register: lsblk_out

    - name: Mount options i wolne miejsce
      ansible.builtin.command: findmnt -J
      changed_when: false
      register: findmnt_out

    # package_facts zamiast `rpm -qa | grep`: kanoniczny modul zapytania, odporny
    # na brak dopasowania (grep zwracal rc=1) i bez parseowania stdout w shellu.
    - name: Istniejące pakiety MariaDB/ProxySQL
      ansible.builtin.package_facts:

    # service_facts raz dla calego raportu (uslugi DB + log shipping); filtracje
    # po nazwie jednostki robimy w szablonie raportu, nie w shellu.
    - name: "Zrzut stanu usług systemd (raport: MariaDB/ProxySQL/log shipping)"
      ansible.builtin.service_facts:

    - name: Istniejący monitoring (procesy)
      ansible.builtin.shell: |
        set -o pipefail
        ps -eo comm | grep -Ei 'prometheus|node_exporter|zabbix|datadog|grafana' || true
      changed_when: false
      register: monitoring_procs

    - name: Audyt PK w information_schema (jeśli istnieje MariaDB)
      ansible.mysql.mysql_query:
        query: |
          SELECT t.TABLE_SCHEMA, t.TABLE_NAME
          FROM information_schema.TABLES t
          LEFT JOIN information_schema.TABLE_CONSTRAINTS c
            ON t.TABLE_SCHEMA=c.TABLE_SCHEMA AND t.TABLE_NAME=c.TABLE_NAME
            AND c.CONSTRAINT_TYPE='PRIMARY KEY'
          WHERE t.TABLE_TYPE='BASE TABLE'
            AND t.TABLE_SCHEMA NOT IN ('mysql','sys','performance_schema','information_schema')
            AND c.CONSTRAINT_NAME IS NULL
        login_unix_socket: /var/lib/mysql/mysql.sock
      become: true
      become_user: mysql
      ignore_errors: true
      register: missing_pk

    - name: wsrep received (jeśli istnieje MariaDB) — okno IST w raporcie
      ansible.mysql.mysql_query:
        query: SHOW GLOBAL STATUS LIKE 'wsrep_received'
        login_unix_socket: /var/lib/mysql/mysql.sock
      become: true
      become_user: mysql
      ignore_errors: true
      register: wsrep_received

    - name: NUMA topology
      ansible.builtin.command: numactl --hardware
      changed_when: false
      ignore_errors: true
      register: numa_hw

    - name: Zapisz fakty hosta do pliku raportu
      ansible.builtin.copy:
        content: "{{ lookup('template', '../roles/discovery/templates/discovery-report.json.j2') }}"
        dest: /var/tmp/f0-discovery-{{ inventory_hostname }}.json
        mode: "0640"

  handlers: []
