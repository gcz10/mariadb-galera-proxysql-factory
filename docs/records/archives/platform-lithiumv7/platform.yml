---
# ARCHIWUM — maszyny l7mon/l7p1/l7p2/l7app (VMID 9880-9883, .85-.88)
# zniszczone 2026-08-27; VIP .89 zwolniony. Zastapione przez `platform/xenonv8`.
# NIE URUCHAMIAJ `platform-build`: ta platforma juz nie istnieje.
platform:
  name: "lithiumv7"
  environment: "laboratory"
  rocky_linux_major: 9
  infra:
    services: ["pmm", "maildev"]
versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"
proxysql:
  nodes_expected: 2
  frontend_tls:
    ca_reference: "pki/lithiumv7/ca.pem"
    certificate_reference: "pki/lithiumv7/server-cert.pem"
    private_key_reference: "pki/lithiumv7/server-key.pem"
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.89"
    port: 6033
network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.85/32"]
monitoring:
  pmm:
    server_url: "https://192.168.1.85"
    agent_id: "pmm-server"
    cluster_name: "lithiumv7"
    validate_certs: false
    credentials_revision: 1
    backup_retention: 2
  agent_groups: ["proxysql"]
  alerts:
    email: "ops@claude.local"
