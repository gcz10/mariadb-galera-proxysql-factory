---
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3
  children:
    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        hp1:
          ansible_host: "192.168.1.75"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.75"
        hp2:
          ansible_host: "192.168.1.76"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.76"
    app:
      vars:
        app_role: "app"
      hosts:
        happ:
          ansible_host: "192.168.1.77"
          app_node_address: "192.168.1.77"
    infra:
      vars:
        infra_role: "infra"
      hosts:
        hmon:
          ansible_host: "192.168.1.74"
          infra_node_address: "192.168.1.74"
