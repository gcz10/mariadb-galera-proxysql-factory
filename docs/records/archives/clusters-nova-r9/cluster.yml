---
# ARCHIWUM — maszyny nv1-nv3 (VMID 9780-9782, .36/.37/.39) zostaly zniszczone
# 2026-08-25 po zakonczeniu przebiegu. Definicja ZOSTAJE jako slad: to pierwszy
# najemca zbudowany bez Terraforma, z maszyn utworzonych golym REST API.
# NIE URUCHAMIAJ na niej `cluster-build` — adresy .36/.37/.39 nie odpowiadaja
# zadnym maszynom, a rezerwacja tych adresow jest tu celowa, zeby kolejny
# najemca ich nie przejal.
#
# Najemca warstwy `kobalt`, DRUGI na tej samej parze ProxySQL.
# Maszyny powstaly przez REST API hypervisora, nie przez Terraform.
# Backup wylaczony swiadomie — magazyn S3 jest usluga zewnetrzna i nie powstaje
# razem z monitoringiem.
cluster:
  name: "nova-r9"
  environment: "laboratory"
  profile: "laboratory"

platform:
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  cluster_name: "nv_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  # Drugi najemca: baza 10 zajmuje 10/20/30/40, wiec ta musi byc rozlaczna.
  hostgroup_base: 50
  app_user: "app_user_nv"
  frontend_tls:
    ca_reference: "pki/kobalt/ca.pem"
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.31"
    port: 6033

tls:
  mode: "full"
  socket_dynamic: false
  per_node_certificates: true
  ca_reference: "pki/nv9/ca.pem"
  certificate_reference: "pki/nv9/server-cert.pem"
  private_key_reference: "pki/nv9/server-key.pem"
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.28/32"]

storage:
  data_directory: "/var/lib/mysql"
  expected_database_size_gb: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  rto_node_failure: "2m"

backup:
  enabled: false
  destination: "s3"
  full_backup_schedule: "disabled"
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "disabled"
  scheduler:
    mode: "manual"
    host: "nv1"
    timezone: "UTC"
  s3:
    # Endpoint zewnetrzny — do uzupelnienia, gdy magazyn kopii zostanie wskazany.
    endpoint: "s3.invalid:9000"
    bucket: "nova-galera-backups"
    secure: false

monitoring:
  pmm:
    server_url: "https://192.168.1.28"
    agent_id: "pmm-server"
    cluster_name: "nova-galera"
    validate_certs: false
    credentials_revision: 1
  agent_groups: ["galera"]
  qan_source: "slowlog"
  alerts:
    email: "ops@claude.local"

mariadb_tuning:
  innodb_buffer_pool_size: "768M"
  innodb_log_file_size: "256M"
  max_connections: 100
  # Laboratory: jawny opt-out od bezpiecznego defaultu 1.
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "256M"
  slow_query_log: "ON"
  long_query_time: 0.1
