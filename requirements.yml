---
# requirements.yml — kolekcje Ansible. JEDYNE źródło prawdy dla ich wersji.
#
# Kolekcje żyją na KONTROLERZE, nie na hostach floty, więc nie mają nic wspólnego
# z podziałem lockfile'ów na EL9/EL10 ani z serią MariaDB. Do 2026-09-04 ich piny
# stały równolegle w czterech lockfile'ach jako blok `ansible` — bez konsumenta
# (żaden playbook, rola ani sonda go nie czytały), poza kontraktem
# `validate-lockfile.py` i bez bramki spójności z tym plikiem. Blok usunięto;
# jedynym instalującym jest `ansible-galaxy collection install -r requirements.yml`
# (.github/workflows/ci.yml).
#
# F1 research: community.mysql deprecated -> ansible.mysql (2026-07-22).
# ansible.mysql wspiera MariaDB do mid-2027; potem ansible.mariadb.

collections:
  # 5.2.0: wsparcie MariaDB oznaczone jako deprecated, usuniecie w 6.0.0
  # (nie wczesniej niz mid-2027) — nastepca to kolekcja `ansible.mariadb`.
  # Skutek uboczny 5.2.0: modul emituje ostrzezenie przy wykryciu serwera
  # MariaDB, czyli na kazdym tasku tej floty. Migracja FQCN to osobny pakiet.
  - name: "ansible.mysql"
    version: "5.2.0"
    source: "https://galaxy.ansible.com"
  # 13.x wymaga ansible-core >= 2.18.0 (meta/runtime.yml) — mamy 2.21.3.
  # Jedyny uzywany modul to `seport`; w majorach 11/12/13 nie ma dla niego
  # breaking changes, jest za to poprawka idempotencji, gdy zadany port
  # miesci sie w juz zarejestrowanym zakresie tego samego setype.
  - name: "community.general"
    version: "13.3.0"
    source: "https://galaxy.ansible.com"
  # 2.0.0 zmienilo typy opcji `forward`, `masquerade` i `icmp_block_inversion`
  # modulu firewalld ze str na bool. Repo nie uzywa zadnej z nich (grep pusty),
  # wiec skok majora jest bezpieczny. requires_ansible >= 2.16.0.
  - name: "ansible.posix"
    version: "2.2.2"
    source: "https://galaxy.ansible.com"

roles: []
