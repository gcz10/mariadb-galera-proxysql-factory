#cloud-config
# Cloud-init dla VM klastra ISA na Proxmoxie.
# Zapisz na PVE: /var/lib/vz/snippets/r10-user-data.yaml
# Terraform referencjuje go przez initialization.user_data_file_id.
users:
  - name: ansible
    primary_group: ansible
    groups: wheel
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEi2JptnezdY/Nyec+JtsKltgffUiJICpRkUS4LHB/1m ansible-lab

# qemu-guest-agent nie ma w GenericCloud; instalujemy, zeby Proxmox widzial IP VM.
packages:
  - qemu-guest-agent
runcmd:
  - systemctl enable --now qemu-guest-agent
