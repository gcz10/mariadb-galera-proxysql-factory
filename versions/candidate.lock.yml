---
# candidate.lock.yml — wersje kandydujące dla staging/laboratory.
# Wypełniony w F1 na podstawie oficjalnych źródeł (2026-07-22).
# Produkcja używa versions.lock.yml (po F0 walidacji na hostach).
# Nigdy state: latest; deployment zatrzymuje się, gdy pakiet niedostępny.

rocky_linux:
  major: 9
  allowed_minors:
    - "9.8"  # do rozszerzenia po F0, gdy hosty mają inny minor
  major_eol: "2032-05-31"

mariadb:
  version: "11.4.12"
  series: "11.4"
  type: "LTS"
  eol: "2029-05"
  rpm_release: "to-confirm-F0"  # dnf info na hostach
  repo_setup_script: "https://downloads.mariadb.com/MariaDB/mariadb_repo_setup"
  repo_setup_args: "--mariadb-server-version=11.4"
  galera_provider: "galera-4"
  galera_provider_wsrep_api: 26
  mariadb_backup_package: "mariadb-backup"
  eol_warning_10_6: "2026-07-06"

proxysql:
  version: "3.0.9"
  series: "3.0"
  tier: "Stable"
  released: "2026-06-05"
  rpm_release: "to-confirm-F0"
  repo_baseurl: "https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/rocky/9/"
  repo_gpgkey: "https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/repo_pub_key.gpg"
  cves_patched:
    - "CVE-2026-48772"
    - "CVE-2026-48773"

pmm:
  version: "3.8.1"
  released: "2026-06-16"
  image: "percona/pmm-server:3.8.1"
  image_digest: "sha256:ef47471fb3b54e10897a92bab0b7b45e82d9825c3b0abf5a0693242191f99468"
  deployment: "docker-volume"
  rpm_for_rocky_9: false
  support_eol: "not-published-per-point-release"
  source: "https://github.com/percona/pmm/blob/main/documentation/docs/release-notes/3.8.1.md"

docker:
  engine_version: "3:29.6.2-1.el9"
  cli_version: "1:29.6.2-1.el9"
  containerd_version: "2.2.6-1.el9"
  buildx_version: "0.35.0-1.el9"
  compose_version: "5.3.1-1.el9"
  repo_baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
  repo_gpgkey: "https://download.docker.com/linux/centos/gpg"

minio:
  image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
  image_digest: "sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e"

maildev:
  image: "maildev/maildev:2.2.1"

node_exporter:
  version: "1.12.1"
  released: "2026-07-14"
  rpm_for_rocky_9: false
  source: "https://github.com/prometheus/node_exporter/releases/tag/v1.12.1"
  linux_sha256:
    amd64: "b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
    arm64: "ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7"

ansible:
  core_version: "2.21.2"
  core_released: "2026-07-13"
  collections:
    - name: "ansible.mysql"
      version: "5.1.0"
      note: "successor of deprecated community.mysql; FQCN ansible.mysql.*"
    - name: "community.general"
      version: "latest-stable"
    - name: "ansible.posix"
      version: "latest-stable"

repositories:
  - name: "mariadb-official"
    url: "https://downloads.mariadb.com/MariaDB/mariadb_repo_setup"
    gpg_fingerprint: "to-verify-F2"  # F2: gpg --recv-keys przed gpgcheck=1
  - name: "proxysql-official"
    url: "https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/rocky/9/"
    gpgkey: "https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/repo_pub_key.gpg"
    gpg_fingerprint: "to-verify-F2"

# Status: candidate — do promocji do versions.lock.yml po F0 walidacji na hostach.
