---
# versions.lock.yml — ZATWIERDZONY lockfile (promoted from candidate 2026-07-22 po F0).
# Wypełniony w F1 na podstawie oficjalnych źródeł + F0 potwierdzenie na hostach.
# Produkcja używa wyłącznie tego pliku. Nigdy state: latest.
# Deployment zatrzymuje się, gdy pakiet z lockfile niedostępny.

rocky_linux:
  major: 9
  allowed_minors:
    - "9.8"  # do rozszerzenia po F0, gdy hosty mają inny minor
  major_eol: "2032-05-31"

mariadb:
  version: "11.4.12"
  series: "11.4"
  type: "LTS"
  eol: "2029-05"
  rpm_release: "1.el9"          # audit#12: potwierdzone na hostach (MariaDB-server-11.4.12-1.el9)
  repo_setup_script: "https://downloads.mariadb.com/MariaDB/mariadb_repo_setup"
  repo_setup_args: "--mariadb-server-version=11.4"
  repo_setup_sha256: "7325ac7755809ca3312b446bd832542421699298f25b701f9a111bb42df0c7c1"  # audit#6: integralność skryptu (v2026-06-30, 44184B)
  galera_provider: "galera-4"
  galera_provider_version: "26.4.27"   # audit#12: galera-4-26.4.27-1.el9
  galera_provider_rpm_release: "1.el9"
  galera_provider_wsrep_api: 26
  # audit#12: pakiet z oficjalnego repo nazywa się MariaDB-backup (wielkie M), nie mariadb-backup
  mariadb_backup_package: "MariaDB-backup"
  server_package: "MariaDB-server"
  client_package: "MariaDB-client"
  eol_warning_10_6: "2026-07-06"
  # Zrodla pinow — zweryfikowane pobraniem 2026-08-15 (HTTP 200 + wzmianka
  # o dokladnej wersji na stronie). Bez nich pin byl nieweryfikowalny inaczej
  # niz powtorzeniem calego rozeznania; egzekwuje to validate-lockfile.py.
  source: "https://github.com/mariadb-corporation/mariadb-docs/blob/main/platform/post-download/mariadb-server-11.4.12.md"
  galera_provider_source: "https://github.com/codership/galera/releases/tag/release_26.4.27"

proxysql:
  version: "3.0.10"
  series: "3.0"
  tier: "Stable"
  released: "2026-07-31"
  rpm_release: "1"              # audit#12: potwierdzone na hostach (proxysql-3.0.9-1.x86_64)
  # R1: usunieto repo_baseurl - wskazywalo na 404 (sciezka `rocky/9` nie istnieje;
  # oficjalna jest `centos/<major>`) i nie bylo przez nic konsumowane.
  # URL RPM-u sklada f2_install z: series + rocky_linux.major + version + architektura.
  repo_gpgkey: "https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/repo_pub_key.gpg"
  # audit#6: klucz repo_pub_key.gpg jest binarny (nie ASCII-armored) → rpm --import odrzuca.
  # Kontrolą integralności jest przypięty sha256 RPM-u (weryfikowany przez get_url).
  rpm_sha256:
    x86_64: "04d5696c2b9b12bf5dd758a3024c4553231c629521929274d5dd1d53bc35ecc0"  # proxysql-3.0.10-1-centos9.x86_64.rpm, 41610935B
  cves_patched:
    - "CVE-2026-48772"
    - "CVE-2026-48773"
    - "GHSA-fvch-fpgq-pwfx"
  source: "https://github.com/sysown/proxysql/releases/tag/v3.0.10"

pmm:
  version: "3.9.0"
  released: "2026-07-30"
  image: "percona/pmm-server:3.9.0"
  image_digest: "sha256:ec0391338420a019a45ab33c101a2b62c3e2e0908bf6748056a9793b97c6d094"
  deployment: "docker-volume"
  rpm_for_rocky_9: false
  support_eol: "not-published-per-point-release"
  # 3.9.0 USUWA upgrade z UI i Watchtower z obrazu (PMM-14969). Jedyna wspierana
  # sciezka to podmiana obrazu kontenera — czyli dokladnie to, co robi
  # infra_services.yml przez `docker compose up --pull always`.
  security: >-
    CVE-2026-39822 (HIGH, symlink traversal w stdlib Go) naprawiony w
    percona-telemetry-agent; usuniety preinstalowany datasource PostgreSQL,
    ktory pozwalal roli Viewer wykonywac dowolny SQL na wewnetrznej bazie PMM
    (dokanczka hardeningu po CVE-2026-25212 z 3.7.0)
  # Dlaczego ta wersja, a nie tylko "nowsza": PMM-14193/PMM-15145 naprawiaja
  # alerty *Down* wracajace do Normal, gdy baza I agent padaja jednoczesnie.
  # To dokladnie ta sama zasada fail-closed, ktorej pilnuje ISC-47.
  source: "https://github.com/percona/pmm/blob/main/documentation/docs/release-notes/3.9.0.md"

docker:
  engine_version: "3:29.6.2-1.el9"
  cli_version: "1:29.6.2-1.el9"
  containerd_version: "2.2.6-1.el9"
  buildx_version: "0.35.0-1.el9"
  compose_version: "5.3.1-1.el9"
  repo_baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
  repo_gpgkey: "https://download.docker.com/linux/centos/gpg"

backup_tools:
  python_pip_package: "python3-pip"
  encryption_package: "openssl"
  archive_package: "tar"
  cron_package: "cronie"
  cifs_userspace_package: "cifs-utils"

minio:
  image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
  image_digest: "sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e"
  # R1/B3: klient S3 uzywany przez f10_backup / f10_restore (pip). Wczesniej "7.2.7"
  # bylo wpisane na sztywno w obu playbookach - wersja poza kontrola lockfile.
  sdk_version: "7.2.7"
  mc_image: "minio/mc:RELEASE.2025-08-13T08-35-41Z"
  mc_image_digest: "sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727"

maildev:
  image: "maildev/maildev:2.2.1"

node_exporter:
  version: "1.12.1"
  released: "2026-07-14"
  rpm_for_rocky_9: false
  source: "https://github.com/prometheus/node_exporter/releases/tag/v1.12.1"
  linux_sha256:
    amd64: "b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"
    arm64: "ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7"

ansible:
  core_version: "2.21.2"
  core_released: "2026-07-13"
  collections:
    - name: "ansible.mysql"
      version: "5.1.0"
      note: "successor of deprecated community.mysql; FQCN ansible.mysql.*"
    - name: "community.general"
      version: "10.3.0"          # audit#12: przypięte zgodnie z requirements.yml (było latest-stable)
    - name: "ansible.posix"
      version: "1.5.4"           # audit#12: przypięte zgodnie z requirements.yml (było latest-stable)

repositories:
  - name: "mariadb-official"
    url: "https://downloads.mariadb.com/MariaDB/mariadb_repo_setup"
    # audit#12/#6: integralność skryptu repo_setup jest wymuszana przez sha256 (mariadb.repo_setup_sha256),
    # a pakiety przez gpgcheck repo MariaDB (klucz instalowany przez sam mariadb_repo_setup).
    integrity_control: "sha256-pinned-repo-setup"
  - name: "proxysql-official"
    url: "https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/centos/9/"   # R1: bylo rocky/9 -> 404
    gpgkey: "https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/repo_pub_key.gpg"
    # audit#6: klucz jest binarny (nie ASCII-armored) → rpm --import go odrzuca.
    integrity_control: "sha256-pinned-rpm"   # proxysql.rpm_sha256

# Status: LOCKED — promowany z candidate.lock.yml 2026-07-22 (F0 PASS na lab-cluster).

pmm_client:
  # Agent PMM instalowany z repozytorium Percony (pmm3-client), NIE tarball.
  # Wersja MUSI byc <= wersji serwera (pmm.version powyzej) — dokumentacja Percony
  # wymaga kolejnosci: najpierw serwer, potem klient. Oba na 3.9.0.
  # Zweryfikowane w repo na zywym hoscie: `dnf --showduplicates list pmm-client`
  # zwraca 3.9.0-1.el9 jako najnowszy.
  version: "3.9.0"
  rpm_release: "1.el9"
  package: "pmm-client-3.9.0-1.el9"
  repo_component: "pmm3-client"
  release_rpm: "https://repo.percona.com/yum/percona-release-latest.noarch.rpm"
  # Tryb metryk MUSI byc jawnie 'push'. Domyslka `pmm-admin add` to 'auto', ktore
  # w tym srodowisku wybiera 'pull' — a pull wymaga otwarcia 42000-51999
  # przychodzaco, czego minimalna polityka firewalld (ISC-5) nie dopuszcza.
  metrics_mode: "push"
  source: "https://docs.percona.com/percona-monitoring-and-management/3/install-pmm/install-pmm-client/package_manager.html"
