---
# versions-el9-118.lock.yml — historyczny lockfile klastrów EL9 na MariaDB 11.8.
# Ostatni użytkownik: zarchiwizowane definicje orionv12-r9 i cassiopeiav11-r9
# (docs/records/archives/). Żaden żywy klaster go nie używa — żywe staki EL9
# są na serii 11.4 (versions.lock.yml), a Rocky 10 na versions-el10.lock.yml.
#
# Powstaje z versions.lock.yml przez zmianę WYŁĄCZNIE bloku mariadb (11.4.12 → 11.8.9);
# pozostałe bloki identyczne (piny platformowe EL9 bez zmian).
#
# Powód istnienia: klastry wymagają dokładnie serii 11.8. Per-cluster `lock_file`
# pozwala mieszać serie między klastrami bez mieszania ich w jednym klastrze.
# Linia decyzyjna: docs/records/2026-08-29-mariadb-118-upgrade-orionv11.md
# (pierwotny ADR: docs/records/2026-08-29-mariadb-118-upgrade-orion.md) oraz
# docs/records/2026-08-29-mariadb-118-upgrade-cassiopeia.md.
# Świadoma regresja okna wsparcia: EOL 11.8 = 2028-06 vs 11.4 = 2029-05 —
# strażnik ISC-55 wymaga -e f12_allow_eol_regression=true.
#
# Weryfikacja 2026-08-29 (dnf probe na o12db1, enablerepo=mariadb-server/11.8/rhel9):
# MariaDB-server/client/backup 11.8.9-1.el9 oraz galera-4 26.4.27-1.el9
# (to samo wydanie galery co klaster 11.4 → wsrep API 26 → rolling zgodny).

rocky_linux:
  major: 9
  allowed_minors:
    - "9.8"
  major_eol: "2032-05-31"

mariadb:
  version: "11.8.9"
  series: "11.8"
  type: "LTS"
  eol: "2028-06"
  rpm_release: "1.el9"           # zweryfikowane w dnf probe: MariaDB-server-11.8.9-1.el9
  repo_setup_script: "https://downloads.mariadb.com/MariaDB/mariadb_repo_setup"
  repo_setup_args: "--mariadb-server-version=mariadb-11.8.9"
  repo_setup_sha256: "7325ac7755809ca3312b446bd832542421699298f25b701f9a111bb42df0c7c1"
  galera_provider: "galera-4"
  galera_provider_version: "26.4.27"
  galera_provider_rpm_release: "1.el9"
  galera_provider_wsrep_api: 26
  mariadb_backup_package: "MariaDB-backup"
  server_package: "MariaDB-server"
  client_package: "MariaDB-client"
  # Wersjonowany katalog serii — odporny na dryf aliasu (lekcja z pułapki
  # opisanej w versions.lock.yml:20-25; materializacja 2026-08-24).
  verified_baseurl: "https://dlm.mariadb.com/repo/mariadb-server/11.8/yum/rhel/9/x86_64"
  source: "https://mariadb.org/mariadb-server-12-3-11-8-11-4-and-10-11-q3-2026-maintenance-releases-and-goodbye-10-6/"
  galera_provider_source: "https://github.com/codership/galera/releases/tag/release_26.4.27"

proxysql:
  version: "3.0.11"
  series: "3.0"
  tier: "Stable"
  released: "2026-08-27"
  rpm_release: "1"
  repo_gpgkey: "https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/repo_pub_key.gpg"
  rpm_sha256:
    x86_64: "41f0d7aebd93cf6a4ba9681074202b8b1495adec4e810beb5480d8ee3a689fff"  # proxysql-3.0.11-1-centos9.x86_64.rpm, 42484661B
  cves_patched:
    - "CVE-2026-48772"
    - "CVE-2026-48773"
    - "GHSA-fvch-fpgq-pwfx"
  source: "https://github.com/sysown/proxysql/releases/tag/v3.0.11"

pmm:
  version: "3.9.1"
  released: "2026-08-19"
  image: "percona/pmm-server:3.9.1"
  image_digest: "sha256:003f9c25f84256e53dccbd71975e3aaf98ca06e891bda86a35c262ef21ca58c1"
  deployment: "docker-volume"
  rpm_for_rocky_9: false
  support_eol: "not-published-per-point-release"
  source: "https://github.com/percona/pmm/releases/tag/v3.9.1"

docker:
  engine_version: "3:29.6.2-1.el9"
  cli_version: "1:29.6.2-1.el9"
  containerd_version: "2.2.6-1.el9"
  buildx_version: "0.35.0-1.el9"
  compose_version: "5.3.1-1.el9"
