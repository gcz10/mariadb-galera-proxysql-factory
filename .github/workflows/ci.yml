---
# CI — gate merge na sprawdzeniach, które realnie łapią błędy (audit#22).
# validate (blocking): schema, ansible syntax-check, python compile, bash -n.
# lint (blocking): ansible-lint — 0 naruszeń; dług stylistyczny i idiomatyczny
# spłacony (yaml[line-length] wyłączony z uzasadnieniem w .ansible-lint).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (schema + syntax + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ansible-core 2.21.x wymaga Pythona >=3.12 (requires_python, PyPI).
          python-version: '3.12'

      - name: Install Python deps
        # minio: importowane przez tests/lab/probe-backup.py, ktore laduje
        # test jednostkowy test_probe_backup.py. Bez tego job pada na
        # ModuleNotFoundError, a cala bramka jakosci przestaje blokowac merge.
        # Piny ==: CI ma byc powtarzalny niezaleznie od upstreamu, tak jak
        # lockfile'e (versions/*.lock.yml, .terraform.lock.hcl). Podbijajac
        # wersje: aktualna sprawdz na pypi.org/pypi/<pakiet>/json;
        # ansible-core trzymaj zgodny z baseline w
        # versions/compatibility-report.md (wymaga Pythona >=3.12).
        run: pip install ansible-core==2.21.3 jsonschema==4.26.0 pyyaml==6.0.3 minio==7.2.20

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Platform schema and inventory validation (all platforms)
        run: |
          set -e
          rc=0
          for p in platform/*/platform.yml; do
            [ -f "$p" ] || continue
            pdir=$(dirname "$p")
            if python3 tests/validation/validate-platform.py "$p" platform/schema/platform.schema.json "$pdir/inventory.yml"; then
              echo "OK: $p"
            else
              echo "FAIL: $p"; rc=1
            fi
          done
          exit $rc

      - name: Schema validation (all clusters)
        run: |
          set -e
          rc=0
          for c in clusters/*/cluster.yml; do
            [ -f "$c" ] || continue
            if python3 tests/validation/validate-cluster-schema.py "$c" clusters/schema/cluster.schema.json; then
              echo "OK: $c"
            else
              echo "FAIL: $c"; rc=1
            fi
          done
          exit $rc

      - name: Inventory invariants (all clusters)
        run: |
          set -e
          rc=0
          for inv in clusters/*/inventory.yml; do
            [ -f "$inv" ] || continue
            cdir=$(dirname "$inv")
            # Katalog bez cluster.yml nie jest klastrem — to resztka po
            # przerwanym przebiegu. Walidator dostalby nieistniejaca sciezke
            # i wywalil cala bramke zamiast pominac smiec.
            [ -f "$cdir/cluster.yml" ] || { echo "SKIP (brak cluster.yml): $cdir"; continue; }
            if python3 tests/validation/validate-inventory.py "$inv" "$cdir/cluster.yml"; then
              echo "OK: $inv"
            else
              echo "FAIL: $inv"; rc=1
            fi
          done
          exit $rc

      - name: Backup configuration semantics and ownership
        run: python3 tests/validation/validate-backup-config.py clusters
      - name: Unit tests (tests/unit)
        run: python3 -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: Galera backup executable compile
        run: python3 -m py_compile roles/galera_backup/files/galera-backup

      # Walidujemy lockfile'e faktycznie UZYWANE przez klastry (versions.lock_file),
      # nie kazdy plik w versions/. candidate.lock.yml jest z zalozenia niedokonczony
      # (placeholdery to-confirm-F0 czekajace na F0) i nie jest przez nikogo wskazywany.
      # Efekt uboczny: wykrywa tez klaster wskazujacy na nieistniejacy lockfile.
      - name: Lockfile validation (lockfiles referenced by clusters)
        run: |
          set -e
          rc=0
          used=$(python3 - <<'PY'
          import glob, yaml
          out = set()
          for path in sorted(glob.glob("clusters/*/cluster.yml")):
              with open(path, encoding="utf-8") as fh:
                  cfg = yaml.safe_load(fh) or {}
              lock = (cfg.get("versions") or {}).get("lock_file")
              if lock:
                  out.add(lock)
          print("\n".join(sorted(out)))
          PY
          )
          [ -n "$used" ] || { echo "FAIL: zaden klaster nie wskazuje lockfile"; exit 1; }
          for lf in $used; do
            if [ ! -f "$lf" ]; then
              echo "FAIL: $lf wskazany przez cluster.yml, ale nie istnieje"; rc=1; continue
            fi
            python3 tests/validation/validate-lockfile.py "$lf" || rc=1
          done
          exit $rc

      # Hook `.omp/hooks/pre/docs-fetch.ts` blokuje pobieranie dokumentacji
      # przez curl. Sonda pilnuje OBU kierunkow: ze wpadki sa lapane i ze
      # legalne wywolania API/rejestrow nie sa. Falszywy alarm jest tu
      # grozniejszy — bramka, ktora blokuje curl do Docker Huba, zostanie
      # wylaczona i nie ochroni juz przed niczym.
      # Node >= 22.18 uruchamia .ts bez transpilacji; obraz CI ma node.
      - name: Docs-fetch hook guard
        run: node tests/validation/probe-docs-fetch-hook.ts

      # Adres wezla rowny adresowi hypervisora Proxmox wywalil `terraform apply`
      # w polowie (konflikt ARP z wywolaniami API) i zwrocil klucz SSH cudzego
      # hosta. Adres byl "wolny" wedlug listy VM, bo hypervisor nie jest VM.
      # W CI brak PROXMOX_VE_ENDPOINT, wiec dziala czesc miedzyklastrowa i VIP.
      - name: Address collision guard
        run: python3 tests/validation/probe-address-collision.py

      - name: ansible syntax-check (playbooks only; skip include-only files)
        run: |
          set -e
          rc=0
          for pb in playbooks/*.yml; do
            # pomiń pliki bez ,hosts:' (include_tasks jak tls_certs.yml — nie są playbookami)
            if ! grep -qE '^[[:space:]]*hosts:' "$pb"; then
              echo "skip (include-only): $pb"; continue
            fi
            if ansible-playbook "$pb" -i clusters/example-cluster/inventory.yml -e @clusters/example-cluster/cluster.yml --syntax-check >/tmp/sx.out 2>&1; then
              echo "syntax OK: $pb"
            else
              echo "syntax FAIL: $pb"; cat /tmp/sx.out; rc=1
            fi
          done
          # `playbooks/*.yml` nie schodzi do `playbooks/tasks/`, a `--syntax-check`
          # nie wchodzi w `include_tasks` (include dynamiczny). Bez tego kroku
          # zepsuty helper przechodzi CI i wywala sie dopiero w runtime — od razu
          # we wszystkich 11 bramach zdrowia, ktore go wlaczaja.
          for tf in playbooks/tasks/*.yml; do
            [ -f "$tf" ] || continue
            if python3 -c "import sys,yaml; d=yaml.safe_load(open(sys.argv[1])); sys.exit(0 if isinstance(d,list) else 1)" "$tf"; then
              echo "task-file OK: $tf"
            else
              echo "task-file FAIL (nie jest lista zadan): $tf"; rc=1
            fi
          done
          exit $rc

      # compileall tylko parsuje — przepuszcza martwe importy, zduplikowane stale
      # i f-stringi bez placeholderow. Dokladnie ten brud przeszedl w commicie
      # 439218a i wyszedl dopiero w review. pyflakes to lapie.
      - name: python compile (tests + validation)
        run: python3 -m compileall -q tests

      # Pin ==: powtarzalnosc CI niezaleznie od upstreamu; wersje do podbicia
      # sprawdzaj na pypi.org/pypi/pyflakes/json.
      - name: pyflakes (martwe importy, nieuzywane zmienne, puste f-stringi)
        run: |
          python3 -m pip install -q pyflakes==3.4.0
          python3 -m pyflakes tests roles/galera_backup/filter_plugins roles/galera_backup/files/galera_backup

      # Jedno zrodlo prawdy: recepta bramki zyje w Makefile (selftest + sonda),
      # CI tylko ja wywoluje. Nowa sonda = nowy target, bez edycji tego pliku.
      - name: Static guards (make verify-* — mass restart, double bootstrap, zero hardcode, role contract, conditional env, proxysql tenancy, inventory<->TF, secret leak, no state latest)
        run: |
          set -e
          for t in verify-no-mass-restart verify-no-double-bootstrap verify-zero-hardcode \
                   verify-role-contract verify-no-conditional-env verify-proxysql-tenancy \
                   verify-inventory-tf verify-no-secrets-leak verify-no-state-latest; do
            echo "== make $t"; make "$t"
          done

      - name: bash -n (all shell scripts)
        run: |
          set -e
          rc=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "bash -n FAIL: $f"; rc=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $rc

      - name: JSON schema file valid
        run: python3 -c "import json; json.load(open('clusters/schema/cluster.schema.json')); print('schema JSON valid')"

  # Stan na 2026-08-17: 0 naruszen. Ostatni syntax-check[specific] w f10_backup.yml
  # rozwiazany konwencja repo (hosts z `| default(...)`, jak bootstrap.yml/firewall.yml)
  # zamiast wykluczania pliku z lintu. Kosmetyka name[casing]/empty-lines poprawiona
  # w miejscu; yaml[line-length] wylaczony w .ansible-lint (tam uzasadnienie).
  # Merytoryka splacona: pipefail w potokach sond, package_facts/service_facts/uri
  # zamiast rpm/systemctl/curl, changed_when na mutatorach, handler dla restartu
  # Dockera, prefiks galera_backup_ dla zmiennych rejestrowanych w roli.
  # Dwa celowe, uzasadnione w kodzie wyjatki noqa: `systemctl is-active` w site.yml
  # (rc steruje rozgalezieniem FLUSH SSL vs restart klastra) i komenda operatora
  # w f12_apply_patch.yml (dane operatora moga uzywac featurow shella).
  lint:
    name: ansible-lint (blocking — 0 naruszeń)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # ansible-core 2.21.x wymaga Pythona >=3.12 (requires_python, PyPI).
          python-version: '3.12'
      # ansible-lint ma twardy require na ansible-core (requires_dist na
      # PyPI: ansible-core!=2.17.*,>=2.16.19), wiec para jest przypinana
      # razem. Podbicie: sprawdz requires_dist na
      # pypi.org/pypi/ansible-lint/json i utrzymaj ansible-core zgodny
      # z versions/compatibility-report.md.
      - run: pip install ansible-lint==26.8.0 ansible-core==2.21.3
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint playbooks roles
        env:
          # ansible.cfg fail-closed odrzuca brak inventory. Lint uruchamia
          # nieskipowalny syntax-check, wiec dostaje jawny, niezywy wzorzec.
          ANSIBLE_INVENTORY: clusters/example-cluster/inventory.yml
