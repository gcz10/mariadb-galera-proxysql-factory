# ansible.cfg — produkcja: weryfikacja kluczy SSH globalnie ON.
# Laboratoria nadpisują StrictHostKeyChecking=no w swoim inventory.yml (zob. clusters/lab-*/inventory.yml).
# Domyślne inventory usunięte: ansible-playbook bez -i kończy błędem zamiast celować w example-cluster.
[defaults]
host_key_checking = True
roles_path = roles
stdout_callback = default
retry_files_enabled = False
interpreter_python = auto_silent

# Puste albo nieparsowalne inventory nie jest poprawnym no-opem. Domyslne
# zachowanie Ansible zwraca wtedy rc=0 ("no hosts matched"), co w cold recovery
# przepuszczalo nieaktualny plik wyboru wezla bootstrap.
[inventory]
unparsed_is_failed = True

[privilege_escalation]
become = True
become_method = sudo
