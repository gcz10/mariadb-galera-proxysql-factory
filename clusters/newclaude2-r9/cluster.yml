---
# newclaude2-r9 — klaster Galera na Rocky Linux 9 (Proxmox, real VM).
#
# KLASTER KONTROLNY, DRUGI PRZEBIEG. Pierwszy (`newclaude-r9`, 2026-08-15)
# zbudowal sie od zera i znalazl szesc defektow: brak generatora certow TLS,
# kolizje globalnego CA na wspoldzielonym ProxySQL, nieczytelna dla uslugi
# sciezke CA, martwa backreferencje Jinja w bloku YAML (zadanie nigdy nie bylo
# idempotentne) oraz trzy zalozenia sciezki agentless w F11. Wszystkie
# naprawione. Ten klaster sprawdza, czy poprawki trzymaja przy budowie od zera
# — tym razem LACZNIE z monitoringiem, ktorego pierwszy przebieg nie przeszedl.
# `finalclaude-r9` jest WYLACZONY (nie skasowany) i moze wrocic — dlatego kazdy
# identyfikator ponizej jest z nim rozlaczny.
#
# Adresacja: n2g1-3 na .160-.162 (VMID 9430-9432), restore n2r1 .163 (9433).
#
# WARSTWA WSPOLNA (terraform/shared/): ProxySQL fcp1/fcp2 .131/.132, VIP .133,
# infra .130 (PMM + MinIO). TA SAMA para ProxySQL obsluguje finalclaude-r10.
#
# ROZLACZNOSC NA WSPOLNYM ProxySQL — bez niej drugi klaster kasuje pierwszego:
#   hostgroup_base: 210  (writer 210, backup 220, reader 230, offline 240)
#                        finalclaude-r10 uzywa domyslnych 10/20/30/40
#   app_user: app_user_n2
#                        wpis w mysql_users jest globalny, a jego
#                        default_hostgroup wybiera klaster
# Pilnuje tego tests/validation/probe-proxysql-tenancy.py.
#
# Warstwa bazodanowa jest wersyjnie IDENTYCZNA z EL10 (MariaDB 11.4.12,
# galera-4 26.4.27) — rozniczke niesie wylacznie versions.lock_file ponizej.
#
# TLS jest WLACZONY na tym klastrze, a finalclaude-r10 zostaje plaintextem.
# Jest to mozliwe, bo `use_ssl` to kolumna PER SERWER w `mysql_servers`, a kazde
# zadanie TLS w f7_proxysql jest bramkowane wlasnym `tls.mode` klastra — klaster
# bez TLS nie czyta ani nie czysci CA sasiada.
#
# DWA klastry z tls.mode=full na tej samej parze ProxySQL sa juz bezpieczne.
# Do 2026-08-15 NIE byly: f7 zapisywalo CA do GLOBALNEJ zmiennej
# `mysql-ssl_p2s_ca` pod stala sciezka, wiec drugi klaster cicho nadpisywal CA
# pierwszego. Teraz f7 pisze wiersze `mysql_servers_ssl_params` (ssl_ca per
# hostname+port+username, ProxySQL >= 2.6.0), a CA lezy pod
# /etc/mysql/tls/<klaster>/ca.pem — sciezka per klaster i przechodnia dla
# uzytkownika `proxysql`. Pilnuje tego probe-proxysql-tenancy.py: sonda sprawdza
# obecnosc mechanizmu per-serwer, nie tylko brak kolizji miedzy klastrami.

cluster:
  name: "newclaude2-r9"
  environment: "laboratory"
  profile: "laboratory"
  automation_release: "0.1.0"

platform:
  virtualization: "proxmox_kvm"
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  # wsrep_cluster_name jest czescia tozsamosci Primary Component — kolizja nazw
  # skleilaby dwa niezalezne klastry w jeden.
  cluster_name: "n2_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  max_writers: 1
  read_write_split_enabled: false
  hostgroup_base: 210
  app_user: "app_user_n2"
  # Konsument warstwy wspolnej: NIE instaluje pakietow na fcp1/fcp2/fcinfra ani
  # nie zarzadza VIP-em. Rejestruje tylko wlasne hostgroupy i uzytkownika przez
  # f7. Ownerem tej pary jest finalclaude-r10 — i on postawil te wezly na EL10,
  # dlatego lockfile EL9 tego klastra ich nie dotyczy.
  role: "consumer"
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.133"   # VIP warstwy wspolnej — ten sam co finalclaude-r10
    port: 6033

tls:
  mode: "full"
  # RUNDA 3 (2026-08-14): fallback ZDJETY. Ten sam przelacznik wlacza [sst] encrypt=3
  # — sprzezenie jest celowe, bo SST nie ma odpowiednika socket.dynamic i dawca musi
  # zgadzac sie z przyjmujacym. Konfiguracja trafia na WSZYSTKIE wezly przed
  # jakimkolwiek restartem, wiec skrypt SST czyta encrypt=3 po obu stronach nawet
  # zanim mariadbd przeladuje wsrep_provider_options.
  socket_dynamic: false
  certificate_source: "file"
  ca_reference: "tests/lab/tls/n2/ca.pem"
  certificate_reference: "tests/lab/tls/n2/server-cert.pem"
  private_key_reference: "tests/lab/tls/n2/server-key.pem"
  # Wymuszanie TLS na WSZYSTKICH polaczeniach TCP to osobny krok, nie czesc tej
  # migracji: ProxySQL laczy sie do backendow z use_ssl=0, a mysqld_exporter i
  # agent QAN ida TCP na 127.0.0.1:3306 (nie socketem, wiec wyjatek dla socketa
  # unixowego ich nie obejmuje). Wlaczenie tego przed przelaczeniem tamtych
  # zshunnowaloby backendy i wygasilo metryki.
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.130/32"]

secrets:
  backend: "ansible_vault"   # env-only w aktualnej implementacji (patrz opis w schema)

storage:
  data_directory: "/var/lib/mysql"
  backup_staging_directory: "/var/tmp/mariadb-backup"
  filesystem: "xfs"
  expected_database_size_gb: "unknown"
  expected_growth_gb_per_month: "unknown"
  available_iops: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  rpo: "0"
  rto_node_failure: "2m"
  rto_full_cluster_failure: "30m"
  maintenance_window: "weekend"
  allowed_service_interruption: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "30 2 * * *"      # przesuniete wzgledem r10 (0 2) — wspolny MinIO
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 5 * * 0"      # przesuniete wzgledem r10 (0 4)
  scheduler:
    mode: "cron"
    # Nie moze byc aktywnym writerem ProxySQL — runner odrzuca backup z writera (ISC-39).
    host: "n2g1"
    timezone: "UTC"
  s3:
    endpoint: "192.168.1.130:9000"
    bucket: "n2-galera-backups"          # rozlaczny z fc9/fc10-galera-backups
    secure: false

monitoring:
  pmm:
    server_url: "https://192.168.1.130"
    agent_id: "pmm-server"
    # Namespace regul alertow i folderow w PMM — musi byc rozlaczny z fc10-galera.
    cluster_name: "n2-galera"
    validate_certs: false
    credentials_revision: 3
  # Wezly Galera tego klastra dostaja lokalnego pmm-agenta (porownanie z r10,
  # ktory zostaje agentless). ProxySQL pomijamy — nalezy do ownera (r10).
  agent_groups: ["galera"]
  # Zrodlo QAN. slowlog mozliwy TYLKO tu (lokalny agent czyta plik);
  # fc10 jest agentless i musi zostac przy perfschema.
  qan_source: "slowlog"
  system: "pmm"
  alerts:
    email: "ops@claude.local"
  log_destination: "journald"

mariadb_tuning:
  # Limit operatora: 5 GB RAM na VM; wezly Galera maja 3 GB. Buffer pool 768M
  # zostawia zapas na mariabackup podczas SST i backupu.
  innodb_buffer_pool_size: "768M"
  innodb_log_file_size: "256M"
  max_connections: 100
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "256M"
  # QAN ze slowloga zamiast perfschema — mozliwe TYLKO tu, bo ten klaster ma
  # lokalnego pmm-agenta czytajacego plik. finalclaude-r10 jest agentless
  # i zostaje przy perfschema; to swiadoma roznica do porownania.
  slow_query_log: "ON"
  # 0 = loguj wszystko (zmierzone: 276 B/zapytanie, ~1 GB/h przy 1000 q/s NA WEZEL).
  # 0.1 = tylko zapytania >=100 ms. QAN widzi wtedy WYLACZNIE te wolne — szybkie,
  # ale czeste zapytania znikaja z analizy, a to czesto one sumuja sie w obciazenie.
  long_query_time: 0.1
