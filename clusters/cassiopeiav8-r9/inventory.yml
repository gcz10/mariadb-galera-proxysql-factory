---
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3
  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        c8db1:
          ansible_host: "192.168.1.126"
          galera_node_address: "192.168.1.126"
          galera_node_idx: 1
        c8db2:
          ansible_host: "192.168.1.127"
          galera_node_address: "192.168.1.127"
          galera_node_idx: 2
        c8db3:
          ansible_host: "192.168.1.128"
          galera_node_address: "192.168.1.128"
          galera_node_idx: 3
    restore:
      vars:
        restore_role: "restore"
      hosts:
        c8r1:
          ansible_host: "192.168.1.136"
          restore_node_address: "192.168.1.136"
    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        x8p1:
          ansible_host: "192.168.1.119"
          proxysql_node_address: "192.168.1.119"
          proxysql_node_idx: 1
        x8p2:
          ansible_host: "192.168.1.120"
          proxysql_node_address: "192.168.1.120"
          proxysql_node_idx: 2
    app:
      vars:
        app_role: "app"
      hosts:
        x8app:
          ansible_host: "192.168.1.121"
          app_node_address: "192.168.1.121"
    infra:
      vars:
        infra_role: "infra"
      hosts:
        x8mon:
          ansible_host: "192.168.1.118"
          infra_node_address: "192.168.1.118"
