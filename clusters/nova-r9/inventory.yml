---
# Najemca `nova-r9`. Maszyny nv1-3 powstaly WYLACZNIE przez REST API Proxmoxa,
# bez Terraforma i bez szablonu VM - dowod, ze fabryka nie zna zrodla maszyn.
# kp1/kp2, kapp i kmon naleza do warstwy `kobalt`; ten najemca ich nie tworzy.
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        nv1:
          ansible_host: "192.168.1.36"
          galera_node_idx: 1
          galera_node_address: "192.168.1.36"
        nv2:
          ansible_host: "192.168.1.37"
          galera_node_idx: 2
          galera_node_address: "192.168.1.37"
        nv3:
          ansible_host: "192.168.1.39"
          galera_node_idx: 3
          galera_node_address: "192.168.1.39"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        kp1:
          ansible_host: "192.168.1.29"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.29"
        kp2:
          ansible_host: "192.168.1.30"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.30"

    app:
      vars:
        app_role: "app"
      hosts:
        kapp:
          ansible_host: "192.168.1.32"
          app_node_address: "192.168.1.32"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        kmon:
          ansible_host: "192.168.1.28"
          infra_node_address: "192.168.1.28"
