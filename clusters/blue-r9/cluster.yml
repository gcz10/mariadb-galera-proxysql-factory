---
# Blue Rocky 9 — drugi najemca warstwy wspolnej `green`, budowany z szablonu
# clusters/example-cluster/. Wszystko, co musi byc rozlaczne wobec `green-r9`:
# nazwa wsrep, baza hostgroup, uzytkownik aplikacyjny, namespace PMM, bucket S3
# i katalog PKI.
cluster:
  name: "blue-r9"
  environment: "laboratory"
  profile: "laboratory"

platform:
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  cluster_name: "bl_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  # Rozlacznosc najemcow na WSPOLNEJ parze ProxySQL. Baza rezerwuje CZTERY
  # hostgroupy (base, +10, +20, +30), wiec green z baza 890 zajmuje 890-920.
  # Pierwsza wolna baza to 930; 900 weszlo w jego backup_writera.
  hostgroup_base: 930
  app_user: "app_user_bl"
  frontend_tls:
    # CA wspolnego endpointu nalezy do platformy, nie do najemcy.
    ca_reference: "pki/green/ca.pem"
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.27"
    port: 6033

tls:
  mode: "full"
  socket_dynamic: false
  per_node_certificates: true
  ca_reference: "pki/bl9/ca.pem"
  certificate_reference: "pki/bl9/server-cert.pem"
  private_key_reference: "pki/bl9/server-key.pem"
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.23/32"]

storage:
  data_directory: "/var/lib/mysql"
  expected_database_size_gb: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  rto_node_failure: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "50 4 * * *"
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 19 * * 0"
  scheduler:
    mode: "cron"
    host: "bg1"
    timezone: "UTC"
  s3:
    # Istniejacy MinIO warstwy wspolnej. Najemca dostaje wlasny bucket i wlasne
    # konto scoped; instancja nie jest przez niego konfigurowana.
    endpoint: "192.168.1.23:9000"
    bucket: "blue-galera-backups"
    secure: false

monitoring:
  pmm:
    server_url: "https://192.168.1.23"
    agent_id: "pmm-server"
    cluster_name: "blue-galera"
    validate_certs: false
    credentials_revision: 1
  agent_groups: ["galera"]
  qan_source: "slowlog"
  alerts:
    email: "ops@claude.local"

mariadb_tuning:
  innodb_buffer_pool_size: "768M"
  innodb_log_file_size: "256M"
  max_connections: 100
  # Laboratory: jawny opt-out od bezpiecznego defaultu 1.
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "256M"
  slow_query_log: "ON"
  long_query_time: 0.1
