---
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3
  children:
    galera:
      hosts:
        o15db1:
          ansible_host: "192.168.1.80"
          galera_node_address: "192.168.1.80"
          galera_node_idx: 1
        o15db2:
          ansible_host: "192.168.1.81"
          galera_node_address: "192.168.1.81"
          galera_node_idx: 2
        o15db3:
          ansible_host: "192.168.1.82"
          galera_node_address: "192.168.1.82"
          galera_node_idx: 3
    restore:
      hosts:
        o15r1:
          ansible_host: "192.168.1.83"
          restore_node_address: "192.168.1.83"
    proxysql:
      hosts:
        x12p1:
          ansible_host: "192.168.1.71"
          proxysql_node_address: "192.168.1.71"
          proxysql_node_idx: 1
        x12p2:
          ansible_host: "192.168.1.72"
          proxysql_node_address: "192.168.1.72"
          proxysql_node_idx: 2
    app:
