---
# Example inventory — adresy IP żyją TYLKO tutaj, nie w cluster.yml ani rolach.
# Skopiuj do clusters/<name>/inventory.yml i uzupełnij adresy.

all:
  vars:
    ansible_user: "ansible"
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        gnode1:
          ansible_host: "10.0.0.11"
          galera_node_idx: 1
        gnode2:
          ansible_host: "10.0.0.12"
          galera_node_idx: 2
        gnode3:
          ansible_host: "10.0.0.13"
          galera_node_idx: 3

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        pnode1:
          ansible_host: "10.0.1.21"
          proxysql_node_idx: 1
        pnode2:
          ansible_host: "10.0.1.22"
          proxysql_node_idx: 2

    # Opcjonalna grupa dla F0 fio benchmark — TYLKO jawne testowe hosty.
    discovery_bench:
      hosts: {}
      vars:
        allow_bench: true
