---
# Example cluster — szablon konfiguracji. Skopiuj do clusters/<name>/cluster.yml.
# Walidowane przez clusters/schema/cluster.schema.json.
# Nie wpisuj adresów IP tutaj — adresy żyją w inventory.yml.

cluster:
  name: "example-cluster"
  environment: "laboratory"
  profile: "laboratory"
  automation_release: "0.1.0"

platform:
  virtualization: "vmware_esxi"
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  cluster_name: "example_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  max_writers: 1
  read_write_split_enabled: false
  endpoint:
    type: "keepalived_vip"
    address: "10.0.0.100"   # PLACEHOLDER — zastąp rzeczywistym VIP z sieci klastra
    port: 6033

# TLS opcjonalne per-klaster. mode=full => serwer prezentuje cert, replikacja Galera
# + SST + ProxySQL->backend szyfrowane. references = ścieżki na hoście kontrolnym
# (certificate_source=file) lub artefakty PKI produkcji (jeden cert z SAN wszystkich węzłów+VIP).
tls:
  mode: "disabled"                    # disabled | full
  certificate_source: ""             # "file" gdy references to ścieżki na hoście kontrolnym
  ca_reference: ""                   # CA (pem)
  certificate_reference: ""          # cert serwera z SAN=wszystkie IP/hostname węzłów + VIP
  private_key_reference: ""          # klucz prywatny serwera
  require_secure_transport: false    # true => wymusza TLS na WSZYSTKICH poł. TCP (klienci muszą mieć TLS)

network:
  application_cidrs: []
  database_cluster_cidrs: []
  administration_cidrs: []
  monitoring_cidrs: []

secrets:
  backend: "ansible_vault"

storage:
  data_directory: "/var/lib/mysql"
  backup_staging_directory: "/var/tmp/mariadb-backup"
  filesystem: "xfs"
  expected_database_size_gb: "unknown"
  expected_growth_gb_per_month: "unknown"
  available_iops: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

# Tuning MariaDB (opcjonalne). Pominięcie => bezpieczne minimalne wartości lab (server.cnf.j2 default).
# PRODUKCJA: dostosuj do RAM/IOPS węzła (patrz storage/workload powyżej).
mariadb_tuning:
  innodb_buffer_pool_size: "256M"    # produkcja: ~70% RAM węzła (np. "24G")
  innodb_log_file_size: "128M"       # produkcja: ~25% buffer pool (np. "2G")
  max_connections: 50                # produkcja: peak_connections + zapas
  innodb_flush_log_at_trx_commit: 0  # 1=pełne ACID; 0/2=wydajność (Galera: trwałość z replikacji klastra)
  gcache_size: "128M"                 # ISC-68: wylicz z calc-gcache.py; podbij przy realnym write rate

availability:
  rpo: "0"
  rto_node_failure: "2m"
  rto_full_cluster_failure: "30m"
  maintenance_window: "weekend"
  allowed_service_interruption: "2m"

backup:
  enabled: true
  destination: "smb"
  full_backup_schedule: "0 2 * * *"
  incremental_backup_schedule: "disabled"
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 4 * * 0"

monitoring:
  pmm:
    server_url: "https://pmm.example.invalid"
    agent_id: "pmm-server"
    cluster_name: "example-cluster"
    validate_certs: true
    credentials_revision: 1
  alerts:
    email: "alerts@example.invalid"
    folder_uid: "isa-alerts"
    datasource_uid: ""
  system: "pmm"
  log_destination: "unknown"
