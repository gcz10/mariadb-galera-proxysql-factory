---
# claude-r10t — 4 NOWE VM Rocky 10 z tls.mode=full (.54-.57, VMID 9160-9163),
# stworzone przez terraform/claude-r10t/.
#
# Nazwy hostow sa nosnikiem tozsamosci: f2_install ustawia hostname na
# inventory_hostname, a runner galera-backup porownuje go ze
# scheduler_system_hostname. Te same nazwy wystepuja w SAN certyfikatu
# (tests/lab/tls/server-cert.pem) — zmiana nazwy wymaga regeneracji certu.
#
# Grupa proxysql wskazuje na wezly claude-r10b WYLACZNIE po to, by spelnic
# proxysql.nodes_expected=2 wymagane przez schema i walidator inventory.
# f10_backup.yml / f10_restore.yml jej nie dotykaja. NIE uruchamiaj site.yml,
# f7_proxysql.yml ani f8_keepalived.yml z tym inventory — f7 rozprowadza CA na
# wezly ProxySQL i przekonfigurowalby zywy endpoint claude-r10b.
#
# Grupa infra wskazuje na wspoldzielone MinIO (.47) jako cel backupu S3.

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: tests/lab/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        gtnode1:
          ansible_host: "192.168.1.54"
          galera_node_idx: 1
          galera_node_address: "192.168.1.54"
        gtnode2:
          ansible_host: "192.168.1.55"
          galera_node_idx: 2
          galera_node_address: "192.168.1.55"
        gtnode3:
          ansible_host: "192.168.1.56"
          galera_node_idx: 3
          galera_node_address: "192.168.1.56"

    # WLASNA para ProxySQL (.58/.59, VMID 9164-9165) — NIE wspoldzielona.
    # f7_proxysql.yml przy tls.mode=full rozprowadza tu CA (owner root, bez
    # klucza prywatnego) i ustawia use_ssl=1 dla backendow. Uzycie pnode1/pnode2
    # klastra claude-r10b przekonfigurowaloby zywy endpoint.
    #
    # ProxySQL waliduje cert backendu wobec CA, a backendy to .54-.56 — sa w SAN
    # certyfikatu, wiec wezly ProxySQL nie potrzebuja wlasnego certu.
    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        ptnode1:
          ansible_host: "192.168.1.58"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.58"
        ptnode2:
          ansible_host: "192.168.1.59"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.59"

    # WLASNY wezel EL10 — host restore musi nalezec do tej samej rodziny OS co
    # klaster, bo f10_restore instaluje pakiety przypiete z lockfile'a
    # (MariaDB-server-11.4.12-1.el10). Dzielenie wezla miedzy rodziny konczy sie
    # "No package ... available".
    restore:
      vars:
        restore_role: "restore"
      hosts:
        rtnode1:
          ansible_host: "192.168.1.57"
          restore_node_address: "192.168.1.57"

    # WSPOLDZIELONY z claude-r10b — PMM + MinIO + maildev.
    infra:
      vars:
        infra_role: "infra"
      hosts:
        infranode:
          ansible_host: "192.168.1.47"
          infra_node_address: "192.168.1.47"
