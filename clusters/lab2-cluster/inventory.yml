---
# Drugi niezależny klaster (lab2) — ISC-60/61.
# Osobna sieć 172.29.0.x, osobne nazwy, osobny VIP/MinIO.
# SSH key: tests/lab/ssh_key (kontenery współdzielą Dockerfile).

all:
  vars:
    ansible_ssh_private_key_file: "tests/lab/ssh_key"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        gnode1b:
          ansible_host: "127.0.0.1"
          ansible_port: 2231
          ansible_user: "ansible"
          galera_node_idx: 1
          galera_node_address: "172.29.0.11"
        gnode2b:
          ansible_host: "127.0.0.1"
          ansible_port: 2232
          ansible_user: "ansible"
          galera_node_idx: 2
          galera_node_address: "172.29.0.12"
        gnode3b:
          ansible_host: "127.0.0.1"
          ansible_port: 2233
          ansible_user: "ansible"
          galera_node_idx: 3
          galera_node_address: "172.29.0.13"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        pnode1b:
          ansible_host: "127.0.0.1"
          ansible_port: 2234
          ansible_user: "ansible"
          proxysql_node_idx: 1
          proxysql_node_address: "172.29.0.21"
        pnode2b:
          ansible_host: "127.0.0.1"
          ansible_port: 2235
          ansible_user: "ansible"
          proxysql_node_idx: 2
          proxysql_node_address: "172.29.0.22"

    restore:
      vars:
        restore_role: "restore"
      hosts:
        rnode1b:
          ansible_host: "127.0.0.1"
          ansible_port: 2236
          ansible_user: "ansible"
