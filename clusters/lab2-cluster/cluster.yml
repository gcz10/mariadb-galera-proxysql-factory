---
# Drugi niezależny klaster (lab2) — ISC-60/61.
# Osobne nazwy (lab2_galera / lab2-galera), osobny VIP (172.29.0.30),
# osobny MinIO (172.29.0.60), osobny PMM namespace (lab2-galera).
# Powstaje wyłącznie przez ten katalog — zero zmian w rolach/playbookach.

cluster:
  name: "lab2-cluster"
  environment: "laboratory"
  profile: "laboratory"

platform:
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  cluster_name: "lab2_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  endpoint:
    type: "keepalived_vip"
    address: "172.29.0.30"
    port: 6033

# TLS full (demonstracja: TLS jest opcjonalne per-klaster — lab1 disabled, lab2 full).
# Certy lab są gitignored (tests/lab/tls/lab2/) i host-specyficzne; obok nich lezy
# san.cnf z lista SAN (DNS wezlow + IP 172.29.0.x + VIP). Regeneracja na innym
# hoscie, skladnia OpenSSL 3.x (genrsa i -nodes sa tam deprecowane):
#   cd tests/lab/tls/lab2
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out ca-key.pem
#   openssl req -x509 -new -noenc -key ca-key.pem -days 3650 -out ca.pem \
#     -subj /CN=isa-lab2-CA \
#     -addext "basicConstraints=critical,CA:TRUE,pathlen:0" \
#     -addext "keyUsage=critical,keyCertSign,cRLSign"
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out server-key.pem
#   openssl req -new -key server-key.pem -out server.csr -config san.cnf
#   openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -CAcreateserial \
#     -days 3650 -out server-cert.pem -extensions v3_req -extfile san.cnf
# basicConstraints/keyUsage na CA sa wymagane przez RFC 5280 — obecny certyfikat
# lab2 nie ma zadnych rozszerzen X509v3 i przejdzie tylko przez lagodne stosy TLS.
# Nastepnie zaktualizuj *_reference ponizej. Produkcja: uzyj korporacyjnego PKI.
tls:
  mode: "full"
  ca_reference: "tests/lab/tls/lab2/ca.pem"
  certificate_reference: "tests/lab/tls/lab2/server-cert.pem"
  private_key_reference: "tests/lab/tls/lab2/server-key.pem"

network:
  application_cidrs: []
  database_cluster_cidrs: []
  administration_cidrs: []
  monitoring_cidrs: []


storage:
  data_directory: "/var/lib/mysql"
  expected_database_size_gb: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

# Lab jawnie zachowuje dotychczasowy opt-out wydajnosciowy. Bez tego wpisu
# nowy bezpieczny default szablonu (=1) zmienilby zachowanie przy converge.
mariadb_tuning:
  innodb_flush_log_at_trx_commit: 0

availability:
  rto_node_failure: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "0 2 * * *"
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 4 * * 0"
  scheduler:
    mode: "manual"
    host: "gnode1b"
    timezone: "UTC"
  s3:
    endpoint: "172.29.0.60:9000"
    bucket: "lab2-galera-backups"
    secure: false

monitoring:
  pmm:
    server_url: "https://127.0.0.1:8443"
    agent_id: "pmm-server"
    cluster_name: "lab2-galera"
    validate_certs: false
    credentials_revision: 2
