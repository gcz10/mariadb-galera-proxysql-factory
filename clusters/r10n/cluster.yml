---
# r10n — trzeci klaster Rocky Linux 10, postawiony od zera na wolnej adresacji.
# Warstwa bazy jest WLASNA (gnode: galera1-3, VMID 9190-9192, IP .71-.73),
# natomiast ProxySQL, VIP, restore i infra sa WSPOLDZIELONE z claude-r10b.
#
# WSPOLDZIELONE Z claude-r10b (nie stawiane przez terraform/r10n/):
#   ProxySQL pnode1-2 .44/.45, VIP .50, restore rnode1 .46, infra .47 (PMM + MinIO).
#
# KONSEKWENCJA OPERACYJNA: f7_proxysql.yml i f8_keepalived.yml uruchomione dla
# claude-r10b przepna wspoldzielony ProxySQL i VIP z powrotem na wezly .51-.53.
# Dopoki oba klastry dziela ten sam ProxySQL, tylko JEDEN z nich moze byc
# wlascicielem konfiguracji warstwy dostepowej — obecnie jest nim r10n.
#
# Nazwa `r10n` jest CZESCIA TOZSAMOSCI wdrozenia: /opt/galera-backup/clusters/r10n,
# /etc/cron.d/galera-backup-r10n oraz marker wlasciciela bucketu w MinIO
# (galera-backup-owner.json). Zmiana nazwy wymaga skasowania markera i rekonfiguracji.

cluster:
  name: "r10n"
  environment: "laboratory"
  profile: "laboratory"
  automation_release: "0.1.0"

platform:
  virtualization: "proxmox_kvm"
  rocky_linux_major: 10

versions:
  policy: "candidate"
  lock_file: "versions/versions-el10.lock.yml"

galera:
  # Rozlaczna z claude_galera (EL9) i r10b_galera_g2 — wsrep_cluster_name jest
  # czescia tozsamosci Primary Component, wiec kolizja nazw laczy klastry.
  cluster_name: "r10n_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  max_writers: 1
  read_write_split_enabled: false
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.50"   # VIP wspoldzielony z claude-r10b
    port: 6033

tls:
  mode: "disabled"
  certificate_source: ""
  ca_reference: ""
  certificate_reference: ""
  private_key_reference: ""
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.47/32"]

secrets:
  backend: "ansible_vault"   # env-only w aktualnej implementacji (patrz opis w schema)

storage:
  data_directory: "/var/lib/mysql"
  backup_staging_directory: "/var/tmp/mariadb-backup"
  filesystem: "xfs"
  expected_database_size_gb: "unknown"
  expected_growth_gb_per_month: "unknown"
  available_iops: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  # RPO 0 opiera sie na synchronicznej replikacji Galery, nie na trwalosci
  # pojedynczego wezla — patrz innodb_flush_log_at_trx_commit ponizej.
  rpo: "0"
  rto_node_failure: "2m"
  rto_full_cluster_failure: "30m"
  maintenance_window: "weekend"
  allowed_service_interruption: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "0 2 * * *"
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 4 * * 0"
  scheduler:
    mode: "cron"
    # Nie moze byc aktywnym writerem ProxySQL — runner odrzuca backup z writera (ISC-39).
    host: "galera1"
    timezone: "UTC"
  s3:
    endpoint: "192.168.1.47:9000"    # MinIO na wspoldzielonej infra VM
    bucket: "r10n-galera-backups"    # rozlaczny z bucketami r10b/r10t/r9g
    secure: false

monitoring:
  pmm:
    server_url: "https://192.168.1.47"
    agent_id: "pmm-server"
    # Namespace regul alertow, folderow i contact pointow w PMM — musi byc
    # rozlaczny z r10b-galera, inaczej klastry nadpisza sobie reguly.
    cluster_name: "r10n-galera"
    validate_certs: false
    credentials_revision: 1
  system: "pmm"
  alerts:
    email: "ops@claude.local"
  log_destination: "journald"

mariadb_tuning:
  innodb_buffer_pool_size: "1G"
  innodb_log_file_size: "256M"
  max_connections: 100
  # 0 = wydajnosc kosztem trwalosci POJEDYNCZEGO wezla; przy 3 wezlach Galery
  # zatwierdzona transakcja zyje w Primary Component, ale jednoczesna utrata
  # zasilania wszystkich wezlow moze kosztowac ostatnia sekunde zapisow.
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "256M"
