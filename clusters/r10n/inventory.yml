---
# r10n — trzeci klaster ISA na Rocky Linux 10 (Proxmox, real VM).
# Logowanie jako root przez klucz cloud-init; become:true jest wtedy no-opem.
# VM Galera tworzy terraform/r10n/: galera1-3 (VMID 9190-9192, IP .71-.73).
# ProxySQL (.44/.45), restore (.46) i infra (.47) NALEZA do terraform/claude-r10b/
# i sa tu tylko deklarowane — ten katalog ich nie tworzy ani nie niszczy. VIP .50.

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: tests/lab/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        galera1:
          ansible_host: "192.168.1.71"
          galera_node_idx: 1
          galera_node_address: "192.168.1.71"
        galera2:
          ansible_host: "192.168.1.72"
          galera_node_idx: 2
          galera_node_address: "192.168.1.72"
        galera3:
          ansible_host: "192.168.1.73"
          galera_node_idx: 3
          galera_node_address: "192.168.1.73"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        pnode1:
          ansible_host: "192.168.1.44"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.44"
        pnode2:
          ansible_host: "192.168.1.45"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.45"

    restore:
      vars:
        restore_role: "restore"
      hosts:
        rnode1:
          ansible_host: "192.168.1.46"
          restore_node_address: "192.168.1.46"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        infranode:
          ansible_host: "192.168.1.47"
          infra_node_address: "192.168.1.47"
