---
# claude-r9g — MALY klaster weryfikacyjny na Rocky Linux 9 (Proxmox, real VM).
#
# Cel: udowodnic, ze ten sam runner galera-backup i ta sama rola dzialaja na EL9
# tak samo jak na EL10 (claude-r10b). Rozniczke niesie WYLACZNIE
# versions.lock_file — kod playbookow nie zna platformy.
#
# Terraform tworzy TYLKO 3 wezly Galera (.17-.19, 2 GB kazdy). ProxySQL, restore
# i monitoring sa DZIEDZICZONE po dzialajacym claude-r10b — patrz inventory.yml.
# Warstwa bazodanowa jest wersyjnie identyczna z EL10 (MariaDB 11.4.12,
# galera-4 26.4.27) — to zmiana systemu operacyjnego, nie upgrade bazy.

cluster:
  name: "claude-r9g"
  environment: "laboratory"
  profile: "laboratory"
  automation_release: "0.1.0"

platform:
  virtualization: "proxmox_kvm"
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  # Nazwa rozlaczna z claude_galera (claude-pve) i r10b_galera_g2 (claude-r10b) —
  # wsrep_cluster_name jest czescia tozsamosci Primary Component.
  cluster_name: "r9g_galera"
  nodes_expected: 3

# ProxySQL NIE jest stawiany przez ten klaster. Blok opisuje wspoldzielony
# endpoint claude-r10b (VIP Keepalived na pnode1/pnode2), zeby schema i
# walidator inventory mialy spojna deklaracje. NIE uruchamiaj site.yml ani
# playbookow ProxySQL z tym cluster.yml — przekierowalyby zywy ProxySQL
# claude-r10b na te wezly.
proxysql:
  nodes_expected: 2
  max_writers: 1
  read_write_split_enabled: false
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.50"   # VIP claude-r10b — wspoldzielony, nie tworzony tutaj
    port: 6033

# TLS disabled — tak samo jak na claude-r10b, zeby porownanie platform bylo 1:1.
tls:
  mode: "disabled"
  certificate_source: ""
  ca_reference: ""
  certificate_reference: ""
  private_key_reference: ""
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.47/32"]

secrets:
  backend: "ansible_vault"   # env-only w aktualnej implementacji (patrz opis w schema)

storage:
  data_directory: "/var/lib/mysql"
  backup_staging_directory: "/var/tmp/mariadb-backup"
  filesystem: "xfs"
  expected_database_size_gb: "unknown"
  expected_growth_gb_per_month: "unknown"
  available_iops: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  rpo: "0"
  rto_node_failure: "2m"
  rto_full_cluster_failure: "30m"
  maintenance_window: "weekend"
  allowed_service_interruption: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "0 2 * * *"
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 4 * * 0"
  # Tryb manual: cron zostal juz dowiedziony na EL9 (harmonogram tymczasowy
  # "5 16 * * *" wystrzelil 16:05:02 UTC i wyprodukowal drugi artefakt).
  # Klaster jest weryfikacyjny, wiec nie zostawiamy dobowego harmonogramu.
  scheduler:
    mode: "manual"
    host: "g9node1"
    timezone: "UTC"
  s3:
    endpoint: "192.168.1.47:9000"    # wspoldzielone MinIO claude-r10b
    bucket: "r9g-galera-backups"     # bucket rozlaczny — wlasnosc egzekwuje owner marker
    secure: false
monitoring:
  pmm:
    server_url: "https://192.168.1.47"   # wspoldzielony PMM claude-r10b
    agent_id: "pmm-server"
    # Etykieta klastra namespace'uje reguly alertow w PMM (UID/folder/contact point).
    # Musi byc rozlaczna z r10b-galera, inaczej klastry nadpisza sobie reguly.
    cluster_name: "r9g-galera"
    validate_certs: false
    credentials_revision: 1
  system: "pmm"
  alerts:
    email: "ops@claude.local"
  log_destination: "journald"

mariadb_tuning:
  # VM ma 2 GB. Buffer pool 512M + gcache 256M zostawia zapas na mariadbd,
  # SST (mariabackup) i system.
  innodb_buffer_pool_size: "512M"
  innodb_log_file_size: "128M"
  max_connections: 100
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "256M"
