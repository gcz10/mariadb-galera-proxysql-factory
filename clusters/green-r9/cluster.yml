---
# Green Rocky 9 — swiezy klaster Galera korzystajacy z platform/green.
# Nazwy, VMID, IP, wsrep_cluster_name, PMM namespace, bucket, app user i
# hostgroupy sa rozlaczne od wszystkich obecnych i zatrzymanych stackow.
cluster:
  name: "green-r9"
  environment: "laboratory"
  profile: "laboratory"

platform:
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  cluster_name: "gr_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  hostgroup_base: 890
  app_user: "app_user_gr"
  frontend_tls:
    ca_reference: "pki/green/ca.pem"
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.27"
    port: 6033

tls:
  mode: "full"
  socket_dynamic: false
  per_node_certificates: true
  ca_reference: "pki/gr9/ca.pem"
  certificate_reference: "pki/gr9/server-cert.pem"
  private_key_reference: "pki/gr9/server-key.pem"
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.23/32"]

storage:
  data_directory: "/var/lib/mysql"
  expected_database_size_gb: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  rto_node_failure: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "40 4 * * *"
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 18 * * 0"
  scheduler:
    mode: "cron"
    host: "grg1"
    timezone: "UTC"
  s3:
    endpoint: "192.168.1.23:9000"
    bucket: "green-galera-backups"
    secure: false

monitoring:
  pmm:
    server_url: "https://192.168.1.23"
    agent_id: "pmm-server"
    cluster_name: "green-galera"
    validate_certs: false
    credentials_revision: 1
  agent_groups: ["galera"]
  qan_source: "slowlog"
  alerts:
    email: "ops@claude.local"

mariadb_tuning:
  innodb_buffer_pool_size: "768M"
  innodb_log_file_size: "256M"
  max_connections: 100
  # Laboratory: jawny opt-out od bezpiecznego defaultu 1.
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "256M"
  slow_query_log: "ON"
  long_query_time: 0.1
