---
# newclaude17-r9 - klaster Galera na Rocky Linux 9 (Proxmox, real VM).
#
# SIEDMNASTY przebieg budowy warstwy Galera od zera.
#
# Hipoteza: to pierwszy klaster stawiany JEDNYM poleceniem `make cluster-build`
# po naprawie cyklu zycia. Wczesniej krok `backup` konczyl sie na samej
# konfiguracji runnera, wiec bramka `lab-post-build-gate` odpalala probe-backup
# i probe-restore, nie majac zadnego dowodu do zmierzenia. Teraz build wykonuje
# configure -> backup -> drill restore -> odswiezenie metryk PRZED bramka.
# Dowodem jest przejscie bramki za PIERWSZYM podejsciem, bez recznych krokow.
#
# Adresacja: n17g1-3 na .144-.146 (VMID 9550-9552), restore n17r1 .147 (9553).
# Blok .144-.147 jest SWIEZY (aktywny skan 2026-08-22: wolne, bez reuzywania
# adresow po n16). VMID 9550-9553 sa REUZYWANE po newclaude16-r9, ktory zostal
# zderejestrowany (PMM, Grafana, ProxySQL, konto serwisowe MinIO) i zniszczony.
# To swiadomy test kompletnosci sprzatania: niedokonczona derejestracja
# objawilaby sie natychmiast kolizja w PMM, ProxySQL albo sierota ZFS.
# NAZWY hostow sa nowe, bo PMM Inventory wymaga globalnej unikalnosci we flocie.
#
# WARSTWA WSPOLNA (terraform/shared/): ProxySQL fcp1/fcp2 .131/.132, VIP .139,
# app fcapp .134, infra .130 (PMM + MinIO). Ten klaster jest jej KONSUMENTEM -
# nie tworzy jej, nie niszczy i nie zarzadza VIP-em. Ownerem pary ProxySQL
# jest finalclaude-r10.
#
# ROZLACZNOSC NA WSPOLNYM ProxySQL - bez niej drugi klaster kasuje pierwszego:
#   hostgroup_base: 850 (writer 850, backup 860, reader 870, offline 880)
#     finalclaude-r10 uzywa 10/20/30/40; blok 850 zwolniony po n16.
#   app_user: app_user_n17
#     wpis w mysql_users jest globalny, a jego default_hostgroup wybiera klaster
#   Pilnuje tego tests/validation/probe-proxysql-tenancy.py.
#
# TLS jest WLACZONY z rozlacznym CA per klaster pod /etc/mysql/tls/<klaster>/ca.pem
# (sciezka przechodnia dla uzytkownika `proxysql`; /etc/proxysql jest 0750 root:root).

cluster:
  name: "newclaude17-r9"
  environment: "laboratory"
  profile: "laboratory"

platform:
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  # wsrep_cluster_name jest czescia tozsamosci Primary Component - kolizja nazw
  # skleilaby dwa niezalezne klastry w jeden.
  cluster_name: "n17_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  hostgroup_base: 850
  app_user: "app_user_n17"
  # Najemca warstwy wspolnej: NIE instaluje pakietow na fcp1/fcp2/fcinfra ani
  # nie zarzadza VIP-em. Rejestruje tylko wlasne hostgroupy i uzytkownika przez f7.
  # Wezly wspolne postawila warstwa platform na EL10, wiec lockfile EL9 najemcy
  # ich nie dotyczy.
  # Najemca DEKLARUJE, komu ufa na wspolnym endpoincie, ale go NIE wdraza -
  # material frontendu nalezy do platform/shared/platform.yml. Ta sciezka trafia
  # na host aplikacyjny, zeby klient mogl zweryfikowac lancuch VIP-a. CA jest
  # wspolne, nie klastrowe: jeden cert frontendu obsluguje wszystkie klastry naraz.
  frontend_tls:
    ca_reference: "pki/shared/ca.pem"
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.139"   # VIP warstwy wspolnej - ten sam co finalclaude-r10
    port: 6033

tls:
  mode: "full"
  socket_dynamic: false
  # Lisc i klucz PER WEZEL spod wspolnego CA (node-<host>-{cert,key}.pem).
  # certificate_reference/private_key_reference zostaja jako opis wspolnego
  # materialu i sa ignorowane przy tej fladze - sciezke liscia wyprowadza
  # tls_certs.yml z katalogu CA i `inventory_hostname`.
  per_node_certificates: true
  ca_reference: "pki/n17/ca.pem"
  certificate_reference: "pki/n17/server-cert.pem"
  private_key_reference: "pki/n17/server-key.pem"
  # Wymuszanie TLS na WSZYSTKICH polaczeniach TCP to osobny krok: ProxySQL laczy
  # sie do backendow z use_ssl per serwer, a mysqld_exporter i agent QAN ida TCP
  # na 127.0.0.1:3306. Wlaczenie tego tutaj zshunnowaloby backendy i wygasilo metryki.
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.130/32"]


storage:
  data_directory: "/var/lib/mysql"
  expected_database_size_gb: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  rto_node_failure: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "20 4 * * *"       # rozlaczne z r10 (0 2) i po n16
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  # Materializowany w /etc/cron.d/galera-restore-<cluster>. Na swiezym hoscie
  # schedulera zadanie musi powstac przy pierwszym `configure`.
  restore_test_schedule: "0 17 * * 0"      # rozlaczne z r10 (0 4) i po n16
  scheduler:
    mode: "cron"
    # Nie moze byc aktywnym writerem ProxySQL - runner odrzuca backup z writera (ISC-39).
    host: "n17g1"
    timezone: "UTC"
  s3:
    endpoint: "192.168.1.130:9000"
    bucket: "n17-galera-backups"           # rozlaczny z fc10-galera-backups
    secure: false

monitoring:
  pmm:
    server_url: "https://192.168.1.130"
    agent_id: "pmm-server"
    # Namespace regul alertow i folderow w PMM - musi byc rozlaczny z fc10-galera.
    cluster_name: "n17-galera"
    validate_certs: false
    credentials_revision: 1
  # Wezly Galera dostaja lokalnego pmm-agenta. ProxySQL pomijamy - to wezly
  # warstwy wspolnej i rejestruje je platform/shared w PMM.
  # To ta sciezka (local-agent) wymaga, by F11 sam usunal anonimowe konta: eksporter
  # laczy sie po TCP na 127.0.0.1, ktore MariaDB resolvuje do 'localhost'.
  agent_groups: ["galera"]
  # Zrodlo QAN. slowlog mozliwy TYLKO tu (lokalny agent czyta plik);
  # fc10 jest agentless i musi zostac przy perfschema.
  qan_source: "slowlog"
  alerts:
    email: "ops@claude.local"

mariadb_tuning:
  # Limit operatora: 5 GB RAM na VM; wezly Galera maja 3 GB. Buffer pool 768M
  # zostawia zapas na mariabackup podczas SST i backupu.
  innodb_buffer_pool_size: "768M"
  innodb_log_file_size: "256M"
  max_connections: 100
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "256M"
  slow_query_log: "ON"
  # 0.1 = tylko zapytania >=100 ms. Przy 0 (loguj wszystko) zmierzono 276 B/zapytanie,
  # czyli ~1 GB/h przy 1000 q/s NA WEZEL.
  long_query_time: 0.1
