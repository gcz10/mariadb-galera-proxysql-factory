---
# newclaude17-r9 - klaster Galera na Rocky Linux 9 (Proxmox, real VM).
# Logowanie jako root przez klucz cloud-init; become:true jest wtedy no-opem.
#
# VM Galera i restore tworzy terraform/newclaude17-r9/:
#   n17g1-3 (VMID 9550-9552, IP .144-.146), n17r1 (9553, .147).
# ProxySQL fcp1/fcp2 (.131/.132), app fcapp (.134) i infra fcinfra (.130)
# NALEZA do terraform/shared/ i sa tu tylko deklarowane - ten katalog ich
# nie tworzy ani nie niszczy. VIP .139.
#
# Nazwy hostow sa globalnie rozlaczne w calej flocie: trafiaja do PMM Inventory
# jako <pmm.cluster_name>-<host> oraz do hostname VM. Adresy sa reuzyte po
# zderejestrowanym i zniszczonym newclaude16-r9, ale nazwy juz nie - dzieki
# temu jakikolwiek niedosprzatany obiekt po n16 wyszedlby jako kolizja, a nie
# jako cichy zlepek dwoch klastrow.

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: tests/lab/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        n17g1:
          ansible_host: "192.168.1.144"
          galera_node_idx: 1
          galera_node_address: "192.168.1.144"
        n17g2:
          ansible_host: "192.168.1.145"
          galera_node_idx: 2
          galera_node_address: "192.168.1.145"
        n17g3:
          ansible_host: "192.168.1.146"
          galera_node_idx: 3
          galera_node_address: "192.168.1.146"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        fcp1:
          ansible_host: "192.168.1.131"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.131"
        fcp2:
          ansible_host: "192.168.1.132"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.132"

    restore:
      vars:
        restore_role: "restore"
      hosts:
        n17r1:
          ansible_host: "192.168.1.147"
          restore_node_address: "192.168.1.147"

    # Host APLIKACYJNY warstwy wspolnej: laczy sie do klastra tak, jak zrobilaby
    # to aplikacja (po sieci, przez VIP). Nie jest wezlem bazy i nie liczy sie do
    # zadnego nodes_expected. Tworzy go terraform/shared/, nie ten klaster.
    app:
      vars:
        app_role: "app"
      hosts:
        fcapp:
          ansible_host: "192.168.1.134"
          app_node_address: "192.168.1.134"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        fcinfra:
          ansible_host: "192.168.1.130"
          infra_node_address: "192.168.1.130"
