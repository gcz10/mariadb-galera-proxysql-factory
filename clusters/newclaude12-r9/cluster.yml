---
# newclaude12-r9 — klaster Galera na Rocky Linux 9 (Proxmox, real VM).
#
# DWUNASTY przebieg budowy warstwy Galera od zera.
#
# Hipoteza: od czasu n11 przerobiono `command`/`shell` na moduly (package_facts,
# service_facts, uri) w ~25 playbookach, zmieniono `state MASTER`->`BACKUP` w
# keepalived, dodano certy per wezel i cert frontendu ProxySQL. WSZYSTKO to bylo
# weryfikowane na ISTNIEJACYM klastrze. Budowa od zera przechodzi sciezki, ktorych
# zbiezny klaster nie dotyka: package_facts na czystym hoście, preflight czystosci,
# bootstrap, SST przy dolaczaniu, pierwsza rejestracja w PMM i w ProxySQL.
#
# Kolejnosc wg README.md:32-38 — F11 przed F6, lab-seed-smoke przed drillem,
# lab-monitoring-verify na samym koncu.
#
# Adresacja: n12g1-3 na .172-.174 (VMID 9520-9522), restore n12r1 .175 (9523).
# Blok potwierdzony AKTYWNYM skanem (ping + 22/8006). Skan jest falsyfikowalny:
# kontrola .179/.184 wyszla ZYWA, a .189 okazal sie nowym zywym hostem, ktorego
# nie bylo na dotychczasowej liscie — dlatego blok .185-.188, nie .186-.189.
#
# WARSTWA WSPOLNA (terraform/shared/): ProxySQL fcp1/fcp2 .131/.132, VIP .133,
# app fcapp .134, infra .130 (PMM + MinIO). Ten klaster jest jej KONSUMENTEM —
# nie tworzy jej, nie niszczy i nie zarzadza VIP-em. Ownerem pary ProxySQL
# jest finalclaude-r10.
#
# ROZLACZNOSC NA WSPOLNYM ProxySQL — bez niej drugi klaster kasuje pierwszego:
#   hostgroup_base: 690 (writer 690, backup 700, reader 710, offline 720)
#     finalclaude-r10 uzywa 10/20/30/40, finalclaude-r9 110-140
#   app_user: app_user_n12
#     wpis w mysql_users jest globalny, a jego default_hostgroup wybiera klaster
#   Pilnuje tego tests/validation/probe-proxysql-tenancy.py.
#
# TLS jest WLACZONY z rozlacznym CA per klaster pod /etc/mysql/tls/<klaster>/ca.pem
# (sciezka przechodnia dla uzytkownika `proxysql`; /etc/proxysql jest 0750 root:root).

cluster:
  name: "newclaude12-r9"
  environment: "laboratory"
  profile: "laboratory"
  automation_release: "0.1.0"

platform:
  virtualization: "proxmox_kvm"
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  # wsrep_cluster_name jest czescia tozsamosci Primary Component — kolizja nazw
  # skleilaby dwa niezalezne klastry w jeden.
  cluster_name: "n12_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  max_writers: 1
  read_write_split_enabled: false
  hostgroup_base: 690
  app_user: "app_user_n12"
  # Konsument warstwy wspolnej: NIE instaluje pakietow na fcp1/fcp2/fcinfra ani
  # nie zarzadza VIP-em. Rejestruje tylko wlasne hostgroupy i uzytkownika przez f7.
  # Owner (finalclaude-r10) postawil te wezly na EL10, wiec lockfile EL9 ich nie dotyczy.
  role: "consumer"
  # Konsument DEKLARUJE, komu ufa na wspolnym endpoincie, ale go NIE wdraza —
  # material frontendu nalezy do ownera. Ta sciezka trafia na host aplikacyjny,
  # zeby klient mogl zweryfikowac lancuch VIP-a. CA jest wspolne, nie klastrowe:
  # jeden cert frontendu obsluguje wszystkie klastry naraz.
  frontend_tls:
    ca_reference: "tests/lab/tls/shared/ca.pem"
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.133"   # VIP warstwy wspolnej — ten sam co finalclaude-r10
    port: 6033

tls:
  mode: "full"
  socket_dynamic: false
  certificate_source: "file"
  # Lisc i klucz PER WEZEL spod wspolnego CA (node-<host>-{cert,key}.pem).
  # certificate_reference/private_key_reference zostaja jako opis wspolnego
  # materialu i sa ignorowane przy tej fladze — sciezke liscia wyprowadza
  # tls_certs.yml z katalogu CA i `inventory_hostname`.
  per_node_certificates: true
  ca_reference: "tests/lab/tls/n12/ca.pem"
  certificate_reference: "tests/lab/tls/n12/server-cert.pem"
  private_key_reference: "tests/lab/tls/n12/server-key.pem"
  # Wymuszanie TLS na WSZYSTKICH polaczeniach TCP to osobny krok: ProxySQL laczy
  # sie do backendow z use_ssl per serwer, a mysqld_exporter i agent QAN ida TCP
  # na 127.0.0.1:3306. Wlaczenie tego tutaj zshunnowaloby backendy i wygasilo metryki.
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.130/32"]

secrets:
  backend: "ansible_vault"

storage:
  data_directory: "/var/lib/mysql"
  backup_staging_directory: "/var/tmp/mariadb-backup"
  filesystem: "xfs"
  expected_database_size_gb: "unknown"
  expected_growth_gb_per_month: "unknown"
  available_iops: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  rpo: "0"
  rto_node_failure: "2m"
  rto_full_cluster_failure: "30m"
  maintenance_window: "weekend"
  allowed_service_interruption: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "20 3 * * *"       # rozlaczne z r10 (0 2), r9 (30 2), n10 (40 2)
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 12 * * 0"     # rozlaczne z r10 (0 4) i r9 (0 5)
  scheduler:
    mode: "cron"
    # Nie moze byc aktywnym writerem ProxySQL — runner odrzuca backup z writera (ISC-39).
    host: "n12g1"
    timezone: "UTC"
  s3:
    endpoint: "192.168.1.130:9000"
    bucket: "n12-galera-backups"          # rozlaczny z fc10-galera-backups
    secure: false

monitoring:
  pmm:
    server_url: "https://192.168.1.130"
    agent_id: "pmm-server"
    # Namespace regul alertow i folderow w PMM — musi byc rozlaczny z fc10-galera.
    cluster_name: "n12-galera"
    validate_certs: false
    credentials_revision: 1
  # Wezly Galera dostaja lokalnego pmm-agenta. ProxySQL pomijamy — nalezy do ownera (r10).
  # To ta sciezka (local-agent) wymaga, by F11 sam usunal anonimowe konta: eksporter
  # laczy sie po TCP na 127.0.0.1, ktore MariaDB resolvuje do 'localhost'.
  agent_groups: ["galera"]
  # Zrodlo QAN. slowlog mozliwy TYLKO tu (lokalny agent czyta plik);
  # fc10 jest agentless i musi zostac przy perfschema.
  qan_source: "slowlog"
  system: "pmm"
  alerts:
    email: "ops@claude.local"

mariadb_tuning:
  # Limit operatora: 5 GB RAM na VM; wezly Galera maja 3 GB. Buffer pool 768M
  # zostawia zapas na mariabackup podczas SST i backupu.
  innodb_buffer_pool_size: "768M"
  innodb_log_file_size: "256M"
  max_connections: 100
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "256M"
  slow_query_log: "ON"
  # 0.1 = tylko zapytania >=100 ms. Przy 0 (loguj wszystko) zmierzono 276 B/zapytanie,
  # czyli ~1 GB/h przy 1000 q/s NA WEZEL.
  long_query_time: 0.1
