---
cluster:
  name: "cassiopeiav13-r9"
  environment: "laboratory"

# VM-y tworzone recznie przez tools/pve-create-vm.sh (machines-from-elsewhere)
terraform_managed: false

platform:
  rocky_linux_major: 9

versions:
  policy: "locked"
  lock_file: "versions/versions.lock.yml"

galera:
  cluster_name: "cassiopeiav13_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  hostgroup_base: 810
  app_user: "app_user_cv13"
  frontend_tls:
    ca_reference: "pki/xenonv11/ca.pem"
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.172"
    port: 6033

tls:
  mode: "full"
  ca_reference: "pki/c13/ca.pem"
  certificate_reference: "pki/c13/server-cert.pem"
  private_key_reference: "pki/c13/server-key.pem"
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.160/32"]

storage:
  data_directory: "/var/lib/mysql"
  expected_database_size_gb: "unknown"

mariadb_tuning:
  innodb_buffer_pool_size: "256M"
  innodb_log_file_size: "128M"
  max_connections: 50
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "512M"

availability:
  rto_node_failure: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "30 2 * * *"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  restore_test_schedule: "0 15 * * 0"
  scheduler:
    mode: "cron"
    host: "c13db1"
    timezone: "UTC"
  s3:
    endpoint: "192.168.1.160:9000"
    bucket: "cassiopeiav13-galera-backups"
    secure: false

monitoring:
  pmm:
    server_url: "https://192.168.1.160"
    cluster_name: "cassiopeiav13-r9"
    validate_certs: false
    credentials_revision: 1
  alerts:
    email: "ops@claude.local"
    folder_uid: ""
    datasource_uid: ""
