---
# claude-r10 — klaster ISA na Rocky Linux 10 (Proxmox, real VM).
# Logowanie jako root przez klucz cloud-init; become:true jest wtedy no-opem.
# VM tworzy terraform/claude-r10/ (VMID 9110-9116), IP 192.168.1.30-36, VIP .40.

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: tests/lab/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        gnode1:
          ansible_host: "192.168.1.37"
          galera_node_idx: 1
          galera_node_address: "192.168.1.37"
        gnode2:
          ansible_host: "192.168.1.31"
          galera_node_idx: 2
          galera_node_address: "192.168.1.31"
        gnode3:
          ansible_host: "192.168.1.32"
          galera_node_idx: 3
          galera_node_address: "192.168.1.32"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        pnode1:
          ansible_host: "192.168.1.33"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.33"
        pnode2:
          ansible_host: "192.168.1.34"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.34"

    restore:
      vars:
        restore_role: "restore"
      hosts:
        rnode1:
          ansible_host: "192.168.1.35"
          restore_node_address: "192.168.1.35"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        infranode:
          ansible_host: "192.168.1.36"
          infra_node_address: "192.168.1.36"
