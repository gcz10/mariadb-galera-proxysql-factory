---
# Lab cluster inventory — 3 Galera + 2 ProxySQL w kontenerach Docker (OrbStack).
# BLK-1/BLK-2 ROZBLOKOWANE 2026-07-22 przez lokalny lab Docker.
# Profil: laboratory. Nie jest to produkcja — kontenery bez SELinux jądra.

all:
  vars:
    ansible_user: "ansible"
    ansible_become: true
    ansible_ssh_private_key_file: "tests/lab/ssh_key"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        gnode1:
          ansible_host: "127.0.0.1"
          ansible_port: 2221
          galera_node_idx: 1
          galera_node_address: "172.28.0.11"
        gnode2:
          ansible_host: "127.0.0.1"
          ansible_port: 2222
          galera_node_idx: 2
          galera_node_address: "172.28.0.12"
        gnode3:
          ansible_host: "127.0.0.1"
          ansible_port: 2223
          galera_node_idx: 3
          galera_node_address: "172.28.0.13"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        pnode1:
          ansible_host: "127.0.0.1"
          ansible_port: 2224
          proxysql_node_idx: 1
          proxysql_node_address: "172.28.0.21"
        pnode2:
          ansible_host: "127.0.0.1"
          ansible_port: 2225
          proxysql_node_idx: 2
          proxysql_node_address: "172.28.0.22"

    discovery_bench:
      hosts:
        gnode1:
      vars:
        allow_bench: true
