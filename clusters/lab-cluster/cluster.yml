---
# Lab cluster — konfiguracja dla 5-kontenerowego klastra Docker (OrbStack).
# Profil: laboratory. Nie jest to produkcja.

cluster:
  name: "lab-cluster"
  environment: "laboratory"
  profile: "laboratory"

platform:
  rocky_linux_major: 9

versions:
  policy: "candidate"
  lock_file: "versions/versions.lock.yml"

galera:
  cluster_name: "lab_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  endpoint:
    type: "keepalived_vip"
    address: "172.28.0.30"
    port: 6033

tls:
  mode: "disabled"
  ca_reference: ""
  certificate_reference: ""
  private_key_reference: ""

network:
  application_cidrs: ["172.28.0.0/24"]
  database_cluster_cidrs: ["172.28.0.0/24"]
  administration_cidrs: ["172.28.0.0/24"]
  monitoring_cidrs: ["172.28.0.0/24"]


storage:
  data_directory: "/var/lib/mysql"
  expected_database_size_gb: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  rto_node_failure: "2m"

backup:
  enabled: true
  # Produkcja: destination=smb (cifs mount). Lab OrbStack nie ma modułu jądra
  # cifs (uname -r 7.0.11-orbstack), więc lab używa S3 (MinIO) — sankcjonowana
  # opcja off-cluster. Ścieżka SMB jest zaimplementowana w f10_backup.yml,
  # ale nietestowalna w tym labie (ograniczenie jądra, jak brak SELinux).
  destination: "s3"
  full_backup_schedule: "0 2 * * *"
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 4 * * 0"
  scheduler:
    mode: "manual"
    host: "gnode1"
    timezone: "UTC"
  s3:
    endpoint: "172.28.0.60:9000"
    bucket: "galera-backups"
    region: "us-east-1"
    secure: false

monitoring:
  pmm:
    server_url: "https://127.0.0.1:8443"
    agent_id: "pmm-server"
    cluster_name: "lab-galera"
    validate_certs: false
    credentials_revision: 2
  alerts:
    email: "ops@lab.local"
