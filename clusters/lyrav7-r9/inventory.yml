---
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3
  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        l7g1:
          ansible_host: "192.168.1.90"
          galera_node_address: "192.168.1.90"
          galera_node_idx: 1
        l7g2:
          ansible_host: "192.168.1.91"
          galera_node_address: "192.168.1.91"
          galera_node_idx: 2
        l7g3:
          ansible_host: "192.168.1.92"
          galera_node_address: "192.168.1.92"
          galera_node_idx: 3
    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        l7p1:
          ansible_host: "192.168.1.86"
          proxysql_node_address: "192.168.1.86"
          proxysql_node_idx: 1
        l7p2:
          ansible_host: "192.168.1.87"
          proxysql_node_address: "192.168.1.87"
          proxysql_node_idx: 2
    app:
      vars:
        app_role: "app"
      hosts:
        l7app:
          ansible_host: "192.168.1.88"
          app_node_address: "192.168.1.88"
    infra:
      vars:
        infra_role: "infra"
      hosts:
        l7mon:
          ansible_host: "192.168.1.85"
          infra_node_address: "192.168.1.85"
    discovery_bench:
      hosts: {}
