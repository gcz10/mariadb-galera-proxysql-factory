---
# claude-r10b — DRUGI klaster ISA na Rocky Linux 10 (Proxmox, real VM).
# Logowanie jako root przez klucz cloud-init; become:true jest wtedy no-opem.
# VM tworzy terraform/claude-r10b/: Galera gnode4-6 (VMID 9130-9132, IP .51-.53),
# ProxySQL/restore/infra (VMID 9123-9126, IP .44-.47) — te ostatnie NIE sa przebudowywane. VIP .50.

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: tests/lab/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        gnode4:
          ansible_host: "192.168.1.51"
          galera_node_idx: 1
          galera_node_address: "192.168.1.51"
        gnode5:
          ansible_host: "192.168.1.52"
          galera_node_idx: 2
          galera_node_address: "192.168.1.52"
        gnode6:
          ansible_host: "192.168.1.53"
          galera_node_idx: 3
          galera_node_address: "192.168.1.53"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        pnode1:
          ansible_host: "192.168.1.44"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.44"
        pnode2:
          ansible_host: "192.168.1.45"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.45"

    restore:
      vars:
        restore_role: "restore"
      hosts:
        rnode1:
          ansible_host: "192.168.1.46"
          restore_node_address: "192.168.1.46"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        infranode:
          ansible_host: "192.168.1.47"
          infra_node_address: "192.168.1.47"
