---
# finalclaude-r10 — klaster Galera na Rocky Linux 10 (Proxmox, real VM).
# Logowanie jako root przez klucz cloud-init; become:true jest wtedy no-opem.
#
# VM Galera i restore tworzy terraform/finalclaude-r10/:
#   f10g1-3 (VMID 9410-9412, IP .140-.142), f10r1 (9413, .143).
# ProxySQL fcp1/fcp2 (.131/.132) i infra fcinfra (.130) NALEZA do terraform/shared/
# i sa tu tylko deklarowane — ten katalog ich nie tworzy ani nie niszczy. VIP .139.
#
# Nazwy hostow sa globalnie rozlaczne w calej flocie: traf iaja do PMM Inventory
# jako <pmm.cluster_name>-<host> oraz do hostname VM.

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: tests/lab/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        f10g1:
          ansible_host: "192.168.1.140"
          galera_node_idx: 1
          galera_node_address: "192.168.1.140"
        f10g2:
          ansible_host: "192.168.1.141"
          galera_node_idx: 2
          galera_node_address: "192.168.1.141"
        f10g3:
          ansible_host: "192.168.1.142"
          galera_node_idx: 3
          galera_node_address: "192.168.1.142"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        fcp1:
          ansible_host: "192.168.1.131"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.131"
        fcp2:
          ansible_host: "192.168.1.132"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.132"

    restore:
      vars:
        restore_role: "restore"
      hosts:
        f10r1:
          ansible_host: "192.168.1.143"
          restore_node_address: "192.168.1.143"

    # Host APLIKACYJNY warstwy wspolnej — ten sam dla calej floty. Nie jest wezlem
    # bazy i nie liczy sie do zadnego nodes_expected; tworzy go terraform/shared/.
    app:
      vars:
        app_role: "app"
      hosts:
        fcapp:
          ansible_host: "192.168.1.134"
          app_node_address: "192.168.1.134"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        fcinfra:
          ansible_host: "192.168.1.130"
          infra_node_address: "192.168.1.130"
