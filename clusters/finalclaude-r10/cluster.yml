---
# finalclaude-r10 — klaster Galera na Rocky Linux 10 (Proxmox, real VM).
#
# Adresacja: f10g1-3 na .140-.142 (VMID 9410-9412), restore f10r1 .143 (9413).
#
# WARSTWA WSPOLNA (terraform/shared/, NIE stawiana przez terraform/finalclaude-r10/):
#   ProxySQL fcp1/fcp2 .131/.132 w HA, VIP .133, infra .130 (PMM + MinIO).
#   ProxySQL jest wspoldzielony z kazdym przyszlym klastrem — dlatego nalezy do
#   warstwy wspolnej, a nie do zadnego katalogu klastra.
#
# UWAGA: warstwa bazodanowa jest wersyjnie IDENTYCZNA z EL9 (MariaDB 11.4.12,
# galera-4 26.4.27) — rozniczke niesie wylacznie versions.lock_file ponizej.

cluster:
  name: "finalclaude-r10"
  environment: "laboratory"
  profile: "laboratory"
  automation_release: "0.1.0"

platform:
  virtualization: "proxmox_kvm"
  rocky_linux_major: 10

versions:
  policy: "candidate"
  lock_file: "versions/versions-el10.lock.yml"

galera:
  # wsrep_cluster_name jest czescia tozsamosci Primary Component — kolizja nazw
  # skleilaby dwa niezalezne klastry w jeden.
  cluster_name: "fc10_galera"
  nodes_expected: 3

proxysql:
  nodes_expected: 2
  max_writers: 1
  read_write_split_enabled: false
  # Owner warstwy wspolnej: ten klaster INSTALUJE i utrzymuje fcp1/fcp2 oraz
  # fcinfra, i zarzadza VIP-em. Dokladnie jeden klaster na parze moze nim byc —
  # pilnuje tego tests/validation/probe-proxysql-tenancy.py.
  # Hostgroupy zostaja domyslne (10/20/30/40), app_user domyslny.
  role: "owner"
  endpoint:
    type: "keepalived_vip"
    address: "192.168.1.133"   # VIP warstwy wspolnej
    port: 6033

tls:
  mode: "disabled"
  certificate_source: ""
  ca_reference: ""
  certificate_reference: ""
  private_key_reference: ""
  require_secure_transport: false

network:
  application_cidrs: ["192.168.1.0/24"]
  database_cluster_cidrs: ["192.168.1.0/24"]
  administration_cidrs: ["192.168.1.0/24"]
  monitoring_cidrs: ["192.168.1.130/32"]

secrets:
  backend: "ansible_vault"   # env-only w aktualnej implementacji (patrz opis w schema)

storage:
  data_directory: "/var/lib/mysql"
  backup_staging_directory: "/var/tmp/mariadb-backup"
  filesystem: "xfs"
  expected_database_size_gb: "unknown"
  expected_growth_gb_per_month: "unknown"
  available_iops: "unknown"

workload:
  peak_qps: "unknown"
  peak_connections: "unknown"
  read_write_ratio: "unknown"
  largest_transaction_mb: "unknown"
  largest_table_gb: "unknown"
  expected_write_latency_ms: "unknown"

availability:
  # RPO 0 opiera sie na synchronicznej replikacji Galery, nie na trwalosci
  # pojedynczego wezla — patrz innodb_flush_log_at_trx_commit ponizej.
  rpo: "0"
  rto_node_failure: "2m"
  rto_full_cluster_failure: "30m"
  maintenance_window: "weekend"
  allowed_service_interruption: "2m"

backup:
  enabled: true
  destination: "s3"
  full_backup_schedule: "0 2 * * *"
  incremental_backup_schedule: "disabled"
  freshness_sla_hours: 26
  retention_days: 14
  encryption_enabled: true
  immutable_or_offsite_copy: true
  restore_test_schedule: "0 4 * * 0"
  scheduler:
    mode: "cron"
    # Nie moze byc aktywnym writerem ProxySQL — runner odrzuca backup z writera (ISC-39).
    host: "f10g1"
    timezone: "UTC"
  s3:
    endpoint: "192.168.1.130:9000"     # MinIO na wspoldzielonej infra VM
    bucket: "fc10-galera-backups"      # rozlaczny z bucketami innych klastrow
    secure: false

monitoring:
  pmm:
    server_url: "https://192.168.1.130"
    agent_id: "pmm-server"
    # Namespace regul alertow, folderow i contact pointow w PMM — musi byc
    # rozlaczny miedzy klastrami, inaczej nadpisza sobie reguly.
    cluster_name: "fc10-galera"
    validate_certs: false
    credentials_revision: 3
  # Owner wspolnej pary: to on instaluje pmm-agenta na fcp1/fcp2.
  # Wlasne wezly Galera zostaja AGENTLESS — punkt odniesienia do porownania z r9.
  agent_groups: ["proxysql"]
  system: "pmm"
  alerts:
    email: "ops@claude.local"
  log_destination: "journald"

mariadb_tuning:
  # Limit operatora: 3 GB RAM na VM. Buffer pool 768M zamiast 1G zostawia zapas
  # na mariabackup podczas SST i backupu — na 3 GB wezle 1G bylo zbyt ciasne.
  innodb_buffer_pool_size: "768M"
  innodb_log_file_size: "256M"
  max_connections: 100
  # 0 = wydajnosc kosztem trwalosci POJEDYNCZEGO wezla; przy 3 wezlach Galery
  # zatwierdzona transakcja zyje w Primary Component, ale jednoczesna utrata
  # zasilania wszystkich wezlow moze kosztowac ostatnia sekunde zapisow.
  innodb_flush_log_at_trx_commit: 0
  gcache_size: "256M"
