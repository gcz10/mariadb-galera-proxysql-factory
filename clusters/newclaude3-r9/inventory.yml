---
# newclaude3-r9 — klaster Galera na Rocky Linux 9 (Proxmox, real VM).
# Logowanie jako root przez klucz cloud-init; become:true jest wtedy no-opem.
#
# VM Galera i restore tworzy terraform/newclaude3-r9/:
#   n3g1-3 (VMID 9430-9432, IP .160-.162), n3r1 (9433, .163).
# ProxySQL fcp1/fcp2 (.131/.132) i infra fcinfra (.130) NALEZA do terraform/shared/
# i sa tu tylko deklarowane — ten katalog ich nie tworzy ani nie niszczy. VIP .133.
#
# Nazwy hostow sa globalnie rozlaczne w calej flocie: trafiaja do PMM Inventory
# jako <pmm.cluster_name>-<host> oraz do hostname VM.

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: tests/lab/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        n3g1:
          ansible_host: "192.168.1.160"
          galera_node_idx: 1
          galera_node_address: "192.168.1.160"
        n3g2:
          ansible_host: "192.168.1.161"
          galera_node_idx: 2
          galera_node_address: "192.168.1.161"
        n3g3:
          ansible_host: "192.168.1.162"
          galera_node_idx: 3
          galera_node_address: "192.168.1.162"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        fcp1:
          ansible_host: "192.168.1.131"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.131"
        fcp2:
          ansible_host: "192.168.1.132"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.132"

    restore:
      vars:
        restore_role: "restore"
      hosts:
        n3r1:
          ansible_host: "192.168.1.163"
          restore_node_address: "192.168.1.163"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        fcinfra:
          ansible_host: "192.168.1.130"
          infra_node_address: "192.168.1.130"
