---
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3
  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        o8db1:
          ansible_host: "192.168.1.123"
          galera_node_address: "192.168.1.123"
          galera_node_idx: 1
        o8db2:
          ansible_host: "192.168.1.124"
          galera_node_address: "192.168.1.124"
          galera_node_idx: 2
        o8db3:
          ansible_host: "192.168.1.125"
          galera_node_address: "192.168.1.125"
          galera_node_idx: 3
    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        x8p1:
          ansible_host: "192.168.1.119"
          proxysql_node_address: "192.168.1.119"
          proxysql_node_idx: 1
        x8p2:
          ansible_host: "192.168.1.120"
          proxysql_node_address: "192.168.1.120"
          proxysql_node_idx: 2
    app:
      vars:
        app_role: "app"
      hosts:
        x8app:
          ansible_host: "192.168.1.121"
          app_node_address: "192.168.1.121"
    infra:
      vars:
        infra_role: "infra"
      hosts:
        x8mon:
          ansible_host: "192.168.1.118"
          infra_node_address: "192.168.1.118"
    discovery_bench:
      hosts: {}
