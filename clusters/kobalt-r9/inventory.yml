---
# Najemca `kobalt-r9`. Do tego Terraform root naleza wylacznie kg1-3; kp1/kp2
# i kmon sa deklarowane jako cele integracji z warstwa wspolna, ktorej ten
# najemca nie tworzy ani nie niszczy.
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    galera:
      vars:
        galera_role: "galera"
      hosts:
        kg1:
          ansible_host: "192.168.1.33"
          galera_node_idx: 1
          galera_node_address: "192.168.1.33"
        kg2:
          ansible_host: "192.168.1.34"
          galera_node_idx: 2
          galera_node_address: "192.168.1.34"
        kg3:
          ansible_host: "192.168.1.35"
          galera_node_idx: 3
          galera_node_address: "192.168.1.35"

    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        kp1:
          ansible_host: "192.168.1.29"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.29"
        kp2:
          ansible_host: "192.168.1.30"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.30"

    app:
      vars:
        app_role: "app"
      hosts:
        kapp:
          ansible_host: "192.168.1.32"
          app_node_address: "192.168.1.32"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        kmon:
          ansible_host: "192.168.1.28"
          infra_node_address: "192.168.1.28"
