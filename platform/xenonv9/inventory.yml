---
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3
  children:
    proxysql:
      hosts:
        x9p1:
          ansible_host: "192.168.1.138"
          proxysql_node_address: "192.168.1.138"
          proxysql_node_idx: 1
        x9p2:
          ansible_host: "192.168.1.139"
          proxysql_node_address: "192.168.1.139"
          proxysql_node_idx: 2
    app:
      hosts:
        x9app:
          ansible_host: "192.168.1.140"
          app_node_address: "192.168.1.140"
    infra:
      hosts:
        x9mon:
          ansible_host: "192.168.1.137"
          infra_node_address: "192.168.1.137"
