---
# Warstwa wspolna green — hosty tworzone wyłącznie przez terraform/green/.
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3

  children:
    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        grp1:
          ansible_host: "192.168.1.24"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.24"
        grp2:
          ansible_host: "192.168.1.25"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.25"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        grinfra:
          ansible_host: "192.168.1.23"
          infra_node_address: "192.168.1.23"

    app:
      vars:
        app_role: "app"
      hosts:
        grapp:
          ansible_host: "192.168.1.26"
          app_node_address: "192.168.1.26"
