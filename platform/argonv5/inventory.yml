---
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: secrets/ssh_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile='{{ inventory_dir }}/known_hosts'"
    ansible_python_interpreter: /usr/bin/python3
  children:
    proxysql:
      vars:
        proxysql_role: "proxysql"
      hosts:
        ap1:
          ansible_host: "192.168.1.64"
          proxysql_node_idx: 1
          proxysql_node_address: "192.168.1.64"
        ap2:
          ansible_host: "192.168.1.65"
          proxysql_node_idx: 2
          proxysql_node_address: "192.168.1.65"

    app:
      vars:
        app_role: "app"
      hosts:
        aapp:
          ansible_host: "192.168.1.66"
          app_node_address: "192.168.1.66"

    infra:
      vars:
        infra_role: "infra"
      hosts:
        amon:
          ansible_host: "192.168.1.63"
          infra_node_address: "192.168.1.63"
